<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ao" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ea580c" />
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Robin-Rand an Kühlrippe</text>
  <text x="130" y="41" class="sub">Übergang Metall ➔ Luftstrom</text>

  <!-- Inner Metal Node 1 -->
  <g transform="translate(20, 56)">
    <rect width="220" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="110" y="22" class="lbl" style="fill: #92400e;">1. Metall-Inneres (Knoten 1)</text>
    <text x="110" y="45" class="math" style="fill: #b45309;">Temperatur T_{1,y}</text>
    <text x="110" y="63" class="sub" style="fill: #78350f;">Wärmeleitung λ im Aluminium</text>
  </g>

  <!-- Conduction Arrow -->
  <line x1="130" y1="128" x2="130" y2="166" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)" />
  <rect x="42" y="135" width="176" height="18" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1" />
  <text x="130" y="148" class="lbl" style="fill: #c2410c; font-size: 10px;">q̇_Leitung = λ·(T_1 − T_0)/Δx</text>

  <!-- Surface Node 0 -->
  <g transform="translate(20, 168)">
    <rect width="220" height="72" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5" />
    <text x="110" y="22" class="lbl" style="fill: #9a3412;">2. Rippen-Oberfläche (Knoten 0)</text>
    <text x="110" y="45" class="math" style="fill: #c2410c;">Randtemperatur T_{0,y}</text>
    <text x="110" y="63" class="sub" style="fill: #7c2d12; font-weight: bold;">Bilanz: q̇_Leitung = q̇_Konvektion!</text>
  </g>

  <!-- Convection Arrow -->
  <line x1="130" y1="240" x2="130" y2="278" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ab)" />
  <rect x="42" y="247" width="176" height="18" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1" />
  <text x="130" y="260" class="lbl" style="fill: #0369a1; font-size: 10px;">q̇_Konvektion = h · (T_0 − T_∞)</text>

  <!-- Ambient Air -->
  <g transform="translate(20, 280)">
    <rect width="220" height="122" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" />
    <text x="110" y="22" class="lbl" style="fill: #0369a1;">3. Vorbeiströmende Kühlluft</text>
    <text x="110" y="45" class="math" style="fill: #0284c7;">Umgebung T_∞ = 25 °C</text>
    <text x="110" y="70" class="sub" style="fill: #0c4a6e;">• <tspan font-weight="bold">Lüfter AN:</tspan> h = 250 W/(m²K)</text>
    <text x="110" y="88" class="sub" style="fill: #dc2626;">• <tspan font-weight="bold">Lüfter AUS:</tspan> h = 20 W/(m²K)</text>
    <text x="110" y="108" class="sub" style="fill: #0369a1; font-weight: bold;">(12,5× schwächere Kühlung!)</text>
  </g>
</svg>
