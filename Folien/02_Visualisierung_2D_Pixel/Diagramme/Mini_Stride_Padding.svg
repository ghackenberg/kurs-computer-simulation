<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Zeilen-Padding &amp; Stride</text>
  <text x="130" y="41" class="sub">1D-Speicherblöcke im RAM</text>

  <!-- Row 0 -->
  <g transform="translate(16, 56)">
    <text x="114" y="13" class="lbl" style="fill: #334155;">Zeile y = 0 (Start: Offset 0)</text>
    <rect x="0" y="20" width="172" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" />
    <text x="86" y="42" class="lbl" style="fill: #1e40af;">Nutzdaten (Breite × 4)</text>
    <rect x="176" y="20" width="52" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="202" y="42" class="lbl" style="fill: #b45309;">Pad</text>
    <!-- Stride Bracket -->
    <line x1="0" y1="64" x2="228" y2="64" stroke="#0284c7" stroke-width="1.5" />
    <line x1="0" y1="60" x2="0" y2="68" stroke="#0284c7" stroke-width="1.5" />
    <line x1="228" y1="60" x2="228" y2="68" stroke="#0284c7" stroke-width="1.5" />
    <text x="114" y="79" class="code" style="fill: #0369a1;">◄─── 1 × Stride ───►</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(16, 154)">
    <text x="114" y="13" class="lbl" style="fill: #334155;">Zeile y = 1 (Start: 1 · Stride)</text>
    <rect x="0" y="20" width="172" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" />
    <text x="86" y="42" class="lbl" style="fill: #1e40af;">Nutzdaten (Breite × 4)</text>
    <rect x="176" y="20" width="52" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="202" y="42" class="lbl" style="fill: #b45309;">Pad</text>
    <line x1="0" y1="64" x2="228" y2="64" stroke="#0284c7" stroke-width="1.5" />
    <line x1="0" y1="60" x2="0" y2="68" stroke="#0284c7" stroke-width="1.5" />
    <line x1="228" y1="60" x2="228" y2="68" stroke="#0284c7" stroke-width="1.5" />
    <text x="114" y="79" class="code" style="fill: #0369a1;">◄─── 1 × Stride ───►</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(16, 252)">
    <text x="114" y="13" class="lbl" style="fill: #334155;">Zeile y = 2 (Start: 2 · Stride)</text>
    <rect x="0" y="20" width="172" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" />
    <text x="86" y="42" class="lbl" style="fill: #1e40af;">Nutzdaten (Breite × 4)</text>
    <rect x="176" y="20" width="52" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="202" y="42" class="lbl" style="fill: #b45309;">Pad</text>
  </g>

  <!-- Summary Footer -->
  <rect x="16" y="332" width="228" height="72" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="130" y="352" class="lbl" style="fill: #166534;">Warum Padding?</text>
  <text x="130" y="370" class="sub" style="fill: #15803d;">Jede neue Zeile startet exakt</text>
  <text x="130" y="385" class="sub" style="fill: #15803d;">auf einer schnellen 4/8-Byte</text>
  <text x="130" y="399" class="sub" style="fill: #15803d; font-weight: bold;">Speichergrenze (Alignment)!</text>
</svg>
