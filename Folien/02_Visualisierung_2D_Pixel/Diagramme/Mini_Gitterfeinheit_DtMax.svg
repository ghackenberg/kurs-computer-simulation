<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Quadratisches Δx²-Gesetz</text>
  <text x="130" y="41" class="sub">Warum feine Gitter kleines Δt fordern</text>

  <!-- Coarse Grid dx = 1 mm -->
  <g transform="translate(15, 56)">
    <rect width="230" height="155" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #166534;">1. Standard-Gitter (Δx = 1 mm)</text>

    <!-- 2x2 large pixels -->
    <g transform="translate(75, 30)">
      <rect x="0" y="0" width="40" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <rect x="40" y="0" width="40" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <rect x="0" y="40" width="40" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <rect x="40" y="40" width="40" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    </g>

    <text x="115" y="128" class="math" style="fill: #15803d;">Δt_max = 2,5 ms</text>
    <text x="115" y="146" class="sub" style="fill: #14532d;">(400 Schritte pro Sekunde)</text>
  </g>

  <!-- Fine Grid dx = 0.5 mm -->
  <g transform="translate(15, 226)">
    <rect width="230" height="178" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #991b1b;">2. Halbes Gitter (Δx = 0,5 mm)</text>

    <!-- 4x4 small pixels in same area -->
    <g transform="translate(75, 30)" fill="#fee2e2" stroke="#dc2626" stroke-width="1">
      <rect x="0" y="0" width="20" height="20" /><rect x="20" y="0" width="20" height="20" /><rect x="40" y="0" width="20" height="20" /><rect x="60" y="0" width="20" height="20" />
      <rect x="0" y="20" width="20" height="20" /><rect x="20" y="20" width="20" height="20" /><rect x="40" y="20" width="20" height="20" /><rect x="60" y="20" width="20" height="20" />
      <rect x="0" y="40" width="20" height="20" /><rect x="20" y="40" width="20" height="20" /><rect x="40" y="40" width="20" height="20" /><rect x="60" y="40" width="20" height="20" />
      <rect x="0" y="60" width="20" height="20" /><rect x="20" y="60" width="20" height="20" /><rect x="40" y="60" width="20" height="20" /><rect x="60" y="60" width="20" height="20" />
    </g>

    <text x="115" y="128" class="math" style="fill: #dc2626;">Δt_max = 0,625 ms  (÷ 4 !)</text>
    <text x="115" y="148" class="sub" style="fill: #7f1d1d;">4× mehr Pixel × 4× mehr Schritte</text>
    <text x="115" y="166" class="lbl" style="fill: #991b1b;">➔ 16× höherer Rechenaufwand!</text>
  </g>
</svg>
