<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Die „Kühlakku“-Falle</text>
  <text x="130" y="41" class="sub">Innere Isolatorwand (α = 0)</text>

  <!-- WRONG: Only alpha = 0 -->
  <g transform="translate(15, 56)">
    <rect width="230" height="168" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #991b1b;">❌ Nur _alphaMap[x+1,y] = 0</text>

    <rect x="20" y="34" width="82" height="68" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="61" y="58" class="lbl" style="fill: #991b1b;">Heißes Pixel</text>
    <text x="61" y="82" class="lbl" style="fill: #dc2626; font-size: 14px;">80 °C</text>

    <rect x="128" y="34" width="82" height="68" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text x="169" y="55" class="lbl" style="fill: #1e40af;">Wand (α=0)</text>
    <text x="169" y="74" class="lbl" style="fill: #1d4ed8;">Bleibt 20 °C</text>
    <text x="169" y="92" class="sub" style="fill: #1e3a8a;">(Startwert!)</text>

    <line x1="98" y1="68" x2="124" y2="68" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)" />

    <text x="115" y="124" class="sub" style="fill: #7f1d1d;">Nachbar sieht ΔT = 20 − 80 = −60 K</text>
    <text x="115" y="144" class="lbl" style="fill: #dc2626;">➔ Wand saugt Wärme weg</text>
    <text x="115" y="160" class="lbl" style="fill: #991b1b;">wie ein 20 °C Kühlakku!</text>
  </g>

  <!-- RIGHT: Neumann Mirror -->
  <g transform="translate(15, 238)">
    <rect width="230" height="166" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #166534;">✅ Mit Neumann-Spiegelung</text>

    <rect x="20" y="34" width="82" height="68" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="61" y="58" class="lbl" style="fill: #991b1b;">Heißes Pixel</text>
    <text x="61" y="82" class="lbl" style="fill: #dc2626; font-size: 14px;">80 °C</text>

    <rect x="128" y="34" width="82" height="68" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2" />
    <text x="169" y="55" class="lbl" style="fill: #92400e;">Spiegelwert</text>
    <text x="169" y="76" class="lbl" style="fill: #b45309; font-size: 11px;">tCenter: 80 °C</text>
    <text x="169" y="93" class="sub" style="fill: #78350f;">(Kopie)</text>

    <text x="115" y="124" class="sub" style="fill: #14532d;">Nachbar sieht ΔT = 80 − 80 = 0 K</text>
    <text x="115" y="146" class="lbl" style="fill: #15803d;">➔ Exakt 0 W Wärmeverlust!</text>
  </g>
</svg>
