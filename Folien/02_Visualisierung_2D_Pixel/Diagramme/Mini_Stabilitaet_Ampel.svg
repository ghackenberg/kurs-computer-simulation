<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Stabilitäts-Ampel für s</text>
  <text x="130" y="41" class="sub">Eigengewicht w_0 = 1 − 4s</text>

  <!-- Green: Stable -->
  <g transform="translate(15, 56)">
    <rect width="230" height="106" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <circle cx="28" cy="24" r="10" fill="#16a34a" />
    <text x="125" y="28" class="lbl" style="fill: #166534;">1. Stabil: s &lt; 0,25</text>
    <text x="115" y="54" class="math" style="fill: #15803d;">1 − 4s &gt; 0   (Positiv)</text>
    <text x="115" y="76" class="sub" style="fill: #14532d;">Echte Mischung (0..100 %)</text>
    <text x="115" y="94" class="lbl" style="fill: #166534;">➔ Glatte Temperaturkurve!</text>
  </g>

  <!-- Yellow: Boundary -->
  <g transform="translate(15, 174)">
    <rect width="230" height="106" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="2" />
    <circle cx="28" cy="24" r="10" fill="#ca8a04" />
    <text x="125" y="28" class="lbl" style="fill: #854d0e;">2. Grenzfall: s = 0,25</text>
    <text x="115" y="54" class="math" style="fill: #a16207;">1 − 4s = 0   (Null)</text>
    <text x="115" y="76" class="sub" style="fill: #713f12;">Alter Eigenwert fällt weg:</text>
    <text x="115" y="94" class="lbl" style="fill: #854d0e;">➔ T_neu = 100 % T̄_Nachbarn</text>
  </g>

  <!-- Red: Unstable -->
  <g transform="translate(15, 292)">
    <rect width="230" height="112" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <circle cx="28" cy="24" r="10" fill="#dc2626" />
    <text x="125" y="28" class="lbl" style="fill: #991b1b;">3. Instabil: s &gt; 0,25</text>
    <text x="115" y="54" class="math" style="fill: #dc2626;">1 − 4s &lt; 0   (NEGATIV!)</text>
    <text x="115" y="76" class="sub" style="fill: #7f1d1d;">Vorzeichen kippt jeden Schritt</text>
    <text x="115" y="96" class="lbl" style="fill: #dc2626;">➔ Schachbrett-Explosion (NaN)!</text>
  </g>
</svg>
