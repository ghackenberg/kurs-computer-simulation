<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ad" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Vorzeichen-Logik (−λ)</text>
  <text x="130" y="41" class="sub">Vom Gefälle zum positiven Fluss</text>

  <!-- Step 1: Temperature drop -->
  <g transform="translate(15, 56)">
    <rect width="230" height="72" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #1e40af;">1. Temperatur fällt nach rechts</text>
    <text x="115" y="42" class="math" style="fill: #1d4ed8;">T_i = 80 °C  ➔  T_{i+1} = 30 °C</text>
    <text x="115" y="60" class="sub" style="fill: #1e3a8a;">Differenz ΔT = 30 − 80 = −50 K</text>
  </g>

  <line x1="130" y1="128" x2="130" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#ad)" />

  <!-- Step 2: Negative Slope -->
  <g transform="translate(15, 152)">
    <rect width="230" height="68" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #991b1b;">2. Mathematische Steigung</text>
    <text x="115" y="44" class="math" style="fill: #dc2626;">∂T / ∂x  &lt;  0   (NEGATIV)</text>
    <text x="115" y="60" class="sub" style="fill: #7f1d1d;">Kurve geht nach unten (−)</text>
  </g>

  <line x1="130" y1="220" x2="130" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#ad)" />

  <!-- Step 3: Multiply by -lambda -->
  <g transform="translate(30, 244)">
    <rect width="200" height="52" rx="26" fill="#ea580c" />
    <text x="100" y="23" class="lbl" style="fill: #ffffff;">3. Vorzeichen-Umkehr</text>
    <text x="100" y="41" class="math" style="fill: #ffffff;">(−λ) · (−Steigung) = (+)</text>
  </g>

  <line x1="130" y1="296" x2="130" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#ad)" />

  <!-- Step 4: Positive Flux -->
  <g transform="translate(15, 320)">
    <rect width="230" height="82" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <text x="115" y="22" class="lbl" style="fill: #166534;">4. Physikalischer Wärmestrom</text>
    <text x="115" y="46" class="math" style="fill: #15803d;">q̇_x  &gt;  0   (POSITIV)</text>
    <text x="115" y="68" class="sub" style="fill: #14532d; font-weight: bold;">Fließt von Warm nach Kalt (+x)!</text>
  </g>
</svg>
