<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #004B96; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #475569; }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #334155; }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #0f172a; }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; }
    </style>

    <marker id="arrowAxis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffffff" />
    </marker>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <text x="35" y="36" class="title">Schritt 1 zur DGL: Das Fouriersche Wärmeleitungsgesetz</text>
  <text x="35" y="56" class="subtitle">Wie hängt der Wärmestrom q̇ [W/m²] zwischen zwei benachbarten Gitterpunkten vom Temperaturgefälle ab?</text>

  <!-- ========================================================= -->
  <!-- LEFT CARD: TEMPERATURGEFÄLLE & STAB                       -->
  <!-- ========================================================= -->
  <g transform="translate(35, 72)" filter="url(#shadow)">
    <rect width="510" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr">1. Temperaturprofil T(x) und Wärmestromdichte q̇_x</text>

    <!-- Axes for T(x) -->
    <line x1="60" y1="230" x2="470" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrowAxis)" />
    <line x1="60" y1="240" x2="60" y2="55" stroke="#475569" stroke-width="2" marker-end="url(#arrowAxis)" />
    <text x="480" y="234" class="label-bold">x</text>
    <text x="52" y="52" class="label-bold" style="text-anchor: end;">T(x)</text>

    <!-- Dashed vertical grid lines for x_i (130) and x_{i+1} (380) -->
    <line x1="130" y1="85" x2="130" y2="282" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="380" y1="185" x2="380" y2="282" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Temperature slope line -->
    <line x1="95" y1="71" x2="415" y2="199" stroke="#dc2626" stroke-width="3.5" />

    <!-- Slope triangle (Steigungsdreieck) -->
    <line x1="130" y1="85" x2="130" y2="185" stroke="#0284c7" stroke-width="2.5" />
    <line x1="130" y1="185" x2="380" y2="185" stroke="#0284c7" stroke-width="2.5" />

    <!-- Labels on Slope Triangle -->
    <rect x="66" y="122" width="144" height="26" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
    <text x="138" y="139" class="label-bold" style="fill: #0369a1; text-anchor: middle;">ΔT = T_{i+1} − T_i &lt; 0</text>
    <text x="255" y="204" class="label-bold" style="fill: #0369a1; text-anchor: middle;">Abstand Δx = h</text>

    <!-- Points T_i and T_{i+1} -->
    <circle cx="130" cy="85" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="144" y="82" class="label-bold" style="fill: #dc2626;">T_i = 80 °C (heiß)</text>

    <circle cx="380" cy="185" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
    <text x="386" y="172" class="label-bold" style="fill: #2563eb; font-size: 12px;">T_{i+1} = 30 °C (kalt)</text>

    <!-- 1D Rod / Two Neighboring Pixels below the chart (NON-OVERLAPPING) -->
    <text x="20" y="268" class="label-bold" style="fill: #475569;">Zugehörige Gitterzellen (Pixel i und Pixel i+1):</text>
    
    <!-- Left Pixel i: x=60..195 (width 135, center 127.5) -->
    <rect x="60" y="282" width="135" height="75" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" />
    <text x="127.5" y="310" class="label-bold" style="fill: #991b1b; text-anchor: middle;">Pixel i</text>
    <text x="127.5" y="336" class="math" style="fill: #dc2626; text-anchor: middle;">T_i = 80 °C</text>

    <!-- Heat Flux Arrow cleanly between pixels: x=203..307 (width 104) -->
    <rect x="203" y="302" width="104" height="34" rx="5" fill="#ea580c" />
    <line x1="215" y1="319" x2="293" y2="319" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)" />

    <!-- Right Pixel i+1: x=315..455 (width 140, center 385) -->
    <rect x="315" y="282" width="140" height="75" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" />
    <text x="385" y="310" class="label-bold" style="fill: #1e40af; text-anchor: middle;">Pixel i+1</text>
    <text x="385" y="336" class="math" style="fill: #2563eb; text-anchor: middle;">T_{i+1} = 30 °C</text>

    <text x="255" y="382" class="label-bold" style="fill: #c2410c; text-anchor: middle;">
      Wärmestrom q̇_x fließt nach rechts (+x)!
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT CARD: FORMEL & VORZEICHEN-LOGIK                     -->
  <!-- ========================================================= -->
  <g transform="translate(565, 72)" filter="url(#shadow)">
    <rect width="400" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr">2. Fouriersches Gesetz &amp; das Minuszeichen</text>

    <!-- Formula Box -->
    <rect x="20" y="44" width="360" height="90" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="2" />
    <text x="200" y="68" class="label-bold" style="fill: #9a3412; text-anchor: middle;">Kontinuierlich &amp; Diskret zwischen zwei Zellen:</text>
    <text x="200" y="96" class="math" style="fill: #c2410c; font-size: 14px; text-anchor: middle;">
      q̇_x = −λ · (∂T / ∂x)  ≈  −λ · (T_{i+1} − T_i) / Δx
    </text>
    <text x="200" y="122" class="label" style="fill: #7c2d12; text-anchor: middle; font-size: 11.5px;">
      Einheit: [W/(m·K)] · [K/m] = [W/m²] (Leistung pro Fläche)
    </text>

    <!-- Why the minus sign? -->
    <text x="20" y="162" class="label-bold" style="font-size: 13.5px;">Warum steht vor dem λ ein Minuszeichen?</text>

    <!-- Case 1 -->
    <g transform="translate(20, 175)">
      <rect width="360" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="12" y="22" class="label-bold" style="fill: #166534;">Fall A: Links heißer als rechts (T_i = 80, T_{i+1} = 30)</text>
      <text x="12" y="42" class="label">• Steigung ist <tspan font-weight="bold">negativ</tspan>: T_{i+1} − T_i = −50 K &lt; 0</text>
      <text x="12" y="60" class="label">• Durch <tspan font-weight="bold">−λ</tspan> wird q̇_x <tspan font-weight="bold" fill="#15803d">positiv (+)</tspan> ➔ Fluss nach rechts!</text>
    </g>

    <!-- Case 2 -->
    <g transform="translate(20, 255)">
      <rect width="360" height="70" rx="6" fill="#eff6ff" stroke="#93c5fd" />
      <text x="12" y="22" class="label-bold" style="fill: #1e40af;">Fall B: Rechts heißer als links (T_i = 30, T_{i+1} = 80)</text>
      <text x="12" y="42" class="label">• Steigung ist <tspan font-weight="bold">positiv</tspan>: T_{i+1} − T_i = +50 K &gt; 0</text>
      <text x="12" y="60" class="label">• Durch <tspan font-weight="bold">−λ</tspan> wird q̇_x <tspan font-weight="bold" fill="#1d4ed8">negativ (−)</tspan> ➔ Fluss nach links!</text>
    </g>

    <!-- Case 3 -->
    <g transform="translate(20, 335)">
      <rect width="360" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="12" y="22" class="label-bold" style="fill: #334155;">Fall C: Gleiche Temperatur (T_i = 50, T_{i+1} = 50)</text>
      <text x="12" y="42" class="label">• Steigung ist <tspan font-weight="bold">Null</tspan>: T_{i+1} − T_i = 0 K</text>
      <text x="12" y="58" class="label">• <tspan font-weight="bold">q̇_x = 0</tspan> ➔ Thermisches Gleichgewicht (kein Fluss)!</text>
    </g>
  </g>
</svg>
