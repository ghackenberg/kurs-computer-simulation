<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">CPU-Cache &amp; Schleifen</text>
  <text x="130" y="41" class="sub">Zugriffsmuster im 2D-Gitter</text>

  <!-- GOOD: Row-Major -->
  <g transform="translate(15, 54)">
    <rect width="230" height="165" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #166534;">✅ Zeilenweise (y außen, x innen)</text>
    
    <!-- 3x2 mini grid -->
    <g transform="translate(30, 32)">
      <rect x="0" y="0" width="48" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" />
      <rect x="60" y="0" width="48" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" />
      <rect x="120" y="0" width="48" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" />
      <line x1="36" y1="16" x2="58" y2="16" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)" />
      <line x1="96" y1="16" x2="118" y2="16" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)" />

      <rect x="0" y="42" width="48" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" />
      <rect x="60" y="42" width="48" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" />
      <rect x="120" y="42" width="48" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" />
      <line x1="36" y1="58" x2="58" y2="58" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)" />
      <line x1="96" y1="58" x2="118" y2="58" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)" />
    </g>

    <text x="115" y="126" class="code" style="fill: #15803d;">Adresse +4 Bytes (Linear)</text>
    <text x="115" y="146" class="sub" style="fill: #166534; font-weight: bold;">➔ 100 % L1-Cache-Treffer!</text>
  </g>

  <!-- BAD: Column-Major -->
  <g transform="translate(15, 234)">
    <rect width="230" height="170" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #991b1b;">❌ Spaltenweise (x außen, y innen)</text>

    <!-- 3x2 mini grid with vertical jumps -->
    <g transform="translate(30, 32)">
      <rect x="0" y="0" width="48" height="32" rx="3" fill="#fee2e2" stroke="#ef4444" />
      <rect x="60" y="0" width="48" height="32" rx="3" fill="#fee2e2" stroke="#ef4444" />
      <rect x="120" y="0" width="48" height="32" rx="3" fill="#fee2e2" stroke="#ef4444" />

      <rect x="0" y="46" width="48" height="32" rx="3" fill="#fee2e2" stroke="#ef4444" />
      <rect x="60" y="46" width="48" height="32" rx="3" fill="#fee2e2" stroke="#ef4444" />
      <rect x="120" y="46" width="48" height="32" rx="3" fill="#fee2e2" stroke="#ef4444" />

      <line x1="24" y1="22" x2="24" y2="44" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)" />
      <line x1="84" y1="22" x2="84" y2="44" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)" />
      <line x1="144" y1="22" x2="144" y2="44" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)" />
    </g>

    <text x="115" y="130" class="code" style="fill: #dc2626;">Sprung +Stride pro Pixel!</text>
    <text x="115" y="150" class="sub" style="fill: #991b1b; font-weight: bold;">➔ Ständige Cache-Misses!</text>
  </g>
</svg>
