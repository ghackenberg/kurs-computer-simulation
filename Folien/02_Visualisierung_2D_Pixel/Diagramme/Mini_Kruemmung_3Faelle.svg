<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">3 Krümmungs-Fälle</text>
  <text x="130" y="41" class="sub">Vorzeichen von ∂²T / ∂x²</text>

  <!-- Case 1: Straight line -->
  <g transform="translate(15, 56)">
    <rect width="230" height="106" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #334155;">1. Gerade (∂²T/∂x² = 0)</text>
    <line x1="45" y1="36" x2="185" y2="74" stroke="#64748b" stroke-width="3" />
    <circle cx="115" cy="55" r="5" fill="#f59e0b" stroke="#0f172a" />
    <text x="115" y="94" class="lbl" style="fill: #475569;">➔ Zufluss = Abfluss (T bleibt!)</text>
  </g>

  <!-- Case 2: Valley / Delle -->
  <g transform="translate(15, 174)">
    <rect width="230" height="108" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #166534;">2. Tal / Delle (∂²T/∂x² &gt; 0)</text>
    <path d="M 45 36 Q 115 96 185 42" fill="none" stroke="#16a34a" stroke-width="3" />
    <circle cx="115" cy="68" r="5" fill="#2563eb" stroke="#0f172a" />
    <text x="115" y="96" class="lbl" style="fill: #15803d;">➔ Wärme strömt herein (T steigt ↑)</text>
  </g>

  <!-- Case 3: Peak / Berg -->
  <g transform="translate(15, 294)">
    <rect width="230" height="110" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #991b1b;">3. Berg / Peak (∂²T/∂x² &lt; 0)</text>
    <path d="M 45 78 Q 115 16 185 78" fill="none" stroke="#dc2626" stroke-width="3" />
    <circle cx="115" cy="47" r="5" fill="#dc2626" stroke="#0f172a" />
    <text x="115" y="98" class="lbl" style="fill: #dc2626;">➔ Wärme strömt weg (T fällt ↓)</text>
  </g>
</svg>
