<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">DFS-Zykluserkennung</text>
  <text x="135" y="42" class="sub">3-Farben-Tiefensuche in O(V+E)</text>

  <!-- Graphic Display of 3 Colors -->
  <g transform="translate(25, 54)">
    <rect width="220" height="180" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Node 1 (Gray, Active) -->
    <circle cx="50" cy="50" r="16" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <text x="50" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">v_1</text>
    <text x="50" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#475569" text-anchor="middle">Grau (Stack)</text>

    <!-- Node 2 (Gray, Active) -->
    <circle cx="170" cy="50" r="16" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <text x="170" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">v_2</text>

    <!-- Node 3 (Gray, Active) -->
    <circle cx="170" cy="140" r="16" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <text x="170" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">v_3</text>

    <!-- Node 4 (White, Unvisited) -->
    <circle cx="50" cy="140" r="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <text x="50" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#64748b" text-anchor="middle">v_4</text>
    <text x="50" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#64748b" text-anchor="middle">Weiß (Neu)</text>

    <!-- Forward Edges -->
    <line x1="66" y1="50" x2="154" y2="50" stroke="#475569" stroke-width="2" />
    <line x1="170" y1="66" x2="170" y2="124" stroke="#475569" stroke-width="2" />

    <!-- Red Back-Edge from v_3 to v_1 -->
    <path d="M 156 130 L 64 62" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3,2" />
    
    <!-- Shielded badge for text -->
    <rect x="58" y="90" width="104" height="20" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
    <text x="110" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#dc2626" text-anchor="middle">Rückwärtskante!</text>
  </g>

  <!-- Algorithm Legend -->
  <g transform="translate(15, 246)">
    <rect width="240" height="84" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #1d4ed8;">Die 3 Markierungsfarben</text>
    <text x="120" y="38" class="desc" style="fill: #475569;">1. Weiß: Noch nicht besucht</text>
    <text x="120" y="54" class="desc" style="font-weight: bold; fill: #dc2626;">2. Grau: Im aktuellen Rekursionspfad</text>
    <text x="120" y="72" class="desc" style="fill: #1e3a8a;">3. Schwarz: Vollständig abgeschlossen</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #b91c1c;">Zyklen-Bedingung</text>
  <text x="135" y="388" class="desc" style="font-weight: bold; fill: #991b1b;">Kante auf grauen Knoten = Zyklus!</text>
</svg>