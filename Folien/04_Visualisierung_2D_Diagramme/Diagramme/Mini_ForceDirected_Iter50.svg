<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="280" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .node-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arr-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="280" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="24" class="hdr">Force-Directed: Iteration 50</text>
  <text x="140" y="42" class="sub">Stationäres Kräftegleichgewicht</text>
  <g transform="translate(15, 54)">
    <rect width="250" height="184" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <line x1="54.0" y1="44.6" x2="172.2" y2="151.9" stroke="#94a3b8" stroke-width="2" />
    <line x1="172.2" y1="151.9" x2="78.7" y2="151.5" stroke="#94a3b8" stroke-width="2" />
    <line x1="78.7" y1="151.5" x2="195.7" y2="44.9" stroke="#94a3b8" stroke-width="2" />
    <line x1="195.7" y1="44.9" x2="124.4" y2="82.1" stroke="#94a3b8" stroke-width="2" />
    <line x1="124.4" y1="82.1" x2="54.0" y2="44.6" stroke="#94a3b8" stroke-width="2" />
    <line x1="172.2" y1="151.9" x2="124.4" y2="82.1" stroke="#94a3b8" stroke-width="2" />
    <rect x="36.0" y="31.6" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="54.0" y="44.6" class="node-txt">v_1</text>
    <rect x="154.2" y="138.9" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="172.2" y="151.9" class="node-txt">v_2</text>
    <rect x="60.7" y="138.5" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="78.7" y="151.5" class="node-txt">v_3</text>
    <rect x="177.7" y="31.9" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="195.7" y="44.9" class="node-txt">v_4</text>
    <rect x="106.4" y="69.1" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="124.4" y="82.1" class="node-txt">v_5</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #15803d;">Kräftegleichgewicht erreicht</text>
    <text x="125" y="38" class="desc" style="fill: #166534;">Summe F_net &approx; 0 an allen Knoten</text>
    <text x="125" y="54" class="desc" style="font-weight: bold; fill: #15803d;">Keine Restbewegungen mehr</text>
    <text x="125" y="72" class="desc" style="fill: #16a34a;">Symmetrisch, organisch, kreuzungsfrei</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #1d4ed8;">Finales Layout</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #1e40af;">Kantenlängen gleichmäßig d &approx; l_0</text>
  <text x="140" y="398" class="desc" style="fill: #2563eb;">Optimales Ergebnis der Partikelsimulation</text>
</svg>
