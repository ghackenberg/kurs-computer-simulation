<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="280" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .node-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arr-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="280" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="24" class="hdr">Force-Directed: Iteration 0 (Start)</text>
  <text x="140" y="42" class="sub">Kräftezerlegung: Hooke F_s + Coulomb F_r</text>
  <g transform="translate(15, 54)">
    <rect width="250" height="184" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <line x1="50.0" y1="45.0" x2="200.0" y2="145.0" stroke="#94a3b8" stroke-width="2" />
    <line x1="200.0" y1="145.0" x2="50.0" y2="145.0" stroke="#94a3b8" stroke-width="2" />
    <line x1="50.0" y1="145.0" x2="200.0" y2="45.0" stroke="#94a3b8" stroke-width="2" />
    <line x1="200.0" y1="45.0" x2="125.0" y2="95.0" stroke="#94a3b8" stroke-width="2" />
    <line x1="125.0" y1="95.0" x2="50.0" y2="45.0" stroke="#94a3b8" stroke-width="2" />
    <line x1="200.0" y1="145.0" x2="125.0" y2="95.0" stroke="#94a3b8" stroke-width="2" />
    <line x1="50.0" y1="45.0" x2="56.7" y2="49.5" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <line x1="50.0" y1="45.0" x2="46.6" y2="41.3" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)" />
    <line x1="50.0" y1="45.0" x2="54.0" y2="45.9" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
    <line x1="200.0" y1="145.0" x2="188.1" y2="140.5" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <line x1="200.0" y1="145.0" x2="203.4" y2="148.7" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)" />
    <line x1="200.0" y1="145.0" x2="189.5" y2="144.1" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
    <line x1="50.0" y1="145.0" x2="61.5" y2="140.8" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <line x1="50.0" y1="145.0" x2="46.6" y2="148.7" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)" />
    <line x1="50.0" y1="145.0" x2="60.1" y2="144.3" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
    <line x1="200.0" y1="45.0" x2="193.3" y2="49.5" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <line x1="200.0" y1="45.0" x2="203.4" y2="41.3" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)" />
    <line x1="200.0" y1="45.0" x2="196.0" y2="45.9" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
    <line x1="125.0" y1="95.0" x2="125.3" y2="94.8" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <line x1="125.0" y1="95.0" x2="125.4" y2="94.7" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
    <rect x="32.0" y="32.0" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="50.0" y="45.0" class="node-txt">v_1</text>
    <rect x="182.0" y="132.0" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="200.0" y="145.0" class="node-txt">v_2</text>
    <rect x="32.0" y="132.0" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="50.0" y="145.0" class="node-txt">v_3</text>
    <rect x="182.0" y="32.0" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="200.0" y="45.0" class="node-txt">v_4</text>
    <rect x="107.0" y="82.0" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="125.0" y="95.0" class="node-txt">v_5</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #1d4ed8;">Kräfte-Vektoren (Start)</text>
    <text x="125" y="38" class="desc" style="fill: #2563eb;">Blau: Hookesche Federn F_s (Zug)</text>
    <text x="125" y="54" class="desc" style="fill: #dc2626;">Rot: Coulomb-Abstoßung F_r (Ladung)</text>
    <text x="125" y="72" class="desc" style="font-weight: bold; fill: #16a34a;">Grün: Resultierende Summe F_net</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #004B96;">Zufällige Startverteilung</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #334155;">Kanten überschneiden sich chaotisch</text>
  <text x="140" y="398" class="desc" style="fill: #64748b;">Euler-Schritt verschiebt Knoten entlang F_net</text>
</svg>
