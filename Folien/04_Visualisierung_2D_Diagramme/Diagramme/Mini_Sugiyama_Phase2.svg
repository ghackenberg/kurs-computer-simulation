<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="280" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .layer-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #475569; text-anchor: middle; }
      .node-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .dummy-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #c2410c; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arr-green2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-orange2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>

  <rect width="280" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="24" class="hdr">Sugiyama Phase 2</text>
  <text x="140" y="42" class="sub">Schichten &amp; Dummy-Knoten</text>

  <!-- Graphic Display -->
  <g transform="translate(15, 54)">
    <rect width="250" height="184" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- 3 Layer Columns -->
    <rect x="8" y="26" width="70" height="150" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="43" y="20" class="layer-hdr">Schicht L_1</text>

    <rect x="90" y="26" width="70" height="150" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="125" y="20" class="layer-hdr">Schicht L_2</text>

    <rect x="172" y="26" width="70" height="150" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
    <text x="207" y="20" class="layer-hdr">Schicht L_3</text>

    <!-- Node v1 in L1 -->
    <rect x="20" y="40" width="46" height="32" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="43" y="56" class="node-txt">v_1</text>

    <!-- Node v2 in L2 -->
    <rect x="102" y="40" width="46" height="32" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <text x="125" y="56" class="node-txt">v_2</text>

    <!-- Node v3 in L3 -->
    <rect x="184" y="40" width="46" height="32" rx="4" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" />
    <text x="207" y="56" class="node-txt">v_3</text>

    <!-- Standard Edges v1 -> v2 -> v3 (span 1) -->
    <line x1="66" y1="56" x2="94" y2="56" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green2)" />
    <line x1="148" y1="56" x2="176" y2="56" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green2)" />

    <!-- Long edge: v1 -> v3 via Dummy d1 in L2 -->
    <!-- Dummy Node d1 in L2 -->
    <rect x="106" y="115" width="38" height="26" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="125" y="128" class="dummy-txt">d_1</text>

    <!-- Edge v1 -> d1 -->
    <path d="M 43 72 C 43 100 80 128 98 128" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange2)" />

    <!-- Edge d1 -> v3 -->
    <path d="M 144 128 C 165 128 207 100 207 80" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange2)" />

    <!-- Badge -->
    <rect x="80" y="152" width="90" height="20" rx="3" fill="#ffffff" stroke="#fdba74" stroke-width="1" />
    <text x="125" y="166" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#ea580c" text-anchor="middle">Dummy-Knoten</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #15803d;">Normalisierung: ΔL = 1</text>
    <text x="125" y="38" class="desc" style="fill: #166534;">Jeder Knoten erhält Schicht L_1, L_2...</text>
    <text x="125" y="54" class="desc" style="font-weight: bold; fill: #c2410c;">Langkanten v_1 ➔ v_3 über d_1 teilen</text>
    <text x="125" y="72" class="desc" style="fill: #16a34a;">Kanten nur zwischen Nachbarschichten</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #1d4ed8;">Algorithmen zur Schichtung</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #1e40af;">Longest-Path (schnell, minimaler Rang)</text>
  <text x="140" y="398" class="desc" style="fill: #2563eb;">Network-Simplex (minimiert Dummy-Zahl)</text>
</svg>
