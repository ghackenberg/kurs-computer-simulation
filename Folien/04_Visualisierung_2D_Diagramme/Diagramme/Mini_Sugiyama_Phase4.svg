<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="280" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .node-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .dim-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #64748b; text-anchor: middle; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea" />
    </marker>
    <marker id="arr-red4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="280" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="24" class="hdr">Sugiyama Phase 4</text>
  <text x="140" y="42" class="sub">Koordinaten &amp; Spline-Routing</text>

  <!-- Graphic Display -->
  <g transform="translate(15, 54)">
    <rect width="250" height="184" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Aligned Nodes (Brandes-Köpf alignment) -->
    <!-- Node v1 (Input) -->
    <rect x="18" y="42" width="46" height="32" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="41" y="58" class="node-txt">v_1</text>

    <!-- Node v2 (Controller) -->
    <rect x="102" y="42" width="46" height="32" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="125" y="58" class="node-txt">v_2</text>

    <!-- Node v3 (Plant) -->
    <rect x="186" y="42" width="46" height="32" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="209" y="58" class="node-txt">v_3</text>

    <!-- Straight Horizontal Forward Path (perfect alignment) -->
    <line x1="64" y1="58" x2="94" y2="58" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-purple)" />
    <line x1="148" y1="58" x2="178" y2="58" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-purple)" />

    <!-- Feedback Node v4 (Sensor) centered underneath -->
    <rect x="102" y="118" width="46" height="32" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="125" y="134" class="node-txt">v_4</text>

    <!-- Smooth Spline Feedback path from v3 down to v4 -->
    <path d="M 209 74 C 209 110 180 134 156 134" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red4)" />

    <!-- Smooth Spline Feedback path from v4 back to v1 -->
    <path d="M 102 134 C 65 134 41 110 41 82" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red4)" />

    <!-- Badges -->
    <rect x="68" y="14" width="114" height="20" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="125" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#7c3aed" text-anchor="middle">Gerade Leitungen</text>

    <rect x="65" y="156" width="120" height="20" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="125" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#dc2626" text-anchor="middle">Glatte Rückführung</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #86198f;">Brandes-Köpf &amp; Splines</text>
    <text x="125" y="38" class="desc" style="fill: #701a75;">1. Horizontale Ausrichtung (fluchtend)</text>
    <text x="125" y="54" class="desc" style="font-weight: bold; fill: #9333ea;">2. Dummy-Knoten als Spline-Stützen</text>
    <text x="125" y="72" class="desc" style="fill: #dc2626;">3. Feedback-Kanten außen herum leiten</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #1d4ed8;">Simulink / MSAGL Ästhetik</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #1e40af;">Kompaktes, übersichtliches Layout</text>
  <text x="140" y="398" class="desc" style="fill: #2563eb;">Kollisionsfreies Routing mit minimalem Verschnitt</text>
</svg>
