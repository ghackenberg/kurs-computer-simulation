    <circle cx="68.5" cy="51.8" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="184.3" cy="52.4" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="183.7" cy="140.8" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="70.0" cy="141.4" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="128.5" cy="103.7" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8" />
    <line x1="68.5" y1="51.8" x2="78.6" y2="51.2" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
    <line x1="184.3" y1="52.4" x2="175.5" y2="49.8" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
    <line x1="183.7" y1="140.8" x2="180.6" y2="145.8" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
    <line x1="70.0" y1="141.4" x2="74.5" y2="144.5" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-net)" />
