  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #c2410c;">Simulated Annealing</text>
    <text x="125" y="38" class="desc" style="fill: #9a3412;">Temperatur T_k klingt schrittweise ab</text>
    <text x="125" y="54" class="desc" style="font-weight: bold; fill: #ea580c;">Schrittweiten schrumpfen (Dämpfung)</text>
    <text x="125" y="72" class="desc" style="fill: #c2410c;">Verhindert Oszillieren um Minimum</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #004B96;">Einschwingphase</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #334155;">Topologie bereits kreuzungsfrei</text>
  <text x="140" y="398" class="desc" style="fill: #64748b;">Feinjustierung der Kantenlängen l_0</text>
</svg>
