    <line x1="70.0" y1="141.4" x2="68.5" y2="51.8" stroke="#94a3b8" stroke-width="2" />
    <line x1="128.5" y1="103.7" x2="68.5" y2="51.8" stroke="#94a3b8" stroke-width="2" />
    <line x1="128.5" y1="103.7" x2="184.3" y2="52.4" stroke="#94a3b8" stroke-width="2" />
    <line x1="128.5" y1="103.7" x2="183.7" y2="140.8" stroke="#94a3b8" stroke-width="2" />
