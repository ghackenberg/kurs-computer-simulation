<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Das Binning-Dilemma</text>
  <text x="135" y="42" class="sub">Wahl der Klassenbreite h</text>

  <!-- Box 1: Too wide -->
  <g transform="translate(15, 52)">
    <rect width="240" height="88" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="120" y="18" class="lbl" style="fill: #b91c1c;">1. Zu breit (k = 3)</text>
    <g transform="translate(30, 24)">
      <rect x="10" y="15" width="45" height="25" fill="#f87171" stroke="#b91c1c" />
      <rect x="60" y="5" width="45" height="35" fill="#f87171" stroke="#b91c1c" />
      <rect x="110" y="20" width="45" height="20" fill="#f87171" stroke="#b91c1c" />
    </g>
    <text x="120" y="76" class="desc" style="fill: #991b1b;">Überglättung: Details verloren</text>
  </g>

  <!-- Box 2: Too narrow -->
  <g transform="translate(15, 146)">
    <rect width="240" height="88" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
    <text x="120" y="18" class="lbl" style="fill: #c2410c;">2. Zu schmal (k = 50)</text>
    <g transform="translate(25, 22)">
      <line x1="10" y1="38" x2="10" y2="18" stroke="#ea580c" stroke-width="2" />
      <line x1="25" y1="38" x2="25" y2="30" stroke="#ea580c" stroke-width="2" />
      <line x1="40" y1="38" x2="40" y2="10" stroke="#ea580c" stroke-width="2" />
      <line x1="55" y1="38" x2="55" y2="32" stroke="#ea580c" stroke-width="2" />
      <line x1="70" y1="38" x2="70" y2="5" stroke="#ea580c" stroke-width="2" />
      <line x1="85" y1="38" x2="85" y2="28" stroke="#ea580c" stroke-width="2" />
      <line x1="100" y1="38" x2="100" y2="14" stroke="#ea580c" stroke-width="2" />
      <line x1="115" y1="38" x2="115" y2="30" stroke="#ea580c" stroke-width="2" />
      <line x1="130" y1="38" x2="130" y2="12" stroke="#ea580c" stroke-width="2" />
      <line x1="145" y1="38" x2="145" y2="28" stroke="#ea580c" stroke-width="2" />
      <line x1="160" y1="38" x2="160" y2="18" stroke="#ea580c" stroke-width="2" />
      <line x1="175" y1="38" x2="175" y2="32" stroke="#ea580c" stroke-width="2" />
    </g>
    <text x="120" y="76" class="desc" style="fill: #9a3412;">Unterglättung: Reines Rauschen</text>
  </g>

  <!-- Box 3: Optimal -->
  <g transform="translate(15, 240)">
    <rect width="240" height="94" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="120" y="18" class="lbl" style="fill: #15803d;">3. Optimal (Freedman-Diaconis)</text>
    <g transform="translate(25, 24)">
      <rect x="10" y="24" width="20" height="15" fill="#4ade80" stroke="#15803d" />
      <rect x="33" y="16" width="20" height="23" fill="#4ade80" stroke="#15803d" />
      <rect x="56" y="8" width="20" height="31" fill="#4ade80" stroke="#15803d" />
      <rect x="79" y="3" width="20" height="36" fill="#4ade80" stroke="#15803d" />
      <rect x="102" y="10" width="20" height="29" fill="#4ade80" stroke="#15803d" />
      <rect x="125" y="18" width="20" height="21" fill="#4ade80" stroke="#15803d" />
      <rect x="148" y="26" width="20" height="13" fill="#4ade80" stroke="#15803d" />
    </g>
    <text x="120" y="78" class="desc" style="font-weight: bold; fill: #166534;">h = 2 * IQR * N^(-1/3)</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #1d4ed8;">Empfehlung</text>
  <text x="135" y="388" class="desc" style="font-weight: bold; fill: #1e3a8a;">Robust: Freedman-Diaconis</text>
</svg>