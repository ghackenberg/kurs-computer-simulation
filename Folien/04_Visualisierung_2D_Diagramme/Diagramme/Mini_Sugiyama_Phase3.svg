<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="280" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .box-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .node-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="280" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="24" class="hdr">Sugiyama Phase 3</text>
  <text x="140" y="42" class="sub">Kreuzungsminimierung (Barycenter)</text>

  <!-- Graphic Display: Vorher vs. Nachher -->
  <g transform="translate(15, 54)">
    <rect width="250" height="184" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Subpanel Left: Vorher (mit Kreuzung) -->
    <rect x="6" y="6" width="114" height="172" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="63" y="20" class="box-hdr" style="fill: #dc2626;">Vorher (Kreuzung)</text>
    <text x="31" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#64748b" text-anchor="middle">L_1</text>
    <text x="95" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#64748b" text-anchor="middle">L_2</text>

    <!-- Nodes Left -->
    <rect x="14" y="38" width="34" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="31" y="50" class="node-txt">v_1</text>

    <rect x="14" y="98" width="34" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="31" y="110" class="node-txt">v_2</text>

    <rect x="78" y="38" width="34" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="95" y="50" class="node-txt">v_3</text>

    <rect x="78" y="98" width="34" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="95" y="110" class="node-txt">v_4</text>

    <!-- Crossed Edges -->
    <line x1="48" y1="50" x2="78" y2="110" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-gray)" />
    <line x1="48" y1="110" x2="78" y2="50" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-gray)" />

    <!-- Red Crossing Marker -->
    <circle cx="63" cy="80" r="10" fill="#dc2626" />
    <text x="63" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">✕</text>
    <text x="63" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#dc2626" text-anchor="middle">1 Kreuzung</text>


    <!-- Subpanel Right: Nachher (Kreuzungsfrei durch Vertauschen) -->
    <rect x="130" y="6" width="114" height="172" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="187" y="20" class="box-hdr" style="fill: #16a34a;">Nachher (Sortiert)</text>
    <text x="155" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#64748b" text-anchor="middle">L_1</text>
    <text x="219" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#64748b" text-anchor="middle">L_2</text>

    <!-- Nodes Right: v_4 and v_3 swapped! -->
    <rect x="138" y="38" width="34" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="155" y="50" class="node-txt">v_1</text>

    <rect x="138" y="98" width="34" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="155" y="110" class="node-txt">v_2</text>

    <!-- Swapped in L_2: v_4 is on top, v_3 is on bottom -->
    <rect x="202" y="38" width="34" height="24" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <text x="219" y="50" class="node-txt" style="fill: #16a34a;">v_4</text>

    <rect x="202" y="98" width="34" height="24" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <text x="219" y="110" class="node-txt" style="fill: #16a34a;">v_3</text>

    <!-- Parallel Edges: NO crossing! -->
    <line x1="172" y1="50" x2="202" y2="50" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green3)" />
    <line x1="172" y1="110" x2="202" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green3)" />

    <!-- Green OK Marker -->
    <circle cx="187" cy="80" r="10" fill="#16a34a" />
    <text x="187" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">✓</text>
    <text x="187" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#16a34a" text-anchor="middle">Kreuzungsfrei!</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #c2410c;">Barycenter-Heuristik</text>
    <text x="125" y="38" class="desc" style="fill: #9a3412;">Schwerpunkt: y_bary(v) = Mittelwert y(u)</text>
    <text x="125" y="54" class="desc" style="font-weight: bold; fill: #ea580c;">Sortiere Schicht nach y_bary aufsteigend</text>
    <text x="125" y="72" class="desc" style="fill: #c2410c;">Löst NP-schweres Problem heuristisch</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #004B96;">Layer-by-Layer Sweeps</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #334155;">Mehrfaches Hin- und Herschwingen</text>
  <text x="140" y="398" class="desc" style="fill: #64748b;">(Vorwärts- &amp; Rückwärtspass) minimiert Crossings</text>
</svg>
