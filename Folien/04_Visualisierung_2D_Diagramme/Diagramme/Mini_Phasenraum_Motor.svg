<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Phasenraum: Motorprüfstand</text>
  <text x="135" y="42" class="sub">M-n Kennfeld &amp; P_max Hyperbel</text>

  <!-- Coordinate system diagram -->
  <g transform="translate(20, 56)">
    <rect width="230" height="190" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Axes -->
    <line x1="38" y1="160" x2="205" y2="160" stroke="#475569" stroke-width="1.5" />
    <polygon points="208,160 200,157 200,163" fill="#475569" />
    <text x="195" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#334155" text-anchor="end">n [rpm]</text>

    <line x1="38" y1="160" x2="38" y2="24" stroke="#475569" stroke-width="1.5" />
    <polygon points="38,20 35,27 41,27" fill="#475569" />
    <text x="48" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#334155">M [Nm]</text>

    <!-- Constant Torque limit then Hyperbola -->
    <path d="M 38 55 L 90 55 Q 130 60 185 145" fill="none" stroke="#dc2626" stroke-width="2.5" />
    <text x="110" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c">P_max = 2*pi*n*M</text>

    <!-- Allowed operating area fill -->
    <path d="M 38 160 L 38 55 L 90 55 Q 130 60 185 145 L 185 160 Z" fill="#dbeafe" opacity="0.4" />

    <!-- Trajectory in phase space -->
    <path d="M 50 140 Q 80 85 110 80 T 130 105" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3,2" />
    <circle cx="130" cy="105" r="5" fill="#1d4ed8" />
    
    <rect x="138" y="94" width="75" height="18" rx="2" fill="#ffffff" opacity="0.9" />
    <text x="142" y="107" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#1e40af">Arbeitspunkt</text>
  </g>

  <!-- Explanation Box -->
  <g transform="translate(15, 260)">
    <rect width="240" height="74" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #1d4ed8;">Zustandsraum statt Zeitachse</text>
    <text x="120" y="40" class="desc" style="font-weight: bold; fill: #1e40af;">Elimination der Zeit t</text>
    <text x="120" y="58" class="desc" style="fill: #1e3a8a;">Thermische Grenzen sofort sichtbar</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #004B96;">Labor-Track A (Industrie)</text>
  <text x="135" y="388" class="desc" style="font-weight: bold; fill: #334155;">Plot.Add.Scatter(nArr, mArr)</text>
</svg>