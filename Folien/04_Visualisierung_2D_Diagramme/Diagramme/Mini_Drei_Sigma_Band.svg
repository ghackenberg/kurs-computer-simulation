<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Dynamische 3-Sigma-Bänder</text>
  <text x="135" y="42" class="sub">Statistische Hüllkurven</text>

  <!-- Plot Area -->
  <g transform="translate(20, 56)">
    <rect width="230" height="180" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Tolerance Band Fill -->
    <rect x="10" y="40" width="210" height="100" fill="#dbeafe" opacity="0.6" />

    <!-- Upper 3 Sigma Line -->
    <line x1="10" y1="40" x2="220" y2="40" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" />
    <rect x="15" y="20" width="130" height="16" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.5" />
    <text x="80" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#dc2626" text-anchor="middle">+3 Sigma (upperLine)</text>

    <!-- Mean Line at y=90 -->
    <line x1="10" y1="90" x2="220" y2="90" stroke="#1d4ed8" stroke-width="2" />
    <rect x="15" y="66" width="125" height="16" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="0.5" />
    <text x="77" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#1e40af" text-anchor="middle">Mittelwert (meanLine)</text>

    <!-- Lower 3 Sigma Line at y=140 -->
    <line x1="10" y1="140" x2="220" y2="140" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" />
    <rect x="15" y="146" width="145" height="16" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.5" />
    <text x="87" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#dc2626" text-anchor="middle">-3 Sigma (Toleranzgrenze)</text>

    <!-- Signal Stream with Anomaly Peak at x=185, wave stays around y=95-105 -->
    <path d="M 10 98 Q 50 106 85 98 T 150 98 L 185 24 L 205 98 L 220 98" fill="none" stroke="#2563eb" stroke-width="2" />
    <circle cx="185" cy="24" r="4" fill="#dc2626" />
    <rect x="155" y="4" width="60" height="14" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.5" />
    <text x="185" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#dc2626" text-anchor="middle">Alarm!</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="240" height="82" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #1d4ed8;">99,73 % Konfidenzintervall</text>
    <text x="120" y="40" class="desc" style="font-weight: bold; fill: #1e40af;">upperLine.Y = Mean + 3 * StdDev</text>
    <text x="120" y="58" class="desc" style="fill: #1e3a8a;">Ausreißer indizieren Fehler (Kavitation,</text>
    <text x="120" y="74" class="desc" style="fill: #1e3a8a;">Lagerschaden, Gripverlust)</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #004B96;">Labor-Sprint A &amp; B</text>
  <text x="135" y="388" class="desc" style="font-weight: bold; fill: #334155;">HorizontalLine in ScottPlot</text>
</svg>