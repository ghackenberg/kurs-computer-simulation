<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="280" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .node-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arr-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="280" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="24" class="hdr">Force-Directed: Iteration 2</text>
  <text x="140" y="42" class="sub">Dynamische Entwirrung (Summenvektor)</text>
  <g transform="translate(15, 54)">
    <rect width="250" height="184" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <line x1="51.2" y1="45.3" x2="196.7" y2="144.7" stroke="#94a3b8" stroke-width="2" />
    <line x1="196.7" y1="144.7" x2="53.1" y2="144.8" stroke="#94a3b8" stroke-width="2" />
    <line x1="53.1" y1="144.8" x2="198.8" y2="45.3" stroke="#94a3b8" stroke-width="2" />
    <line x1="198.8" y1="45.3" x2="125.1" y2="94.9" stroke="#94a3b8" stroke-width="2" />
    <line x1="125.1" y1="94.9" x2="51.2" y2="45.3" stroke="#94a3b8" stroke-width="2" />
    <line x1="196.7" y1="144.7" x2="125.1" y2="94.9" stroke="#94a3b8" stroke-width="2" />
    <line x1="51.2" y1="45.3" x2="57.6" y2="46.5" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-net)" />
    <line x1="196.7" y1="144.7" x2="179.8" y2="144.0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-net)" />
    <line x1="53.1" y1="144.8" x2="69.8" y2="144.2" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-net)" />
    <line x1="198.8" y1="45.3" x2="192.5" y2="46.4" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-net)" />
    <line x1="125.1" y1="94.9" x2="125.4" y2="93.9" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-net)" />
    <rect x="33.2" y="32.3" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="51.2" y="45.3" class="node-txt">v_1</text>
    <rect x="178.7" y="131.7" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="196.7" y="144.7" class="node-txt">v_2</text>
    <rect x="35.1" y="131.8" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="53.1" y="144.8" class="node-txt">v_3</text>
    <rect x="180.8" y="32.3" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="198.8" y="45.3" class="node-txt">v_4</text>
    <rect x="107.1" y="81.9" width="36" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="125.1" y="94.9" class="node-txt">v_5</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #15803d;">Dynamische Entwirrung</text>
    <text x="125" y="38" class="desc" style="fill: #166534;">Nur noch Summenvektor F_net aktiv</text>
    <text x="125" y="54" class="desc" style="font-weight: bold; fill: #15803d;">Knoten wandern entlang Gradient</text>
    <text x="125" y="72" class="desc" style="fill: #16a34a;">Kanten beginnen sich zu entflechten</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #1d4ed8;">Partikelsimulation</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #1e40af;">Kräfte treiben das System</text>
  <text x="140" y="398" class="desc" style="fill: #2563eb;">Richtung minimaler Verformungsenergie</text>
</svg>
