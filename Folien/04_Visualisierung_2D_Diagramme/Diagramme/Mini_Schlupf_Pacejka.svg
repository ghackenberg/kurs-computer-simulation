<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Reifenschlupf &amp; mu-Kurve</text>
  <text x="135" y="42" class="sub">Kraftschluss nach Pacejka</text>

  <!-- Diagram Canvas -->
  <g transform="translate(20, 56)">
    <rect width="230" height="190" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Shaded Zones in Background -->
    <rect x="38" y="25" width="42" height="135" fill="#dcfce7" opacity="0.45" />
    <rect x="80" y="25" width="45" height="135" fill="#fef3c7" opacity="0.45" />
    <rect x="125" y="25" width="85" height="135" fill="#fee2e2" opacity="0.45" />

    <!-- Axes -->
    <line x1="38" y1="160" x2="210" y2="160" stroke="#475569" stroke-width="1.5" />
    <polygon points="214,160 206,157 206,163" fill="#475569" />
    <text x="200" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#334155" text-anchor="end">Schlupf s [%]</text>

    <line x1="38" y1="160" x2="38" y2="20" stroke="#475569" stroke-width="1.5" />
    <polygon points="38,16 35,23 41,23" fill="#475569" />
    <text x="48" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#334155">mu</text>

    <!-- Pacejka mu-slip curve -->
    <path d="M 38 160 Q 65 35 102 38 T 205 92" fill="none" stroke="#2563eb" stroke-width="2.8" />

    <!-- Peak Marker -->
    <circle cx="102" cy="38" r="4.5" fill="#ea580c" />
    
    <!-- Text Labels with solid white shields -->
    <rect x="42" y="132" width="34" height="16" rx="2" fill="#ffffff" />
    <text x="59" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">Linear</text>

    <rect x="74" y="12" width="86" height="18" rx="2" fill="#ffffff" />
    <text x="117" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b45309" text-anchor="middle">mu_max Peak</text>

    <rect x="145" y="98" width="60" height="16" rx="2" fill="#ffffff" />
    <text x="175" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">Gleiten</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 254)">
    <rect width="240" height="74" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #c2410c;">Entstehung von Schlupf s</text>
    <text x="120" y="40" class="desc" style="font-weight: bold; fill: #9a3412;">v_Rad = omega * r &gt; v</text>
    <text x="120" y="58" class="desc" style="fill: #ea580c;">s = (v_Rad - v) / v</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="336" width="240" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="356" class="lbl" style="fill: #004B96;">Pacejka-Kraftschluss</text>
  <text x="135" y="376" class="desc" style="font-weight: bold; fill: #15803d;">s = 0 %: mu = 0 (keine Kraft!)</text>
  <text x="135" y="394" class="desc" style="fill: #475569;">Grip-Peak: mu_max bei 10-15 %</text>
</svg>
