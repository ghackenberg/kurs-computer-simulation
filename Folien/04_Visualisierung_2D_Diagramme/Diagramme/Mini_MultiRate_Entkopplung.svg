<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Taktentkopplung (Multi-Rate)</text>
  <text x="135" y="42" class="sub">1 kHz DAQ vs. 50 Hz Display</text>

  <!-- Block 1: Fast Producer -->
  <g transform="translate(15, 54)">
    <rect width="240" height="70" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #1d4ed8;">1. Schnelle Simulation / Sensor</text>
    <text x="120" y="40" class="desc" style="font-weight: bold; fill: #1e40af;">Takt: 1.000 Hz (dt = 1 ms)</text>
    <text x="120" y="58" class="desc" style="fill: #2563eb;">Schreibt in Ringpuffer (O(1))</text>
  </g>

  <!-- Intermediate Buffer -->
  <g transform="translate(45, 134)">
    <rect width="180" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="90" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">Puffer (CircularBuffer)</text>
  </g>

  <!-- Block 2: Gentle UI Timer -->
  <g transform="translate(15, 186)">
    <rect width="240" height="70" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #b91c1c;">2. WPF UI-Thread (Dispatcher)</text>
    <text x="120" y="40" class="desc" style="font-weight: bold; fill: #991b1b;">Takt: 50 Hz (20 ms Tick)</text>
    <text x="120" y="58" class="desc" style="fill: #dc2626;">Liest Snapshot &amp; WpfPlot.Refresh()</text>
  </g>

  <!-- Problem Callout -->
  <g transform="translate(15, 268)">
    <rect width="240" height="66" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #c2410c;">Warum nicht 1.000 Hz Refresh?</text>
    <text x="120" y="38" class="desc" style="font-weight: bold; fill: #9a3412;">UI-Message-Queue blockiert!</text>
    <text x="120" y="54" class="desc" style="fill: #ea580c;">Auge sieht max. 60–120 FPS</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #004B96;">Goldene Regel</text>
  <text x="135" y="388" class="desc" style="font-weight: bold; fill: #334155;">DispatcherTimer steuert GUI (50 Hz)</text>
</svg>