<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Algebraische Schleifen</text>
  <text x="135" y="42" class="sub">Integrator vs. Direkter Durchgriff</text>

  <!-- Box 1: Healthy Loop with Integrator -->
  <g transform="translate(15, 54)">
    <rect width="240" height="130" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #15803d;">1. Zulässig: Mit Integrator 1/s</text>
    
    <g transform="translate(20, 28)">
      <circle cx="20" cy="25" r="12" fill="#dcfce7" stroke="#16a34a" />
      <text x="20" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">+</text>

      <rect x="65" y="10" width="45" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" />
      <text x="87" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">1/s</text>

      <rect x="135" y="10" width="45" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" />
      <text x="157" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">k</text>

      <!-- Connections -->
      <line x1="32" y1="25" x2="65" y2="25" stroke="#16a34a" stroke-width="1.5" />
      <line x1="110" y1="25" x2="135" y2="25" stroke="#16a34a" stroke-width="1.5" />
      <!-- Feedback with delay -->
      <path d="M 180 25 L 195 25 L 195 55 L 20 55 L 20 37" fill="none" stroke="#16a34a" stroke-width="1.5" />
    </g>

    <text x="120" y="102" class="desc" style="font-weight: bold; fill: #166534;">Kausale Zeitverzögerung</text>
    <text x="120" y="118" class="desc" style="fill: #14532d;">Explizit lösbar: dx/dt = f(x, u)</text>
  </g>

  <!-- Box 2: Algebraic Loop (Direct Feedthrough) -->
  <g transform="translate(15, 196)">
    <rect width="240" height="134" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #b91c1c;">2. Algebraische Schleife (D != 0)</text>

    <g transform="translate(20, 28)">
      <circle cx="20" cy="25" r="12" fill="#fee2e2" stroke="#dc2626" />
      <text x="20" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">+</text>

      <rect x="65" y="10" width="45" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" />
      <text x="87" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">k_1</text>

      <rect x="135" y="10" width="45" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" />
      <text x="157" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">k_2</text>

      <!-- Connections in red loop -->
      <line x1="32" y1="25" x2="65" y2="25" stroke="#dc2626" stroke-width="2" />
      <line x1="110" y1="25" x2="135" y2="25" stroke="#dc2626" stroke-width="2" />
      <path d="M 180 25 L 195 25 L 195 55 L 20 55 L 20 37" fill="none" stroke="#dc2626" stroke-width="2" />
    </g>

    <text x="120" y="102" class="desc" style="font-weight: bold; fill: #991b1b;">Kein Speicherbaustein!</text>
    <text x="120" y="118" class="desc" style="fill: #7f1d1d;">y = g(y, u) erzwingt Nullstellensuche</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #1d4ed8;">MSAGL Visualisierung</text>
  <text x="135" y="383" class="desc" style="font-weight: bold; fill: #1e3a8a;">Schleifenkanten auffällig rot färben</text>
  <text x="135" y="398" class="desc" style="fill: #1e40af;">Diagnose vor Solver-Start</text>
</svg>