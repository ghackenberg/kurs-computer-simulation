<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="280" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arr-red-osc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arr-grn-osc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="280" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="24" class="hdr">Das Oszillations-Dilemma</text>
  <text x="140" y="42" class="sub">Ungedämpft vs. Simulated Annealing</text>

  <!-- Graphic canvas -->
  <g transform="translate(15, 54)">
    <rect width="250" height="184" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Left Compartment: Ungedämpft -->
    <text x="62" y="18" class="lbl" style="fill: #dc2626; text-anchor: middle;">Ungedämpft</text>
    <text x="62" y="32" class="desc" style="fill: #7f1d1d; font-size: 11.5px; text-anchor: middle;">T = const</text>
    <circle cx="62" cy="95" r="9" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- Limit Cycle Trajectory (Overshooting) -->
    <path d="M 26 55 L 98 135 L 32 130 L 92 60 Z" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" />
    <line x1="26" y1="55" x2="64" y2="97" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red-osc)" />
    <line x1="98" y1="135" x2="60" y2="132" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red-osc)" />
    <line x1="32" y1="130" x2="66" y2="89" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red-osc)" />
    <circle cx="26" cy="55" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="98" cy="135" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="32" cy="130" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <text x="62" y="166" class="desc" style="font-weight: bold; fill: #b91c1c; text-anchor: middle;">Grenzzyklus</text>

    <!-- Divider -->
    <line x1="125" y1="10" x2="125" y2="174" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Right Compartment: Mit Annealing -->
    <text x="188" y="18" class="lbl" style="fill: #15803d; text-anchor: middle;">Mit Annealing</text>
    <text x="188" y="32" class="desc" style="fill: #14532d; font-size: 11.5px; text-anchor: middle;">T_{k+1} = &#947; &#183; T_k</text>
    <circle cx="188" cy="95" r="9" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" />

    <!-- Converging Damped Spiral Trajectory -->
    <line x1="148" y1="55" x2="218" y2="122" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-grn-osc)" />
    <line x1="218" y1="122" x2="172" y2="106" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-grn-osc)" />
    <line x1="172" y1="106" x2="188" y2="95" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-grn-osc)" />
    <circle cx="148" cy="55" r="5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="218" cy="122" r="4.5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="188" cy="95" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="1.8" />
    <text x="188" y="166" class="desc" style="font-weight: bold; fill: #15803d; text-anchor: middle;">Stabile Ruhelage</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #c2410c;">Ursache des Oszillierens</text>
    <text x="125" y="38" class="desc" style="fill: #9a3412;">Coulomb-Kräfte steigen quadratisch (1/d²)</text>
    <text x="125" y="54" class="desc" style="fill: #9a3412;">Knoten schießen über das Minimum hinaus</text>
    <text x="125" y="72" class="desc" style="font-weight: bold; fill: #ea580c;">Ohne Dämpfung entsteht ein Limit Cycle!</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #004B96;">Dämpfung durch Annealing</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #334155;">Schrittweite schrumpft mit T_k</text>
  <text x="140" y="398" class="desc" style="fill: #64748b;">Dämpft kinetische Energie des Systems</text>
</svg>
