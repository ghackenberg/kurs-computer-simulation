<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Welford: Mittelwert-Update</text>
  <text x="135" y="42" class="sub">O(1) Online-Rekursion</text>

  <!-- Graphic representation of Mean shift -->
  <g transform="translate(25, 56)">
    <rect width="220" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <line x1="20" y1="60" x2="200" y2="60" stroke="#94a3b8" stroke-width="1.5" />
    
    <!-- delta_k bracket (cx 70 to cx 170) -->
    <path d="M 70 44 L 70 30 L 170 30 L 170 44" fill="none" stroke="#2563eb" stroke-width="1.5" />
    <rect x="105" y="21" width="30" height="18" rx="2" fill="#ffffff" />
    <text x="120" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#1d4ed8" text-anchor="middle">δ_k</text>

    <!-- Old Mean -->
    <circle cx="70" cy="60" r="5" fill="#3b82f6" />
    <rect x="46" y="68" width="48" height="16" rx="2" fill="#ffffff" />
    <text x="70" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#1d4ed8" text-anchor="middle">x̄_{k-1}</text>

    <!-- New Sample x_k -->
    <circle cx="170" cy="60" r="5" fill="#dc2626" />
    <rect x="155" y="68" width="30" height="16" rx="2" fill="#ffffff" />
    <text x="170" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">x_k</text>

    <!-- New Mean shift -->
    <circle cx="95" cy="60" r="5" fill="#16a34a" />
    <rect x="80" y="88" width="32" height="16" rx="2" fill="#ffffff" />
    <text x="96" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">x̄_k</text>
    <path d="M 70 65 Q 82 72 95 65" fill="none" stroke="#16a34a" stroke-width="1.5" />
  </g>

  <!-- Step-by-Step Code Card -->
  <g transform="translate(15, 178)">
    <rect width="240" height="152" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="24" class="lbl" style="fill: #1d4ed8;">Rekursionsformel</text>
    
    <g transform="translate(20, 42)">
      <text x="0" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#1e3a8a">1. δ_k = x_k - x̄_{k-1}</text>
      <text x="0" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold" fill="#1d4ed8">2. x̄_k = x̄_{k-1} + δ_k / k</text>
      <text x="0" y="74" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#475569">Korrektur um 1/k der Abweichung</text>
    </g>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #15803d;">Genialer Vorteil</text>
  <text x="135" y="383" class="desc" style="font-weight: bold; fill: #166534;">Keine Historie speichern!</text>
  <text x="135" y="398" class="desc" style="fill: #14532d;">O(1) Zeit &amp; O(1) Speicher</text>
</svg>
