<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">RAM-Bedarf im Vergleich</text>
  <text x="135" y="42" class="sub">10^6 Punkte im Hauptspeicher</text>

  <!-- Box 1: Scatter -->
  <g transform="translate(15, 54)">
    <rect width="240" height="132" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="120" y="22" class="lbl" style="fill: #b91c1c;">1. Scatter(xs, ys)</text>
    
    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="95" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
      <text x="47" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">xs: 8 MB</text>
      
      <rect x="105" y="0" width="95" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
      <text x="152" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">ys: 8 MB</text>
    </g>

    <text x="120" y="90" class="desc" style="font-weight: bold; fill: #991b1b;">Summe: 16 MB Heap</text>
    <text x="120" y="108" class="desc" style="fill: #7f1d1d;">+ O(N) Rendering-Traversierung</text>
    <text x="120" y="124" class="desc" style="fill: #b91c1c;">Für Phasenräume x2(x1) nötig</text>
  </g>

  <!-- Box 2: Signal -->
  <g transform="translate(15, 198)">
    <rect width="240" height="132" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="120" y="22" class="lbl" style="fill: #15803d;">2. Signal(ys) (ScottPlot)</text>

    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="130" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
      <text x="65" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">ys: 8 MB</text>

      <rect x="140" y="0" width="80" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
      <text x="180" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">dt, t_0</text>
    </g>

    <text x="120" y="90" class="desc" style="font-weight: bold; fill: #166534;">Summe: Nur 8 MB (-50 %!)</text>
    <text x="120" y="108" class="desc" style="fill: #14532d;">O(1) Direktindex i = t / dt</text>
    <text x="120" y="124" class="desc" style="fill: #15803d;">Ideal für feste Zeitschritte</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #1d4ed8;">Empfehlung</text>
  <text x="135" y="383" class="desc" style="font-weight: bold; fill: #1e3a8a;">Signal für Zeitleitstände</text>
  <text x="135" y="398" class="desc" style="fill: #1e40af;">Scatter für Phasenporträts</text>
</svg>