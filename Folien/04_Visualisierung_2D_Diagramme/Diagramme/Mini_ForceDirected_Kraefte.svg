<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Force-Directed Layout</text>
  <text x="135" y="42" class="sub">Spring-Embedder Kräftegleichgewicht</text>

  <!-- Graphic Display of Forces -->
  <g transform="translate(25, 56)">
    <rect width="220" height="170" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Spring line between Node A and B -->
    <path d="M 50 85 L 70 70 L 90 100 L 110 70 L 130 100 L 150 70 L 170 85" fill="none" stroke="#2563eb" stroke-width="2" />
    
    <!-- Attractive arrows towards each other -->
    <path d="M 65 52 L 95 52" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)" />
    <path d="M 155 52 L 125 52" stroke="#1d4ed8" stroke-width="2" />
    <text x="110" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Zugfeder F_s</text>

    <!-- Node A -->
    <circle cx="50" cy="85" r="16" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" />
    <text x="50" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v_1</text>

    <!-- Node B -->
    <circle cx="170" cy="85" r="16" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" />
    <text x="170" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v_2</text>

    <!-- Repulsive arrows at bottom -->
    <path d="M 80 140 L 40 140" stroke="#dc2626" stroke-width="2" />
    <path d="M 140 140 L 180 140" stroke="#dc2626" stroke-width="2" />
    <text x="110" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">Coulomb F_r (Abstoßung)</text>
  </g>

  <!-- Formula Card -->
  <g transform="translate(15, 238)">
    <rect width="240" height="92" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #1d4ed8;">Physikalisches Analogon</text>
    <text x="120" y="40" class="desc" style="font-weight: bold; fill: #1e40af;">Federn F_s = k*(d - d_0)</text>
    <text x="120" y="58" class="desc" style="font-weight: bold; fill: #dc2626;">Knoten = Elektrische Ladungen F_r</text>
    <text x="120" y="78" class="desc" style="fill: #1e3a8a;">Numerisches Minimum: Sum(F) = 0</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #004B96;">Einsatzgebiet</text>
  <text x="135" y="383" class="desc" style="font-weight: bold; fill: #334155;">Ungerichtete Netze, Schaltungen,</text>
  <text x="135" y="398" class="desc" style="fill: #64748b;">Komponenten-Cluster ohne Kausalität</text>
</svg>