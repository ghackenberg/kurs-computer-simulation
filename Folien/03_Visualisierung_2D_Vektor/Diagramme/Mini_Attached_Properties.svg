<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; fill: #334155; }
      .code { font-family: 'Consolas', monospace; font-size: 11px; fill: #0369a1; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Attached Properties</text>
  <text x="135" y="42" class="sub">Eigenschaften von außen anhängen</text>

  <!-- Box 1: Das C# OOP Dilemma -->
  <g transform="translate(15, 54)">
    <rect width="240" height="106" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #991b1b;">1. Das C#-Objekt-Dilemma</text>
    
    <!-- Ellipse Box -->
    <rect x="10" y="32" width="94" height="64" rx="4" fill="#ffffff" stroke="#f87171" stroke-width="1.2" />
    <text x="57" y="48" class="lbl" style="font-size: 11.5px; fill: #991b1b; text-anchor: middle;">class Ellipse</text>
    <text x="16" y="66" class="code" style="font-size: 11px; fill: #64748b;">Width, Height</text>
    <text x="16" y="82" class="code" style="font-size: 11px; fill: #64748b;">Fill, Stroke</text>

    <!-- Trenner & Container-Verwirrung -->
    <text x="120" y="68" class="lbl" style="font-size: 18px; fill: #dc2626; text-anchor: middle;">≠</text>
    <g transform="translate(134, 32)">
      <rect width="96" height="64" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="48" y="22" class="desc" style="font-size: 11.5px; font-weight: bold; fill: #b91c1c; text-anchor: middle;">Kein Left/Top</text>
      <text x="48" y="42" class="desc" style="font-size: 11px; fill: #64748b; text-anchor: middle;">Im Grid oder</text>
      <text x="48" y="56" class="desc" style="font-size: 11px; fill: #64748b; text-anchor: middle;">StackPanel nutzlos</text>
    </g>
  </g>

  <!-- Box 2: Die Lösung: Angehängte Property -->
  <g transform="translate(15, 170)">
    <rect width="240" height="124" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #1d4ed8;">2. Der Canvas „hängt an“</text>
    
    <g transform="translate(10, 32)">
      <!-- Canvas Box -->
      <rect width="220" height="82" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2" />
      <text x="110" y="20" class="code" style="font-size: 11.5px; fill: #1e40af; font-weight: bold; text-anchor: middle;">Canvas.SetLeft(node, 100);</text>
      
      <!-- Store Repräsentation -->
      <g transform="translate(10, 30)">
        <rect width="200" height="42" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="100" y="16" class="desc" style="font-size: 11px; fill: #0369a1; text-anchor: middle;">Zentraler Property-Store des Objekts:</text>
        <text x="100" y="32" class="code" style="font-size: 11.5px; font-weight: bold; fill: #1d4ed8; text-anchor: middle;">Canvas.LeftProperty ➔ 100</text>
      </g>
    </g>
  </g>

  <!-- Box 3: Layout Auswertung -->
  <g transform="translate(15, 304)">
    <rect width="240" height="102" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #15803d;">3. Canvas.Arrange() platziert</text>
    
    <text x="14" y="44" class="code" style="fill: #166534;">double x = Canvas.GetLeft(child);</text>
    <text x="14" y="62" class="code" style="fill: #166534;">double y = Canvas.GetTop(child);</text>
    <text x="14" y="82" class="code" style="font-size: 11px; font-weight: bold; fill: #14532d;">child.Arrange(new Rect(x, y, w, h));</text>
  </g>
</svg>
