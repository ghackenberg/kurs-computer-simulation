<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: bold; }
      .axis { font-family: 'Cambria Math', serif; font-size: 11.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="22" class="hdr">Die 3 Koordinatenräume</text>
  <text x="135" y="38" class="sub">Screen vs. Canvas vs. World</text>

  <!-- 1. Screen Space (Monitor / Viewport) -->
  <g transform="translate(15, 48)">
    <rect width="240" height="98" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="20" rx="6" fill="#fee2e2" />
    <text x="10" y="15" class="lbl" style="fill: #991b1b;">1. Screen-Raum (Monitor [px])</text>

    <!-- Mini Window Frame -->
    <rect x="12" y="26" width="95" height="64" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="1.2" />
    <line x1="12" y1="36" x2="107" y2="36" stroke="#fca5a5" stroke-width="0.8" />
    <circle cx="18" cy="31" r="1.8" fill="#ef4444" />
    <circle cx="23" cy="31" r="1.8" fill="#f59e0b" />
    <circle cx="28" cy="31" r="1.8" fill="#10b981" />
    
    <!-- Origin text -->
    <text x="16" y="50" class="desc" style="font-size: 11.5px; fill: #b91c1c; font-weight: bold;">(0,0)</text>
    
    <!-- Screen Click Point -->
    <circle cx="62" cy="58" r="3.5" fill="#dc2626" />
    <!-- Cursor Icon -->
    <path d="M 62,58 L 68,68 L 65,69 L 68,75 L 66,76 L 63,70 L 59,72 Z" fill="#0f172a" stroke="#ffffff" stroke-width="0.8" />
    <text x="62" y="84" class="fml" style="font-size: 11.5px; fill: #b91c1c; text-anchor: middle;">P_screen</text>

    <!-- Text description right -->
    <text x="116" y="42" class="fml" style="fill: #b91c1c;">(x_p, y_p) in [px]</text>
    <text x="116" y="60" class="desc" style="font-weight: bold; fill: #991b1b;">Viewport-Klick</text>
    <text x="116" y="76" class="desc" style="fill: #7f1d1d;">Starres Monitor-Raster</text>
    <text x="116" y="90" class="desc" style="font-size: 11.5px; fill: #991b1b;">+Y zeigt nach UNTEN</text>
  </g>

  <!-- Transition 1 -> 2 (Kamera M^-1) -->
  <g transform="translate(15, 150)">
    <line x1="55" y1="0" x2="55" y2="16" stroke="#475569" stroke-width="1.8" />
    <polygon points="55,20 51,13 59,13" fill="#475569" />
    <text x="80" y="14" class="fml" style="fill: #1e40af;">P_canvas = M⁻¹ · P_screen</text>
  </g>

  <!-- 2. Canvas Space (WPF Canvas) -->
  <g transform="translate(15, 172)">
    <rect width="240" height="98" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="20" rx="6" fill="#dbeafe" />
    <text x="10" y="15" class="lbl" style="fill: #1e40af;">2. Canvas-Raum (WPF Canvas [px])</text>

    <!-- Virtual Canvas Sheet -->
    <rect x="12" y="26" width="95" height="64" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,2" />
    <!-- Truss Model on Canvas -->
    <polygon points="22,72 88,72 55,48" fill="none" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="22" cy="72" r="2.5" fill="#1d4ed8" />
    <circle cx="88" cy="72" r="2.5" fill="#1d4ed8" />
    <circle cx="55" cy="48" r="3.5" fill="#dc2626" />
    <!-- Labels safely distanced -->
    <text x="55" y="40" class="fml" style="font-size: 11.5px; fill: #1d4ed8; text-anchor: middle;">P_canvas</text>
    <text x="55" y="85" class="desc" style="font-size: 11.5px; fill: #2563eb; text-anchor: middle;">(x_u, y_u)</text>

    <!-- Text description right -->
    <text x="116" y="42" class="fml" style="fill: #1d4ed8;">P_unzoom in [px]</text>
    <text x="116" y="60" class="desc" style="font-weight: bold; fill: #1e40af;">Ruhende Zeichenebene</text>
    <text x="116" y="76" class="desc" style="fill: #1e3a8a;">Hebt Pan &amp; Zoom auf</text>
    <text x="116" y="90" class="desc" style="font-size: 11.5px; fill: #1e40af;">Modell vor Kamera</text>
  </g>

  <!-- Transition 2 -> 3 (Viewport Inversion) -->
  <g transform="translate(15, 274)">
    <line x1="55" y1="0" x2="55" y2="16" stroke="#475569" stroke-width="1.8" />
    <polygon points="55,20 51,13 59,13" fill="#475569" />
    <text x="80" y="14" class="fml" style="fill: #15803d;">Viewport⁻¹: x_off, y_off, s</text>
  </g>

  <!-- 3. World Space (Physik in Metern) -->
  <g transform="translate(15, 296)">
    <rect width="240" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="20" rx="6" fill="#dcfce7" />
    <text x="10" y="15" class="lbl" style="fill: #15803d;">3. World-Raum (Physik [m])</text>

    <!-- Cartesian World Axis System -->
    <g transform="translate(16, 92)">
      <!-- X-Axis -->
      <line x1="0" y1="0" x2="88" y2="0" stroke="#16a34a" stroke-width="1.8" />
      <polygon points="94,0 87,-3 87,3" fill="#16a34a" />
      <text x="76" y="-7" class="axis" style="fill: #15803d;">+X_w</text>

      <!-- Y-Axis (UPWARDS!) -->
      <line x1="0" y1="0" x2="0" y2="-62" stroke="#16a34a" stroke-width="1.8" />
      <polygon points="0,-66 -3,-59 3,-59" fill="#16a34a" />
      <text x="5" y="-54" class="axis" style="fill: #15803d;">+Y_w</text>

      <!-- Physical Truss in World -->
      <polygon points="12,0 66,0 39,-36" fill="none" stroke="#15803d" stroke-width="1.5" />
      <circle cx="12" cy="0" r="2.5" fill="#166534" />
      <circle cx="66" cy="0" r="2.5" fill="#166534" />
      <circle cx="39" cy="-36" r="3.5" fill="#dc2626" />
      <text x="47" y="-33" class="fml" style="font-size: 11.5px; fill: #15803d; text-anchor: start;">P_world</text>
    </g>

    <!-- Text description right -->
    <text x="116" y="42" class="fml" style="fill: #15803d;">(x_w, y_w) in [m]</text>
    <text x="116" y="60" class="desc" style="font-weight: bold; fill: #166534;">Ingenieur-System [m]</text>
    <text x="116" y="76" class="desc" style="fill: #14532d;">+Y zeigt nach OBEN</text>
    <text x="116" y="90" class="desc" style="font-size: 11.5px; fill: #166534; font-weight: bold;">Physik &amp; Simulation</text>
    <text x="116" y="104" class="desc" style="font-size: 11.5px; fill: #15803d;">(X_min, Y_max)</text>
  </g>
</svg>