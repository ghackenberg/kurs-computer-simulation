<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; fill: #334155; }
      .fml { font-family: 'Consolas', monospace; font-size: 12.5px; fill: #0369a1; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">DIN 406 Bemaßungskette</text>
  <text x="135" y="42" class="sub">Geometrische 5-Schritt-Konstruktion</text>

  <!-- Visualisierung Bemaßung -->
  <g transform="translate(15, 54)">
    <rect width="240" height="175" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Bauteil / Stab -->
    <line x1="40" y1="40" x2="200" y2="40" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <circle cx="40" cy="40" r="6" fill="#004B96" />
    <circle cx="200" cy="40" r="6" fill="#004B96" />
    <text x="40" y="26" class="lbl" style="fill: #004B96;">P₁</text>
    <text x="200" y="26" class="lbl" style="fill: #004B96;">P₂</text>

    <!-- Maßhilfslinien -->
    <!-- Links -->
    <line x1="40" y1="48" x2="40" y2="135" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3,2" />
    <!-- Rechts -->
    <line x1="200" y1="48" x2="200" y2="135" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3,2" />

    <!-- Maßlinie -->
    <line x1="40" y1="120" x2="200" y2="120" stroke="#0284c7" stroke-width="2" />
    
    <!-- Pfeilspitzen (innen nach außen zeigend) -->
    <polygon points="40,120 54,115 54,125" fill="#0284c7" />
    <polygon points="200,120 186,115 186,125" fill="#0284c7" />

    <!-- Maßzahl (nach DIN 406 oberhalb der Maßlinie) -->
    <rect x="95" y="96" width="50" height="18" fill="#ffffff" stroke="#bae6fd" rx="3" />
    <text x="120" y="110" class="lbl" style="fill: #0369a1;">4.00 m</text>

    <!-- Beschriftungen der Zonen (rechts der Maßhilfslinie) -->
    <text x="46" y="58" class="desc" style="font-size: 11.5px; fill: #64748b;">Gap 4px</text>
    <text x="46" y="142" class="desc" style="font-size: 11.5px; fill: #64748b;">Überstand 8px</text>
  </g>

  <!-- Konstruktionsschritte Legende -->
  <g transform="translate(15, 238)">
    <rect width="240" height="168" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="120" y="22" class="lbl" style="fill: #0369a1;">Die 5 Konstruktionsschritte</text>
    <line x1="15" y1="32" x2="225" y2="32" stroke="#bae6fd" stroke-width="1" />

    <text x="25" y="52" class="desc"><b>1. Referenz:</b> Knoten P₁, P₂ erfassen</text>
    <text x="25" y="76" class="desc"><b>2. Hilfslinien:</b> Von P_i mit Gap 4 px</text>
    <text x="25" y="100" class="desc"><b>3. Überstand:</b> 8 px über Maßlinie</text>
    <text x="25" y="124" class="desc"><b>4. Maßlinie:</b> Zwischen Hilfslinien</text>
    <text x="25" y="148" class="desc"><b>5. Pfeile &amp; Text:</b> Spitzen 1:3 &amp; Zahl</text>
  </g>
</svg>