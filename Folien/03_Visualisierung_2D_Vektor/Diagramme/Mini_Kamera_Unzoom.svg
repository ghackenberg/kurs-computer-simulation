<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="19" class="hdr">Kamera-Unzoom (Schicht 1)</text>
  <text x="135" y="38" class="sub">Vom Mausklick zur Zeichenebene</text>

  <!-- 1. Screen Viewport (Gezoomt & Panned) -->
  <g transform="translate(15, 48)">
    <rect width="240" height="130" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="20" rx="6" fill="#fee2e2" />
    <text x="10" y="15" class="lbl" style="fill: #991b1b;">1. Bildschirm-Fenster (Kamera aktiv)</text>

    <!-- Mini Window Frame -->
    <rect x="10" y="28" width="105" height="92" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="1.2" />
    <line x1="10" y1="38" x2="115" y2="38" stroke="#fca5a5" stroke-width="0.8" />
    <circle cx="16" cy="33" r="1.8" fill="#ef4444" />
    <circle cx="21" cy="33" r="1.8" fill="#f59e0b" />
    <circle cx="26" cy="33" r="1.8" fill="#10b981" />

    <!-- Gezoomtes / verschobenes Fachwerk -->
    <polygon points="5,94 95,94 50,48" fill="none" stroke="#ef4444" stroke-width="2" />
    <circle cx="50" cy="48" r="4" fill="#dc2626" />
    <!-- Cursor Icon -->
    <path d="M 50,48 L 56,58 L 53,59 L 56,65 L 54,66 L 51,60 L 47,62 Z" fill="#0f172a" stroke="#ffffff" stroke-width="0.8" />
    <text x="62" y="112" class="desc" style="font-size: 11.5px; fill: #b91c1c; text-anchor: middle;">Ausschnitt</text>

    <!-- Text right -->
    <text x="126" y="48" class="fml" style="fill: #b91c1c;">P_screen</text>
    <text x="126" y="68" class="fml" style="fill: #991b1b;">(x_p, y_p) [px]</text>
    <text x="126" y="90" class="desc" style="font-weight: bold; fill: #991b1b;">Klick im Fenster</text>
    <text x="126" y="110" class="desc" style="fill: #7f1d1d;">Kamera M aktiv</text>
  </g>

  <!-- Transition Arrow M^-1 -->
  <g transform="translate(15, 184)">
    <line x1="45" y1="0" x2="45" y2="28" stroke="#1d4ed8" stroke-width="2.2" />
    <polygon points="45,33 40,25 50,25" fill="#1d4ed8" />
    <rect x="70" y="4" width="162" height="24" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="151" y="20" class="fml" style="fill: #1e40af; text-anchor: middle;">P_unzoom = M⁻¹ · P_screen</text>
  </g>

  <!-- 2. Resting Canvas (Ruhende Zeichenebene) -->
  <g transform="translate(15, 224)">
    <rect width="240" height="136" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="20" rx="6" fill="#dbeafe" />
    <text x="10" y="15" class="lbl" style="fill: #1e40af;">2. Ruhende Zeichenebene (Canvas [px])</text>

    <!-- Resting Canvas Sheet -->
    <rect x="10" y="28" width="105" height="96" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,2" />
    <!-- Vollständiges ruhendes Fachwerk -->
    <polygon points="20,96 100,96 60,54" fill="none" stroke="#2563eb" stroke-width="1.8" />
    <circle cx="20" cy="96" r="3" fill="#1d4ed8" />
    <circle cx="100" cy="96" r="3" fill="#1d4ed8" />
    <circle cx="60" cy="54" r="4" fill="#dc2626" />
    <text x="60" y="44" class="fml" style="font-size: 11.5px; fill: #1d4ed8; text-anchor: middle;">P_unzoom</text>
    <text x="60" y="116" class="desc" style="font-size: 11.5px; fill: #2563eb; text-anchor: middle;">Normalansicht</text>

    <!-- Text right -->
    <text x="126" y="48" class="fml" style="fill: #1e40af;">P_unzoom</text>
    <text x="126" y="68" class="fml" style="fill: #1d4ed8;">(x_u, y_u) [px]</text>
    <text x="126" y="90" class="desc" style="font-weight: bold; fill: #1e40af;">Unbewegter Canvas</text>
    <text x="126" y="110" class="desc" style="fill: #1e3a8a;">Kamera aufgehoben</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="368" width="240" height="42" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
  <text x="135" y="386" class="desc" style="font-weight: bold; fill: #15803d; text-anchor: middle;">Ergebnis von Schicht 1:</text>
  <text x="135" y="402" class="desc" style="font-size: 11.5px; fill: #166534; text-anchor: middle;">Exakter Pixelpunkt vor der Kamerabewegung</text>
</svg>