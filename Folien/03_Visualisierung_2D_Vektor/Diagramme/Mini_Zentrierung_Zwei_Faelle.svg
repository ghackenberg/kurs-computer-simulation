<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 12px; fill: #b91c1c; text-anchor: middle; }
      .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Das Zentrierungs-Problem</text>
  <text x="135" y="42" class="sub">Naive Platzierung bei (margin, margin)</text>

  <!-- Fall 1: Höhen-Limitiert (s_y <= s_x) -> Modell klebt links, Restplatz rechts -->
  <g transform="translate(15, 52)">
    <rect width="240" height="116" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="22" rx="6" fill="#f1f5f9" />
    <text x="120" y="16" class="lbl" style="fill: #1e40af;">Fall 1: Höhen-Limitiert (s = s_y)</text>

    <!-- Viewport Area (breit) -->
    <rect x="15" y="28" width="210" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" />

    <!-- Modell (klebt links am Rand) -->
    <rect x="15" y="28" width="120" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <!-- Fachwerk-Grafik angedeutet -->
    <polygon points="25,98 125,98 75,38" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
    <line x1="75" y1="38" x2="75" y2="58" stroke="#1d4ed8" stroke-width="1.5" />
    <line x1="75" y1="80" x2="75" y2="98" stroke="#1d4ed8" stroke-width="1.5" />
    <circle cx="25" cy="98" r="3.5" fill="#1e40af" />
    <circle cx="125" cy="98" r="3.5" fill="#1e40af" />
    <circle cx="75" cy="38" r="3.5" fill="#1e40af" />
    
    <!-- Shield Pill for Tag -->
    <rect x="44" y="60" width="62" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="75" y="73" class="tag" style="fill: #1e40af;">Modell</text>

    <!-- Ungenutzter Freiraum rechts (ΔW) -->
    <rect x="135" y="28" width="90" height="80" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="3,2" stroke-width="1" />
    <text x="180" y="62" class="fml" style="font-weight: bold; font-size: 13px;">ΔW</text>
    <text x="180" y="80" class="desc" style="font-size: 11.5px; fill: #991b1b;">Freiraum rechts</text>
  </g>

  <!-- Fall 2: Breiten-Limitiert (s_x < s_y) -> Modell klebt oben, Restplatz unten -->
  <g transform="translate(15, 176)">
    <rect width="240" height="116" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="22" rx="6" fill="#f1f5f9" />
    <text x="120" y="16" class="lbl" style="fill: #b45309;">Fall 2: Breiten-Limitiert (s = s_x)</text>

    <!-- Viewport Area (hoch) -->
    <rect x="15" y="28" width="210" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" />

    <!-- Modell (klebt oben am Rand) -->
    <rect x="15" y="28" width="210" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <!-- Flaches Fachwerk -->
    <polygon points="25,64 195,64 110,34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
    <circle cx="25" cy="64" r="3.5" fill="#1e40af" />
    <circle cx="195" cy="64" r="3.5" fill="#1e40af" />
    <circle cx="110" cy="34" r="3.5" fill="#1e40af" />

    <!-- Shield Pill for Tag -->
    <rect x="85" y="40" width="50" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="110" y="53" class="tag" style="fill: #1e40af;">Modell</text>

    <!-- Ungenutzter Freiraum unten (ΔH) -->
    <rect x="15" y="70" width="210" height="38" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="3,2" stroke-width="1" />
    <text x="120" y="93" class="fml" style="font-weight: bold; font-size: 12.5px;">ΔH (Freiraum unten)</text>
  </g>

  <!-- Problem & Challenge Summary Box -->
  <g transform="translate(15, 300)">
    <rect width="240" height="106" rx="6" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #991b1b;">Problem: Asymmetrischer Rand!</text>
    <text x="120" y="41" class="desc" style="fill: #7f1d1d;">Modell klebt am linken bzw. oberen Rand</text>
    <text x="120" y="59" class="desc" style="fill: #7f1d1d;">Freiraum (ΔW bzw. ΔH) klafft einseitig</text>
    <text x="120" y="79" class="lbl" style="fill: #004B96;">Ziel: Symmetrische Offsets x_off, y_off</text>
    <text x="120" y="96" class="desc" style="fill: #475569;">zur mittigen Ausrichtung im Viewport</text>
  </g>
</svg>
