<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #0369a1; text-anchor: middle; }
      .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Restplatz-Verteilung</text>
  <text x="135" y="42" class="sub">Die beiden Grenzfälle der Zentrierung</text>

  <!-- Fall 1: Höhen-Limitiert (s_y < s_x) -> Restplatz X -->
  <g transform="translate(15, 52)">
    <rect width="240" height="116" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="22" rx="6" fill="#f1f5f9" />
    <text x="120" y="16" class="lbl" style="fill: #1e40af;">Fall 1: Höhen-Limitiert (s = s_y)</text>

    <!-- Viewport Area (breit) -->
    <rect x="15" y="28" width="210" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" />

    <!-- Freiraum links (ΔW / 2) -->
    <rect x="15" y="28" width="45" height="80" fill="#e0f2fe" opacity="0.8" />
    <text x="37" y="73" class="fml" style="font-size: 11.5px; fill: #0369a1;">ΔW/2</text>

    <!-- Modell (mittig, füllt Höhe voll) -->
    <rect x="60" y="28" width="120" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <!-- Fachwerk-Grafik angedeutet -->
    <polygon points="70,98 170,98 120,38" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
    <line x1="120" y1="38" x2="120" y2="58" stroke="#1d4ed8" stroke-width="1.5" />
    <line x1="120" y1="80" x2="120" y2="98" stroke="#1d4ed8" stroke-width="1.5" />
    <circle cx="70" cy="98" r="3.5" fill="#1e40af" />
    <circle cx="170" cy="98" r="3.5" fill="#1e40af" />
    <circle cx="120" cy="38" r="3.5" fill="#1e40af" />
    
    <!-- Shield Pill for Tag -->
    <rect x="94" y="60" width="52" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="120" y="73" class="tag" style="fill: #1e40af;">Modell</text>

    <!-- Freiraum rechts (ΔW / 2) -->
    <rect x="180" y="28" width="45" height="80" fill="#e0f2fe" opacity="0.8" />
    <text x="202" y="73" class="fml" style="font-size: 11.5px; fill: #0369a1;">ΔW/2</text>
  </g>

  <!-- Fall 2: Breiten-Limitiert (s_x < s_y) -> Restplatz Y -->
  <g transform="translate(15, 176)">
    <rect width="240" height="116" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="22" rx="6" fill="#f1f5f9" />
    <text x="120" y="16" class="lbl" style="fill: #b45309;">Fall 2: Breiten-Limitiert (s = s_x)</text>

    <!-- Viewport Area (hoch) -->
    <rect x="25" y="28" width="190" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" />

    <!-- Freiraum oben (ΔH / 2) -->
    <rect x="25" y="28" width="190" height="18" fill="#fef3c7" opacity="0.8" />
    <text x="120" y="42" class="fml" style="font-size: 11.5px; fill: #b45309;">ΔH / 2</text>

    <!-- Modell (mittig, füllt Breite voll) -->
    <rect x="25" y="46" width="190" height="44" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <!-- Flaches Fachwerk -->
    <polygon points="35,82 205,82 120,52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
    <circle cx="35" cy="82" r="3.5" fill="#1e40af" />
    <circle cx="205" cy="82" r="3.5" fill="#1e40af" />
    <circle cx="120" cy="52" r="3.5" fill="#1e40af" />

    <!-- Shield Pill for Tag -->
    <rect x="94" y="60" width="52" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="120" y="73" class="tag" style="fill: #1e40af;">Modell</text>

    <!-- Freiraum unten (ΔH / 2) -->
    <rect x="25" y="90" width="190" height="18" fill="#fef3c7" opacity="0.8" />
    <text x="120" y="104" class="fml" style="font-size: 11.5px; fill: #b45309;">ΔH / 2</text>
  </g>

  <!-- Formula Summary Box -->
  <g transform="translate(15, 300)">
    <rect width="240" height="106" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #15803d;">Universelle Offset-Formel</text>
    <text x="120" y="40" class="fml" style="fill: #166534;">x_off = margin + ΔW / 2</text>
    <text x="120" y="58" class="fml" style="fill: #166534;">y_off = margin + ΔH / 2</text>
    <text x="120" y="77" class="desc" style="font-size: 11.5px; fill: #166534;">ΔW = W_draw - W_world · s</text>
    <text x="120" y="93" class="desc" style="font-size: 11.5px; fill: #166534;">ΔH = H_draw - H_world · s</text>
  </g>
</svg>
