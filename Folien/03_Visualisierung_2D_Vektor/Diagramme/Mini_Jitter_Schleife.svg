<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .warn { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #b91c1c; text-anchor: middle; }
      .step { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #991b1b; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Die Dragging-Jitter-Falle</text>
  <text x="135" y="42" class="sub">Der fatale Feedback-Loop (60 Hz)</text>

  <!-- Cycle Box -->
  <g transform="translate(15, 52)">
    <rect width="240" height="232" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Center Warning Pill -->
    <rect x="65" y="98" width="110" height="36" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="120" y="112" class="warn" style="font-size: 11.5px;">60 Hz Oszillation</text>
    <text x="120" y="128" class="warn" style="font-size: 11.5px;">Heftiges Zittern!</text>

    <!-- Step 1: Oben (Maus zieht K3) -->
    <rect x="42" y="12" width="156" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
    <text x="120" y="29" class="step">1. Maus zieht K3 nach oben</text>

    <!-- Pfeil 1 -> 2 (nach rechts unten) -->
    <path d="M 180,38 L 182,56" fill="none" stroke="#dc2626" stroke-width="1.5" />
    <polygon points="179,54 182,60 185,54" fill="#dc2626" />

    <!-- Step 2: Rechts (BoundingBox wächst) -->
    <rect x="132" y="62" width="100" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
    <text x="182" y="78" class="step">2. Bounds wachsen</text>
    <text x="182" y="92" class="desc" style="font-size: 11.5px; fill: #7f1d1d;">H_world steigt</text>

    <!-- Pfeil 2 -> 3 (nach links unten) -->
    <path d="M 170,102 C 180,140 180,165 160,190" fill="none" stroke="#dc2626" stroke-width="1.5" />
    <polygon points="163,185 158,192 167,189" fill="#dc2626" />

    <!-- Step 3: Unten (Auto-Fit s sinkt) -->
    <rect x="42" y="194" width="156" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
    <text x="120" y="211" class="step">3. Auto-Fit Maßstab s sinkt</text>

    <!-- Pfeil 3 -> 4 (nach links oben) -->
    <path d="M 80,190 C 60,165 60,140 70,102" fill="none" stroke="#dc2626" stroke-width="1.5" />
    <polygon points="68,107 72,100 74,108" fill="#dc2626" />

    <!-- Step 4: Links (K3 springt weg) -->
    <rect x="8" y="62" width="100" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
    <text x="58" y="78" class="step">4. K3 springt weg!</text>
    <text x="58" y="92" class="desc" style="font-size: 11.5px; fill: #7f1d1d;">Lücke zum Cursor</text>

    <!-- Pfeil 4 -> 1 (nach rechts oben) -->
    <path d="M 58,60 L 60,42" fill="none" stroke="#dc2626" stroke-width="1.5" />
    <polygon points="57,44 60,38 63,44" fill="#dc2626" />
  </g>

  <!-- Problem Summary Box -->
  <g transform="translate(15, 298)">
    <rect width="240" height="108" rx="6" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #991b1b;">Ursache: Teufelskreis-Kopplung</text>
    <text x="120" y="41" class="desc" style="fill: #7f1d1d;">Auto-Fit verändert die Kamera,</text>
    <text x="120" y="59" class="desc" style="fill: #7f1d1d;">während die Maus das Modell bewegt.</text>
    <text x="120" y="79" class="lbl" style="fill: #004B96;">Lösung: Transformation einfrieren</text>
    <text x="120" y="96" class="desc" style="fill: #475569;">solange Ziehen aktiv ist!</text>
  </g>
</svg>