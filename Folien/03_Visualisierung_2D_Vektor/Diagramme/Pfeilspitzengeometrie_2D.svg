<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
  <defs>
    <!-- Pfeilspitze Marker für Einheitsvektoren -->
    <marker id="arrow-u" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#004B96" />
    </marker>
    <marker id="arrow-perp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 7 2 L 1 5 L 7 8 z" fill="#D97706" />
    </marker>
    <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#D97706" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Rahmen & Hintergrund -->
  <rect x="5" y="5" width="570" height="430" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Titelbanner -->
  <rect x="5" y="5" width="570" height="42" rx="12" fill="#F1F5F9" />
  <rect x="5" y="35" width="570" height="12" fill="#F1F5F9" />
  <line x1="5" y1="47" x2="575" y2="47" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="25" y="31" font-size="16" font-weight="700" fill="#004B96">Geometrie der Pfeilspitze (2D-Vektordarstellung)</text>

  <!-- Pfeilschaft (Stab / Kraftlinie) -->
  <line x1="120" y1="340" x2="450" y2="160" stroke="#004B96" stroke-width="4" stroke-linecap="round" />

  <!-- Pfeilspitzen-Dreieck -->
  <polygon points="450,160 321,177 371,264" fill="#0284C7" fill-opacity="0.25" stroke="#004B96" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Gestrichelte Basis-Linie des Pfeildreiecks -->
  <line x1="321" y1="177" x2="371" y2="264" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Rechter Winkel bei P_base -->
  <path d="M 359,213 L 351,200 L 338,207" fill="none" stroke="#64748B" stroke-width="1.5" />
  <circle cx="350" cy="207" r="1.5" fill="#64748B" />

  <!-- Basis-Mittelpunkt P_base (mit Shield-Badge) -->
  <circle cx="346" cy="220" r="4" fill="#D97706" />
  <g transform="translate(280, 230)">
    <rect x="0" y="0" width="58" height="20" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <text x="29" y="14" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">P_base</text>
  </g>

  <!-- Einheitsvektoren bei P_node -->
  <!-- Richtungsvektor u -->
  <line x1="120" y1="340" x2="198" y2="297" stroke="#004B96" stroke-width="2.5" marker-end="url(#arrow-u)" />
  <text x="175" y="285" font-size="15" font-weight="700" fill="#004B96">u = e_u</text>

  <!-- Orthogonalvektor u_perp -->
  <line x1="346" y1="220" x2="310" y2="158" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-perp)" />
  <text x="250" y="160" font-size="15" font-weight="700" fill="#DC2626">+u^⊥</text>

  <line x1="346" y1="220" x2="382" y2="282" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-perp)" />
  <text x="390" y="295" font-size="15" font-weight="700" fill="#DC2626">-u^⊥</text>

  <!-- Bemaßung Pfeillänge L (parallel versetzt) -->
  <line x1="450" y1="160" x2="405" y2="85" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="346" y1="220" x2="301" y2="145" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="305" y1="148" x2="408" y2="92" stroke="#D97706" stroke-width="1.8" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
  <rect x="340" y="105" width="40" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
  <text x="360" y="121" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">L</text>

  <!-- Bemaßung Basisbreite W -->
  <line x1="321" y1="177" x2="356" y2="157" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="371" y1="264" x2="406" y2="244" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="353" y1="162" x2="403" y2="248" stroke="#D97706" stroke-width="1.8" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
  <rect x="382" y="195" width="42" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
  <text x="403" y="211" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">W</text>

  <!-- Eckpunkte & Beschriftung -->
  <!-- Knotenpunkt P_node -->
  <circle cx="120" cy="340" r="6" fill="#FFFFFF" stroke="#004B96" stroke-width="3" />
  <text x="40" y="365" font-size="15" font-weight="700" fill="#1E293B">P_node (Start)</text>

  <!-- Pfeilspitze P_tip -->
  <circle cx="450" cy="160" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="2" />
  <text x="462" y="155" font-size="15" font-weight="700" fill="#DC2626">P_tip (Spitze)</text>

  <!-- Flügel 1 (P1) -->
  <circle cx="321" cy="177" r="4.5" fill="#004B96" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="210" y="200" font-size="14" font-weight="700" fill="#004B96">P_wing1 (P1)</text>

  <!-- Flügel 2 (P2) -->
  <circle cx="371" cy="264" r="4.5" fill="#004B96" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="350" y="325" font-size="14" font-weight="700" fill="#004B96">P_wing2 (P2)</text>

  <!-- Formel-Infobox unten -->
  <rect x="25" y="360" width="530" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="40" y="384" font-size="14" font-weight="700" fill="#1E293B">Analytische Berechnung:</text>
  <text x="40" y="405" font-size="14" fill="#334155">P_base = P_tip - L · u    |    <tspan font-weight="700" fill="#004B96">P_wing1,2 = P_base ± (W / 2) · u^⊥</tspan></text>
</svg>
