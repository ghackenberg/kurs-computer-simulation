<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #334155; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13px; font-weight: bold; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">ScaleAt: Fixpunkt-Zoom</text>
  <text x="135" y="42" class="sub">Zentriert auf den Mauszeiger</text>

  <!-- Illustration -->
  <g transform="translate(15, 54)">
    <rect width="240" height="220" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Radiale Dehnungsstrahlen vom Fixpunkt -->
    <line x1="120" y1="96" x2="120" y2="40" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,2" />
    <line x1="120" y1="96" x2="40" y2="144" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,2" />
    <line x1="120" y1="96" x2="200" y2="144" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,2" />

    <!-- Skaliertes Objekt nach Zoom (s = 1.5, isotrop) -->
    <polygon points="45,141 195,141 120,45" fill="#eff6ff" fill-opacity="0.5" stroke="#2563eb" stroke-width="2.5" />
    <circle cx="120" cy="45" r="3.5" fill="#1d4ed8" />
    <circle cx="45" cy="141" r="3.5" fill="#1d4ed8" />
    <circle cx="195" cy="141" r="3.5" fill="#1d4ed8" />

    <!-- Ursprüngliches Objekt vor Zoom (s = 1.0) -->
    <polygon points="70,126 170,126 120,62" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" />
    <circle cx="120" cy="62" r="3" fill="#64748b" />
    <circle cx="70" cy="126" r="3" fill="#64748b" />
    <circle cx="170" cy="126" r="3" fill="#64748b" />

    <!-- Fixpunkt Cursor C -->
    <circle cx="120" cy="96" r="14" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2" />
    <circle cx="120" cy="96" r="3.5" fill="#dc2626" />
    <polygon points="120,96 120,112 125,107 131,116 134,114 128,105 135,104" fill="#1e293b" stroke="#ffffff" stroke-width="1" />
    
    <!-- Fixpunkt Badge -->
    <g transform="translate(138, 76)">
      <rect width="80" height="18" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
      <text x="40" y="13" class="math" style="font-size: 11px; fill: #991b1b; text-anchor: middle;">P_cursor (Fix)</text>
    </g>

    <!-- Legende -->
    <g transform="translate(14, 164)">
      <line x1="0" y1="8" x2="18" y2="8" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" />
      <text x="24" y="12" class="desc" style="font-size: 11.5px; fill: #64748b; font-weight: 600; text-anchor: start;">Vor Zoom (s = 1.0)</text>
    </g>

    <g transform="translate(14, 188)">
      <line x1="0" y1="8" x2="18" y2="8" stroke="#2563eb" stroke-width="2.5" />
      <text x="24" y="12" class="desc" style="font-size: 11.5px; fill: #1d4ed8; font-weight: bold; text-anchor: start;">Nach ScaleAt (s = 1.5)</text>
    </g>

    <g transform="translate(152, 188)">
      <line x1="0" y1="8" x2="14" y2="8" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
      <text x="18" y="12" class="desc" style="font-size: 11px; fill: #b45309; font-weight: 600; text-anchor: start;">Radialstrahl</text>
    </g>
  </g>

  <!-- Explanation -->
  <g transform="translate(15, 286)">
    <rect width="240" height="120" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="120" y="24" class="lbl" style="fill: #15803d;">Analytische 3er-Operation</text>
    <text x="120" y="48" class="desc" style="fill: #166534;">1. Translate(-P.X, -P.Y)</text>
    <text x="120" y="68" class="desc" style="fill: #166534;">2. Scale(s, s) isotrop</text>
    <text x="120" y="88" class="desc" style="fill: #166534;">3. Translate(+P.X, +P.Y)</text>
    <text x="120" y="108" class="desc" style="font-weight: bold; fill: #14532d;">Fixpunkt P bleibt ortsfest!</text>
  </g>
</svg>