<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: bold; }
      .axis { font-family: 'Cambria Math', serif; font-size: 11.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="20" class="hdr">Geometrisches Unzoom</text>
  <text x="135" y="38" class="sub">Vom Klick zur Welt-Koordinate</text>

  <!-- Schritt 1: Kamera-Unzoom (M^-1) -->
  <g transform="translate(15, 48)">
    <rect width="240" height="154" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="20" rx="6" fill="#dbeafe" />
    <text x="10" y="15" class="lbl" style="fill: #1e40af;">Schritt 1: Kamera-Unzoom (M⁻¹)</text>

    <!-- Subpanel A: Gezoomter Viewport (Screen) -->
    <g transform="translate(10, 26)">
      <rect width="90" height="72" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
      <text x="45" y="14" class="lbl" style="font-size: 11.5px; fill: #991b1b; text-anchor: middle;">P_screen</text>
      <!-- Zoomed / shifted truss (larger, cropped) -->
      <polygon points="5,54 75,54 40,24" fill="none" stroke="#ef4444" stroke-width="1.8" />
      <circle cx="40" cy="24" r="3" fill="#dc2626" />
      <!-- Cursor -->
      <path d="M 40,24 L 46,34 L 43,35 L 46,41 L 44,42 L 41,36 L 37,38 Z" fill="#0f172a" stroke="#ffffff" stroke-width="0.6" />
      <text x="45" y="68" class="desc" style="font-size: 11.5px; fill: #b91c1c; text-anchor: middle;">(x_p, y_p)</text>
    </g>

    <!-- Arrow M^-1 in between -->
    <g transform="translate(103, 54)">
      <line x1="0" y1="6" x2="18" y2="6" stroke="#1d4ed8" stroke-width="2" />
      <polygon points="22,6 16,2 16,10" fill="#1d4ed8" />
      <text x="11" y="-3" class="lbl" style="font-size: 11.5px; fill: #1e40af; text-anchor: middle;">M⁻¹</text>
    </g>

    <!-- Subpanel B: Unzoomed Canvas -->
    <g transform="translate(132, 26)">
      <rect width="98" height="72" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,2" />
      <text x="49" y="14" class="lbl" style="font-size: 11.5px; fill: #1e40af; text-anchor: middle;">P_unzoom</text>
      <!-- Standard resting truss -->
      <polygon points="14,54 84,54 49,26" fill="none" stroke="#2563eb" stroke-width="1.5" />
      <circle cx="14" cy="54" r="2.5" fill="#1d4ed8" />
      <circle cx="84" cy="54" r="2.5" fill="#1d4ed8" />
      <circle cx="49" cy="26" r="3" fill="#dc2626" />
      <text x="49" y="68" class="desc" style="font-size: 11.5px; fill: #1e40af; text-anchor: middle;">(x_u, y_u)</text>
    </g>

    <!-- Formula pill at bottom of Box 1 (spacious 18px line spacing) -->
    <rect x="10" y="106" width="220" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
    <text x="120" y="121" class="fml" style="fill: #1e40af; text-anchor: middle;">P_unzoom = M⁻¹ · P_screen [px]</text>
    <text x="120" y="139" class="desc" style="font-size: 11.5px; fill: #475569; text-anchor: middle;">Hebt Pan-Offset &amp; Zoomfaktor auf</text>
  </g>

  <!-- Schritt 2: Viewport-Invertierung (Transform2D) -->
  <g transform="translate(15, 208)">
    <rect width="240" height="158" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="20" rx="6" fill="#dcfce7" />
    <text x="10" y="15" class="lbl" style="fill: #15803d;">Schritt 2: Viewport⁻¹ (Meter-Modell)</text>

    <!-- Left: Geometric mapping illustration -->
    <g transform="translate(18, 92)">
      <!-- World Coordinate Frame -->
      <line x1="0" y1="0" x2="68" y2="0" stroke="#16a34a" stroke-width="1.5" />
      <polygon points="72,0 66,-3 66,3" fill="#16a34a" />
      <text x="56" y="-7" class="axis" style="fill: #15803d;">+X_w</text>

      <!-- Y-Axis (UPWARDS!) -->
      <line x1="0" y1="0" x2="0" y2="-62" stroke="#16a34a" stroke-width="1.5" />
      <polygon points="0,-66 -3,-60 3,-60" fill="#16a34a" />
      <text x="5" y="-53" class="axis" style="fill: #15803d;">+Y_w</text>

      <!-- Physical Truss -->
      <polygon points="10,0 56,0 33,-36" fill="none" stroke="#15803d" stroke-width="1.5" />
      <circle cx="10" cy="0" r="2.5" fill="#166534" />
      <circle cx="56" cy="0" r="2.5" fill="#166534" />
      <circle cx="33" cy="-36" r="3" fill="#dc2626" />
      <text x="40" y="-33" class="fml" style="font-size: 11.5px; fill: #15803d; text-anchor: start;">P_world</text>
    </g>

    <!-- Right: Transformation explanation (spacious 18-20px spacing) -->
    <g transform="translate(108, 28)">
      <text x="0" y="14" class="desc" style="font-weight: bold; fill: #166534;">X: Translation &amp; s</text>
      <text x="0" y="32" class="desc" style="font-size: 11.5px; fill: #15803d;">Offset x_off abziehen</text>

      <text x="0" y="54" class="desc" style="font-weight: bold; fill: #b91c1c;">Y: Invertierung &amp; s</text>
      <text x="0" y="72" class="desc" style="font-size: 11.5px; fill: #b91c1c;">Y-Spiegelung von Y_max</text>
    </g>

    <!-- Formula pill bottom of Box 2 (clean 20px spacing) -->
    <rect x="8" y="104" width="224" height="46" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" />
    <text x="120" y="121" class="fml" style="font-size: 11.5px; fill: #15803d; text-anchor: middle;">x_w = X_min + (x_u - x_off) / s</text>
    <text x="120" y="141" class="fml" style="font-size: 11.5px; fill: #b91c1c; text-anchor: middle;">y_w = Y_max - (y_u - y_off) / s</text>
  </g>

  <!-- Summary Footer (spacious 18px line spacing) -->
  <rect x="15" y="372" width="240" height="38" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2" />
  <text x="135" y="387" class="desc" style="font-weight: bold; fill: #92400e; text-anchor: middle;">Dimensionsrein: [px] → [m]</text>
  <text x="135" y="404" class="desc" style="font-size: 11.5px; fill: #b45309; text-anchor: middle;">Exakter physikalischer Punkt für Hit-Testing</text>
</svg>