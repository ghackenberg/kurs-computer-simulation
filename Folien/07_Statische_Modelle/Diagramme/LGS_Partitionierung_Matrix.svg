<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>

    <style>
      text {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      }
    </style>
  </defs>

  <!-- Outer Canvas Background -->
  <rect x="0" y="0" width="960" height="440" fill="#FFFFFF"/>
  <rect x="5" y="5" width="950" height="430" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <path d="M 5 15 Q 5 5 15 5 L 945 5 Q 955 5 955 15 L 955 42 L 5 42 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="24" y="27" font-size="15" font-weight="bold" fill="#004B96">LGS-Partitionierung: Randbedingungen &amp; Blockzerlegung</text>
  <text x="936" y="27" font-size="12" font-weight="bold" fill="#64748B" text-anchor="end">Kapitel 07: Statische Modelle (Fachwerke &amp; FEM)</text>

  <!-- ==================== MATRIX & VECTOR BACKGROUNDS & GEOMETRY ==================== -->
  <!-- Matrix K: Block K_ff (Frei/Beweglich, n_f x n_f) -->
  <rect x="45" y="65" width="165" height="135" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>

  <!-- Matrix K: Block K_fp (Kopplung frei-fest, n_f x n_p) -->
  <rect x="215" y="65" width="95" height="135" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Matrix K: Block K_pf (Kopplung fest-frei, n_p x n_f) -->
  <rect x="45" y="205" width="165" height="75" rx="6" fill="#E1F5FE" stroke="#0284C7" stroke-width="2"/>

  <!-- Matrix K: Block K_pp (Lager-Lager, n_p x n_p) -->
  <rect x="215" y="205" width="95" height="75" rx="6" fill="#CFD8DC" stroke="#78909C" stroke-width="1.5"/>

  <!-- Large Structural Brackets for Matrix K -->
  <path d="M 40 65 L 34 65 L 34 280 L 40 280" fill="none" stroke="#334155" stroke-width="2.5"/>
  <path d="M 315 65 L 321 65 L 321 280 L 315 280" fill="none" stroke="#334155" stroke-width="2.5"/>

  <!-- Vector u: Blocks -->
  <rect x="345" y="65" width="70" height="135" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <rect x="345" y="205" width="70" height="75" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Large Brackets for Vector u -->
  <path d="M 340 65 L 334 65 L 334 280 L 340 280" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 420 65 L 426 65 L 426 280 L 420 280" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Vector f: Blocks -->
  <rect x="450" y="65" width="70" height="135" rx="6" fill="#EFF6FF" stroke="#0284C7" stroke-width="2"/>
  <rect x="450" y="205" width="70" height="75" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>

  <!-- Large Brackets for Vector f -->
  <path d="M 445 65 L 439 65 L 439 280 L 445 280" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 525 65 L 531 65 L 531 280 L 525 280" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Connecting Workflow Arrows from Equations to Solution Cards -->
  <!-- Row 1 to Cholesky Card -->
  <line x1="535" y1="132" x2="565" y2="132" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Row 2 to Reaction Card -->
  <line x1="535" y1="242" x2="565" y2="242" stroke="#D97706" stroke-width="3" marker-end="url(#arrowAmber)"/>

  <!-- Horizontal Partition Line (Dashed) -->
  <line x1="30" y1="202" x2="535" y2="202" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Strike-through diagonal red cancellation lines indicating u_p = 0 elimination -->
  <line x1="225" y1="75" x2="300" y2="190" stroke="#DC2626" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="355" y1="215" x2="405" y2="270" stroke="#DC2626" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="225" y1="215" x2="300" y2="270" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3" stroke-opacity="0.7"/>

  <!-- ==================== LABELS INSIDE MATRIX & VECTORS (WITH SHIELDS) ==================== -->
  <!-- Block K_ff labels -->
  <rect x="52" y="73" width="151" height="20" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="127" y="87" font-size="13" font-weight="bold" fill="#1B5E20" text-anchor="middle">K_ff (Freie FG)</text>

  <rect x="52" y="98" width="151" height="18" rx="3" fill="#FFFFFF"/>
  <text x="127" y="111" font-size="12" fill="#2E7D32" text-anchor="middle">Größe: n_f × n_f</text>

  <rect x="52" y="122" width="151" height="20" rx="3" fill="#DCFCE7" stroke="#22C55E" stroke-width="0.8"/>
  <text x="127" y="136" font-size="12" font-weight="bold" fill="#15803D" text-anchor="middle">SPD (Symm. Pos.-Def.)</text>

  <rect x="52" y="148" width="151" height="18" rx="3" fill="#FFFFFF"/>
  <text x="127" y="161" font-size="12" fill="#166534" text-anchor="middle">Eindeutig invertierbar!</text>

  <rect x="52" y="171" width="151" height="18" rx="3" fill="#FFFFFF"/>
  <text x="127" y="184" font-size="12" fill="#15803D" text-anchor="middle">Cholesky-tauglich</text>

  <!-- Block K_fp labels -->
  <rect x="220" y="73" width="85" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="262" y="87" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">K_fp (Koppl.)</text>

  <rect x="220" y="98" width="85" height="18" rx="3" fill="#FFFFFF"/>
  <text x="262" y="111" font-size="12" fill="#64748B" text-anchor="middle">n_f × n_p</text>

  <rect x="220" y="125" width="85" height="20" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
  <text x="262" y="139" font-size="12" font-weight="bold" fill="#B91C1C" text-anchor="middle">· u_p = 0</text>

  <rect x="220" y="152" width="85" height="18" rx="3" fill="#FFFFFF"/>
  <text x="262" y="165" font-size="12" fill="#991B1B" text-anchor="middle">(Entfällt)</text>

  <!-- Block K_pf labels -->
  <rect x="52" y="211" width="151" height="20" rx="3" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="0.8"/>
  <text x="127" y="225" font-size="12" font-weight="bold" fill="#0284C7" text-anchor="middle">K_pf (Reaktion)</text>

  <rect x="52" y="234" width="151" height="18" rx="3" fill="#FFFFFF"/>
  <text x="127" y="247" font-size="12" fill="#0369A1" text-anchor="middle">n_p × n_f (Lagerreakt.)</text>

  <rect x="52" y="255" width="151" height="18" rx="3" fill="#E0F2FE"/>
  <text x="127" y="268" font-size="12" font-weight="bold" fill="#075985" text-anchor="middle">Berechnet Lagerkräfte</text>

  <!-- Block K_pp labels -->
  <rect x="220" y="211" width="85" height="20" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8"/>
  <text x="262" y="225" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">K_pp (Lager)</text>

  <rect x="220" y="234" width="85" height="18" rx="3" fill="#FFFFFF"/>
  <text x="262" y="247" font-size="12" fill="#64748B" text-anchor="middle">n_p × n_p</text>

  <rect x="220" y="255" width="85" height="18" rx="3" fill="#FFFFFF"/>
  <text x="262" y="268" font-size="12" fill="#94A3B8" text-anchor="middle">· u_p = 0</text>

  <!-- Vector u labels -->
  <rect x="350" y="73" width="60" height="24" rx="3" fill="#FFFFFF" stroke="#F87171" stroke-width="0.8"/>
  <text x="380" y="89" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">u_f</text>

  <rect x="348" y="103" width="64" height="18" rx="3" fill="#FEF2F2"/>
  <text x="380" y="116" font-size="12" font-weight="bold" fill="#B91C1C" text-anchor="middle">Gesucht!</text>

  <rect x="348" y="125" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="380" y="138" font-size="12" fill="#991B1B" text-anchor="middle">Freie</text>

  <rect x="348" y="145" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="380" y="158" font-size="12" fill="#991B1B" text-anchor="middle">Verschiebg.</text>

  <rect x="348" y="170" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="380" y="183" font-size="12" font-weight="bold" fill="#7F1D1D" text-anchor="middle">[ m ]</text>

  <rect x="348" y="211" width="64" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="380" y="225" font-size="13" font-weight="bold" fill="#64748B" text-anchor="middle">u_p = 0</text>

  <rect x="348" y="235" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="380" y="248" font-size="12" fill="#64748B" text-anchor="middle">Starre</text>

  <rect x="348" y="255" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="380" y="268" font-size="12" fill="#64748B" text-anchor="middle">Auflager</text>

  <!-- Vector f labels -->
  <rect x="455" y="73" width="60" height="24" rx="3" fill="#FFFFFF" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="485" y="89" font-size="15" font-weight="bold" fill="#0284C7" text-anchor="middle">f_f</text>

  <rect x="453" y="103" width="64" height="18" rx="3" fill="#EFF6FF"/>
  <text x="485" y="116" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">Bekannt</text>

  <rect x="453" y="125" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="485" y="138" font-size="12" fill="#075985" text-anchor="middle">Äußere</text>

  <rect x="453" y="145" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="485" y="158" font-size="12" fill="#075985" text-anchor="middle">Knotenlast</text>

  <rect x="453" y="170" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="485" y="183" font-size="12" font-weight="bold" fill="#0C4A6E" text-anchor="middle">[ N ]</text>

  <rect x="455" y="211" width="60" height="20" rx="3" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.8"/>
  <text x="485" y="225" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">f_p</text>

  <rect x="453" y="235" width="64" height="18" rx="3" fill="#FFFBEB"/>
  <text x="485" y="248" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">Reaktionen</text>

  <rect x="453" y="255" width="64" height="18" rx="3" fill="#FFFFFF"/>
  <text x="485" y="268" font-size="12" fill="#92400E" text-anchor="middle">Lagerkräfte</text>

  <!-- Operators Between Matrices with Shields -->
  <rect x="325" y="160" width="16" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="333" y="177" font-size="18" font-weight="bold" fill="#475569" text-anchor="middle">·</text>

  <rect x="430" y="160" width="16" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="438" y="177" font-size="18" font-weight="bold" fill="#475569" text-anchor="middle">=</text>

  <!-- Row Index Labels at Left -->
  <rect x="8" y="122" width="22" height="20" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="19" y="136" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">Z1</text>

  <rect x="8" y="233" width="22" height="20" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8"/>
  <text x="19" y="247" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">Z2</text>

  <!-- ==================== RIGHT WORKFLOW PANELS ==================== -->
  <!-- Card 1: Primäres LGS lösen via Cholesky (Zeile 1) -->
  <rect x="570" y="55" width="375" height="175" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <path d="M 570 63 Q 570 55 578 55 L 937 55 Q 945 55 945 63 L 945 80 L 570 80 Z" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="582" y="72" font-size="13" font-weight="bold" fill="#14532D">Schritt 1: Primäres LGS lösen (Verschiebungen u_f)</text>

  <text x="582" y="98" font-size="12" fill="#166534">Zeile 1:  K_ff · u_f + K_fp · u_p = f_f</text>
  <text x="582" y="115" font-size="12" fill="#166534">Mit u_p = 0 entfällt der Koppelterm vollständig:</text>

  <rect x="582" y="122" width="351" height="28" rx="5" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.2"/>
  <text x="757" y="141" font-size="15" font-weight="bold" fill="#15803D" text-anchor="middle">K_ff · u_f = f_f  ⟹  SPD-System</text>

  <text x="582" y="167" font-size="12" font-weight="bold" fill="#14532D">Cholesky-Lösung (Direktes Verfahren, ⅓ n_f³ Ops):</text>
  <text x="582" y="185" font-size="12" fill="#166534">1. Zerlegung:  K_ff = L · Lᵀ  (L = untere Dreiecksmatrix)</text>
  <text x="582" y="203" font-size="12" fill="#166534">2. Lösen:  L · y = f_f (Vorwärts)  und  Lᵀ · u_f = y (Rückwärts)</text>
  <text x="582" y="221" font-size="12" font-weight="bold" fill="#15803D">✓ Liefert alle elastischen Knotenverschiebungen u_f</text>

  <!-- Card 2: Auflagerreaktionen berechnen (Zeile 2) -->
  <rect x="570" y="238" width="375" height="98" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <path d="M 570 246 Q 570 238 578 238 L 937 238 Q 945 238 945 246 L 945 263 L 570 263 Z" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="582" y="255" font-size="13" font-weight="bold" fill="#78350F">Schritt 2: Auflagerkräfte berechnen (Post-Processing)</text>

  <text x="582" y="280" font-size="12" fill="#92400E">Zeile 2:  f_p = K_pf · u_f + K_pp · u_p  mit u_p = 0:</text>

  <rect x="582" y="288" width="351" height="26" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="757" y="306" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">f_p = K_pf · u_f  [Keine Inversion erforderlich!]</text>

  <text x="582" y="328" font-size="12" fill="#78350F">Reine Matrix-Vektor-Multiplikation mit Aufwand O(n_p · n_f).</text>

  <!-- ==================== BOTTOM NOMENCLATURE & THEORY BANNER ==================== -->
  <rect x="45" y="348" width="900" height="78" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <path d="M 45 356 Q 45 348 53 348 L 937 348 Q 945 348 945 356 L 945 372 L 45 372 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="58" y="365" font-size="12" font-weight="bold" fill="#0F172A">Nomenklatur-Harmonisierung &amp; Mathematische Fundierung</text>

  <!-- Left Column: Nomenklatur-Mapping -->
  <text x="58" y="388" font-size="12" font-weight="bold" fill="#004B96">Nomenklatur-Mapping (International ↔ Deutsch):</text>
  <text x="58" y="405" font-size="12" fill="#334155">• Index f (free)  ≡  Index B (beweglich / frei verschiebbar):  u_f ≡ u_B,  f_f ≡ f_B</text>
  <text x="58" y="420" font-size="12" fill="#334155">• Index p (prescribed)  ≡  Index A (Auflager / fest eingespannt):  u_p ≡ u_A,  f_p ≡ f_A</text>

  <!-- Vertical Divider -->
  <line x1="515" y1="375" x2="515" y2="422" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Right Column: Mathematischer Kern-Vorteil -->
  <text x="530" y="388" font-size="12" font-weight="bold" fill="#15803D">Mathematischer Vorteil der Partitionierung:</text>
  <text x="530" y="405" font-size="12" fill="#334155">• Gesamtsystem K ist singulär (Rangdefizit durch Starrkörper-Freiheitsgrade).</text>
  <text x="530" y="420" font-size="12" fill="#334155">• Erst K_ff ist symmetrisch positiv-definit (SPD) und eindeutig lösbar!</text>
</svg>
