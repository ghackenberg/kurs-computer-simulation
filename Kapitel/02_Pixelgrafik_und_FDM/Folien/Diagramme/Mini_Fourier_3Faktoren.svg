<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Fouriersches Gesetz</text>
  <text x="130" y="41" class="sub">Die 3 Einflussgrößen auf q̇_x</text>

  <!-- Factor 1: Lambda -->
  <g transform="translate(15, 56)">
    <rect width="230" height="92" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
    <text x="115" y="22" class="lbl" style="fill: #9a3412;">1. Material: Leitfähigkeit λ ↑</text>
    <text x="115" y="44" class="sub">Kupfer leitet 100× besser als</text>
    <text x="115" y="60" class="sub">Glas bei gleichem Gefälle:</text>
    <text x="115" y="80" class="math" style="fill: #c2410c;">q̇_x  ∝  λ</text>
  </g>

  <!-- Factor 2: Delta T -->
  <g transform="translate(15, 160)">
    <rect width="230" height="92" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="115" y="22" class="lbl" style="fill: #991b1b;">2. Triebkraft: Differenz ΔT ↑</text>
    <text x="115" y="44" class="sub">Doppelter Temperaturunterschied</text>
    <text x="115" y="60" class="sub">treibt doppelten Wärmestrom:</text>
    <text x="115" y="80" class="math" style="fill: #dc2626;">q̇_x  ∝  (T_{i+1} − T_i)</text>
  </g>

  <!-- Factor 3: Delta x -->
  <g transform="translate(15, 264)">
    <rect width="230" height="92" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="115" y="22" class="lbl" style="fill: #1e40af;">3. Wanddicke: Abstand Δx ↓</text>
    <text x="115" y="44" class="sub">Je dünner die Schicht (kleines Δx),</text>
    <text x="115" y="60" class="sub">desto steiler das Gefälle:</text>
    <text x="115" y="80" class="math" style="fill: #1d4ed8;">q̇_x  ∝  1 / Δx</text>
  </g>

  <!-- Combined -->
  <rect x="15" y="368" width="230" height="38" rx="6" fill="#004B96" />
  <text x="130" y="392" class="math" style="fill: #ffffff;">q̇_x = −λ · ΔT / Δx  [W/m²]</text>
</svg>
