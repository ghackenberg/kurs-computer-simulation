<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Fouriersches Gesetz</text>
  <text x="130" y="41" class="sub sem-muted-text">Die 3 Einflussgrößen auf q̇_x</text>

  <!-- Factor 1: Lambda -->
  <g transform="translate(15, 56)">
    <rect class="sem-warning" width="230" height="92" rx="6" stroke-width="1.5" />
    <text x="115" y="22" class="lbl sem-warning-text" >1. Material: Leitfähigkeit λ ↑</text>
    <text x="115" y="44" class="sub sem-muted-text">Kupfer leitet 100× besser als</text>
    <text x="115" y="60" class="sub sem-muted-text">Glas bei gleichem Gefälle:</text>
    <text x="115" y="80" class="math sem-warning-text" >q̇_x  ∝  λ</text>
  </g>

  <!-- Factor 2: Delta T -->
  <g transform="translate(15, 160)">
    <rect class="sem-danger" width="230" height="92" rx="6" stroke-width="1.5" />
    <text x="115" y="22" class="lbl sem-danger-text" >2. Triebkraft: Differenz ΔT ↑</text>
    <text x="115" y="44" class="sub sem-muted-text">Doppelter Temperaturunterschied</text>
    <text x="115" y="60" class="sub sem-muted-text">treibt doppelten Wärmestrom:</text>
    <text x="115" y="80" class="math sem-danger-text" >q̇_x  ∝  (T_{i+1} − T_i)</text>
  </g>

  <!-- Factor 3: Delta x -->
  <g transform="translate(15, 264)">
    <rect class="sem-primary" width="230" height="92" rx="6" stroke-width="1.5" />
    <text x="115" y="22" class="lbl sem-primary-text" >3. Wanddicke: Abstand Δx ↓</text>
    <text x="115" y="44" class="sub sem-muted-text">Je dünner die Schicht (kleines Δx),</text>
    <text x="115" y="60" class="sub sem-muted-text">desto steiler das Gefälle:</text>
    <text x="115" y="80" class="math sem-primary-text" >q̇_x  ∝  1 / Δx</text>
  </g>

  <!-- Combined -->
  <rect class="sem-primary-fill" x="15" y="368" width="230" height="38" rx="6" />
  <text x="130" y="392" class="math" style="fill: #ffffff;">q̇_x = −λ · ΔT / Δx  [W/m²]</text>
</svg>
