<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-success-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Energiebilanz an Zelle i</text>
  <text x="130" y="41" class="sub sem-muted-text">Wann ändert sich T_i zeitlich?</text>

  <!-- Case 1: In = Out -->
  <g transform="translate(15, 56)">
    <rect class="sem-muted" width="230" height="165" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-neutral-text" >1. Stationärer Durchfluss (0 W)</text>

    <line class="sem-success-stroke" x1="16" y1="75" x2="66" y2="75" stroke-width="2.5" marker-end="url(#ag)" />
    <text x="41" y="63" class="lbl sem-success-text" style="font-size: 11.5px;">+40 W</text>

    <rect class="sem-warning" x="72" y="44" width="86" height="62" rx="6" stroke-width="2" />
    <text x="115" y="70" class="lbl sem-warning-text" >Zelle i</text>
    <text x="115" y="90" class="lbl sem-warning-text" >T_i = konst.</text>

    <line class="sem-danger-stroke" x1="164" y1="75" x2="212" y2="75" stroke-width="2.5" marker-end="url(#ar)" />
    <text x="188" y="63" class="lbl sem-danger-text" style="font-size: 11.5px;">−40 W</text>

    <text x="115" y="128" class="sub sem-muted-text sem-neutral-text" >Netto-Bilanz: +40 − 40 → 0 W</text>
    <text x="115" y="148" class="lbl sem-muted-text" >➔ ∂T_i / ∂t = 0 (Keine Änderung)</text>
  </g>

  <!-- Case 2: Net Inflow > 0 -->
  <g transform="translate(15, 236)">
    <rect class="sem-success" width="230" height="168" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-success-text" >2. Netto-Zufluss (+100 W &gt; 0)</text>

    <line class="sem-success-stroke" x1="16" y1="75" x2="66" y2="75" stroke-width="2.5" marker-end="url(#ag)" />
    <text x="41" y="63" class="lbl sem-success-text" style="font-size: 11.5px;">+60 W</text>

    <rect class="sem-success" x="72" y="44" width="86" height="62" rx="6" stroke-width="2" />
    <text x="115" y="70" class="lbl sem-success-text" >Zelle i</text>
    <text x="115" y="90" class="lbl sem-success-text" >T_i steigt ↑</text>

    <line class="sem-success-stroke" x1="214" y1="75" x2="164" y2="75" stroke-width="2.5" marker-end="url(#ag)" />
    <text x="188" y="63" class="lbl sem-success-text" style="font-size: 11.5px;">+40 W</text>

    <text x="115" y="128" class="sub sem-muted-text sem-success-text" >Netto-Bilanz: +60 + 40 → +100 W</text>
    <text x="115" y="148" class="lbl sem-success-text" >➔ ∂T_i / ∂t &gt; 0 (Erwärmung!)</text>
  </g>
</svg>
