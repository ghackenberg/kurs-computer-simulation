<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 260 372" width="260" height="372">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>


  <!-- Green: Stable -->
  <g transform="translate(15, 56)">
    <rect class="sem-success" width="230" height="106" rx="6" stroke-width="2" />
    <circle class="sem-success-fill" cx="28" cy="24" r="10" />
    <text x="125" y="28" class="lbl sem-success-text" >1. Stabil: s &lt; 0,25</text>
    <text x="115" y="54" class="math sem-success-text" >1 − 4s &gt; 0   (Positiv)</text>
    <text x="115" y="76" class="sub sem-muted-text sem-success-text" >Echte Mischung (0..100 %)</text>
    <text x="115" y="94" class="lbl sem-success-text" >➔ Glatte Temperaturkurve!</text>
  </g>

  <!-- Yellow: Boundary -->
  <g transform="translate(15, 174)">
    <rect class="sem-warning-stroke sem-warning-bg" width="230" height="106" rx="6" stroke-width="2" />
    <circle class="sem-warning-fill" cx="28" cy="24" r="10" />
    <text x="125" y="28" class="lbl sem-warning-text" >2. Grenzfall: s = 0,25</text>
    <text x="115" y="54" class="math sem-warning-text" >1 − 4s = 0   (Null)</text>
    <text x="115" y="76" class="sub sem-muted-text sem-warning-text" >Alter Eigenwert fällt weg:</text>
    <text x="115" y="94" class="lbl sem-warning-text" >➔ T_neu = 100 % T̄_Nachbarn</text>
  </g>

  <!-- Red: Unstable -->
  <g transform="translate(15, 292)">
    <rect class="sem-danger" width="230" height="112" rx="6" stroke-width="2" />
    <circle class="sem-danger-fill" cx="28" cy="24" r="10" />
    <text x="125" y="28" class="lbl sem-danger-text" >3. Instabil: s &gt; 0,25</text>
    <text x="115" y="54" class="math sem-danger-text" >1 − 4s &lt; 0   (NEGATIV!)</text>
    <text x="115" y="76" class="sub sem-muted-text sem-danger-text" >Vorzeichen kippt jeden Schritt</text>
    <text x="115" y="96" class="lbl sem-danger-text" >➔ Schachbrett-Explosion (NaN)!</text>
  </g>
</svg>
