<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #004B96; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #475569; }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #334155; }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; }
    </style>

    <marker id="arrowIn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrowOut" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <text x="35" y="36" class="title">Schritt 2 zur DGL: Energiebilanz an Zelle i – Woher kommt die 2. Ableitung ∂²T/∂x²?</text>
  <text x="35" y="56" class="subtitle">Nicht das Gefälle selbst, sondern der Unterschied zwischen Zufluss und Abfluss (die Krümmung!) ändert die Temperatur</text>

  <!-- ========================================================= -->
  <!-- COLUMN 1: LINEARES GEFÄLLE (KRÜMMUNG = 0)                 -->
  <!-- ========================================================= -->
  <g transform="translate(30, 72)" filter="url(#shadow)">
    <rect width="300" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="300" height="36" rx="8" fill="#f1f5f9" />
    <text x="150" y="23" class="card-hdr" style="text-anchor: middle; fill: #334155;">Fall A: Lineares Gefälle (Gerade)</text>

    <!-- Curve -->
    <line x1="55" y1="68" x2="245" y2="148" stroke="#64748b" stroke-width="3" />
    <circle cx="55" cy="68" r="5" fill="#dc2626" />
    <circle cx="150" cy="108" r="6" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="245" cy="148" r="5" fill="#2563eb" />
    <text x="55" y="56" class="label-bold" style="fill: #dc2626; text-anchor: middle;">100 °C</text>
    <text x="150" y="94" class="label-bold" style="fill: #b45309; text-anchor: middle;">60 °C</text>
    <text x="245" y="136" class="label-bold" style="fill: #2563eb; text-anchor: middle;">20 °C</text>

    <!-- 3 Cells -->
    <rect x="20" y="170" width="70" height="50" rx="4" fill="#fef2f2" stroke="#f87171" />
    <text x="55" y="192" class="label" style="text-anchor: middle;">i−1</text>
    <text x="55" y="210" class="label-bold" style="text-anchor: middle;">100°</text>

    <rect x="115" y="170" width="70" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <text x="150" y="192" class="label-bold" style="text-anchor: middle;">Zelle i</text>
    <text x="150" y="210" class="label-bold" style="text-anchor: middle;">60°</text>

    <rect x="210" y="170" width="70" height="50" rx="4" fill="#eff6ff" stroke="#60a5fa" />
    <text x="245" y="192" class="label" style="text-anchor: middle;">i+1</text>
    <text x="245" y="210" class="label-bold" style="text-anchor: middle;">20°</text>

    <!-- Arrows -->
    <line x1="92" y1="195" x2="112" y2="195" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowIn)" />
    <line x1="187" y1="195" x2="207" y2="195" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowOut)" />

    <!-- Balance Text -->
    <rect x="15" y="235" width="270" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="22" y="256" class="label">• Zufluss links:  <tspan font-weight="bold" fill="#16a34a">+ (100 − 60) = +40</tspan></text>
    <text x="22" y="276" class="label">• Abfluss rechts: <tspan font-weight="bold" fill="#dc2626">+ (20 − 60)  = −40</tspan></text>
    <text x="22" y="298" class="label-bold" style="fill: #334155;">➔ Summe L_i = +40 − 40 = 0 K</text>
    <text x="22" y="316" class="label-bold" style="fill: #475569;">➔ ∂T/∂t = 0 (Zelle bleibt 60 °C!)</text>
  </g>

  <!-- ========================================================= -->
  <!-- COLUMN 2: THERMISCHES TAL (KRÜMMUNG > 0)                  -->
  <!-- ========================================================= -->
  <g transform="translate(350, 72)" filter="url(#shadow)">
    <rect width="300" height="340" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="2" />
    <rect x="0" y="0" width="300" height="36" rx="8" fill="#dcfce7" />
    <text x="150" y="23" class="card-hdr" style="text-anchor: middle; fill: #166534;">Fall B: Tal / Delle (∂²T/∂x² &gt; 0)</text>

    <!-- Curve (Valley) -->
    <path d="M 55 68 Q 150 185 245 88" fill="none" stroke="#16a34a" stroke-width="3" />
    <circle cx="55" cy="68" r="5" fill="#dc2626" />
    <circle cx="150" cy="132" r="6" fill="#2563eb" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="245" cy="88" r="5" fill="#ea580c" />
    <text x="55" y="56" class="label-bold" style="fill: #dc2626; text-anchor: middle;">100 °C</text>
    <text x="150" y="154" class="label-bold" style="fill: #1d4ed8; text-anchor: middle;">40 °C (Tal)</text>
    <text x="245" y="76" class="label-bold" style="fill: #ea580c; text-anchor: middle;">80 °C</text>

    <!-- 3 Cells -->
    <rect x="20" y="170" width="70" height="50" rx="4" fill="#fef2f2" stroke="#f87171" />
    <text x="55" y="192" class="label" style="text-anchor: middle;">i−1</text>
    <text x="55" y="210" class="label-bold" style="text-anchor: middle;">100°</text>

    <rect x="115" y="170" width="70" height="50" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="150" y="192" class="label-bold" style="text-anchor: middle;">Zelle i</text>
    <text x="150" y="210" class="label-bold" style="text-anchor: middle;">40°</text>

    <rect x="210" y="170" width="70" height="50" rx="4" fill="#fff7ed" stroke="#fb923c" />
    <text x="245" y="192" class="label" style="text-anchor: middle;">i+1</text>
    <text x="245" y="210" class="label-bold" style="text-anchor: middle;">80°</text>

    <!-- Arrows (Both In!) -->
    <line x1="92" y1="195" x2="112" y2="195" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowIn)" />
    <line x1="208" y1="195" x2="188" y2="195" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowIn)" />

    <!-- Balance Text -->
    <rect x="15" y="235" width="270" height="90" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="22" y="256" class="label">• Zufluss links:  <tspan font-weight="bold" fill="#16a34a">+ (100 − 40) = +60</tspan></text>
    <text x="22" y="276" class="label">• Zufluss rechts: <tspan font-weight="bold" fill="#16a34a">+ (80 − 40)  = +40</tspan></text>
    <text x="22" y="298" class="label-bold" style="fill: #15803d;">➔ Summe L_i = +60 + 40 = +100 K &gt; 0</text>
    <text x="22" y="316" class="label-bold" style="fill: #166534;">➔ ∂T/∂t &gt; 0 (Zelle i ERWÄRMT sich!)</text>
  </g>

  <!-- ========================================================= -->
  <!-- COLUMN 3: THERMISCHER BERG / HOTSPOT (KRÜMMUNG < 0)       -->
  <!-- ========================================================= -->
  <g transform="translate(670, 72)" filter="url(#shadow)">
    <rect width="300" height="340" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2" />
    <rect x="0" y="0" width="300" height="36" rx="8" fill="#fee2e2" />
    <text x="150" y="23" class="card-hdr" style="text-anchor: middle; fill: #991b1b;">Fall C: Berg / Hotspot (∂²T/∂x² &lt; 0)</text>

    <!-- Curve (Peak) -->
    <path d="M 55 138 Q 150 20 245 138" fill="none" stroke="#dc2626" stroke-width="3" />
    <circle cx="55" cy="138" r="5" fill="#2563eb" />
    <circle cx="150" cy="78" r="6" fill="#dc2626" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="245" cy="138" r="5" fill="#2563eb" />
    <text x="55" y="156" class="label-bold" style="fill: #2563eb; text-anchor: middle;">40 °C</text>
    <text x="150" y="62" class="label-bold" style="fill: #dc2626; text-anchor: middle;">100 °C (Peak)</text>
    <text x="245" y="156" class="label-bold" style="fill: #2563eb; text-anchor: middle;">40 °C</text>

    <!-- 3 Cells -->
    <rect x="20" y="170" width="70" height="50" rx="4" fill="#eff6ff" stroke="#60a5fa" />
    <text x="55" y="192" class="label" style="text-anchor: middle;">i−1</text>
    <text x="55" y="210" class="label-bold" style="text-anchor: middle;">40°</text>

    <rect x="115" y="170" width="70" height="50" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="150" y="192" class="label-bold" style="text-anchor: middle;">Zelle i</text>
    <text x="150" y="210" class="label-bold" style="text-anchor: middle;">100°</text>

    <rect x="210" y="170" width="70" height="50" rx="4" fill="#eff6ff" stroke="#60a5fa" />
    <text x="245" y="192" class="label" style="text-anchor: middle;">i+1</text>
    <text x="245" y="210" class="label-bold" style="text-anchor: middle;">40°</text>

    <!-- Arrows (Both Out!) -->
    <line x1="112" y1="195" x2="92" y2="195" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowOut)" />
    <line x1="188" y1="195" x2="208" y2="195" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowOut)" />

    <!-- Balance Text -->
    <rect x="15" y="235" width="270" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="22" y="256" class="label">• Abfluss links:  <tspan font-weight="bold" fill="#dc2626">+ (40 − 100) = −60</tspan></text>
    <text x="22" y="276" class="label">• Abfluss rechts: <tspan font-weight="bold" fill="#dc2626">+ (40 − 100) = −60</tspan></text>
    <text x="22" y="298" class="label-bold" style="fill: #b91c1c;">➔ Summe L_i = −60 − 60 = −120 K &lt; 0</text>
    <text x="22" y="316" class="label-bold" style="fill: #991b1b;">➔ ∂T/∂t &lt; 0 (Zelle i KÜHLT AB!)</text>
  </g>

  <!-- ========================================================= -->
  <!-- BOTTOM SUMMARY BAR: DIE 1D-DISKRETISIERUNGSFORMEL         -->
  <!-- ========================================================= -->
  <g transform="translate(30, 426)" filter="url(#shadow)">
    <rect width="940" height="72" rx="8" fill="#ffffff" stroke="#004B96" stroke-width="2" />
    <text x="470" y="28" class="math" style="fill: #004B96; font-size: 15.5px; text-anchor: middle;">
      Netto-Bilanz in 1D:   (T_{i−1} − T_i) + (T_{i+1} − T_i)  =  T_{i+1} − 2·T_i + T_{i−1}  ≈  Δx² · (∂²T / ∂x²)
    </text>
    <text x="470" y="54" class="label-bold" style="fill: #1e293b; text-anchor: middle; font-size: 12.5px;">
      Merksatz: Wärmeleitung glättet Kurven! Täler werden aufgefüllt (∂²T/∂x² &gt; 0), Berge werden abgetragen (∂²T/∂x² &lt; 0).
    </text>
  </g>
</svg>
