<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold;  }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;  }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold;  }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; }
    </style>

    <marker id="arrowIn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
    <marker id="arrowOut" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="sem-card" width="1000" height="520" rx="12" stroke-width="1.5" />

  <!-- Header -->
  <text x="35" y="36" class="title sem-primary-text">Schritt 2 zur DGL: Energiebilanz an Zelle i – Woher kommt die 2. Ableitung ∂²T/∂x²?</text>
  <text x="35" y="56" class="subtitle sem-muted-text">Nicht das Gefälle selbst, sondern der Unterschied zwischen Zufluss und Abfluss (die Krümmung!) ändert die Temperatur</text>

  <!-- ========================================================= -->
  <!-- COLUMN 1: LINEARES GEFÄLLE (KRÜMMUNG = 0)                 -->
  <!-- ========================================================= -->
  <g transform="translate(30, 72)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="300" height="340" rx="8" fill="#ffffff" stroke-width="1.5" />
    <rect class="sem-muted" x="0" y="0" width="300" height="36" rx="8"  stroke="none"/>
    <text x="150" y="23" class="card-hdr sem-neutral-text" style="text-anchor: middle;">Fall A: Lineares Gefälle (Gerade)</text>

    <!-- Curve -->
    <line class="sem-muted-stroke" x1="55" y1="68" x2="245" y2="148" stroke-width="3" />
    <circle class="sem-danger-fill" cx="55" cy="68" r="5" />
    <circle class="sem-warning-fill sem-neutral-stroke" cx="150" cy="108" r="6" stroke-width="1.5" />
    <circle class="sem-primary-fill" cx="245" cy="148" r="5" />
    <text x="55" y="56" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle;">100 °C</text>
    <text x="150" y="94" class="label-bold sem-neutral-text sem-warning-text" style="text-anchor: middle;">60 °C</text>
    <text x="245" y="136" class="label-bold sem-neutral-text sem-primary-text" style="text-anchor: middle;">20 °C</text>

    <!-- 3 Cells -->
    <rect class="sem-danger" x="20" y="170" width="70" height="50" rx="4" />
    <text x="55" y="192" class="label sem-neutral-text" style="text-anchor: middle;">i−1</text>
    <text x="55" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">100°</text>

    <rect class="sem-warning" x="115" y="170" width="70" height="50" rx="4" stroke-width="2" />
    <text x="150" y="192" class="label-bold sem-neutral-text" style="text-anchor: middle;">Zelle i</text>
    <text x="150" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">60°</text>

    <rect class="sem-primary" x="210" y="170" width="70" height="50" rx="4" />
    <text x="245" y="192" class="label sem-neutral-text" style="text-anchor: middle;">i+1</text>
    <text x="245" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">20°</text>

    <!-- Arrows -->
    <line class="sem-success-stroke" x1="92" y1="195" x2="112" y2="195" stroke-width="2.5" marker-end="url(#arrowIn)" />
    <line class="sem-danger-stroke" x1="187" y1="195" x2="207" y2="195" stroke-width="2.5" marker-end="url(#arrowOut)" />

    <!-- Balance Text -->
    <rect class="sem-card" x="15" y="235" width="270" height="90" rx="6" />
    <text x="22" y="256" class="label sem-neutral-text">• Zufluss links:  <tspan class="sem-success-text" font-weight="bold">+ (100 − 60) = +40</tspan></text>
    <text x="22" y="276" class="label sem-neutral-text">• Abfluss rechts: <tspan class="sem-danger-text" font-weight="bold">+ (20 − 60)  = −40</tspan></text>
    <text x="22" y="298" class="label-bold sem-neutral-text" >➔ Summe L_i = +40 − 40 = 0 K</text>
    <text x="22" y="316" class="label-bold sem-neutral-text sem-muted-text" >➔ ∂T/∂t = 0 (Zelle bleibt 60 °C!)</text>
  </g>

  <!-- ========================================================= -->
  <!-- COLUMN 2: THERMISCHES TAL (KRÜMMUNG > 0)                  -->
  <!-- ========================================================= -->
  <g transform="translate(350, 72)" filter="url(#shadow)">
    <rect class="sem-success-stroke" width="300" height="340" rx="8" fill="#ffffff" stroke-width="2" />
    <rect class="sem-success" x="0" y="0" width="300" height="36" rx="8"  stroke="none"/>
    <text x="150" y="23" class="card-hdr sem-neutral-text sem-success-text" style="text-anchor: middle;">Fall B: Tal / Delle (∂²T/∂x² &gt; 0)</text>

    <!-- Curve (Valley) -->
    <path class="sem-success-stroke" d="M 55 68 Q 150 180 245 88" fill="none" stroke-width="3" />
    <circle class="sem-danger-fill" cx="55" cy="68" r="5" />
    <circle class="sem-primary-fill sem-neutral-stroke" cx="150" cy="128" r="6" stroke-width="1.5" />
    <circle class="sem-warning-fill" cx="245" cy="88" r="5" />
    <text x="55" y="56" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle;">100 °C</text>
    <text x="150" y="156" class="label-bold sem-neutral-text sem-primary-text" style="text-anchor: middle;">40 °C (Tal)</text>
    <text x="245" y="76" class="label-bold sem-neutral-text sem-warning-text" style="text-anchor: middle;">80 °C</text>

    <!-- 3 Cells -->
    <rect class="sem-danger" x="20" y="170" width="70" height="50" rx="4" />
    <text x="55" y="192" class="label sem-neutral-text" style="text-anchor: middle;">i−1</text>
    <text x="55" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">100°</text>

    <rect class="sem-success" x="115" y="170" width="70" height="50" rx="4" stroke-width="2" />
    <text x="150" y="192" class="label-bold sem-neutral-text" style="text-anchor: middle;">Zelle i</text>
    <text x="150" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">40°</text>

    <rect class="sem-warning sem-warning-stroke" x="210" y="170" width="70" height="50" rx="4" />
    <text x="245" y="192" class="label sem-neutral-text" style="text-anchor: middle;">i+1</text>
    <text x="245" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">80°</text>

    <!-- Arrows (Both In!) -->
    <line class="sem-success-stroke" x1="92" y1="195" x2="112" y2="195" stroke-width="2.5" marker-end="url(#arrowIn)" />
    <line class="sem-success-stroke" x1="208" y1="195" x2="188" y2="195" stroke-width="2.5" marker-end="url(#arrowIn)" />

    <!-- Balance Text -->
    <rect class="sem-success" x="15" y="235" width="270" height="90" rx="6" />
    <text x="22" y="256" class="label sem-neutral-text">• Zufluss links:  <tspan class="sem-success-text" font-weight="bold">+ (100 − 40) = +60</tspan></text>
    <text x="22" y="276" class="label sem-neutral-text">• Zufluss rechts: <tspan class="sem-success-text" font-weight="bold">+ (80 − 40)  = +40</tspan></text>
    <text x="22" y="298" class="label-bold sem-neutral-text sem-success-text" >➔ Summe L_i = +60 + 40 = +100 K &gt; 0</text>
    <text x="22" y="316" class="label-bold sem-neutral-text sem-success-text" >➔ ∂T/∂t &gt; 0 (Zelle i ERWÄRMT sich!)</text>
  </g>

  <!-- ========================================================= -->
  <!-- COLUMN 3: THERMISCHER BERG / HOTSPOT (KRÜMMUNG < 0)       -->
  <!-- ========================================================= -->
  <g transform="translate(670, 72)" filter="url(#shadow)">
    <rect class="sem-danger-stroke" width="300" height="340" rx="8" fill="#ffffff" stroke-width="2" />
    <rect class="sem-danger" x="0" y="0" width="300" height="36" rx="8"  stroke="none"/>
    <text x="150" y="23" class="card-hdr sem-neutral-text sem-danger-text" style="text-anchor: middle;">Fall C: Berg / Hotspot (∂²T/∂x² &lt; 0)</text>

    <!-- Curve (Peak) -->
    <path class="sem-danger-stroke" d="M 55 130 Q 150 20 245 130" fill="none" stroke-width="3" />
    <circle class="sem-primary-fill" cx="55" cy="130" r="5" />
    <circle class="sem-danger-fill sem-neutral-stroke" cx="150" cy="75" r="6" stroke-width="1.5" />
    <circle class="sem-primary-fill" cx="245" cy="130" r="5" />
    <text x="55" y="156" class="label-bold sem-neutral-text sem-primary-text" style="text-anchor: middle;">40 °C</text>
    <text x="150" y="59" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle;">100 °C (Peak)</text>
    <text x="245" y="156" class="label-bold sem-neutral-text sem-primary-text" style="text-anchor: middle;">40 °C</text>

    <!-- 3 Cells -->
    <rect class="sem-primary" x="20" y="170" width="70" height="50" rx="4" />
    <text x="55" y="192" class="label sem-neutral-text" style="text-anchor: middle;">i−1</text>
    <text x="55" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">40°</text>

    <rect class="sem-danger" x="115" y="170" width="70" height="50" rx="4" stroke-width="2" />
    <text x="150" y="192" class="label-bold sem-neutral-text" style="text-anchor: middle;">Zelle i</text>
    <text x="150" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">100°</text>

    <rect class="sem-primary" x="210" y="170" width="70" height="50" rx="4" />
    <text x="245" y="192" class="label sem-neutral-text" style="text-anchor: middle;">i+1</text>
    <text x="245" y="210" class="label-bold sem-neutral-text" style="text-anchor: middle;">40°</text>

    <!-- Arrows (Both Out!) -->
    <line class="sem-danger-stroke" x1="112" y1="195" x2="92" y2="195" stroke-width="2.5" marker-end="url(#arrowOut)" />
    <line class="sem-danger-stroke" x1="188" y1="195" x2="208" y2="195" stroke-width="2.5" marker-end="url(#arrowOut)" />

    <!-- Balance Text -->
    <rect class="sem-danger" x="15" y="235" width="270" height="90" rx="6" />
    <text x="22" y="256" class="label sem-neutral-text">• Abfluss links:  <tspan class="sem-danger-text" font-weight="bold">+ (40 − 100) = −60</tspan></text>
    <text x="22" y="276" class="label sem-neutral-text">• Abfluss rechts: <tspan class="sem-danger-text" font-weight="bold">+ (40 − 100) = −60</tspan></text>
    <text x="22" y="298" class="label-bold sem-neutral-text sem-danger-text" >➔ Summe L_i = −60 − 60 = −120 K &lt; 0</text>
    <text x="22" y="316" class="label-bold sem-neutral-text sem-danger-text" >➔ ∂T/∂t &lt; 0 (Zelle i KÜHLT AB!)</text>
  </g>

  <!-- ========================================================= -->
  <!-- BOTTOM SUMMARY BAR: DIE 1D-DISKRETISIERUNGSFORMEL         -->
  <!-- ========================================================= -->
  <g transform="translate(30, 426)" filter="url(#shadow)">
    <rect class="sem-primary-stroke" width="940" height="72" rx="8" fill="#ffffff" stroke-width="2" />
    <text x="470" y="28" class="math sem-primary-text" style="font-size: 15.5px; text-anchor: middle;">
      Netto-Bilanz in 1D:   (T_{i−1} − T_i) + (T_{i+1} − T_i)  =  T_{i+1} − 2·T_i + T_{i−1}  ≈  Δx² · (∂²T / ∂x²)
    </text>
    <text x="470" y="54" class="label-bold sem-neutral-text sem-card-text" style="text-anchor: middle; font-size: 12.5px;">
      Merksatz: Wärmeleitung glättet Kurven! Täler werden aufgefüllt (∂²T/∂x² &gt; 0), Berge werden abgetragen (∂²T/∂x² &lt; 0).
    </text>
  </g>
</svg>
