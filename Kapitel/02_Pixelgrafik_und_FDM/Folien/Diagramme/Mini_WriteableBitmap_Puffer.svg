<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ad" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">WriteableBitmap-Pipeline</text>
  <text x="130" y="41" class="sub">Vom C#-Array zur Grafikkarte</text>

  <!-- Stage 1: C# Simulation -->
  <g transform="translate(20, 56)">
    <rect width="220" height="68" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    <text x="110" y="22" class="lbl" style="fill: #92400e;">1. C#-Simulationscode</text>
    <text x="110" y="41" class="code" style="fill: #b45309;">_bitmap.Lock();</text>
    <text x="110" y="57" class="sub" style="fill: #78350f;">Schreibt via uint* Pointer</text>
  </g>

  <line x1="130" y1="124" x2="130" y2="148" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ad)" />

  <!-- Stage 2: BackBuffer (RAM) -->
  <g transform="translate(20, 152)">
    <rect width="220" height="72" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <text x="110" y="22" class="lbl" style="fill: #1e40af;">2. BackBuffer (im RAM)</text>
    <text x="110" y="42" class="code" style="fill: #1d4ed8;">_bitmap.BackBuffer</text>
    <text x="110" y="59" class="sub" style="fill: #1e3a8a;">Nativer Speicherblock (CPU)</text>
  </g>

  <!-- Sync Arrow -->
  <line x1="130" y1="224" x2="130" y2="262" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ad)" />
  <rect x="35" y="232" width="190" height="22" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
  <text x="130" y="247" class="code" style="fill: #0369a1; font-size: 10.5px;">AddDirtyRect() + Unlock()</text>

  <!-- Stage 3: FrontBuffer (GPU) -->
  <g transform="translate(20, 266)">
    <rect width="220" height="72" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <text x="110" y="22" class="lbl" style="fill: #166534;">3. FrontBuffer (DirectX / GPU)</text>
    <text x="110" y="42" class="sub" style="fill: #15803d; font-weight: bold;">WPF MilCore Render-Thread</text>
    <text x="110" y="59" class="sub" style="fill: #14532d;">Zeigt Bild mit 60 FPS am Monitor</text>
  </g>

  <!-- Key takeaway -->
  <rect x="20" y="352" width="220" height="52" rx="6" fill="#1e293b" />
  <text x="130" y="373" class="lbl" style="fill: #38bdf8; font-size: 11px;">Wichtig für die Übung:</text>
  <text x="130" y="391" class="sub" style="fill: #f8fafc;">Ohne AddDirtyRect() kein Update!</text>
</svg>
