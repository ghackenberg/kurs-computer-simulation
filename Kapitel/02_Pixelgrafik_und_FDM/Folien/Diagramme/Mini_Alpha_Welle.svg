<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Temperaturleitfähigkeit α</text>
  <text x="130" y="41" class="sub">Wie schnell läuft die Wärmewelle?</text>

  <!-- Fraction Card -->
  <g transform="translate(15, 54)">
    <rect width="230" height="86" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="115" y="24" class="lbl" style="fill: #15803d;">Zähler: Transport λ [W/mK]</text>
    <line x1="30" y1="36" x2="200" y2="36" stroke="#16a34a" stroke-width="2" />
    <text x="115" y="54" class="lbl" style="fill: #1e40af;">Nenner: Trägheit ρ · c_p [J/m³K]</text>
    <text x="115" y="76" class="math" style="fill: #166534;">= α  in  [m² / s]</text>
  </g>

  <!-- Wave Comparison after 1 second -->
  <g transform="translate(15, 154)">
    <rect width="230" height="250" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="22" class="lbl" style="fill: #0f172a;">Ausbreitung nach Δt = 1 s:</text>

    <!-- Copper -->
    <text x="16" y="48" class="lbl" style="text-anchor: start; fill: #b45309;">1. Kupfer (α = 115 mm²/s)</text>
    <rect x="16" y="56" width="198" height="22" rx="4" fill="#fde68a" stroke="#d97706" />
    <rect x="16" y="56" width="185" height="22" rx="4" fill="#ea580c" />
    <text x="115" y="71" class="lbl" style="fill: #ffffff; font-size: 10.5px;">Welle rast durch das Gitter ➔</text>

    <!-- Aluminum -->
    <text x="16" y="106" class="lbl" style="text-anchor: start; fill: #0369a1;">2. Aluminium (α = 97 mm²/s)</text>
    <rect x="16" y="114" width="198" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" />
    <rect x="16" y="114" width="156" height="22" rx="4" fill="#0284c7" />
    <text x="95" y="129" class="lbl" style="fill: #ffffff; font-size: 10.5px;">Schnelle Spreizung ➔</text>

    <!-- TIM Paste -->
    <text x="16" y="164" class="lbl" style="text-anchor: start; fill: #dc2626;">3. Wärmeleitpaste (α = 2,5 mm²/s)</text>
    <rect x="16" y="172" width="198" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" />
    <rect x="16" y="172" width="14" height="22" rx="3" fill="#dc2626" />
    <text x="120" y="187" class="sub" style="fill: #b91c1c; font-weight: bold;">← Kaum Fortschritt (Stau!)</text>

    <rect x="16" y="206" width="198" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="115" y="226" class="sub" style="font-weight: bold; fill: #334155;">Großes α = Schneller Ausgleich!</text>
  </g>
</svg>
