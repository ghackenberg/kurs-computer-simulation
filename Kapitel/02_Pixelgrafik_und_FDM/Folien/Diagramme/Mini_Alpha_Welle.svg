<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Temperaturleitfähigkeit α</text>
  <text x="130" y="41" class="sub sem-muted-text">Wie schnell läuft die Wärmewelle?</text>

  <!-- Fraction Card -->
  <g transform="translate(15, 54)">
    <rect class="sem-success" width="230" height="86" rx="6" stroke-width="1.5" />
    <text x="115" y="24" class="lbl sem-success-text" >Zähler: Transport λ [W/mK]</text>
    <line class="sem-success-stroke" x1="30" y1="36" x2="200" y2="36" stroke-width="2" />
    <text x="115" y="54" class="lbl sem-primary-text" >Nenner: Trägheit ρ · c_p [J/m³K]</text>
    <text x="115" y="76" class="math sem-success-text" >α  in  [m² / s]</text>
  </g>

  <!-- Wave Comparison after 1 second -->
  <g transform="translate(15, 154)">
    <rect class="sem-card-stroke" width="230" height="250" rx="6" fill="#ffffff" stroke-width="1.5" />
    <text x="115" y="22" class="lbl sem-neutral-text" >Ausbreitung nach Δt = 1 s:</text>

    <!-- Copper -->
    <text x="16" y="48" class="lbl sem-warning-text" style="text-anchor: start;">1. Kupfer (α = 115 mm²/s)</text>
    <rect class="sem-warning-fill sem-warning-stroke" x="16" y="54" width="198" height="26" rx="4" />
    <rect class="sem-warning-fill" x="16" y="54" width="188" height="26" rx="4" />
    <text x="110" y="71" class="lbl" style="fill: #ffffff; font-size: 11.5px;">Rasche Ausbreitung ➔</text>

    <!-- Aluminum -->
    <text x="16" y="106" class="lbl sem-info-text" style="text-anchor: start;">2. Aluminium (α = 97 mm²/s)</text>
    <rect class="sem-info" x="16" y="112" width="198" height="26" rx="4" />
    <rect class="sem-info-fill" x="16" y="112" width="164" height="26" rx="4" />
    <text x="98" y="129" class="lbl" style="fill: #ffffff; font-size: 11.5px;">Schnelle Spreizung ➔</text>

    <!-- TIM Paste -->
    <text x="16" y="164" class="lbl sem-danger-text" style="text-anchor: start;">3. Wärmeleitpaste (α = 2,5 mm²/s)</text>
    <rect class="sem-danger" x="16" y="170" width="198" height="26" rx="4" />
    <rect class="sem-danger-fill" x="16" y="170" width="14" height="26" rx="3" />
    <text x="122" y="187" class="sub sem-muted-text sem-danger-text" style="font-weight: bold;">← Kaum Fortschritt (Stau!)</text>

    <rect class="sem-card" x="16" y="208" width="198" height="30" rx="4" />
    <text x="115" y="227" class="sub sem-muted-text sem-neutral-text" style="font-weight: bold;">Großes α: Schneller Ausgleich!</text>
  </g>
</svg>
