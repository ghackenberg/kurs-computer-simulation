<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0284c7; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold;  }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;  }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold;  }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold;  }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; }
    </style>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow class="sem-neutral-text" dx="0" dy="2" stdDeviation="3" flood- flood-opacity="0.08" />
    </filter>
  </defs>

  <rect class="sem-card" width="1000" height="500" rx="12" stroke-width="1.5" />

  <text x="35" y="36" class="title sem-primary-text">Praxisbeispiel im Gitter: Thermisches Modell eines CPU-Kühlkörpers</text>
  <text x="35" y="56" class="subtitle sem-muted-text">Zusammenspiel von Wärmequelle Q, Materialübergängen α(x,y), Isolierung (Neumann) und Luftkühlung (Robin)</text>

  <!-- ========================================================= -->
  <!-- LEFT: 2D QUERSCHNITT IM PIXELGITTER                       -->
  <!-- ========================================================= -->
  <g transform="translate(35, 74)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="510" height="400" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text">1. 2D-Gitterquerschnitt (Materialzonen &amp; Wärmefluss)</text>

    <!-- Air Background -->
    <rect class="sem-info" x="25" y="45" width="460" height="310" rx="6" stroke-width="1.5" />
    <text x="255" y="68" class="label-bold sem-neutral-text sem-info-text" style="text-anchor: middle; font-size: 12px;">
      Kühlluftstrom: T_∞ = 25 °C (Lüfter aktiv: h = 250 W/m²K | Ausfall: h = 20 W/m²K)
    </text>

    <!-- 6 Representative Aluminum Cooling Fins -->
    <g class="sem-muted-fill sem-muted-stroke" stroke-width="1.5">
      <rect x="95"  y="85" width="32" height="122" rx="2" />
      <rect x="153" y="85" width="32" height="122" rx="2" />
      <rect x="211" y="85" width="32" height="122" rx="2" />
      <rect x="269" y="85" width="32" height="122" rx="2" />
      <rect x="327" y="85" width="32" height="122" rx="2" />
      <rect x="385" y="85" width="32" height="122" rx="2" />
    </g>
    <rect class="sem-info" x="65" y="132" width="380" height="24" rx="4" fill-opacity="0.88"  stroke="none"/>
    <text x="255" y="149" class="label-bold sem-neutral-text" style="text-anchor: middle;">
      Aluminium-Finnen (α_Al ≈ 97 mm²/s) + Robin-Rand an Luft
    </text>

    <!-- Copper Heatspreader -->
    <rect class="sem-warning-fill sem-warning-stroke" x="65" y="207" width="380" height="46" rx="3" stroke-width="2" />
    <text x="255" y="235" class="label-bold sem-neutral-text" style="fill: #ffffff; font-size: 12px; text-anchor: middle;">
      Kupfer-Heatspreader (Spreizt Wärme breit: α_Cu ≈ 115 mm²/s)
    </text>

    <!-- Thermal Interface Material (TIM / Paste) - widened to 310px so text fits cleanly inside! -->
    <rect class="sem-warning-fill sem-warning-stroke" x="100" y="253" width="310" height="22" stroke-width="1.5" />
    <text x="255" y="268" class="label-bold sem-neutral-text sem-warning-text" style="font-size: 11px; text-anchor: middle;">
      TIM / Wärmeleitpaste (Engpass: α ≈ 2,5 mm²/s)
    </text>

    <!-- CPU Die (Silicon Heat Source) - widened to 310px -->
    <rect class="sem-danger-fill sem-danger-stroke" x="100" y="275" width="310" height="43" rx="2" stroke-width="2" />
    <text x="255" y="294" class="label-bold sem-neutral-text" style="fill: #ffffff; font-size: 12px; text-anchor: middle;">
      Silizium CPU-Die (Heizquelle P = 150 W)
    </text>
    <text x="255" y="311" class="label sem-neutral-text sem-danger-text" style="font-size: 11px; text-anchor: middle;">
      Quellterm Q = +q̇_V / (ρ · c_p) [K/s]
    </text>

    <!-- PCB Bottom Insulation (Neumann) -->
    <rect class="sem-neutral-fill" x="25" y="318" width="460" height="37" rx="4" />
    <text x="255" y="341" class="label-bold sem-neutral-text sem-card-text" style="text-anchor: middle;">
      Leiterplatte (PCB) unten: Adiabate Isolierung (Neumann ∂T/∂y = 0)
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT: DER THERMISCHE PFAD VON DER QUELLE ZUR SENKE       -->
  <!-- ========================================================= -->
  <g transform="translate(565, 74)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="400" height="400" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text">2. Die 4 Stationen des Wärmepfads im Code</text>

    <!-- Station 1 -->
    <g transform="translate(20, 44)">
      <rect class="sem-danger" width="360" height="75" rx="6" />
      <text x="14" y="22" class="label-bold sem-neutral-text sem-danger-text" >① Wärmeerzeugung im Chip (Quellterm Q)</text>
      <text x="14" y="42" class="label sem-neutral-text">Elektrische Leistung P [W] heizt die Die-Pixel in jedem</text>
      <text x="14" y="60" class="label sem-neutral-text">Zeitschritt aktiv auf:  <tspan class="sem-danger-text" font-weight="bold">T_neu += Δt · Q[x, y]</tspan></text>
    </g>

    <!-- Station 2 -->
    <g transform="translate(20, 130)">
      <rect class="sem-warning" width="360" height="75" rx="6" />
      <text x="14" y="22" class="label-bold sem-neutral-text sem-warning-text" >② Engpass Wärmeleitpaste (TIM)</text>
      <text x="14" y="42" class="label sem-neutral-text">Kleines α_TIM bremst den Wärmefluss ➔ Großer</text>
      <text x="14" y="60" class="label sem-neutral-text">Temperatursprung ΔT über nur 2 Pixel Schichtdicke!</text>
    </g>

    <!-- Station 3 -->
    <g transform="translate(20, 216)">
      <rect class="sem-warning" width="360" height="75" rx="6" />
      <text x="14" y="22" class="label-bold sem-neutral-text sem-warning-text" >③ Wärmespreizung in Kupfer &amp; Alu (5-Punkt-Stern)</text>
      <text x="14" y="42" class="label sem-neutral-text">Hohes α_Cu verteilt die Hitze seitlich auf alle 10 Finnen:</text>
      <text x="14" y="60" class="label sem-neutral-text"><tspan class="sem-warning-text" font-weight="bold">s[x,y] = α[x,y] · Δt / Δx²</tspan>  (mit Δt nach α_max = α_Cu!)</text>
    </g>

    <!-- Station 4 -->
    <g transform="translate(20, 302)">
      <rect class="sem-info" width="360" height="80" rx="6" />
      <text x="14" y="22" class="label-bold sem-neutral-text sem-info-text" >④ Wärmeabgabe an die Luft (Robin-Randbedingung)</text>
      <text x="14" y="42" class="label sem-neutral-text">Große Oberfläche der 10 Finnen übergibt die Wärme an</text>
      <text x="14" y="60" class="label sem-neutral-text">die Luft (T_∞ = 25 °C). Bei Lüfterausfall droht Überhitzung!</text>
    </g>
  </g>
</svg>
