<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Speicherträgheit ρ · c_p</text>
  <text x="130" y="41" class="sub">„Wie groß ist der Wärmetank?“</text>

  <!-- Top: Small Tank -->
  <g transform="translate(15, 56)">
    <rect width="230" height="165" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #991b1b;">1. Kleiner Speicher (kleines ρ·c_p)</text>
    <text x="115" y="37" class="sub" style="fill: #b91c1c;">Schmales Gefäß (Geringe Trägheit)</text>

    <!-- Narrow Tank -->
    <rect x="85" y="46" width="60" height="76" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <rect x="87" y="56" width="56" height="64" rx="2" fill="#fca5a5" />
    <text x="115" y="92" class="lbl" style="fill: #7f1d1d;">+100 J</text>

    <text x="115" y="144" class="lbl" style="fill: #dc2626;">➔ Temperatur T schießt hoch!</text>
  </g>

  <!-- Bottom: Large Tank -->
  <g transform="translate(15, 236)">
    <rect width="230" height="168" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="115" y="20" class="lbl" style="fill: #1e40af;">2. Großer Speicher (großes ρ·c_p)</text>
    <text x="115" y="37" class="sub" style="fill: #1d4ed8;">Breites Gefäß (Hohe Trägheit)</text>

    <!-- Wide Tank -->
    <rect x="35" y="46" width="160" height="76" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect x="37" y="96" width="156" height="24" rx="2" fill="#93c5fd" />
    <text x="115" y="112" class="lbl" style="fill: #1e3a8a;">Dieselben +100 J</text>

    <text x="115" y="146" class="lbl" style="fill: #1d4ed8;">➔ Temperatur T steigt nur wenig!</text>
  </g>
</svg>
