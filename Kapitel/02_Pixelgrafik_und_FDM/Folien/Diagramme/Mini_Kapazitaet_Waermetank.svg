<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 260 372" width="260" height="372">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>


  <!-- Top: Small Tank -->
  <g transform="translate(15, 56)">
    <rect class="sem-danger" width="230" height="165" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-danger-text" >1. Kleiner Speicher (kleines ρ·c_p)</text>

    <!-- Narrow Tank -->
    <rect class="sem-danger-stroke" x="85" y="46" width="60" height="76" rx="4" fill="#ffffff" stroke-width="2" />
    <rect class="sem-danger-fill" x="87" y="56" width="56" height="64" rx="2" />
    <text x="115" y="92" class="lbl" style="fill: #ffffff;">+100 J</text>

    <text x="115" y="144" class="lbl sem-danger-text" >➔ Temperatur T schießt hoch!</text>
  </g>

  <!-- Bottom: Large Tank -->
  <g transform="translate(15, 236)">
    <rect class="sem-primary" width="230" height="168" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-primary-text" >2. Großer Speicher (großes ρ·c_p)</text>

    <!-- Wide Tank -->
    <rect class="sem-primary-stroke" x="35" y="46" width="160" height="76" rx="4" fill="#ffffff" stroke-width="2" />
    <rect class="sem-primary-fill" x="37" y="96" width="156" height="24" rx="2" />
    <text x="115" y="112" class="lbl" style="fill: #ffffff;">Dieselben +100 J</text>

    <text x="115" y="146" class="lbl sem-primary-text" >➔ Temperatur T steigt nur wenig!</text>
  </g>
</svg>
