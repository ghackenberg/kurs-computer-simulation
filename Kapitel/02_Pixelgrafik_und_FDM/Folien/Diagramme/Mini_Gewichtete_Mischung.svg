<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 260 370" width="260" height="370">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>


  <!-- Stacked Mixing Cylinder -->
  <g transform="translate(45, 58)">
    <!-- Neighbor Weight 4s = 60% -->
    <rect class="sem-primary" x="0" y="0" width="170" height="132" rx="6" stroke-width="2" />
    <text x="85" y="38" class="lbl sem-primary-text" >Nachbargewicht: 4s</text>
    <text x="85" y="64" class="math sem-primary-text" style="font-size: 16px;">4s = 0,60 (60 %)</text>
    <text x="85" y="90" class="sub sem-muted-text sem-primary-text" >Anteil von T̄_Nachbarn</text>
    <text x="85" y="108" class="sub sem-muted-text sem-primary-text" >(je 1 · s pro Nachbar)</text>

    <!-- Self Weight 1-4s = 40% -->
    <rect class="sem-warning" x="0" y="136" width="170" height="96" rx="6" stroke-width="2" />
    <text x="85" y="166" class="lbl sem-warning-text" >Eigengewicht: 1 − 4s</text>
    <text x="85" y="192" class="math sem-warning-text" style="font-size: 16px;">1 − 4s = 0,40 (40 %)</text>
    <text x="85" y="216" class="sub sem-muted-text sem-warning-text" >Anteil des alten Werts T_{i,j}^n</text>
  </g>

  <!-- Sum = 100% -->
  <g transform="translate(15, 308)">
    <rect class="sem-success" width="230" height="96" rx="6" stroke-width="1.5" />
    <text x="115" y="22" class="lbl sem-success-text" >Summe der Gewichte = 1 (100 %)</text>
    <text x="115" y="46" class="math sem-success-text" >(1 − 4s) + 4s = 1,00</text>
    <text x="115" y="68" class="sub sem-muted-text sem-success-text" >Solange <tspan font-weight="bold">1 − 4s ≥ 0</tspan> (d. h. <tspan font-weight="bold">s ≤ 0,25</tspan>),</text>
    <text x="115" y="84" class="sub sem-muted-text sem-success-text" style="font-weight: bold;">ist die Mischung garantiert stabil!</text>
  </g>
</svg>
