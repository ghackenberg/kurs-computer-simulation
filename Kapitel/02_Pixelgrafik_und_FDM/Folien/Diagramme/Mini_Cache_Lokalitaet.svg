<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-success-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">CPU-Cache &amp; Schleifen</text>
  <text x="130" y="41" class="sub sem-muted-text">Zugriffsmuster im 2D-Gitter</text>

  <!-- GOOD: Row-Major -->
  <g transform="translate(15, 54)">
    <rect class="sem-success" width="230" height="165" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-success-text" >✅ Zeilenweise (y außen, x innen)</text>
    
    <!-- 3x2 mini grid -->
    <g transform="translate(30, 32)">
      <rect class="sem-success" x="0" y="0" width="48" height="32" rx="3" />
      <rect class="sem-success" x="60" y="0" width="48" height="32" rx="3" />
      <rect class="sem-success" x="120" y="0" width="48" height="32" rx="3" />
      <line class="sem-success-stroke" x1="36" y1="16" x2="58" y2="16" stroke-width="2" marker-end="url(#ag)" />
      <line class="sem-success-stroke" x1="96" y1="16" x2="118" y2="16" stroke-width="2" marker-end="url(#ag)" />

      <rect class="sem-success" x="0" y="42" width="48" height="32" rx="3" />
      <rect class="sem-success" x="60" y="42" width="48" height="32" rx="3" />
      <rect class="sem-success" x="120" y="42" width="48" height="32" rx="3" />
      <line class="sem-success-stroke" x1="36" y1="58" x2="58" y2="58" stroke-width="2" marker-end="url(#ag)" />
      <line class="sem-success-stroke" x1="96" y1="58" x2="118" y2="58" stroke-width="2" marker-end="url(#ag)" />
    </g>

    <text x="115" y="126" class="code sem-success-text" >Adresse +4 Bytes (Linear)</text>
    <text x="115" y="146" class="sub sem-muted-text sem-success-text" style="font-weight: bold;">➔ 100 % L1-Cache-Treffer!</text>
  </g>

  <!-- BAD: Column-Major -->
  <g transform="translate(15, 234)">
    <rect class="sem-danger" width="230" height="170" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-danger-text" >❌ Spaltenweise (x außen, y innen)</text>

    <!-- 3x2 mini grid with vertical jumps -->
    <g transform="translate(30, 32)">
      <rect class="sem-danger" x="0" y="0" width="48" height="32" rx="3" />
      <rect class="sem-danger" x="60" y="0" width="48" height="32" rx="3" />
      <rect class="sem-danger" x="120" y="0" width="48" height="32" rx="3" />

      <rect class="sem-danger" x="0" y="46" width="48" height="32" rx="3" />
      <rect class="sem-danger" x="60" y="46" width="48" height="32" rx="3" />
      <rect class="sem-danger" x="120" y="46" width="48" height="32" rx="3" />

      <line class="sem-danger-stroke" x1="24" y1="22" x2="24" y2="44" stroke-width="2" marker-end="url(#ar)" />
      <line class="sem-danger-stroke" x1="84" y1="22" x2="84" y2="44" stroke-width="2" marker-end="url(#ar)" />
      <line class="sem-danger-stroke" x1="144" y1="22" x2="144" y2="44" stroke-width="2" marker-end="url(#ar)" />
    </g>

    <text x="115" y="130" class="code sem-danger-text" >Sprung +Stride pro Pixel!</text>
    <text x="115" y="150" class="sub sem-muted-text sem-danger-text" style="font-weight: bold;">➔ Ständige Cache-Misses!</text>
  </g>
</svg>
