<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 430 374" width="430" height="374">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-success-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
  </defs>

  <!-- GOOD: Row-Major -->
  <g transform="translate(15, 54)">
    <rect class="sem-success" width="400" height="165" rx="6" stroke-width="1.5" />
    <text x="200" y="21" class="lbl sem-success-text">✅ Zeilenweise (y außen, x innen)</text>

    <!-- 4x2 mini grid -->
    <g transform="translate(38, 32)">
      <rect class="sem-success" x="0" y="0" width="68" height="32" rx="3" />
      <rect class="sem-success" x="85" y="0" width="68" height="32" rx="3" />
      <rect class="sem-success" x="170" y="0" width="68" height="32" rx="3" />
      <rect class="sem-success" x="255" y="0" width="68" height="32" rx="3" />
      <line class="sem-success-stroke" x1="56" y1="16" x2="82" y2="16" stroke-width="2" marker-end="url(#ag)" />
      <line class="sem-success-stroke" x1="141" y1="16" x2="167" y2="16" stroke-width="2" marker-end="url(#ag)" />
      <line class="sem-success-stroke" x1="226" y1="16" x2="252" y2="16" stroke-width="2" marker-end="url(#ag)" />

      <rect class="sem-success" x="0" y="42" width="68" height="32" rx="3" />
      <rect class="sem-success" x="85" y="42" width="68" height="32" rx="3" />
      <rect class="sem-success" x="170" y="42" width="68" height="32" rx="3" />
      <rect class="sem-success" x="255" y="42" width="68" height="32" rx="3" />
      <line class="sem-success-stroke" x1="56" y1="58" x2="82" y2="58" stroke-width="2" marker-end="url(#ag)" />
      <line class="sem-success-stroke" x1="141" y1="58" x2="167" y2="58" stroke-width="2" marker-end="url(#ag)" />
      <line class="sem-success-stroke" x1="226" y1="58" x2="252" y2="58" stroke-width="2" marker-end="url(#ag)" />
    </g>

    <text x="200" y="128" class="code sem-success-text">Adresse +4 Bytes pro Schritt (Linear)</text>
    <text x="200" y="148" class="sub sem-success-text" style="font-weight: bold;">➔ 100 % L1-Cache-Treffer!</text>
  </g>

  <!-- BAD: Column-Major -->
  <g transform="translate(15, 234)">
    <rect class="sem-danger" width="400" height="170" rx="6" stroke-width="1.5" />
    <text x="200" y="21" class="lbl sem-danger-text">❌ Spaltenweise (x außen, y innen)</text>

    <!-- 4x2 mini grid with vertical jumps -->
    <g transform="translate(38, 32)">
      <rect class="sem-danger" x="0" y="0" width="68" height="32" rx="3" />
      <rect class="sem-danger" x="85" y="0" width="68" height="32" rx="3" />
      <rect class="sem-danger" x="170" y="0" width="68" height="32" rx="3" />
      <rect class="sem-danger" x="255" y="0" width="68" height="32" rx="3" />

      <rect class="sem-danger" x="0" y="46" width="68" height="32" rx="3" />
      <rect class="sem-danger" x="85" y="46" width="68" height="32" rx="3" />
      <rect class="sem-danger" x="170" y="46" width="68" height="32" rx="3" />
      <rect class="sem-danger" x="255" y="46" width="68" height="32" rx="3" />

      <line class="sem-danger-stroke" x1="34" y1="22" x2="34" y2="44" stroke-width="2" marker-end="url(#ar)" />
      <line class="sem-danger-stroke" x1="119" y1="22" x2="119" y2="44" stroke-width="2" marker-end="url(#ar)" />
      <line class="sem-danger-stroke" x1="204" y1="22" x2="204" y2="44" stroke-width="2" marker-end="url(#ar)" />
      <line class="sem-danger-stroke" x1="289" y1="22" x2="289" y2="44" stroke-width="2" marker-end="url(#ar)" />
    </g>

    <text x="200" y="130" class="code sem-danger-text">Sprung +Stride pro Pixel!</text>
    <text x="200" y="150" class="sub sem-danger-text" style="font-weight: bold;">➔ Ständige Cache-Misses!</text>
  </g>
</svg>
