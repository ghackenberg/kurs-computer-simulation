<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0284c7; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold;  }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;  }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold;  }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold;  }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; }
      .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>

    <linearGradient id="hotCoolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <marker id="arrowOrange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="sem-warning-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="sem-info-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow class="sem-neutral-text" dx="0" dy="2" stdDeviation="3" flood- flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="sem-card" width="1000" height="520" rx="12" stroke-width="1.5" />

  <!-- Header -->
  <text x="35" y="36" class="title sem-primary-text">Thermodynamische Grundbegriffe &amp; Ingenieur-Analogie</text>
  <text x="35" y="56" class="subtitle sem-muted-text">Vom bekannten elektrischen / hydraulischen System zum Wärmefluss im Festkörper</text>

  <!-- ========================================================= -->
  <!-- TOP LEFT: THERMISCHES SYSTEM                              -->
  <!-- ========================================================= -->
  <g transform="translate(35, 72)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="450" height="230" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text sem-danger-text" >1. Thermisches System (Wärmeleitung)</text>

    <!-- Hot Block -->
    <rect class="sem-danger" x="25" y="55" width="120" height="115" rx="6" stroke-width="2.5" />
    <text x="85" y="80" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle;">Körper A (Heiß)</text>
    <text x="85" y="106" class="math sem-danger-text" style="font-size: 16px; text-anchor: middle;">T₁ = 100 °C</text>
    <text x="85" y="130" class="label sem-neutral-text sem-danger-text" style="text-anchor: middle;">Hohe Teilchen-</text>
    <text x="85" y="146" class="label sem-neutral-text sem-danger-text" style="text-anchor: middle;">bewegung (E_th)</text>

    <!-- Connecting Rod -->
    <rect class="sem-muted-stroke" x="145" y="92" width="160" height="40" fill="url(#hotCoolGrad)" stroke-width="1.5" />
    <line x1="162" y1="112" x2="282" y2="112" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowOrange)" />
    <rect class="sem-warning" x="155" y="52" width="140" height="28" rx="4" stroke-width="1" />
    <text x="225" y="70" class="label-bold sem-neutral-text sem-warning-text" style="text-anchor: middle;">Wärmestrom Q̇ [W]</text>
    <text x="225" y="152" class="label sem-neutral-text sem-muted-text" style="text-anchor: middle;">Leitwert ~ λ · A / Δx</text>

    <!-- Cold Block -->
    <rect class="sem-primary" x="305" y="55" width="120" height="115" rx="6" stroke-width="2.5" />
    <text x="365" y="80" class="label-bold sem-neutral-text sem-primary-text" style="text-anchor: middle;">Körper B (Kalt)</text>
    <text x="365" y="106" class="math sem-primary-text" style="font-size: 16px; text-anchor: middle;">T₂ = 20 °C</text>
    <text x="365" y="130" class="label sem-neutral-text sem-primary-text" style="text-anchor: middle;">Geringe Teilchen-</text>
    <text x="365" y="146" class="label sem-neutral-text sem-primary-text" style="text-anchor: middle;">bewegung (E_th)</text>

    <!-- Bottom rule -->
    <rect class="sem-danger" x="20" y="185" width="410" height="32" rx="5" />
    <text x="225" y="205" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle;">
      Triebkraft: Temperaturdifferenz ΔT = T₁ − T₂ &gt; 0 (Warm ➔ Kalt)
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- TOP RIGHT: ELEKTRO- / HYDRAULIK-ANALOGIE                  -->
  <!-- ========================================================= -->
  <g transform="translate(515, 72)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="450" height="230" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text sem-info-text" >2. Bekannte Analogie (Elektrotechnik / Hydraulik)</text>

    <!-- Left Tank / Capacitor -->
    <rect class="sem-info" x="25" y="55" width="120" height="115" rx="6" stroke-width="2" />
    <rect class="sem-info-fill" x="27" y="85" width="116" height="83" rx="4" />
    <text x="85" y="75" class="label-bold sem-neutral-text sem-info-text" style="text-anchor: middle;">Knoten 1</text>
    <text x="85" y="110" class="math sem-info-text" style="font-size: 15px; text-anchor: middle;">Spannung U₁</text>
    <text x="85" y="133" class="label sem-neutral-text sem-info-text" style="text-anchor: middle;">(Füllstand h₁)</text>
    <text x="85" y="155" class="label-bold sem-neutral-text sem-info-text" style="text-anchor: middle;">Kondensator C</text>

    <!-- Resistor / Pipe -->
    <rect class="sem-muted" x="145" y="96" width="160" height="32" stroke-width="1.5" />
    <line class="sem-info-stroke" x1="162" y1="112" x2="282" y2="112" stroke-width="3" marker-end="url(#arrowBlue)" />
    <rect class="sem-info" x="155" y="52" width="140" height="28" rx="4" stroke-width="1" />
    <text x="225" y="70" class="label-bold sem-neutral-text sem-info-text" style="text-anchor: middle;">Strom I [A = C/s]</text>
    <text x="225" y="152" class="label sem-neutral-text sem-muted-text" style="text-anchor: middle;">Leitwert G = 1 / R</text>

    <!-- Right Tank / Capacitor -->
    <rect class="sem-card sem-muted-stroke" x="305" y="55" width="120" height="115" rx="6" stroke-width="2" />
    <rect class="sem-info-fill" x="307" y="135" width="116" height="33" rx="4" />
    <text x="365" y="75" class="label-bold sem-neutral-text" style="text-anchor: middle;">Knoten 2</text>
    <text x="365" y="110" class="math sem-neutral-text" style="font-size: 15px; text-anchor: middle;">Spannung U₂</text>
    <text x="365" y="132" class="label sem-neutral-text sem-muted-text" style="text-anchor: middle;">(Füllstand h₂)</text>
    <text x="365" y="155" class="label-bold sem-neutral-text" style="text-anchor: middle;">Kondensator C</text>

    <!-- Bottom rule -->
    <rect class="sem-info" x="20" y="185" width="410" height="32" rx="5" />
    <text x="225" y="205" class="label-bold sem-neutral-text sem-info-text" style="text-anchor: middle;">
      Triebkraft: Spannungsdifferenz ΔU = U₁ − U₂ &gt; 0 (Ohmsches Gesetz)
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- BOTTOM: DIE 3 GRUNDGRÖSSEN AUF EINEN BLICK                -->
  <!-- ========================================================= -->
  <g transform="translate(35, 320)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="930" height="175" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text">3. Die drei Größen sauber auseinanderhalten (Häufigste Verwechslungsgefahr!)</text>

    <!-- Box 1: Temperatur T -->
    <g transform="translate(15, 42)">
      <rect class="sem-danger" width="290" height="115" rx="6" stroke-width="1.5" />
      <rect class="sem-danger-fill" x="12" y="10" width="28" height="24" rx="4" />
      <text x="26" y="22" class="badge">T</text>
      <text x="48" y="27" class="label-bold sem-neutral-text sem-danger-text" style="font-size: 13.5px;">Temperatur [K oder °C]</text>
      <text x="12" y="52" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">Was ist das?</tspan> Lokaler Zustand („Wärmedruck“)</text>
      <text x="12" y="72" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">Elektro-Analogie:</tspan> Spannung U [V] / Füllstand h</text>
      <text x="12" y="92" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">In C#:</tspan> Float-Wert im Pixel <tspan font-family="Consolas">_t[x,y]</tspan></text>
    </g>

    <!-- Box 2: Wärmeenergie E_th -->
    <g transform="translate(320, 42)">
      <rect class="sem-warning" width="290" height="115" rx="6" stroke-width="1.5" />
      <rect class="sem-warning-fill" x="12" y="10" width="38" height="24" rx="4" />
      <text x="31" y="22" class="badge">E_th</text>
      <text x="58" y="27" class="label-bold sem-neutral-text sem-warning-text" style="font-size: 13.5px;">Wärmeenergie [J = W·s]</text>
      <text x="12" y="52" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">Was ist das?</tspan> Gespeicherte Energie im Pixel</text>
      <text x="12" y="72" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">Elektro-Analogie:</tspan> Elektrische Ladung Q [C]</text>
      <text x="12" y="92" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">Formel:</tspan> ΔE_th = m · c_p · ΔT [Joule]</text>
    </g>

    <!-- Box 3: Wärmestrom q_dot -->
    <g transform="translate(625, 42)">
      <rect class="sem-success" width="290" height="115" rx="6" stroke-width="1.5" />
      <rect class="sem-success-fill" x="12" y="10" width="42" height="24" rx="4" />
      <text x="33" y="22" class="badge">Q̇ / q̇</text>
      <text x="62" y="27" class="label-bold sem-neutral-text sem-success-text" style="font-size: 13.5px;">Wärmestrom [W] / [W/m²]</text>
      <text x="12" y="52" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">Was ist das?</tspan> Energiefluss pro Sekunde</text>
      <text x="12" y="72" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">Elektro-Analogie:</tspan> Strom I [A] / Dichte J [A/m²]</text>
      <text x="12" y="92" class="label sem-neutral-text" style="font-size: 11.5px;">• <tspan font-weight="bold">Wichtig:</tspan> Fließt nur bei Temperaturgefälle ΔT!</text>
    </g>
  </g>
</svg>
