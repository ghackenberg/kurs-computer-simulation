<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ad" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-muted-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
  </defs>

  <text x="130" y="24" class="hdr sem-primary-text">Vorzeichen-Logik (−λ)</text>
  <text x="130" y="41" class="sub sem-muted-text">Vom Gefälle zum positiven Fluss</text>

  <!-- Step 1: Temperature drop -->
  <g transform="translate(15, 56)">
    <rect class="sem-primary" width="230" height="72" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-primary-text" >1. Temperatur fällt nach rechts</text>
    <text x="115" y="42" class="math sem-primary-text" >T_i = 80 °C  ➔  T_{i+1} = 30 °C</text>
    <text x="115" y="60" class="sub sem-muted-text sem-primary-text" >Differenz ΔT = 30 − 80 = −50 K</text>
  </g>

  <line class="sem-muted-stroke" x1="130" y1="128" x2="130" y2="148" stroke-width="2" marker-end="url(#ad)" />

  <!-- Step 2: Negative Slope -->
  <g transform="translate(15, 152)">
    <rect class="sem-danger" width="230" height="68" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-danger-text" >2. Mathematische Steigung</text>
    <text x="115" y="44" class="math sem-danger-text" >∂T / ∂x  &lt;  0   (NEGATIV)</text>
    <text x="115" y="60" class="sub sem-muted-text sem-danger-text" >Kurve geht nach unten (−)</text>
  </g>

  <line class="sem-muted-stroke" x1="130" y1="220" x2="130" y2="240" stroke-width="2" marker-end="url(#ad)" />

  <!-- Step 3: Multiply by -lambda -->
  <g transform="translate(30, 244)">
    <rect class="sem-warning-fill" width="200" height="52" rx="26" />
    <text x="100" y="23" class="lbl" style="fill: #ffffff;">3. Vorzeichen-Umkehr</text>
    <text x="100" y="41" class="math" style="fill: #ffffff;">(−λ) · (−Steigung) = (+)</text>
  </g>

  <line class="sem-muted-stroke" x1="130" y1="296" x2="130" y2="316" stroke-width="2" marker-end="url(#ad)" />

  <!-- Step 4: Positive Flux -->
  <g transform="translate(15, 320)">
    <rect class="sem-success" width="230" height="82" rx="6" stroke-width="2" />
    <text x="115" y="22" class="lbl sem-success-text" >4. Physikalischer Wärmestrom</text>
    <text x="115" y="46" class="math sem-success-text" >q̇_x  &gt;  0   (POSITIV)</text>
    <text x="115" y="68" class="sub sem-muted-text sem-success-text" style="font-weight: bold;">Fließt von Warm nach Kalt (+x)!</text>
  </g>
</svg>
