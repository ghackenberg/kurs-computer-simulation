<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Geometrie der Kennzahl s</text>
  <text x="130" y="41" class="sub sem-muted-text">Verhältnis zweier Flächen [m²/m²]</text>

  <!-- Visual Area Comparison -->
  <g transform="translate(20, 56)">
    <!-- Outer Square: Pixel Area dx * dx -->
    <rect class="sem-primary" x="10" y="10" width="200" height="182" rx="6" stroke-width="2.5" />
    <text x="110" y="32" class="lbl sem-primary-text" >1 Pixel-Fläche (Nenner)</text>
    <text x="110" y="50" class="math sem-primary-text" >A_Pixel = Δx · Δx = Δx²</text>

    <!-- Inner Pill/Circle: Thermal Diffusion Area alpha * dt -->
    <rect class="sem-warning-stroke sem-warning" x="38" y="68" width="144" height="96" rx="48" stroke-width="2.5" stroke-dasharray="4,2"  stroke="none"/>
    <circle class="sem-danger-fill" cx="110" cy="116" r="5" />
    <text x="110" y="102" class="lbl sem-warning-text" style="font-size: 11.5px;">Wärme-Fleck</text>
    <text x="110" y="140" class="math sem-warning-text" style="font-size: 12.5px;">A_Diff = α · Δt</text>

    <!-- Dimension label dx -->
    <text x="110" y="210" class="lbl sem-primary-text" >◄──── Kantenlänge Δx ────►</text>
  </g>

  <!-- Explanation Box -->
  <g transform="translate(15, 282)">
    <rect class="sem-success" width="230" height="122" rx="6" stroke-width="1.5" />
    <text x="115" y="22" class="lbl sem-success-text" >Flächenverhältnis s:</text>
    <text x="115" y="46" class="math sem-success-text" style="font-size: 11.5px;">s = A_Diff / A_Pixel = (α·Δt) / Δx²</text>
    <text x="115" y="70" class="sub sem-muted-text sem-success-text" >• <tspan font-weight="bold">s ≤ 0,25:</tspan> Wärmewelle bleibt im</text>
    <text x="115" y="86" class="sub sem-muted-text sem-success-text" >Zeitschritt Δt innerhalb des Pixels.</text>
    <text x="115" y="106" class="sub sem-muted-text sem-danger-text" style="font-weight: bold;">• s &gt; 0,25: Überspringt Zellmitte!</text>
  </g>
</svg>
