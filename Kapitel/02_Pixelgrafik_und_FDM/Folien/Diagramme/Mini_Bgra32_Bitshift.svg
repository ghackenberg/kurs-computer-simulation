<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">32-Bit Pixel (Bgra32)</text>
  <text x="130" y="41" class="sub">4 Kanäle = 1 uint (4 Bytes)</text>

  <!-- Byte 3: Alpha -->
  <g transform="translate(20, 56)">
    <rect width="220" height="58" rx="6" fill="#475569" />
    <text x="110" y="22" class="lbl" style="fill: #f8fafc;">Byte 3: Alpha (Deckkraft)</text>
    <text x="110" y="44" class="code" style="fill: #cbd5e1;">Bits 24..31  (Alpha &lt;&lt; 24)</text>
  </g>

  <!-- Byte 2: Red -->
  <g transform="translate(20, 124)">
    <rect width="220" height="58" rx="6" fill="#dc2626" />
    <text x="110" y="22" class="lbl" style="fill: #ffffff;">Byte 2: Rot-Kanal (0..255)</text>
    <text x="110" y="44" class="code" style="fill: #fecaca;">Bits 16..23  (Rot &lt;&lt; 16)</text>
  </g>

  <!-- Byte 1: Green -->
  <g transform="translate(20, 192)">
    <rect width="220" height="58" rx="6" fill="#16a34a" />
    <text x="110" y="22" class="lbl" style="fill: #ffffff;">Byte 1: Grün-Kanal (0..255)</text>
    <text x="110" y="44" class="code" style="fill: #bbf7d0;">Bits 8..15   (Grün &lt;&lt; 8)</text>
  </g>

  <!-- Byte 0: Blue -->
  <g transform="translate(20, 260)">
    <rect width="220" height="58" rx="6" fill="#2563eb" />
    <text x="110" y="22" class="lbl" style="fill: #ffffff;">Byte 0: Blau-Kanal (0..255)</text>
    <text x="110" y="44" class="code" style="fill: #bfdbfe;">Bits 0..7    (Blau &lt;&lt; 0)</text>
  </g>

  <!-- Combined uint -->
  <g transform="translate(20, 332)">
    <rect width="220" height="72" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="22" class="lbl" style="fill: #38bdf8;">Als 32-Bit uint (Hex):</text>
    <text x="110" y="44" class="code" style="fill: #f8fafc; font-size: 13px;">0x AA RR GG BB</text>
    <text x="110" y="62" class="sub" style="fill: #94a3b8;">z.B. 0xFFFF0000 = Reinrot</text>
  </g>
</svg>
