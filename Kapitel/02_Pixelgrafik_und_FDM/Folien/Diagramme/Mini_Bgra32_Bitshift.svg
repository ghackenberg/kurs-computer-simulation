<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0284c7; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">32-Bit Pixel (Bgra32)</text>
  <text x="130" y="42" class="sub sem-muted-text">4 Kanäle in 1 uint (4 Bytes)</text>

  <!-- Byte 3: Alpha -->
  <g transform="translate(20, 56)">
    <rect class="sem-muted-fill" width="220" height="58" rx="6" />
    <text x="110" y="22" class="lbl sem-card-text" >Byte 3: Alpha (Deckkraft)</text>
    <text x="110" y="44" class="code sem-card-text" >Bits 24..31  (Alpha &lt;&lt; 24)</text>
  </g>

  <!-- Byte 2: Red -->
  <g transform="translate(20, 124)">
    <rect class="sem-danger-fill" width="220" height="58" rx="6" />
    <text x="110" y="22" class="lbl" style="fill: #ffffff;">Byte 2: Rot-Kanal (0..255)</text>
    <text x="110" y="44" class="code sem-danger-text" >Bits 16..23  (Rot &lt;&lt; 16)</text>
  </g>

  <!-- Byte 1: Green -->
  <g transform="translate(20, 192)">
    <rect class="sem-success-fill" width="220" height="58" rx="6" />
    <text x="110" y="22" class="lbl" style="fill: #ffffff;">Byte 1: Grün-Kanal (0..255)</text>
    <text x="110" y="44" class="code sem-success-text" >Bits 8..15   (Grün &lt;&lt; 8)</text>
  </g>

  <!-- Byte 0: Blue -->
  <g transform="translate(20, 260)">
    <rect class="sem-primary-fill" width="220" height="58" rx="6" />
    <text x="110" y="22" class="lbl" style="fill: #ffffff;">Byte 0: Blau-Kanal (0..255)</text>
    <text x="110" y="44" class="code sem-primary-text" >Bits 0..7    (Blau &lt;&lt; 0)</text>
  </g>

  <!-- Combined uint -->
  <g transform="translate(20, 332)">
    <rect class="sem-card-fill sem-info-stroke" width="220" height="72" rx="6" stroke-width="1.5" />
    <text x="110" y="22" class="lbl sem-info-text" >Als 32-Bit uint (Hex):</text>
    <text x="110" y="44" class="code sem-card-text" style="font-size: 13px;">0x AA RR GG BB</text>
    <text x="110" y="62" class="sub sem-muted-text" >z.B. 0xFFFF0000 = Reinrot</text>
  </g>
</svg>
