<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 65 1000 495" width="1000" height="495">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-info-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: url(#grad-sem-info-fill); }
      .sem-info-text { fill: #075985; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold;  }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;  }
      .section-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold;  }
      .cell-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; dominant-baseline: middle; }
      .cell-text-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold;  text-anchor: middle; dominant-baseline: middle; }
      .badge-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .code-font { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px;  }
      .arrow-dash {  stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-amber); }
    </style>

    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="sem-warning-fill" points="0 0, 8 3, 0 6" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon class="sem-muted-fill" points="0 0, 6 2.5, 0 5" />
    </marker>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Hintergrund -->

  <!-- Kopfbereich -->



  <!-- ========================================== -->
  <!-- LINKE KARTE: 2D-PIXELRASTER                -->
  <!-- ========================================== -->
  <g transform="translate(35, 75)" filter="url(#card-shadow)">
    <rect class="sem-card-stroke" width="445" height="340" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="section-hdr sem-neutral-text">1. 2D-Bildmatrix (Koordinatensystem)</text>

    <!-- X-Achse -->
    <line class="sem-muted-stroke" x1="55" y1="55" x2="365" y2="55" stroke-width="1.5" marker-end="url(#arrowhead-gray)" />
    <text x="378" y="56" class="cell-text sem-neutral-text sem-muted-text" style="font-weight: bold;">x</text>
    <text x="205" y="45" class="cell-text sem-neutral-text sem-muted-text" >Breite W (Spalten 0 … W-1)</text>

    <!-- Y-Achse -->
    <line class="sem-muted-stroke" x1="45" y1="65" x2="45" y2="285" stroke-width="1.5" marker-end="url(#arrowhead-gray)" />
    <text x="45" y="302" class="cell-text sem-neutral-text sem-muted-text" style="font-weight: bold;">y</text>

    <!-- Zeile 0 -->
    <g transform="translate(62, 70)">
      <rect class="sem-muted sem-card-stroke" x="0" y="0" width="54" height="35" rx="3" />
      <text x="27" y="17.5" class="cell-text sem-neutral-text">(0, 0)</text>

      <rect class="sem-muted sem-card-stroke" x="59" y="0" width="54" height="35" rx="3" />
      <text x="86" y="17.5" class="cell-text sem-neutral-text">(1, 0)</text>

      <rect class="sem-muted sem-card-stroke" x="118" y="0" width="54" height="35" rx="3" />
      <text x="145" y="17.5" class="cell-text sem-neutral-text">(2, 0)</text>

      <text x="190" y="17.5" class="cell-text sem-neutral-text" style="font-size: 15px;">…</text>

      <rect class="sem-muted sem-card-stroke" x="208" y="0" width="76" height="35" rx="3" />
      <text x="246" y="17.5" class="cell-text sem-neutral-text">(W-1, 0)</text>

      <text x="332" y="17.5" class="cell-text sem-neutral-text sem-muted-text" >Zeile 0</text>
    </g>

    <!-- Zeile 1 -->
    <g transform="translate(62, 115)">
      <rect class="sem-muted sem-card-stroke" x="0" y="0" width="54" height="35" rx="3" />
      <text x="27" y="17.5" class="cell-text sem-neutral-text">(0, 1)</text>

      <rect class="sem-muted sem-card-stroke" x="59" y="0" width="54" height="35" rx="3" />
      <text x="86" y="17.5" class="cell-text sem-neutral-text">(1, 1)</text>

      <rect class="sem-muted sem-card-stroke" x="118" y="0" width="54" height="35" rx="3" />
      <text x="145" y="17.5" class="cell-text sem-neutral-text">(2, 1)</text>

      <text x="190" y="17.5" class="cell-text sem-neutral-text" style="font-size: 15px;">…</text>

      <rect class="sem-muted sem-card-stroke" x="208" y="0" width="76" height="35" rx="3" />
      <text x="246" y="17.5" class="cell-text sem-neutral-text">(W-1, 1)</text>

      <text x="332" y="17.5" class="cell-text sem-neutral-text sem-muted-text" >Zeile 1</text>
    </g>

    <!-- Vertikale Auslassungspunkte -->
    <text x="89" y="168" class="cell-text sem-neutral-text" style="font-size: 16px;">⋮</text>
    <text x="148" y="168" class="cell-text sem-neutral-text" style="font-size: 16px;">⋮</text>
    <text x="207" y="168" class="cell-text sem-neutral-text" style="font-size: 16px;">⋮</text>
    <text x="308" y="168" class="cell-text sem-neutral-text" style="font-size: 16px;">⋮</text>

    <!-- Zeile y mit Target-Pixel (x, y) -->
    <g transform="translate(62, 185)">
      <rect class="sem-card sem-muted-stroke" x="0" y="0" width="54" height="40" rx="3" />
      <text x="27" y="20" class="cell-text sem-neutral-text">(0, y)</text>

      <text x="84" y="20" class="cell-text sem-neutral-text" style="font-size: 15px;">…</text>

      <rect class="sem-warning" x="110" y="0" width="66" height="40" stroke-width="2.5" rx="4" />
      <text x="143" y="20" class="cell-text-bold sem-neutral-text sem-warning-text" >(x, y)</text>

      <text x="192" y="20" class="cell-text sem-neutral-text" style="font-size: 15px;">…</text>

      <rect class="sem-card sem-muted-stroke" x="208" y="0" width="76" height="40" rx="3" />
      <text x="246" y="20" class="cell-text sem-neutral-text">(W-1, y)</text>

      <text x="332" y="20" class="cell-text sem-neutral-text sem-info-text" style="font-weight: bold;">Zeile y</text>
    </g>

    <!-- Vertikale Auslassungspunkte -->
    <text x="89" y="243" class="cell-text sem-neutral-text" style="font-size: 16px;">⋮</text>
    <text x="207" y="243" class="cell-text sem-neutral-text" style="font-size: 16px;">⋮</text>
    <text x="308" y="243" class="cell-text sem-neutral-text" style="font-size: 16px;">⋮</text>

    <!-- Letzte Zeile H-1 -->
    <g transform="translate(62, 255)">
      <rect class="sem-muted sem-card-stroke" x="0" y="0" width="54" height="35" rx="3" />
      <text x="27" y="17.5" class="cell-text sem-neutral-text">(0, H-1)</text>

      <text x="84" y="17.5" class="cell-text sem-neutral-text" style="font-size: 15px;">…</text>
      <text x="192" y="17.5" class="cell-text sem-neutral-text" style="font-size: 15px;">…</text>

      <rect class="sem-muted sem-card-stroke" x="208" y="0" width="78" height="35" rx="3" />
      <text x="247" y="17.5" class="cell-text sem-neutral-text">(W-1, H-1)</text>

      <text x="334" y="17.5" class="cell-text sem-neutral-text sem-muted-text" >Zeile H-1</text>
    </g>

    <text x="20" y="322" class="cell-text sem-neutral-text sem-muted-text" style="text-anchor: start;">
      Höhe H: Zeilen 0 bis H-1 | Pro Pixel: 4 Bytes (32 Bit Farbtiefe)
    </text>
  </g>

  <!-- ========================================== -->
  <!-- RECHTE KARTE: 1D-SPEICHERLAYOUT (RAM)      -->
  <!-- ========================================== -->
  <g transform="translate(500, 75)" filter="url(#card-shadow)">
    <rect class="sem-card-stroke" width="465" height="340" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="section-hdr sem-neutral-text">2. Linearer Adressraum im RAM (BackBuffer)</text>

    <!-- Speicherbalken Zeile 0 -->
    <g transform="translate(20, 48)">
      <rect class="sem-muted" x="0" y="0" width="230" height="28" rx="3" />
      <text x="115" y="14" class="cell-text sem-neutral-text">Zeile 0 (Pixel 0 … W-1)</text>
      <rect class="sem-card-fill sem-muted-stroke" x="230" y="0" width="34" height="28" stroke-dasharray="2,2" rx="2" />
      <text x="247" y="14" class="cell-text sem-neutral-text sem-muted-text" >Pad</text>
      <text x="276" y="14" class="cell-text sem-neutral-text sem-muted-text" style="text-anchor: start;">Offset: 0</text>
    </g>

    <!-- Speicherbalken Zeile 1 -->
    <g transform="translate(20, 82)">
      <rect class="sem-muted" x="0" y="0" width="230" height="28" rx="3" />
      <text x="115" y="14" class="cell-text sem-neutral-text">Zeile 1 (Pixel 0 … W-1)</text>
      <rect class="sem-card-fill sem-muted-stroke" x="230" y="0" width="34" height="28" stroke-dasharray="2,2" rx="2" />
      <text x="247" y="14" class="cell-text sem-neutral-text sem-muted-text" >Pad</text>
      <text x="276" y="14" class="cell-text sem-neutral-text sem-muted-text" style="text-anchor: start;">Offset: 1·Stride</text>
    </g>

    <!-- Vertikale Pünktchen -->
    <text x="135" y="126" class="cell-text sem-neutral-text" style="font-size: 16px;">⋮</text>

    <!-- Stride Klammer / Maßlinie -->
    <line class="sem-info-stroke" x1="398" y1="48" x2="398" y2="110" stroke-width="1.5" />
    <line class="sem-info-stroke" x1="393" y1="48" x2="403" y2="48" stroke-width="1.5" />
    <line class="sem-info-stroke" x1="393" y1="110" x2="403" y2="110" stroke-width="1.5" />
    <text x="408" y="80" class="cell-text sem-neutral-text sem-info-text" style="text-anchor: start;  font-weight: bold;">Stride</text>

    <!-- Zeile y - aktiv im Detail -->
    <g transform="translate(20, 138)">
      <rect class="sem-success" x="0" y="0" width="425" height="148" stroke-width="1.5" rx="6" />
      <text x="14" y="19" class="cell-text-bold sem-neutral-text sem-success-text" style="text-anchor: start;">
        Zeile y (pBackBuffer + y · Stride) — Zoom auf Pixel (x, y):
      </text>

      <!-- Zoom auf Pixel (x, y) mit 4 Bytes -->
      <g transform="translate(24, 32)">
        <rect class="sem-primary-fill" x="0" y="0" width="84" height="44" rx="4" />
        <text x="42" y="13" class="badge-text">Byte 0</text>
        <text x="42" y="32" class="badge-text">B (Blau)</text>

        <rect class="sem-success-fill" x="98" y="0" width="84" height="44" rx="4" />
        <text x="140" y="13" class="badge-text">Byte 1</text>
        <text x="140" y="32" class="badge-text">G (Grün)</text>

        <rect class="sem-danger-fill" x="196" y="0" width="84" height="44" rx="4" />
        <text x="238" y="13" class="badge-text">Byte 2</text>
        <text x="238" y="32" class="badge-text">R (Rot)</text>

        <rect class="sem-muted-fill" x="294" y="0" width="84" height="44" rx="4" />
        <text x="336" y="13" class="badge-text">Byte 3</text>
        <text x="336" y="32" class="badge-text">A (Alpha)</text>
      </g>

      <!-- Beschriftung des Target-Pixels im Speicher -->
      <rect class="sem-warning" x="77" y="84" width="270" height="24" stroke-width="1" rx="3" />
      <text x="212" y="96" class="cell-text-bold sem-neutral-text sem-warning-text" >
        Exakter Offset = y · Stride + x · 4 Bytes
      </text>

      <!-- 32-Bit Darstellung (uint) -->
      <text x="24" y="128" class="code-font sem-neutral-text" >
        Als 32-Bit uint:
      </text>
      <rect class="sem-card-fill" x="165" y="116" width="236" height="22" rx="3" />
      <text x="283" y="127" class="code-font sem-neutral-text sem-info-text" style="text-anchor: middle; dominant-baseline: middle;">
        uint pixel = 0xAARRGGBB;
      </text>
    </g>

    <!-- Zeile H-1 ganz unten im Speicher -->
    <g transform="translate(20, 298)">
      <rect class="sem-muted" x="0" y="0" width="230" height="28" rx="3" />
      <text x="115" y="14" class="cell-text sem-neutral-text">Zeile H-1 (Letzte Zeile)</text>
      <text x="276" y="14" class="cell-text sem-neutral-text sem-muted-text" style="text-anchor: start;">(H-1)·Stride</text>
    </g>
  </g>

  <!-- Verbindung von Target-Pixel (x, y) links zu Offset rechts -->
  <path d="M 240 280 C 330 310, 425 268, 515 250" class="arrow-dash sem-warning-stroke" />

  <!-- ========================================== -->
  <!-- UNTERE FORMEL- & ERKENNTNIS-LEISTE         -->
  <!-- ========================================== -->
  <g transform="translate(35, 435)" filter="url(#card-shadow)">
    <rect class="sem-card-stroke" width="930" height="100" rx="8" fill="#ffffff" stroke-width="1.5" />

    <!-- Formel 1: Offset -->
    <g transform="translate(25, 20)">
      <rect class="sem-info" x="0" y="0" width="280" height="60" rx="6" />
      <text x="15" y="24" class="subtitle sem-muted-text sem-info-text" style="font-weight: bold;">Lineare Byte-Adresse (Offset):</text>
      <text x="15" y="48" class="code-font sem-neutral-text sem-info-text" style="font-size: 14px; font-weight: bold;">
        Offset = y * Stride + x * 4;
      </text>
    </g>

    <!-- Formel 2: Zeigerzugriff -->
    <g transform="translate(325, 20)">
      <rect class="sem-success" x="0" y="0" width="280" height="60" rx="6" />
      <text x="15" y="24" class="subtitle sem-muted-text sem-success-text" style="font-weight: bold;">C# Direct Pointer Access:</text>
      <text x="15" y="48" class="code-font sem-neutral-text sem-success-text" style="font-size: 13px; font-weight: bold;">
        byte* p = pBase + y*stride + x*4;
      </text>
    </g>

    <!-- Formel 3: Stride Definition -->
    <g transform="translate(625, 20)">
      <rect class="sem-warning-stroke sem-warning-bg" x="0" y="0" width="280" height="60" rx="6" />
      <text x="15" y="24" class="subtitle sem-muted-text sem-warning-text" style="font-weight: bold;">Stride (Zeilenbreite in Bytes):</text>
      <text x="15" y="48" class="code-font sem-neutral-text sem-warning-text" style="font-size: 13px; font-weight: bold;">
        Stride = Width * 4 (+ Padding)
      </text>
    </g>
  </g>
</svg>
