<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ad" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-info-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Entstehung des Faktors s</text>
  <text x="130" y="41" class="sub sem-muted-text">3 Konstanten verschmelzen zu s</text>

  <!-- 3 Input Constants -->
  <g transform="translate(15, 56)">
    <rect class="sem-warning" x="0" y="0" width="230" height="46" rx="5" />
    <text x="115" y="19" class="lbl sem-warning-text" >1. Aus der DGL (Material):</text>
    <text x="115" y="37" class="math sem-warning-text" >Faktor  α  [m²/s]</text>

    <rect class="sem-primary" x="0" y="56" width="230" height="46" rx="5" />
    <text x="115" y="75" class="lbl sem-primary-text" >2. Aus 2. Ortsableitung (Gitter):</text>
    <text x="115" y="93" class="math sem-primary-text" >Teiler  1 / Δx²  [1/m²]</text>

    <rect class="sem-warning" x="0" y="112" width="230" height="46" rx="5" />
    <text x="115" y="131" class="lbl sem-warning-text" >3. Euler-Schritt (t_n ➔ t_n + Δt):</text>
    <text x="115" y="149" class="math sem-warning-text" >Multiplikation  · Δt  [s]</text>
  </g>

  <line class="sem-info-stroke" x1="130" y1="216" x2="130" y2="242" stroke-width="2.5" marker-end="url(#ad)" />

  <!-- Bundled Parameter s -->
  <g transform="translate(15, 246)">
    <rect class="sem-success" width="230" height="76" rx="6" stroke-width="2" />
    <text x="115" y="22" class="lbl sem-success-text" >Gebündelter Gitterfaktor s:</text>
    <text x="115" y="48" class="math sem-success-text" style="font-size: 16px;">s = (α · Δt) / Δx²</text>
    <text x="115" y="66" class="sub sem-muted-text sem-success-text" >Steht direkt vor dem 5-Punkt-Stern L_{i,j}</text>
  </g>

  <!-- Final Update Step -->
  <g transform="translate(15, 336)">
    <rect class="sem-card-fill" width="230" height="68" rx="6" />
    <text x="115" y="22" class="lbl sem-info-text" >Fertiges Euler-Update:</text>
    <text x="115" y="48" class="math sem-card-text" style="font-size: 13.5px;">T_{i,j}^{n+1} = T_{i,j}^n + s·L + Δt·Q</text>
  </g>
</svg>
