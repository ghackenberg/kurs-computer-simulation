<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0284c7; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-accent { fill: url(#grad-sem-accent); stroke: #7c3aed; }
      .sem-accent-bg { fill: url(#grad-sem-accent); stroke: none; }
      .sem-accent-stroke { stroke: #7c3aed; }
      .sem-accent-fill { fill: #7c3aed; }
      .sem-accent-text { fill: #6d28d9; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold;  }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;  }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold;  }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold;  }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; }
      .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="sem-card" width="1000" height="520" rx="12" stroke-width="1.5" />

  <!-- Header -->
  <text x="35" y="36" class="title sem-primary-text">Materialparameter: Warum erwärmt sich Kupfer schneller als Paste?</text>
  <text x="35" y="56" class="subtitle sem-muted-text">Zusammenspiel aus Wärmeleitfähigkeit λ (Transport) und Wärmekapazität ρ · c_p (Speicherträgheit)</text>

  <!-- ========================================================= -->
  <!-- LEFT CARD: DIE ZWEI GEGENSPIELER & FORMEL FÜR ALPHA       -->
  <!-- ========================================================= -->
  <g transform="translate(35, 72)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="470" height="420" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text">1. Die zwei Gegenspieler in jedem Gitterpixel</text>

    <!-- Box A: Zähler (Leitung lambda) -->
    <g transform="translate(20, 44)">
      <rect class="sem-warning" width="430" height="105" rx="6" stroke-width="1.5" />
      <rect class="sem-warning-fill" x="12" y="12" width="124" height="24" rx="4" />
      <text x="74" y="24" class="badge">Zähler: Transport</text>
      <text x="146" y="29" class="label-bold sem-neutral-text sem-warning-text" style="font-size: 13.5px;">Wärmeleitfähigkeit λ [W / (m · K)]</text>
      <text x="14" y="54" class="label sem-neutral-text">• Bestimmt, wie <tspan font-weight="bold">breit die „Wärme-Autobahn“</tspan> zwischen zwei Pixeln ist.</text>
      <text x="14" y="74" class="label sem-neutral-text">• Großes λ (z. B. Kupfer: 398) ➔ Viel Wärmestrom pro Grad Gefälle.</text>
      <text x="14" y="94" class="label sem-neutral-text">• Kleines λ (z. B. Luft: 0,026) ➔ Kaum Durchfluss (Isolator).</text>
    </g>

    <!-- Box B: Nenner (Speicher rho * c_p) -->
    <g transform="translate(20, 162)">
      <rect class="sem-primary" width="430" height="115" rx="6" stroke-width="1.5" />
      <rect class="sem-primary-fill" x="12" y="12" width="124" height="24" rx="4" />
      <text x="74" y="24" class="badge">Nenner: Trägheit</text>
      <text x="146" y="29" class="label-bold sem-neutral-text sem-primary-text" style="font-size: 13px;">Volumetrische Kapazität ρ · c_p [J / (m³ · K)]</text>
      <text x="14" y="54" class="label sem-neutral-text">• <tspan font-weight="bold">Dichte ρ [kg/m³]</tspan> × <tspan font-weight="bold">spez. Wärmekapazität c_p [J/(kg·K)]</tspan>.</text>
      <text x="14" y="74" class="label sem-neutral-text">• Bestimmt, wie <tspan font-weight="bold">groß der „Wärmetank“</tspan> eines Volumenelements ist.</text>
      <text x="14" y="94" class="label sem-neutral-text">• Großes ρ · c_p ➔ Zelle speichert viel Energie, ehe T merklich steigt!</text>
    </g>

    <!-- Box C: Quotient Alpha -->
    <g transform="translate(20, 290)">
      <rect class="sem-success" width="430" height="112" rx="6" stroke-width="2" />
      <text x="215" y="24" class="label-bold sem-neutral-text sem-success-text" style="font-size: 14px; text-anchor: middle;">
        Ergebnis: Temperaturleitfähigkeit α (auch a genannt) [m²/s]
      </text>
      <rect class="sem-success-stroke" x="18" y="34" width="394" height="42" rx="6" fill="#ffffff" stroke-width="1.5" />
      <text x="215" y="60" class="math sem-success-text" style="text-anchor: middle; font-size: 15px;">
        α = λ / (ρ · c_p) = Leitvermögen / Speicherträgheit
      </text>
      <text x="215" y="96" class="label-bold sem-neutral-text sem-success-text" style="text-anchor: middle;">
        „Wie schnell breitet sich eine Temperaturfront im Raum aus?“
      </text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT CARD: MATERIALVERGLEICH FÜR DIE SIMULATION          -->
  <!-- ========================================================= -->
  <g transform="translate(525, 72)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="440" height="420" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text">2. Typische Werkstoffe in unserer Simulation (Track A)</text>
    <text x="20" y="48" class="label sem-neutral-text sem-muted-text" >Balkenlänge zeigt die Ausbreitungsgeschwindigkeit α [mm²/s]</text>

    <!-- Material 1: Kupfer -->
    <g transform="translate(20, 68)">
      <rect class="sem-card" width="400" height="72" rx="6" />
      <text x="14" y="22" class="label-bold sem-neutral-text sem-warning-text" style="font-size: 13.5px;">1. Kupfer (Heatspreader)</text>
      <text x="386" y="22" class="math sem-warning-text" style="text-anchor: end; font-size: 13.5px;">α ≈ 115 mm²/s</text>
      <text x="14" y="41" class="label sem-neutral-text" style="font-size: 11.5px;">λ = 398 W/(m·K) | ρ = 8960 kg/m³ | c_p = 385 J/(kg·K)</text>
      <rect class="sem-warning-fill" x="14" y="49" width="372" height="14" rx="4" />
    </g>

    <!-- Material 2: Aluminium -->
    <g transform="translate(20, 152)">
      <rect class="sem-card" width="400" height="72" rx="6" />
      <text x="14" y="22" class="label-bold sem-neutral-text sem-info-text" style="font-size: 13.5px;">2. Aluminium (Kühlrippen / Finnen)</text>
      <text x="386" y="22" class="math sem-info-text" style="text-anchor: end; font-size: 13.5px;">α ≈ 97 mm²/s</text>
      <text x="14" y="41" class="label sem-neutral-text" style="font-size: 11.5px;">λ = 237 W/(m·K) | ρ = 2700 kg/m³ | c_p = 900 J/(kg·K)</text>
      <rect class="sem-info-fill" x="14" y="49" width="314" height="14" rx="4" />
    </g>

    <!-- Material 3: Silizium -->
    <g transform="translate(20, 236)">
      <rect class="sem-card" width="400" height="72" rx="6" />
      <text x="14" y="22" class="label-bold sem-neutral-text sem-accent-text" style="font-size: 13.5px;">3. Silizium (Aktiver CPU-Chip / Die)</text>
      <text x="386" y="22" class="math sem-accent-text" style="text-anchor: end; font-size: 13.5px;">α ≈ 89 mm²/s</text>
      <text x="14" y="41" class="label sem-neutral-text" style="font-size: 11.5px;">λ = 148 W/(m·K) | ρ = 2330 kg/m³ | c_p = 712 J/(kg·K)</text>
      <rect class="sem-accent-fill" x="14" y="49" width="288" height="14" rx="4" />
    </g>

    <!-- Material 4: Wärmeleitpaste (TIM) -->
    <g transform="translate(20, 320)">
      <rect class="sem-danger" width="400" height="82" rx="6" />
      <text x="14" y="22" class="label-bold sem-neutral-text sem-danger-text" style="font-size: 13.5px;">4. Wärmeleitpaste (TIM – Engpass!)</text>
      <text x="386" y="22" class="math sem-danger-text" style="text-anchor: end; font-size: 13.5px;">α ≈ 2,5 mm²/s</text>
      <text x="14" y="41" class="label sem-neutral-text" style="font-size: 11.5px;">λ = 4,5 W/(m·K) | α ist 46× kleiner als bei Kupfer (dünn auftragen!)</text>
      <rect class="sem-danger-fill" x="14" y="49" width="12" height="14" rx="3" />
      <text x="34" y="60" class="label-bold sem-neutral-text sem-danger-text" style="font-size: 11.5px;">← Starker Temperaturstau an der TIM-Schicht</text>
    </g>
  </g>
</svg>
