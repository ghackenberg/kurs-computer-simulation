<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Zeilen-Padding &amp; Stride</text>
  <text x="130" y="41" class="sub sem-muted-text">1D-Speicherblöcke im RAM</text>

  <!-- Row 0 -->
  <g transform="translate(16, 56)">
    <text x="114" y="13" class="lbl sem-neutral-text" >Zeile y = 0 (Start: Offset 0)</text>
    <rect class="sem-primary" x="0" y="20" width="172" height="36" rx="4" stroke-width="1.5" />
    <text x="86" y="42" class="lbl sem-primary-text" >Nutzdaten (Breite × 4)</text>
    <rect class="sem-warning" x="176" y="20" width="52" height="36" rx="4" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="202" y="42" class="lbl sem-warning-text" >Pad</text>
    <!-- Stride Bracket -->
    <line class="sem-info-stroke" x1="0" y1="64" x2="228" y2="64" stroke-width="1.5" />
    <line class="sem-info-stroke" x1="0" y1="60" x2="0" y2="68" stroke-width="1.5" />
    <line class="sem-info-stroke" x1="228" y1="60" x2="228" y2="68" stroke-width="1.5" />
    <text x="114" y="79" class="code sem-info-text" >◄─── 1 × Stride ───►</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(16, 154)">
    <text x="114" y="13" class="lbl sem-neutral-text" >Zeile y = 1 (Start: 1 · Stride)</text>
    <rect class="sem-primary" x="0" y="20" width="172" height="36" rx="4" stroke-width="1.5" />
    <text x="86" y="42" class="lbl sem-primary-text" >Nutzdaten (Breite × 4)</text>
    <rect class="sem-warning" x="176" y="20" width="52" height="36" rx="4" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="202" y="42" class="lbl sem-warning-text" >Pad</text>
    <line class="sem-info-stroke" x1="0" y1="64" x2="228" y2="64" stroke-width="1.5" />
    <line class="sem-info-stroke" x1="0" y1="60" x2="0" y2="68" stroke-width="1.5" />
    <line class="sem-info-stroke" x1="228" y1="60" x2="228" y2="68" stroke-width="1.5" />
    <text x="114" y="79" class="code sem-info-text" >◄─── 1 × Stride ───►</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(16, 252)">
    <text x="114" y="13" class="lbl sem-neutral-text" >Zeile y = 2 (Start: 2 · Stride)</text>
    <rect class="sem-primary" x="0" y="20" width="172" height="36" rx="4" stroke-width="1.5" />
    <text x="86" y="42" class="lbl sem-primary-text" >Nutzdaten (Breite × 4)</text>
    <rect class="sem-warning" x="176" y="20" width="52" height="36" rx="4" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="202" y="42" class="lbl sem-warning-text" >Pad</text>
  </g>

  <!-- Summary Footer -->
  <rect class="sem-success" x="16" y="332" width="228" height="72" rx="6" stroke-width="1.5" />
  <text x="130" y="352" class="lbl sem-success-text" >Warum Padding?</text>
  <text x="130" y="370" class="sub sem-muted-text sem-success-text" >Jede neue Zeile startet exakt</text>
  <text x="130" y="385" class="sub sem-muted-text sem-success-text" >auf einer schnellen 4/8-Byte</text>
  <text x="130" y="399" class="sub sem-muted-text sem-success-text" style="font-weight: bold;">Speichergrenze (Alignment)!</text>
</svg>
