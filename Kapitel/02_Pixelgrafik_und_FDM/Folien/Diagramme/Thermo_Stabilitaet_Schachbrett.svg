<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0284c7; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold;  }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;  }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold;  }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold;  }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow class="sem-neutral-text" dx="0" dy="2" stdDeviation="3" flood- flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="sem-card" width="1000" height="520" rx="12" stroke-width="1.5" />

  <!-- Header -->
  <text x="35" y="36" class="title sem-primary-text">Von-Neumann-Stabilität: Warum explodiert das Gitter ab s &gt; 0,25?</text>
  <text x="35" y="56" class="subtitle sem-muted-text">Umformung als gewichteter Mittelwert:  T_neu = (1 − 4s) · T_alt  +  4s · T̄_Nachbarn</text>

  <!-- ========================================================= -->
  <!-- LEFT CARD: STABILER FALL (s = 0.20 <= 0.25)               -->
  <!-- ========================================================= -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect class="sem-success-stroke" width="450" height="415" rx="8" fill="#ffffff" stroke-width="2" />
    <rect class="sem-success" x="0" y="0" width="450" height="38" rx="8"  stroke="none"/>
    <text x="225" y="25" class="card-hdr sem-neutral-text sem-success-text" style="text-anchor: middle;">
      1. Stabiler Zeitschritt: s = 0,20 ≤ 0,25 (Gültige Mischung)
    </text>

    <!-- Weights Box -->
    <rect class="sem-success" x="20" y="50" width="410" height="56" rx="6" />
    <text x="225" y="72" class="math sem-success-text" style="text-anchor: middle;">
      T_neu = 0,20 · T_alt + 0,80 · T̄_Nachbarn
    </text>
    <text x="225" y="94" class="label sem-neutral-text sem-success-text" style="text-anchor: middle;">
      Beide Gewichte positiv (20 % Eigenwert + 80 % Nachbarn = 100 %)
    </text>

    <!-- Step 0 -->
    <text x="20" y="130" class="label-bold sem-neutral-text">Start (n = 0): Hotspot 100 °C umgeben von 0 °C</text>
    <g transform="translate(45, 140)">
      <rect class="sem-card-fill" x="0" y="20" width="60" height="20" />
      <rect class="sem-card-fill" x="75" y="20" width="60" height="20" />
      <rect class="sem-danger-fill" x="150" y="0" width="60" height="40" />
      <rect class="sem-card-fill" x="225" y="20" width="60" height="20" />
      <rect class="sem-card-fill" x="300" y="20" width="60" height="20" />
      <text x="30" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
      <text x="105" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
      <text x="180" y="25" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">100°</text>
      <text x="255" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
      <text x="330" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
    </g>

    <!-- Step 1 -->
    <text x="20" y="208" class="label-bold sem-neutral-text">Nach 1 Schritt (n = 1): Sanfte Abkühlung der Mitte</text>
    <g transform="translate(45, 218)">
      <rect class="sem-card-fill" x="0" y="20" width="60" height="20" />
      <rect class="sem-primary-fill" x="75" y="14" width="60" height="26" />
      <rect class="sem-warning-fill" x="150" y="14" width="60" height="26" />
      <rect class="sem-primary-fill" x="225" y="14" width="60" height="26" />
      <rect class="sem-card-fill" x="300" y="20" width="60" height="20" />
      <text x="30" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
      <text x="105" y="31" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+20°</text>
      <text x="180" y="31" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+20°</text>
      <text x="255" y="31" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+20°</text>
      <text x="330" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
    </g>

    <!-- Step 2 -->
    <text x="20" y="286" class="label-bold sem-neutral-text">Nach 2 Schritten (n = 2): Glatte Glockenkurve</text>
    <g transform="translate(45, 296)">
      <rect class="sem-primary-fill" x="0" y="18" width="60" height="22" />
      <rect class="sem-primary-fill" x="75" y="16" width="60" height="24" />
      <rect class="sem-info-fill" x="150" y="12" width="60" height="28" />
      <rect class="sem-primary-fill" x="225" y="16" width="60" height="24" />
      <rect class="sem-primary-fill" x="300" y="18" width="60" height="22" />
      <text x="30" y="33" class="label-bold sem-neutral-text" style="text-anchor: middle;">+4°</text>
      <text x="105" y="32" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+8°</text>
      <text x="180" y="30" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+20°</text>
      <text x="255" y="32" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+8°</text>
      <text x="330" y="33" class="label-bold sem-neutral-text" style="text-anchor: middle;">+4°</text>
    </g>

    <!-- Conclusion Left -->
    <rect class="sem-success" x="20" y="352" width="410" height="48" rx="6" />
    <text x="225" y="373" class="label-bold sem-neutral-text sem-success-text" style="text-anchor: middle;">
      Diskretes Maximumprinzip erfüllt:
    </text>
    <text x="225" y="391" class="label sem-neutral-text sem-success-text" style="text-anchor: middle;">
      Temperatur bleibt garantiert zwischen Min (0 °C) und Max (100 °C)!
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT CARD: INSTABILER FALL (s = 0.35 > 0.25)             -->
  <!-- ========================================================= -->
  <g transform="translate(515, 75)" filter="url(#shadow)">
    <rect class="sem-danger-stroke" width="450" height="415" rx="8" fill="#ffffff" stroke-width="2" />
    <rect class="sem-danger" x="0" y="0" width="450" height="38" rx="8"  stroke="none"/>
    <text x="225" y="25" class="card-hdr sem-neutral-text sem-danger-text" style="text-anchor: middle;">
      2. Zu großer Zeitschritt: s = 0,35 &gt; 0,25 (Explosion!)
    </text>

    <!-- Weights Box -->
    <rect class="sem-danger" x="20" y="50" width="410" height="56" rx="6" />
    <text x="225" y="72" class="math sem-danger-text" style="text-anchor: middle;">
      T_neu = −0,40 · T_alt + 1,40 · T̄_Nachbarn
    </text>
    <text x="225" y="94" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle; font-size: 12px;">
      Eigengewicht (1 − 4s = −0,40) ist NEGATIV ➔ Vorzeichenwechsel!
    </text>

    <!-- Step 0 -->
    <text x="20" y="130" class="label-bold sem-neutral-text">Start (n = 0): Hotspot 100 °C umgeben von 0 °C</text>
    <g transform="translate(45, 140)">
      <rect class="sem-card-fill" x="0" y="20" width="60" height="20" />
      <rect class="sem-card-fill" x="75" y="20" width="60" height="20" />
      <rect class="sem-danger-fill" x="150" y="0" width="60" height="40" />
      <rect class="sem-card-fill" x="225" y="20" width="60" height="20" />
      <rect class="sem-card-fill" x="300" y="20" width="60" height="20" />
      <text x="30" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
      <text x="105" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
      <text x="180" y="25" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">100°</text>
      <text x="255" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
      <text x="330" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
    </g>

    <!-- Step 1 -->
    <text x="20" y="208" class="label-bold sem-neutral-text sem-danger-text" >Nach 1 Schritt (n = 1): Mitte schießt auf −40 °C (Eis!)</text>
    <g transform="translate(45, 218)">
      <rect class="sem-card-fill" x="0" y="20" width="60" height="20" />
      <rect class="sem-warning-fill" x="75" y="6" width="60" height="34" />
      <rect class="sem-primary-fill" x="150" y="20" width="60" height="32" />
      <rect class="sem-warning-fill" x="225" y="6" width="60" height="34" />
      <rect class="sem-card-fill" x="300" y="20" width="60" height="20" />
      <text x="30" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
      <text x="105" y="28" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+35°</text>
      <text x="180" y="41" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">−40° !</text>
      <text x="255" y="28" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+35°</text>
      <text x="330" y="34" class="label sem-neutral-text" style="text-anchor: middle;">0°</text>
    </g>

    <!-- Step 2 -->
    <text x="20" y="286" class="label-bold sem-neutral-text sem-danger-text" >Nach 2 Schritten: Schachbrett-Aufschaukeln ➔ NaN</text>
    <g transform="translate(45, 296)">
      <rect class="sem-warning-fill" x="0" y="14" width="60" height="26" />
      <rect class="sem-primary-fill" x="75" y="20" width="60" height="30" />
      <rect class="sem-danger-fill" x="150" y="0" width="60" height="44" />
      <rect class="sem-primary-fill" x="225" y="20" width="60" height="30" />
      <rect class="sem-warning-fill" x="300" y="14" width="60" height="26" />
      <text x="30" y="31" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+12°</text>
      <text x="105" y="40" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">−28°</text>
      <text x="180" y="26" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+65°</text>
      <text x="255" y="40" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">−28°</text>
      <text x="330" y="31" class="label-bold sem-neutral-text" style="fill: #ffffff; text-anchor: middle;">+12°</text>
    </g>

    <!-- Conclusion Right -->
    <rect class="sem-danger" x="20" y="352" width="410" height="48" rx="6" />
    <text x="225" y="372" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle;">
      Zwingende Stabilitätsbedingung in 2D:
    </text>
    <text x="225" y="391" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle; font-size: 11.5px;">
      1 − 4s ≥ 0   ⇔   s = α·Δt / Δx² ≤ 0,25   ⇔   Δt ≤ Δx² / (4 · α_max)
    </text>
  </g>
</svg>
