<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0284c7; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0369a1; }
      .sem-info-text { fill: #075985; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold;  }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;  }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold;  }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold;  }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; }
    </style>

    <marker id="arrowAxis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-muted-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffffff" />
    </marker>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->

  <!-- Header -->
  <text x="35" y="36" class="title sem-primary-text">Schritt 1 zur DGL: Das Fouriersche Wärmeleitungsgesetz</text>
  <text x="35" y="56" class="subtitle sem-muted-text">Wie hängt der Wärmestrom q̇ [W/m²] zwischen zwei benachbarten Gitterpunkten vom Temperaturgefälle ab?</text>

  <!-- ========================================================= -->
  <!-- LEFT CARD: TEMPERATURGEFÄLLE & STAB                       -->
  <!-- ========================================================= -->
  <g transform="translate(35, 72)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="510" height="420" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text">1. Temperaturprofil T(x) und Wärmestromdichte q̇_x</text>

    <!-- Axes for T(x) -->
    <line class="sem-muted-stroke" x1="60" y1="230" x2="470" y2="230" stroke-width="2" marker-end="url(#arrowAxis)" />
    <line class="sem-muted-stroke" x1="60" y1="240" x2="60" y2="55" stroke-width="2" marker-end="url(#arrowAxis)" />
    <text x="480" y="234" class="label-bold sem-neutral-text">x</text>
    <text x="52" y="52" class="label-bold sem-neutral-text" style="text-anchor: end;">T(x)</text>

    <!-- Dashed vertical grid lines for x_i (130) and x_{i+1} (380) -->
    <line class="sem-muted-stroke" x1="130" y1="85" x2="130" y2="244" stroke-width="1.5" stroke-dasharray="4,4" />
    <line class="sem-muted-stroke" x1="380" y1="185" x2="380" y2="244" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Temperature slope line -->
    <line class="sem-danger-stroke" x1="95" y1="71" x2="415" y2="199" stroke-width="3.5" />

    <!-- Slope triangle (Steigungsdreieck) -->
    <line class="sem-info-stroke" x1="130" y1="85" x2="130" y2="185" stroke-width="2.5" />
    <line class="sem-info-stroke" x1="130" y1="185" x2="380" y2="185" stroke-width="2.5" />

    <!-- Labels on Slope Triangle -->
    <rect class="sem-info" x="66" y="122" width="144" height="26" rx="4" />
    <text x="138" y="139" class="label-bold sem-neutral-text sem-info-text" style="text-anchor: middle;">ΔT = T_{i+1} − T_i &lt; 0</text>
    <text x="255" y="204" class="label-bold sem-neutral-text sem-info-text" style="text-anchor: middle;">Abstand Δx</text>

    <!-- Points T_i and T_{i+1} -->
    <circle class="sem-danger-fill" cx="130" cy="85" r="6" stroke="#ffffff" stroke-width="2" />
    <text x="144" y="82" class="label-bold sem-neutral-text sem-danger-text" >T_i = 80 °C (heiß)</text>

    <circle class="sem-primary-fill" cx="380" cy="185" r="6" stroke="#ffffff" stroke-width="2" />
    <text x="420" y="162" class="label-bold sem-neutral-text sem-primary-text" style="font-size: 12px; text-anchor: middle;">T_{i+1} = 30 °C (kalt)</text>

    <!-- 1D Rod / Two Neighboring Pixels below the chart (NON-OVERLAPPING) -->
    <text x="20" y="268" class="label-bold sem-neutral-text sem-muted-text" >Zugehörige Gitterzellen (Pixel i und Pixel i+1):</text>
    
    <!-- Left Pixel i: x=60..195 (width 135, center 127.5) -->
    <rect class="sem-danger" x="60" y="282" width="135" height="75" rx="6" stroke-width="2.5" />
    <text x="127.5" y="310" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle;">Pixel i</text>
    <text x="127.5" y="336" class="math sem-danger-text" style="text-anchor: middle;">T_i = 80 °C</text>

    <!-- Heat Flux Arrow cleanly between pixels: x=203..307 (width 104) -->
    <rect class="sem-warning-fill" x="203" y="302" width="104" height="34" rx="5" />
    <line x1="215" y1="319" x2="293" y2="319" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)" />

    <!-- Right Pixel i+1: x=315..455 (width 140, center 385) -->
    <rect class="sem-primary" x="315" y="282" width="140" height="75" rx="6" stroke-width="2.5" />
    <text x="385" y="310" class="label-bold sem-neutral-text sem-primary-text" style="text-anchor: middle;">Pixel i+1</text>
    <text x="385" y="336" class="math sem-primary-text" style="text-anchor: middle;">T_{i+1} = 30 °C</text>

    <text x="255" y="382" class="label-bold sem-neutral-text sem-warning-text" style="text-anchor: middle;">
      Wärmestrom q̇_x fließt nach rechts (+x)!
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT CARD: FORMEL & VORZEICHEN-LOGIK                     -->
  <!-- ========================================================= -->
  <g transform="translate(565, 72)" filter="url(#shadow)">
    <rect class="sem-card-stroke" width="400" height="420" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="20" y="28" class="card-hdr sem-neutral-text">2. Fouriersches Gesetz &amp; das Minuszeichen</text>

    <!-- Formula Box -->
    <rect class="sem-warning sem-warning-stroke" x="20" y="44" width="360" height="90" rx="6" stroke-width="2" />
    <text x="200" y="68" class="label-bold sem-neutral-text sem-warning-text" style="text-anchor: middle;">Kontinuierlich &amp; Diskret zwischen zwei Zellen:</text>
    <text x="200" y="96" class="math sem-warning-text" style="font-size: 14px; text-anchor: middle;">
      q̇_x = −λ · (∂T / ∂x)  ≈  −λ · (T_{i+1} − T_i) / Δx
    </text>
    <text x="200" y="122" class="label sem-neutral-text sem-warning-text" style="text-anchor: middle; font-size: 11.5px;">
      Einheit: [W/(m·K)] · [K/m] = [W/m²] (Leistung pro Fläche)
    </text>

    <!-- Why the minus sign? -->
    <text x="20" y="162" class="label-bold sem-neutral-text" style="font-size: 13.5px;">Warum steht vor dem λ ein Minuszeichen?</text>

    <!-- Case 1 -->
    <g transform="translate(20, 175)">
      <rect class="sem-success" width="360" height="70" rx="6" />
      <text x="12" y="22" class="label-bold sem-neutral-text sem-success-text" >Fall A: Links heißer als rechts (T_i = 80, T_{i+1} = 30)</text>
      <text x="12" y="42" class="label sem-neutral-text">• Steigung ist <tspan font-weight="bold">negativ</tspan>: T_{i+1} − T_i = −50 K &lt; 0</text>
      <text x="12" y="60" class="label sem-neutral-text">• Durch <tspan font-weight="bold">−λ</tspan> wird q̇_x <tspan class="sem-success-text" font-weight="bold">positiv (+)</tspan> ➔ Fluss nach rechts!</text>
    </g>

    <!-- Case 2 -->
    <g transform="translate(20, 255)">
      <rect class="sem-primary" width="360" height="70" rx="6" />
      <text x="12" y="22" class="label-bold sem-neutral-text sem-primary-text" >Fall B: Rechts heißer als links (T_i = 30, T_{i+1} = 80)</text>
      <text x="12" y="42" class="label sem-neutral-text">• Steigung ist <tspan font-weight="bold">positiv</tspan>: T_{i+1} − T_i = +50 K &gt; 0</text>
      <text x="12" y="60" class="label sem-neutral-text">• Durch <tspan font-weight="bold">−λ</tspan> wird q̇_x <tspan class="sem-primary-text" font-weight="bold">negativ (−)</tspan> ➔ Fluss nach links!</text>
    </g>

    <!-- Case 3 -->
    <g transform="translate(20, 335)">
      <rect class="sem-card" width="360" height="65" rx="6" />
      <text x="12" y="22" class="label-bold sem-neutral-text" >Fall C: Gleiche Temperatur (T_i = 50, T_{i+1} = 50)</text>
      <text x="12" y="42" class="label sem-neutral-text">• Steigung ist <tspan font-weight="bold">Null</tspan>: T_{i+1} − T_i = 0 K</text>
      <text x="12" y="58" class="label sem-neutral-text">• <tspan font-weight="bold">q̇_x = 0</tspan> ➔ Thermisches Gleichgewicht (kein Fluss)!</text>
    </g>
  </g>
</svg>
