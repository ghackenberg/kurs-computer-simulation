<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Quadratisches Δx²-Gesetz</text>
  <text x="130" y="41" class="sub sem-muted-text">Warum feine Gitter kleines Δt fordern</text>

  <!-- Coarse Grid dx = 1 mm -->
  <g transform="translate(15, 56)">
    <rect class="sem-success" width="230" height="155" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-success-text" >1. Standard-Gitter (Δx = 1 mm)</text>

    <!-- 2x2 large pixels -->
    <g transform="translate(75, 30)">
      <rect class="sem-success" x="0" y="0" width="40" height="40" stroke-width="1.5" />
      <rect class="sem-success" x="40" y="0" width="40" height="40" stroke-width="1.5" />
      <rect class="sem-success" x="0" y="40" width="40" height="40" stroke-width="1.5" />
      <rect class="sem-success" x="40" y="40" width="40" height="40" stroke-width="1.5" />
    </g>

    <text x="115" y="128" class="math sem-success-text" >Δt_max = 2,5 ms</text>
    <text x="115" y="146" class="sub sem-muted-text sem-success-text" >(400 Schritte pro Sekunde)</text>
  </g>

  <!-- Fine Grid dx = 0.5 mm -->
  <g transform="translate(15, 226)">
    <rect class="sem-danger" width="230" height="178" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-danger-text" >2. Halbes Gitter (Δx = 0,5 mm)</text>

    <!-- 4x4 small pixels in same area -->
    <g class="sem-danger" transform="translate(75, 30)" stroke-width="1">
      <rect x="0" y="0" width="20" height="20" /><rect x="20" y="0" width="20" height="20" /><rect x="40" y="0" width="20" height="20" /><rect x="60" y="0" width="20" height="20" />
      <rect x="0" y="20" width="20" height="20" /><rect x="20" y="20" width="20" height="20" /><rect x="40" y="20" width="20" height="20" /><rect x="60" y="20" width="20" height="20" />
      <rect x="0" y="40" width="20" height="20" /><rect x="20" y="40" width="20" height="20" /><rect x="40" y="40" width="20" height="20" /><rect x="60" y="40" width="20" height="20" />
      <rect x="0" y="60" width="20" height="20" /><rect x="20" y="60" width="20" height="20" /><rect x="40" y="60" width="20" height="20" /><rect x="60" y="60" width="20" height="20" />
    </g>

    <text x="115" y="128" class="math sem-danger-text" >Δt_max = 0,625 ms  (÷ 4 !)</text>
    <text x="115" y="148" class="sub sem-muted-text sem-danger-text" >4× mehr Pixel × 4× mehr Schritte</text>
    <text x="115" y="166" class="lbl sem-danger-text" >➔ 16× höherer Rechenaufwand!</text>
  </g>
</svg>
