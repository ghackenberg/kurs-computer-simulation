<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 260 372" width="260" height="372">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
  </defs>


  <!-- WRONG: Only alpha = 0 -->
  <g transform="translate(15, 56)">
    <rect class="sem-danger" width="230" height="168" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-danger-text" >❌ Nur _alphaMap[x+1,y] = 0</text>

    <rect class="sem-danger" x="20" y="34" width="82" height="68" rx="5" stroke-width="2" />
    <text x="61" y="58" class="lbl sem-danger-text" >Heißes Pixel</text>
    <text x="61" y="82" class="lbl sem-danger-text" style="font-size: 14px;">80 °C</text>

    <rect class="sem-primary" x="128" y="34" width="82" height="68" rx="5" stroke-width="2" />
    <text x="169" y="55" class="lbl sem-primary-text" >Wand (α=0)</text>
    <text x="169" y="74" class="lbl sem-primary-text" >Bleibt 20 °C</text>
    <text x="169" y="92" class="sub sem-muted-text sem-primary-text" >(Startwert!)</text>

    <line class="sem-danger-stroke" x1="98" y1="68" x2="124" y2="68" stroke-width="2.5" marker-end="url(#ar)" />

    <text x="115" y="124" class="sub sem-muted-text sem-danger-text" >Nachbar sieht ΔT = 20 − 80 = −60 K</text>
    <text x="115" y="144" class="lbl sem-danger-text" >➔ Wand saugt Wärme weg</text>
    <text x="115" y="160" class="lbl sem-danger-text" >wie ein 20 °C Kühlakku!</text>
  </g>

  <!-- RIGHT: Neumann Mirror -->
  <g transform="translate(15, 238)">
    <rect class="sem-success" width="230" height="166" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-success-text" >✅ Mit Neumann-Spiegelung</text>

    <rect class="sem-danger" x="20" y="34" width="82" height="68" rx="5" stroke-width="2" />
    <text x="61" y="58" class="lbl sem-danger-text" >Heißes Pixel</text>
    <text x="61" y="82" class="lbl sem-danger-text" style="font-size: 14px;">80 °C</text>

    <rect class="sem-warning" x="128" y="34" width="82" height="68" rx="5" stroke-width="2" stroke-dasharray="4,2" />
    <text x="169" y="55" class="lbl sem-warning-text" >Spiegelwert</text>
    <text x="169" y="76" class="lbl sem-warning-text" style="font-size: 11px;">tCenter: 80 °C</text>
    <text x="169" y="93" class="sub sem-muted-text sem-warning-text" >(Kopie)</text>

    <text x="115" y="124" class="sub sem-muted-text sem-success-text" >Nachbar sieht ΔT = 80 − 80 = 0 K</text>
    <text x="115" y="146" class="lbl sem-success-text" >➔ Exakt 0 W Wärmeverlust!</text>
  </g>
</svg>
