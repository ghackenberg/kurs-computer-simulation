<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #004B96; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #475569; }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; fill: #0f172a; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #334155; }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #0f172a; }
      .code { font-family: 'Consolas', monospace; font-size: 12.5px; font-weight: bold; }
    </style>

    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1000" height="480" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <text x="35" y="36" class="title">Softwarearchitektur der Zeitschleife: Warum Ping-Pong Double-Buffering?</text>
  <text x="35" y="56" class="subtitle">Vermeidung von In-Place-Verfälschungen ohne Speicher-Neuallokation (0 B Garbage Collection)</text>

  <!-- ========================================================= -->
  <!-- LEFT CARD: FALSCH (IN-PLACE ÜBERSCHREIBEN)                -->
  <!-- ========================================================= -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect width="450" height="375" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2" />
    <rect x="0" y="0" width="450" height="38" rx="8" fill="#fee2e2" />
    <text x="225" y="25" class="card-hdr" style="fill: #991b1b; text-anchor: middle;">
      ❌ FALSCH: In-Place-Update in nur einem Array _t[x, y]
    </text>

    <text x="20" y="64" class="label">Wenn <tspan class="code" fill="#dc2626">_t[x, y]</tspan> sofort überschrieben wird, liest Nachbar <tspan class="code">x+1</tspan> im</text>
    <text x="20" y="82" class="label">selben Schleifendurchlauf bereits den <tspan font-weight="bold" fill="#dc2626">neuen Wert (n+1)</tspan> von links!</text>

    <!-- 3 Cells in 1 Array -->
    <g transform="translate(35, 105)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
      <text x="57" y="24" class="code" style="fill: #991b1b; text-anchor: middle;">Zelle x−1</text>
      <text x="57" y="45" class="label-bold" style="fill: #dc2626; text-anchor: middle;">SCHON NEU!</text>
      <text x="57" y="64" class="label" style="fill: #991b1b; text-anchor: middle;">Zeitstufe n+1</text>

      <rect x="132" y="0" width="115" height="75" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" />
      <text x="190" y="24" class="code" style="fill: #92400e; text-anchor: middle;">Aktuell: x</text>
      <text x="190" y="45" class="label-bold" style="fill: #b45309; text-anchor: middle;">Berechnung</text>
      <text x="190" y="64" class="label" style="fill: #92400e; text-anchor: middle;">Mischt n+1 &amp; n!</text>

      <rect x="265" y="0" width="115" height="75" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
      <text x="322" y="24" class="code" style="fill: #1e40af; text-anchor: middle;">Zelle x+1</text>
      <text x="322" y="45" class="label-bold" style="fill: #1d4ed8; text-anchor: middle;">NOCH ALT</text>
      <text x="322" y="64" class="label" style="fill: #1e40af; text-anchor: middle;">Zeitstufe n</text>

      <line x1="115" y1="38" x2="130" y2="38" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)" />
      <line x1="265" y1="38" x2="250" y2="38" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrBlue)" />
    </g>

    <!-- Visual Artifact Explanation -->
    <rect x="20" y="205" width="410" height="150" rx="6" fill="#fef2f2" stroke="#fecaca" />
    <text x="30" y="230" class="label-bold" style="fill: #991b1b;">Folgen des In-Place-Fehlers:</text>
    <text x="30" y="254" class="label">1. <tspan font-weight="bold">Brechung der Symmetrie:</tspan> Ein runder Hitzepunkt breitet</text>
    <text x="45" y="272" class="label">sich nicht kreisförmig aus, sondern „weht“ schräg nach</text>
    <text x="45" y="290" class="label">rechts unten (in Schleifenrichtung x++, y++)!</text>
    <text x="30" y="314" class="label">2. <tspan font-weight="bold">Verletzte Energieerhaltung:</tspan> Was Zelle x abgibt, stimmt</text>
    <text x="45" y="332" class="label">nicht mehr mit dem überein, was Nachbar x+1 aufnimmt.</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT CARD: RICHTIG (PING-PONG DOUBLE-BUFFERING)          -->
  <!-- ========================================================= -->
  <g transform="translate(515, 75)" filter="url(#shadow)">
    <rect width="450" height="375" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="2" />
    <rect x="0" y="0" width="450" height="38" rx="8" fill="#dcfce7" />
    <text x="225" y="25" class="card-hdr" style="fill: #166534; text-anchor: middle;">
      ✅ RICHTIG: Ping-Pong-Puffer (_tCurrent &amp; _tNext)
    </text>

    <!-- Read Buffer -->
    <g transform="translate(20, 52)">
      <rect width="410" height="62" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
      <text x="15" y="24" class="code" style="fill: #1d4ed8;">_tCurrent[x, y]  (Zeitstufe n — NUR LESEN!)</text>
      <text x="15" y="46" class="label">Liefert für alle 5 Punkte des Sterns konsistente Werte zur Zeit t_n.</text>
    </g>

    <!-- Arrows down -->
    <line x1="140" y1="116" x2="140" y2="152" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreen)" />
    <line x1="225" y1="116" x2="225" y2="152" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreen)" />
    <line x1="310" y1="116" x2="310" y2="152" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreen)" />
    <rect x="150" y="122" width="150" height="24" rx="4" fill="#f0fdf4" stroke="#86efac" />
    <text x="225" y="138" class="label-bold" style="fill: #15803d; text-anchor: middle;">5-Punkt-Stern Formel</text>

    <!-- Write Buffer -->
    <g transform="translate(20, 156)">
      <rect width="410" height="62" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
      <text x="15" y="24" class="code" style="fill: #15803d;">_tNext[x, y]     (Zeitstufe n+1 — NUR SCHREIBEN!)</text>
      <text x="15" y="46" class="label">Nimmt das neue Temperaturfeld auf, ohne _tCurrent zu verändern.</text>
    </g>

    <!-- Pointer Swap Box -->
    <g transform="translate(20, 235)">
      <rect width="410" height="120" rx="6" fill="#1e293b" />
      <text x="16" y="26" class="label-bold" style="fill: #38bdf8; font-size: 12px;">Am Ende des Zeitschritts: O(1) Referenz-Tausch (Pointer-Swap)</text>
      <text x="16" y="54" class="code" style="fill: #f8fafc; font-size: 13.5px;">
        (_tCurrent, _tNext) = (_tNext, _tCurrent);
      </text>
      <text x="16" y="82" class="label" style="fill: #cbd5e1; font-size: 11.5px;">• Es werden <tspan font-weight="bold" fill="#4ade80">keine</tspan> Array-Elemente kopiert und <tspan font-weight="bold" fill="#4ade80">kein</tspan> <tspan class="code" style="font-size: 11.5px;" fill="#4ade80">new float[,]</tspan></text>
      <text x="26" y="102" class="label" style="fill: #cbd5e1; font-size: 11.5px;">erzeugt ➔ <tspan font-weight="bold" fill="#4ade80">0 Bytes Garbage Collection</tspan>, 100 % symmetrisch!</text>
    </g>
  </g>
</svg>
