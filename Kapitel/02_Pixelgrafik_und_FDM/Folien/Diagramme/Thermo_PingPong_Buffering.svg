<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold;  }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;  }
      .card-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold;  }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  }
      .label-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold;  }
      .code { font-family: 'Consolas', monospace; font-size: 12.5px; font-weight: bold; }
    </style>

    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-info-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow class="sem-neutral-text" dx="0" dy="2" stdDeviation="3" flood- flood-opacity="0.08" />
    </filter>
  </defs>

  <rect class="sem-card" width="1000" height="480" rx="12" stroke-width="1.5" />

  <text x="35" y="36" class="title sem-primary-text">Softwarearchitektur der Zeitschleife: Warum Ping-Pong Double-Buffering?</text>
  <text x="35" y="56" class="subtitle sem-muted-text">Vermeidung von In-Place-Verfälschungen ohne Speicher-Neuallokation (0 B Garbage Collection)</text>

  <!-- ========================================================= -->
  <!-- LEFT CARD: FALSCH (IN-PLACE ÜBERSCHREIBEN)                -->
  <!-- ========================================================= -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect class="sem-danger-stroke" width="450" height="375" rx="8" fill="#ffffff" stroke-width="2" />
    <rect class="sem-danger" x="0" y="0" width="450" height="38" rx="8"  stroke="none"/>
    <text x="225" y="25" class="card-hdr sem-neutral-text sem-danger-text" style="text-anchor: middle;">
      ❌ FALSCH: In-Place-Update in nur einem Array _t[x, y]
    </text>

    <text x="20" y="64" class="label sem-neutral-text">Wenn <tspan class="code sem-danger-text">_t[x, y]</tspan> sofort überschrieben wird, liest Nachbar <tspan class="code">x+1</tspan> im</text>
    <text x="20" y="82" class="label sem-neutral-text">selben Schleifendurchlauf bereits den <tspan class="sem-danger-text" font-weight="bold">neuen Wert (n+1)</tspan> von links!</text>

    <!-- 3 Cells in 1 Array -->
    <g transform="translate(35, 105)">
      <rect class="sem-danger" x="0" y="0" width="115" height="75" rx="6" stroke-width="2" />
      <text x="57" y="24" class="code sem-danger-text" style="text-anchor: middle;">Zelle x−1</text>
      <text x="57" y="45" class="label-bold sem-neutral-text sem-danger-text" style="text-anchor: middle;">SCHON NEU!</text>
      <text x="57" y="64" class="label sem-neutral-text sem-danger-text" style="text-anchor: middle;">Zeitstufe n+1</text>

      <rect class="sem-warning" x="132" y="0" width="115" height="75" rx="6" stroke-width="2.5" />
      <text x="190" y="24" class="code sem-warning-text" style="text-anchor: middle;">Aktuell: x</text>
      <text x="190" y="45" class="label-bold sem-neutral-text sem-warning-text" style="text-anchor: middle;">Berechnung</text>
      <text x="190" y="64" class="label sem-neutral-text sem-warning-text" style="text-anchor: middle;">Mischt n+1 &amp; n!</text>

      <rect class="sem-primary" x="265" y="0" width="115" height="75" rx="6" stroke-width="2" />
      <text x="322" y="24" class="code sem-primary-text" style="text-anchor: middle;">Zelle x+1</text>
      <text x="322" y="45" class="label-bold sem-neutral-text sem-primary-text" style="text-anchor: middle;">NOCH ALT</text>
      <text x="322" y="64" class="label sem-neutral-text sem-primary-text" style="text-anchor: middle;">Zeitstufe n</text>

      <line class="sem-danger-stroke" x1="115" y1="38" x2="130" y2="38" stroke-width="2.5" marker-end="url(#arrRed)" />
      <line class="sem-info-stroke" x1="265" y1="38" x2="250" y2="38" stroke-width="2.5" marker-end="url(#arrBlue)" />
    </g>

    <!-- Visual Artifact Explanation -->
    <rect class="sem-danger" x="20" y="205" width="410" height="150" rx="6" />
    <text x="30" y="230" class="label-bold sem-neutral-text sem-danger-text" >Folgen des In-Place-Fehlers:</text>
    <text x="30" y="254" class="label sem-neutral-text">1. <tspan font-weight="bold">Brechung der Symmetrie:</tspan> Ein runder Hitzepunkt breitet</text>
    <text x="45" y="272" class="label sem-neutral-text">sich nicht kreisförmig aus, sondern „weht“ schräg nach</text>
    <text x="45" y="290" class="label sem-neutral-text">rechts unten (in Schleifenrichtung x++, y++)!</text>
    <text x="30" y="314" class="label sem-neutral-text">2. <tspan font-weight="bold">Verletzte Energieerhaltung:</tspan> Was Zelle x abgibt, stimmt</text>
    <text x="45" y="332" class="label sem-neutral-text">nicht mehr mit dem überein, was Nachbar x+1 aufnimmt.</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT CARD: RICHTIG (PING-PONG DOUBLE-BUFFERING)          -->
  <!-- ========================================================= -->
  <g transform="translate(515, 75)" filter="url(#shadow)">
    <rect class="sem-success-stroke" width="450" height="375" rx="8" fill="#ffffff" stroke-width="2" />
    <rect class="sem-success" x="0" y="0" width="450" height="38" rx="8"  stroke="none"/>
    <text x="225" y="25" class="card-hdr sem-neutral-text sem-success-text" style="text-anchor: middle;">
      ✅ RICHTIG: Ping-Pong-Puffer (_tCurrent &amp; _tNext)
    </text>

    <!-- Read Buffer -->
    <g transform="translate(20, 52)">
      <rect class="sem-primary" width="410" height="62" rx="6" stroke-width="2" />
      <text x="15" y="24" class="code sem-primary-text" >_tCurrent[x, y]  (Zeitstufe n — NUR LESEN!)</text>
      <text x="15" y="46" class="label sem-neutral-text">Liefert für alle 5 Punkte des Sterns konsistente Werte zur Zeit t_n.</text>
    </g>

    <!-- Arrows down -->
    <line class="sem-success-stroke" x1="140" y1="116" x2="140" y2="152" stroke-width="2.5" marker-end="url(#arrGreen)" />
    <line class="sem-success-stroke" x1="225" y1="116" x2="225" y2="152" stroke-width="2.5" marker-end="url(#arrGreen)" />
    <line class="sem-success-stroke" x1="310" y1="116" x2="310" y2="152" stroke-width="2.5" marker-end="url(#arrGreen)" />
    <rect class="sem-success" x="150" y="122" width="150" height="24" rx="4" />
    <text x="225" y="138" class="label-bold sem-neutral-text sem-success-text" style="text-anchor: middle;">5-Punkt-Stern Formel</text>

    <!-- Write Buffer -->
    <g transform="translate(20, 156)">
      <rect class="sem-success" width="410" height="62" rx="6" stroke-width="2" />
      <text x="15" y="24" class="code sem-success-text" >_tNext[x, y]     (Zeitstufe n+1 — NUR SCHREIBEN!)</text>
      <text x="15" y="46" class="label sem-neutral-text">Nimmt das neue Temperaturfeld auf, ohne _tCurrent zu verändern.</text>
    </g>

    <!-- Pointer Swap Box -->
    <g transform="translate(20, 235)">
      <rect class="sem-card-fill" width="410" height="120" rx="6" />
      <text x="16" y="26" class="label-bold sem-neutral-text sem-info-text" style="font-size: 12px;">Am Ende des Zeitschritts: O(1) Referenz-Tausch (Pointer-Swap)</text>
      <text x="16" y="54" class="code sem-card-text" style="font-size: 13.5px;">
        (_tCurrent, _tNext) = (_tNext, _tCurrent);
      </text>
      <text x="16" y="82" class="label sem-neutral-text sem-card-text" style="font-size: 11.5px;">• Es werden <tspan class="sem-success-text" font-weight="bold">keine</tspan> Array-Elemente kopiert und <tspan class="sem-success-text" font-weight="bold">kein</tspan> <tspan class="code sem-success-text" style="font-size: 11.5px;">new float[,]</tspan></text>
      <text x="26" y="102" class="label sem-neutral-text sem-card-text" style="font-size: 11.5px;">erzeugt ➔ <tspan class="sem-success-text" font-weight="bold">0 Bytes Garbage Collection</tspan>, 100 % symmetrisch!</text>
    </g>
  </g>
</svg>
