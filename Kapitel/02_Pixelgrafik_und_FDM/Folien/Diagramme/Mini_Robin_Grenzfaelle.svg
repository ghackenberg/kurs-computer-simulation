<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Robin vereint alle Ränder</text>
  <text x="130" y="41" class="sub sem-muted-text">Je nach Wärmeübergang h</text>

  <!-- Limit 1: h -> 0 -->
  <g transform="translate(15, 56)">
    <rect class="sem-muted" width="230" height="106" rx="6" stroke-width="1.5" />
    <text x="115" y="22" class="lbl sem-neutral-text" >1. Grenzfall: h ➔ 0 (Vakuum)</text>
    <text x="115" y="46" class="sub sem-muted-text" >Gewicht der Luft (h·Δx) wird Null:</text>
    <text x="115" y="70" class="math sem-neutral-text" >T_{0,y} = T_{1,y}</text>
    <text x="115" y="92" class="lbl sem-neutral-text" >➔ Identisch zum Neumann-Rand!</text>
  </g>

  <!-- Middle: Normal Robin -->
  <g transform="translate(15, 174)">
    <rect class="sem-warning" width="230" height="106" rx="6" stroke-width="2" />
    <text x="115" y="22" class="lbl sem-warning-text" >2. Praxis: 0 &lt; h &lt; ∞ (Lüfter)</text>
    <text x="115" y="46" class="sub sem-muted-text sem-warning-text" >Gewichtetes Mittel (λ vs. h·Δx):</text>
    <text x="115" y="70" class="math sem-warning-text" >T_∞  &lt;  T_{0,y}  &lt;  T_{1,y}</text>
    <text x="115" y="92" class="lbl sem-warning-text" >➔ Realistische Rippenkühlung!</text>
  </g>

  <!-- Limit 2: h -> infinity -->
  <g transform="translate(15, 292)">
    <rect class="sem-primary" width="230" height="112" rx="6" stroke-width="1.5" />
    <text x="115" y="22" class="lbl sem-primary-text" >3. Grenzfall: h ➔ ∞ (Eisbad)</text>
    <text x="115" y="46" class="sub sem-muted-text sem-primary-text" >Luft-Gewicht dominiert komplett:</text>
    <text x="115" y="70" class="math sem-primary-text" >T_{0,y} = T_∞ = konst.</text>
    <text x="115" y="94" class="lbl sem-primary-text" >➔ Identisch zum Dirichlet-Rand!</text>
  </g>
</svg>
