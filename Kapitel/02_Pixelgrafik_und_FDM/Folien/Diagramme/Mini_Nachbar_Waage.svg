<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="au" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="260" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="130" y="24" class="hdr">Nachbarschafts-Vergleich</text>
  <text x="130" y="41" class="sub">Zugkraft zum Mittelwert T̄</text>

  <!-- Neighbor Average Box -->
  <g transform="translate(20, 56)">
    <rect width="220" height="82" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <text x="110" y="22" class="lbl" style="fill: #1e40af;">Durchschnitt der 4 Nachbarn</text>
    <text x="110" y="46" class="math" style="fill: #1d4ed8;">T̄_Nachbarn = 70 °C</text>
    <text x="110" y="66" class="sub" style="fill: #1e3a8a;">(80° + 40° + 100° + 60°) / 4</text>
  </g>

  <!-- Pull Arrow -->
  <line x1="130" y1="216" x2="130" y2="144" stroke="#16a34a" stroke-width="3" marker-end="url(#au)" />
  <rect x="35" y="162" width="190" height="36" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" />
  <text x="130" y="184" class="lbl" style="fill: #166534;">Differenz: T̄ − T_i = +20 K ↑</text>

  <!-- Center Pixel Box -->
  <g transform="translate(20, 222)">
    <rect width="220" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="110" y="22" class="lbl" style="fill: #92400e;">Eigenwert im Zentrum</text>
    <text x="110" y="46" class="math" style="fill: #b45309;">T_{i,j} = 50 °C</text>
    <text x="110" y="63" class="sub" style="fill: #78350f;">Kälter als seine Umgebung</text>
  </g>

  <!-- Bottom Rule -->
  <g transform="translate(20, 310)">
    <rect width="220" height="92" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="110" y="22" class="lbl" style="fill: #166534;">5-Punkt-Stern L_{i,j}:</text>
    <text x="110" y="46" class="math" style="fill: #15803d;">L_{i,j} = 4 · (+20 K) = +80 K</text>
    <text x="110" y="68" class="sub" style="fill: #14532d; font-weight: bold;">Nachbarn ziehen T_{i,j} nach</text>
    <text x="110" y="83" class="sub" style="fill: #14532d; font-weight: bold;">oben Richtung 70 °C!</text>
  </g>
</svg>
