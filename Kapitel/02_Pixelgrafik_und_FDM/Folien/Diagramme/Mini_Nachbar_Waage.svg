<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="au" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1 L 8 5 L 0 9 z" />
    </marker>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Nachbarschafts-Vergleich</text>
  <text x="130" y="41" class="sub sem-muted-text">Zugkraft zum Mittelwert T̄</text>

  <!-- Neighbor Average Box -->
  <g transform="translate(20, 56)">
    <rect class="sem-primary" width="220" height="82" rx="6" stroke-width="2" />
    <text x="110" y="22" class="lbl sem-primary-text" >Durchschnitt der 4 Nachbarn</text>
    <text x="110" y="46" class="math sem-primary-text" >T̄_Nachbarn = 70 °C</text>
    <text x="110" y="66" class="sub sem-muted-text sem-primary-text" >(80° + 40° + 100° + 60°) / 4</text>
  </g>

  <!-- Pull Arrow -->
  <line class="sem-success-stroke" x1="130" y1="216" x2="130" y2="144" stroke-width="3" marker-end="url(#au)" />
  <rect class="sem-success" x="30" y="162" width="200" height="36" rx="18" stroke-width="1.5" />
  <text x="130" y="184" class="lbl sem-success-text" >Differenz: T̄ − T_{i,j} = +20 K ↑</text>

  <!-- Center Pixel Box -->
  <g transform="translate(20, 222)">
    <rect class="sem-warning" width="220" height="72" rx="6" stroke-width="2" />
    <text x="110" y="22" class="lbl sem-warning-text" >Eigenwert im Zentrum</text>
    <text x="110" y="46" class="math sem-warning-text" >T_{i,j} = 50 °C</text>
    <text x="110" y="63" class="sub sem-muted-text sem-warning-text" >Kälter als seine Umgebung</text>
  </g>

  <!-- Bottom Rule -->
  <g transform="translate(20, 310)">
    <rect class="sem-success" width="220" height="92" rx="6" stroke-width="1.5" />
    <text x="110" y="22" class="lbl sem-success-text" >5-Punkt-Stern L_{i,j}:</text>
    <text x="110" y="46" class="math sem-success-text" >L_{i,j} = 4 · (+20 K) = +80 K</text>
    <text x="110" y="68" class="sub sem-muted-text sem-success-text" style="font-weight: bold;">Nachbarn ziehen T_{i,j} nach</text>
    <text x="110" y="83" class="sub sem-muted-text sem-success-text" style="font-weight: bold;">oben Richtung 70 °C!</text>
  </g>
</svg>
