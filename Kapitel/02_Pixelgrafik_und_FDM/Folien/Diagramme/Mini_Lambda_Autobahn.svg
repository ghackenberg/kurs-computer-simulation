<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="ao" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffffff" />
    </marker>
  </defs>

  <rect class="sem-card" width="260" height="420" rx="10" stroke-width="1.5" />
  <text x="130" y="24" class="hdr sem-primary-text">Wärmeleitfähigkeit λ</text>
  <text x="130" y="41" class="sub sem-muted-text">„Wie breit ist die Wärme-Autobahn?“</text>

  <!-- Top: High Lambda (Copper) -->
  <g transform="translate(15, 56)">
    <rect class="sem-warning" width="230" height="165" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-warning-text" >1. Großes λ (Kupfer: 398)</text>
    <text x="115" y="37" class="sub sem-muted-text sem-warning-text" >Breite Autobahn (Geringer Widerstand)</text>

    <!-- Wide Highway Pipe -->
    <rect class="sem-danger-fill" x="18" y="48" width="44" height="72" rx="4" />
    <text x="40" y="88" class="lbl" style="fill: #ffffff;">Heiß</text>

    <rect class="sem-warning-fill" x="62" y="54" width="106" height="60" />
    <line x1="72" y1="69" x2="154" y2="69" stroke="#ffffff" stroke-width="2.5" marker-end="url(#ao)" />
    <line x1="72" y1="84" x2="154" y2="84" stroke="#ffffff" stroke-width="2.5" marker-end="url(#ao)" />
    <line x1="72" y1="99" x2="154" y2="99" stroke="#ffffff" stroke-width="2.5" marker-end="url(#ao)" />

    <rect class="sem-primary-fill" x="168" y="48" width="44" height="72" rx="4" />
    <text x="190" y="88" class="lbl" style="fill: #ffffff;">Kalt</text>

    <text x="115" y="146" class="lbl sem-warning-text" >➔ Hoher Wärmestrom Q̇ ↑↑</text>
  </g>

  <!-- Bottom: Low Lambda (Paste/Air) -->
  <g transform="translate(15, 236)">
    <rect class="sem-muted" width="230" height="168" rx="6" stroke-width="1.5" />
    <text x="115" y="20" class="lbl sem-neutral-text" >2. Kleines λ (Paste: 4,5 / Luft)</text>
    <text x="115" y="37" class="sub sem-muted-text" >Engpass / Nadelöhr (Hoher Widerstand)</text>

    <!-- Narrow Bottleneck Pipe -->
    <rect class="sem-danger-fill" x="18" y="48" width="44" height="72" rx="4" />
    <text x="40" y="88" class="lbl" style="fill: #ffffff;">Heiß</text>

    <rect class="sem-warning-fill" x="62" y="77" width="106" height="14" />
    <line x1="72" y1="84" x2="154" y2="84" stroke="#ffffff" stroke-width="2" marker-end="url(#ao)" />

    <rect class="sem-primary-fill" x="168" y="48" width="44" height="72" rx="4" />
    <text x="190" y="88" class="lbl" style="fill: #ffffff;">Kalt</text>

    <text x="115" y="148" class="lbl sem-muted-text" >➔ Kaum Durchfluss (Wärmestau!)</text>
  </g>
</svg>
