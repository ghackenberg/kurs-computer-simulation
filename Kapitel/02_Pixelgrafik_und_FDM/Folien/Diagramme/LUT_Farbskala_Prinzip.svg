<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" width="340" height="400">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <linearGradient id="viridis-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#440154" />
      <stop offset="25%" stop-color="#3b528b" />
      <stop offset="50%" stop-color="#21918c" />
      <stop offset="75%" stop-color="#5ec962" />
      <stop offset="100%" stop-color="#fde725" />
    </linearGradient>
    <style>
      /* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
      .ttl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-lut" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-neutral-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Schritt 1: Normierter Wert -->
  <rect class="sem-card sem-muted-stroke" x="15" y="10" width="310" height="66" rx="8" stroke-width="1.8" />
  <text x="170" y="34" class="ttl sem-neutral-text">1. Normierter Wert</text>
  <text x="170" y="58" class="code sem-neutral-text">u ∈ [0.0, 1.0]</text>

  <line class="sem-neutral-stroke" x1="170" y1="76" x2="170" y2="102" stroke-width="2.2" marker-end="url(#arr-lut)" />

  <!-- Schritt 2: Indexberechnung -->
  <rect class="sem-primary" x="15" y="106" width="310" height="68" rx="8" stroke-width="2" />
  <text x="170" y="131" class="ttl sem-primary-text">2. Indexberechnung</text>
  <text x="170" y="156" class="code sem-primary-text">index = (int)(u * 255)</text>

  <line class="sem-neutral-stroke" x1="170" y1="174" x2="170" y2="200" stroke-width="2.2" marker-end="url(#arr-lut)" />

  <!-- Schritt 3: Farbtabelle (LUT) -->
  <rect class="sem-primary" x="15" y="204" width="310" height="90" rx="8" stroke-width="2" />
  <text x="170" y="229" class="ttl sem-primary-text">3. Farbtabelle (256 Einträge)</text>
  <rect class="sem-primary-stroke" x="35" y="241" width="270" height="18" rx="4" fill="url(#viridis-bar)" stroke-width="1.2" />
  <text x="170" y="280" class="code sem-primary-text">LUT[index]  (O(1) im L1-Cache)</text>

  <line class="sem-neutral-stroke" x1="170" y1="294" x2="170" y2="320" stroke-width="2.2" marker-end="url(#arr-lut)" />

  <!-- Schritt 4: 32-Bit Pixelwert -->
  <rect class="sem-success" x="15" y="324" width="310" height="66" rx="8" stroke-width="2" />
  <text x="170" y="348" class="ttl sem-success-text">4. 32-Bit BGRA Pixelwert</text>
  <text x="170" y="372" class="code sem-success-text">0xAARRGGBB (uint)</text>
</svg>
