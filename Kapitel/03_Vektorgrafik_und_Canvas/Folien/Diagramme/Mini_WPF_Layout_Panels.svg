<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-accent { fill: #f5f3ff; stroke: #7c3aed; }
      .sem-accent-bg { fill: #f5f3ff; stroke: none; }
      .sem-accent-stroke { stroke: #7c3aed; }
      .sem-accent-fill { fill: #7c3aed; }
      .sem-accent-text { fill: #6d28d9; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px;  text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">WPF Layout-Panels</text>
  <text x="135" y="42" class="sub sem-muted-text">4 grundlegende Layout-Strategien</text>

  <!-- 1. Canvas (Oben Links) -->
  <g transform="translate(12, 54)">
    <rect class="sem-primary" width="118" height="144" rx="6" stroke-width="1.2" />
    <rect class="sem-primary" width="118" height="24" rx="6"  stroke="none"/>
    <text x="59" y="16" class="lbl sem-primary-text" >1. Canvas</text>
    
    <!-- Mini Skizze -->
    <rect class="sem-primary-stroke" x="14" y="34" width="90" height="52" rx="3" fill="#ffffff" />
    <circle class="sem-primary-fill" cx="34" cy="52" r="7" />
    <rect class="sem-primary-fill" x="62" y="60" width="28" height="16" rx="2" />
    
    <text x="59" y="102" class="desc sem-muted-text sem-primary-text" style="font-weight: bold;">Absolut (X, Y)</text>
    <rect class="sem-primary-stroke" x="10" y="112" width="98" height="22" rx="3" fill="#ffffff" stroke-width="1" />
    <text x="59" y="127" class="code sem-primary-text" >Canvas.Left/Top</text>
  </g>

  <!-- 2. StackPanel (Oben Rechts) -->
  <g transform="translate(140, 54)">
    <rect class="sem-success" width="118" height="144" rx="6" stroke-width="1.2" />
    <rect class="sem-success" width="118" height="24" rx="6"  stroke="none"/>
    <text x="59" y="16" class="lbl sem-success-text" >2. StackPanel</text>
    
    <!-- Mini Skizze -->
    <rect class="sem-success-stroke" x="14" y="34" width="90" height="52" rx="3" fill="#ffffff" />
    <rect class="sem-success-fill" x="22" y="39" width="74" height="11" rx="2" />
    <rect class="sem-success-fill" x="22" y="54" width="74" height="11" rx="2" />
    <rect class="sem-success-fill" x="22" y="69" width="74" height="11" rx="2" />
    
    <text x="59" y="102" class="desc sem-muted-text sem-success-text" style="font-weight: bold;">Linear (Stapel)</text>
    <rect class="sem-success-stroke" x="10" y="112" width="98" height="22" rx="3" fill="#ffffff" stroke-width="1" />
    <text x="59" y="127" class="desc sem-muted-text sem-success-text" style="font-size: 11px;  font-weight: bold;">Keine Koordinaten</text>
  </g>

  <!-- 3. Grid (Unten Links) -->
  <g transform="translate(12, 208)">
    <rect class="sem-warning" width="118" height="144" rx="6" stroke-width="1.2" />
    <rect class="sem-warning-fill" width="118" height="24" rx="6" />
    <text x="59" y="16" class="lbl sem-warning-text" >3. Grid</text>
    
    <!-- Mini Skizze -->
    <rect class="sem-warning-stroke" x="14" y="34" width="90" height="52" rx="3" fill="#ffffff" />
    <line class="sem-warning-stroke" x1="59" y1="34" x2="59" y2="86" stroke-dasharray="2,2" />
    <line class="sem-warning-stroke" x1="14" y1="60" x2="104" y2="60" stroke-dasharray="2,2" />
    <rect class="sem-warning-fill" x="19" y="39" width="35" height="16" rx="2" fill-opacity="0.5" />
    <rect class="sem-warning-fill" x="64" y="65" width="35" height="16" rx="2" fill-opacity="0.5" />

    <text x="59" y="102" class="desc sem-muted-text sem-warning-text" style="font-weight: bold;">Tabelle (Raster)</text>
    <rect class="sem-warning-stroke" x="10" y="112" width="98" height="22" rx="3" fill="#ffffff" stroke-width="1" />
    <text x="59" y="127" class="code sem-warning-text" >Grid.Row/Column</text>
  </g>

  <!-- 4. DockPanel (Unten Rechts) -->
  <g transform="translate(140, 208)">
    <rect class="sem-accent" width="118" height="144" rx="6" stroke-width="1.2" />
    <rect class="sem-accent" width="118" height="24" rx="6"  stroke="none"/>
    <text x="59" y="16" class="lbl sem-accent-text" >4. DockPanel</text>
    
    <!-- Mini Skizze -->
    <rect class="sem-accent-stroke" x="14" y="34" width="90" height="52" rx="3" fill="#ffffff" />
    <rect class="sem-accent-fill" x="18" y="38" width="82" height="11" rx="1" />
    <rect class="sem-accent-fill" x="18" y="52" width="20" height="28" rx="1" />
    <rect class="sem-accent-fill" x="42" y="52" width="58" height="28" rx="1" />

    <text x="59" y="102" class="desc sem-muted-text sem-accent-text" style="font-weight: bold;">Kanten (Andocken)</text>
    <rect class="sem-accent-stroke" x="10" y="112" width="98" height="22" rx="3" fill="#ffffff" stroke-width="1" />
    <text x="59" y="127" class="code sem-accent-text" >DockPanel.Dock</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(12, 362)">
    <rect class="sem-card-stroke" width="246" height="44" rx="6" fill="#ffffff" stroke-width="1" />
    <text x="123" y="18" class="desc sem-muted-text sem-neutral-text" style="font-size: 11px; font-weight: bold;">Jeder Container fordert andere Daten!</text>
    <text x="123" y="34" class="desc sem-muted-text sem-info-text" style="font-size: 11px;">Deshalb: Attached Properties statt fixer Felder</text>
  </g>
</svg>
