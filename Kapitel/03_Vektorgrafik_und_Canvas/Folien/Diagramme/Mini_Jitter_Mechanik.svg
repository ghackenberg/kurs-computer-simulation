<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .warn { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold;  text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px;  text-anchor: middle; }
      .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">Dragging-Jitter Mechanik</text>
  <text x="135" y="42" class="sub sem-muted-text">Warum der Knoten weghüpft</text>

  <!-- Schritt 1: Maus zieht Knoten -->
  <g transform="translate(15, 52)">
    <rect class="sem-muted-stroke" width="240" height="116" rx="6" fill="#ffffff" stroke-width="1.2" />
    <rect class="sem-muted" x="0" y="0" width="240" height="22" rx="6"  stroke="none"/>
    <text x="120" y="16" class="lbl sem-primary-text" >1. Maus zieht K3 nach oben</text>

    <!-- Canvas Simulation Area -->
    <rect class="sem-card" x="15" y="28" width="210" height="80" rx="4" stroke-dasharray="3,2" />

    <!-- Basis Fachwerk (unten) -->
    <polygon class="sem-primary" points="50,98 190,98 120,48" stroke-width="1.5" />
    <circle class="sem-primary-fill" cx="50" cy="98" r="3.5" />
    <circle class="sem-primary-fill" cx="190" cy="98" r="3.5" />
    <circle class="sem-primary-fill" cx="120" cy="48" r="4.5" />

    <!-- Maus Cursor Symbol bei K3 -->
    <path class="sem-neutral-fill" d="M 120,48 L 128,62 L 123,63 L 127,71 L 124,72 L 120,64 L 116,67 Z" stroke="#ffffff" stroke-width="1" />

    <!-- Zug-Pfeil nach oben -->
    <line class="sem-danger-stroke" x1="135" y1="52" x2="135" y2="34" stroke-width="2" />
    <polygon class="sem-danger-fill" points="131,36 135,30 139,36" />

    <!-- Shield Box für BoundingBox wächst -->
    <rect class="sem-danger" x="120" y="32" width="100" height="18" rx="3" stroke-width="1" />
    <text x="170" y="45" class="tag sem-danger-text" style="font-size: 11.5px;">H_world wächst</text>
  </g>

  <!-- Schritt 2: Auto-Fit schrumpft & Knoten hüpft weg -->
  <g transform="translate(15, 176)">
    <rect class="sem-muted-stroke" width="240" height="116" rx="6" fill="#ffffff" stroke-width="1.2" />
    <rect class="sem-danger" x="0" y="0" width="240" height="22" rx="6"  stroke="none"/>
    <text x="120" y="16" class="lbl sem-danger-text" >2. Auto-Fit verkleinert s</text>

    <!-- Canvas Simulation Area -->
    <rect class="sem-card" x="15" y="28" width="210" height="80" rx="4" stroke-dasharray="3,2" />

    <!-- Schrumpf-Effekt: Gesamtes Fachwerk wird kleiner dargestellt! -->
    <polygon class="sem-muted" points="65,98 175,98 120,62" stroke-width="1.2" stroke-dasharray="3,2" />
    <circle class="sem-muted-fill" cx="65" cy="98" r="3" />
    <circle class="sem-muted-fill" cx="175" cy="98" r="3" />
    
    <!-- Neuer geschrumpfter Knoten K3 (gesprungen nach unten!) -->
    <circle class="sem-danger-fill" cx="120" cy="62" r="4.5" />
    
    <!-- Shielded Tag for K3 springt ab -->
    <rect class="sem-danger" x="135" y="54" width="85" height="18" rx="3" stroke-width="1" />
    <text x="177" y="67" class="warn sem-danger-text" style="font-size: 11.5px;">K3 springt ab!</text>

    <!-- Maus Cursor steht noch oben (Lücke entstanden!) -->
    <path class="sem-neutral-fill" d="M 120,38 L 128,52 L 123,53 L 127,61 L 124,62 L 120,54 L 116,57 Z" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    
    <!-- Sprung-Distanz Pfeil -->
    <line class="sem-danger-stroke" x1="120" y1="40" x2="120" y2="54" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- Shield Box für Maßstab sinkt -->
    <rect class="sem-danger" x="15" y="32" width="98" height="18" rx="3" stroke-width="1" />
    <text x="64" y="45" class="tag sem-danger-text" style="font-size: 11.5px;">s sinkt drastisch</text>
  </g>

  <!-- Problem Summary Box -->
  <g transform="translate(15, 300)">
    <rect class="sem-danger-stroke sem-danger" width="240" height="106" rx="6" stroke-width="1.5"  stroke="none"/>
    <text x="120" y="20" class="lbl sem-danger-text" >Ergebnis: Heftiges Jittering</text>
    <text x="120" y="41" class="desc sem-neutral-text sem-danger-text" >Knoten reißt vom Mauszeiger ab</text>
    <text x="120" y="59" class="desc sem-neutral-text sem-danger-text" >Nächster MouseMove korrigiert zurück</text>
    <text x="120" y="79" class="warn sem-danger-text" style="font-size: 12px;">60 Hz Oszillation &amp; Flackern!</text>
    <text x="120" y="96" class="desc sem-neutral-text sem-muted-text" >Modell vibriert unkontrollierbar</text>
  </g>
</svg>