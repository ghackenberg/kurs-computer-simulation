<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
  <defs>
    <!-- Pfeilspitze Marker für Einheitsvektoren -->
    <marker id="arrow-u" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-primary-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arrow-perp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-warning-fill" d="M 7 2 L 1 5 L 7 8 z" />
    </marker>
    <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="sem-warning-fill" d="M 1 2 L 7 5 L 1 8 z" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Rahmen & Hintergrund -->
  <rect class="sem-card-stroke" x="5" y="5" width="570" height="430" rx="12" fill="#FFFFFF" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Titelbanner -->
  <rect class="sem-muted" x="5" y="5" width="570" height="42" rx="12"  stroke="none"/>
  <rect class="sem-muted" x="5" y="35" width="570" height="12"  stroke="none"/>
  <line class="sem-muted-stroke" x1="5" y1="47" x2="575" y2="47" stroke-width="1.5" />
  <text class="sem-primary-text" x="25" y="31" font-size="16" font-weight="700">Geometrie der Pfeilspitze (2D-Vektordarstellung)</text>

  <!-- Pfeilschaft (Stab / Kraftlinie) -->
  <line class="sem-primary-stroke" x1="120" y1="340" x2="450" y2="160" stroke-width="4" stroke-linecap="round" />

  <!-- Pfeilspitzen-Dreieck -->
  <polygon class="sem-info-fill sem-primary-stroke" points="450,160 321,177 371,264" fill-opacity="0.25" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Gestrichelte Basis-Linie des Pfeildreiecks -->
  <line class="sem-warning-stroke" x1="321" y1="177" x2="371" y2="264" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Rechter Winkel bei P_base -->
  <path class="sem-muted-stroke" d="M 359,213 L 351,200 L 338,207" fill="none" stroke-width="1.5" />
  <circle class="sem-muted-fill" cx="350" cy="207" r="1.5" />

  <!-- Basis-Mittelpunkt P_base (mit Shield-Badge) -->
  <circle class="sem-warning-fill" cx="346" cy="220" r="4" />
  <g transform="translate(280, 230)">
    <rect class="sem-warning" x="0" y="0" width="60" height="22" rx="3" stroke-width="1" />
    <text class="sem-warning-text" x="30" y="16" font-size="14" font-weight="700" text-anchor="middle">P_base</text>
  </g>

  <!-- Einheitsvektoren bei P_node -->
  <!-- Richtungsvektor u -->
  <line class="sem-primary-stroke" x1="120" y1="340" x2="198" y2="297" stroke-width="2.5" marker-end="url(#arrow-u)" />
  <g transform="translate(135, 258)">
    <rect class="sem-card-stroke" x="0" y="0" width="80" height="22" rx="3" fill="#FFFFFF" stroke-width="1" />
    <text class="sem-primary-text" x="40" y="16" font-size="14" font-weight="700" text-anchor="middle">u = e_u</text>
  </g>

  <!-- Orthogonalvektor u_perp -->
  <line class="sem-danger-stroke" x1="346" y1="220" x2="310" y2="158" stroke-width="2.5" marker-end="url(#arrow-perp)" />
  <text class="sem-danger-text" x="250" y="160" font-size="15" font-weight="700">+u^⊥</text>

  <line class="sem-danger-stroke" x1="346" y1="220" x2="382" y2="282" stroke-width="2.5" marker-end="url(#arrow-perp)" />
  <text class="sem-danger-text" x="390" y="295" font-size="15" font-weight="700">-u^⊥</text>

  <!-- Bemaßung Pfeillänge L (parallel versetzt) -->
  <line class="sem-muted-stroke" x1="450" y1="160" x2="405" y2="85" stroke-width="1" stroke-dasharray="3,3" />
  <line class="sem-muted-stroke" x1="346" y1="220" x2="301" y2="145" stroke-width="1" stroke-dasharray="3,3" />
  <line class="sem-warning-stroke" x1="305" y1="148" x2="408" y2="92" stroke-width="1.8" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
  <rect class="sem-warning" x="340" y="105" width="40" height="22" rx="4" stroke-width="1" />
  <text class="sem-warning-text" x="360" y="121" font-size="14" font-weight="700" text-anchor="middle">L</text>

  <!-- Bemaßung Basisbreite W -->
  <line class="sem-muted-stroke" x1="321" y1="177" x2="356" y2="157" stroke-width="1" stroke-dasharray="3,3" />
  <line class="sem-muted-stroke" x1="371" y1="264" x2="406" y2="244" stroke-width="1" stroke-dasharray="3,3" />
  <line class="sem-warning-stroke" x1="353" y1="162" x2="403" y2="248" stroke-width="1.8" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
  <rect class="sem-warning" x="382" y="195" width="42" height="22" rx="4" stroke-width="1" />
  <text class="sem-warning-text" x="403" y="211" font-size="14" font-weight="700" text-anchor="middle">W</text>

  <!-- Eckpunkte & Beschriftung -->
  <!-- Knotenpunkt P_node -->
  <circle class="sem-primary-stroke" cx="120" cy="340" r="6" fill="#FFFFFF" stroke-width="3" />
  <g transform="translate(10, 305)">
    <rect class="sem-card-stroke" x="0" y="0" width="106" height="22" rx="3" fill="#FFFFFF" stroke-width="1" />
    <text class="sem-card-text" x="53" y="16" font-size="14" font-weight="700" text-anchor="middle">P_node (Start)</text>
  </g>

  <!-- Pfeilspitze P_tip -->
  <circle class="sem-danger-fill" cx="450" cy="160" r="5" stroke="#FFFFFF" stroke-width="2" />
  <text class="sem-danger-text" x="462" y="155" font-size="15" font-weight="700">P_tip (Spitze)</text>

  <!-- Flügel 1 (P1) -->
  <circle class="sem-primary-fill" cx="321" cy="177" r="4.5" stroke="#FFFFFF" stroke-width="1.5" />
  <text class="sem-primary-text" x="210" y="200" font-size="14" font-weight="700">P_wing1 (P1)</text>

  <!-- Flügel 2 (P2) -->
  <circle class="sem-primary-fill" cx="371" cy="264" r="4.5" stroke="#FFFFFF" stroke-width="1.5" />
  <text class="sem-primary-text" x="350" y="325" font-size="14" font-weight="700">P_wing2 (P2)</text>

  <!-- Formel-Infobox unten -->
  <rect class="sem-card" x="25" y="360" width="530" height="62" rx="8" stroke-width="1.2" />
  <text class="sem-card-text" x="40" y="384" font-size="14" font-weight="700">Analytische Berechnung: <tspan class="sem-warning-text" font-size="14" font-weight="600">(L = s_F · |F| oder L = const)</tspan></text>
  <text class="sem-neutral-text" x="40" y="405" font-size="14">P_base = P_tip - L · u    |    <tspan class="sem-primary-text" font-weight="700">P_wing1,2 = P_base ± (W / 2) · u^⊥</tspan></text>
</svg>
