<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 295 374" width="295" height="374">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13px; font-weight: bold; }
    </style>
  </defs>


  <!-- Illustration -->
  <g transform="translate(15, 54)">
    <rect class="sem-card-stroke" width="265" height="220" rx="6" fill="#ffffff" stroke-width="1.2" />

    <!-- Radiale Dehnungsstrahlen vom Fixpunkt -->
    <line class="sem-warning-stroke" x1="120" y1="96" x2="120" y2="40" stroke-width="1.2" stroke-dasharray="3,2" />
    <line class="sem-warning-stroke" x1="120" y1="96" x2="40" y2="144" stroke-width="1.2" stroke-dasharray="3,2" />
    <line class="sem-warning-stroke" x1="120" y1="96" x2="200" y2="144" stroke-width="1.2" stroke-dasharray="3,2" />

    <!-- Skaliertes Objekt nach Zoom (s = 1.5, isotrop) -->
    <polygon class="sem-primary" points="45,141 195,141 120,45" fill-opacity="0.5" stroke-width="2.5" />
    <circle class="sem-primary-fill" cx="120" cy="45" r="3.5" />
    <circle class="sem-primary-fill" cx="45" cy="141" r="3.5" />
    <circle class="sem-primary-fill" cx="195" cy="141" r="3.5" />

    <!-- Ursprüngliches Objekt vor Zoom (s = 1.0) -->
    <polygon class="sem-muted-stroke" points="70,126 170,126 120,62" fill="none" stroke-width="1.8" stroke-dasharray="4,3" />
    <circle class="sem-muted-fill" cx="120" cy="62" r="3" />
    <circle class="sem-muted-fill" cx="70" cy="126" r="3" />
    <circle class="sem-muted-fill" cx="170" cy="126" r="3" />

    <!-- Fixpunkt Cursor C -->
    <circle class="sem-danger" cx="120" cy="96" r="14" fill-opacity="0.6" stroke-width="1.2" stroke-dasharray="2,2" />
    <circle class="sem-danger-fill" cx="120" cy="96" r="3.5" />
    <polygon class="sem-neutral-fill" points="120,96 120,112 125,107 131,116 134,114 128,105 135,104" stroke="#ffffff" stroke-width="1" />
    
    <!-- Fixpunkt Badge -->
    <g transform="translate(138, 76)">
      <rect class="sem-danger-stroke" width="80" height="18" rx="3" fill="#ffffff" stroke-width="1" />
      <text x="40" y="13" class="math sem-danger-text" style="font-size: 11px;  text-anchor: middle;">P_cursor (Fix)</text>
    </g>

    <!-- Legende -->
    <g transform="translate(14, 164)">
      <line class="sem-muted-stroke" x1="0" y1="8" x2="18" y2="8" stroke-width="2" stroke-dasharray="4,3" />
      <text x="24" y="12" class="desc sem-neutral-text sem-muted-text" style="font-size: 11.5px;  font-weight: 600; text-anchor: start;">Vor Zoom (s = 1.0)</text>
    </g>

    <g transform="translate(14, 188)">
      <line class="sem-primary-stroke" x1="0" y1="8" x2="18" y2="8" stroke-width="2.5" />
      <text x="24" y="12" class="desc sem-neutral-text sem-primary-text" style="font-size: 11.5px;  font-weight: bold; text-anchor: start;">Nach ScaleAt (s = 1.5)</text>
    </g>

    <g transform="translate(152, 188)">
      <line class="sem-warning-stroke" x1="0" y1="8" x2="14" y2="8" stroke-width="1.5" stroke-dasharray="3,2" />
      <text x="18" y="12" class="desc sem-neutral-text sem-warning-text" style="font-size: 11px;  font-weight: 600; text-anchor: start;">Radialstrahl</text>
    </g>
  </g>

  <!-- Explanation -->
  <g transform="translate(15, 286)">
    <rect class="sem-success" width="265" height="120" rx="6" stroke-width="1.5" />
    <text x="132.5" y="24" class="lbl sem-success-text" >Analytische 3er-Operation</text>
    <text x="132.5" y="48" class="desc sem-neutral-text sem-success-text" >1. Translate(-P.X, -P.Y)</text>
    <text x="132.5" y="68" class="desc sem-neutral-text sem-success-text" >2. Scale(s, s) isotrop</text>
    <text x="132.5" y="88" class="desc sem-neutral-text sem-success-text" >3. Translate(+P.X, +P.Y)</text>
    <text x="132.5" y="108" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">Fixpunkt P bleibt ortsfest!</text>
  </g>
</svg>