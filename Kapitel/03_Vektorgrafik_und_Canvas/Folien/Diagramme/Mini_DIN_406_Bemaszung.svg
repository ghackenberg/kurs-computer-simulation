<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .cad { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold;  }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">DIN-406 Bemaßungskette</text>
  <text x="135" y="42" class="sub sem-muted-text">Normgerechte Bemaßung</text>

  <!-- Drawing Area -->
  <g transform="translate(15, 54)">
    <rect class="sem-card-stroke" width="240" height="210" rx="6" fill="#ffffff" stroke-width="1.2" />

    <!-- Bauteil -->
    <rect class="sem-muted" x="40" y="35" width="160" height="24" stroke-width="2" />
    <circle class="sem-neutral-fill" cx="40" cy="47" r="4" />
    <circle class="sem-neutral-fill" cx="200" cy="47" r="4" />
    <text x="120" y="52" class="cad sem-neutral-text" style="text-anchor: middle;">Trägeruntergurt</text>

    <!-- Extension lines -->
    <line class="sem-muted-stroke" x1="40" y1="62" x2="40" y2="150" stroke-width="1.5" />
    <line class="sem-muted-stroke" x1="200" y1="62" x2="200" y2="150" stroke-width="1.5" />

    <!-- Dimension Line -->
    <line class="sem-info-stroke" x1="40" y1="130" x2="200" y2="130" stroke-width="2" />
    <polygon class="sem-info-fill" points="40,130 52,126 52,134" />
    <polygon class="sem-info-fill" points="200,130 188,126 188,134" />

    <!-- Dimension Text with shield rect -->
    <rect class="sem-info-stroke" x="95" y="116" width="50" height="22" rx="3" fill="#ffffff" stroke-width="1" />
    <text x="120" y="132" class="cad sem-neutral-text sem-info-text" style="text-anchor: middle;">4.00 m</text>

    <text x="120" y="180" class="desc sem-neutral-text sem-muted-text" >Überstand ca. 2 mm</text>
  </g>

  <!-- Rules -->
  <g transform="translate(15, 276)">
    <rect class="sem-success" width="240" height="130" rx="6" stroke-width="1.5" />
    <text x="120" y="24" class="lbl sem-success-text" >DIN 406 Regeln</text>
    <text x="120" y="50" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">1. Maßhilfslinien:</text>
    <text x="120" y="68" class="desc sem-neutral-text sem-success-text" >Abstand zum Knoten &amp; Überstand</text>
    <text x="120" y="90" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">2. Maßlinie mit Pfeilen (1:3)</text>
    <text x="120" y="112" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">3. Maßzahl zentriert mit Einheit</text>
  </g>
</svg>