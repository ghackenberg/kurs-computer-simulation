<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .axis { font-family: 'Cambria Math', serif; font-size: 13px; font-weight: bold; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">Das Achsen-Paradoxon</text>
  <text x="135" y="42" class="sub sem-muted-text">Physik vs. Monitor-Raster</text>

  <!-- Box 1: Welt -->
  <g transform="translate(15, 54)">
    <rect class="sem-primary" width="240" height="140" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-primary-text" >Welt-System (Physik / [m])</text>

    <g transform="translate(30, 115)">
      <line class="sem-primary-stroke" x1="0" y1="0" x2="150" y2="0" stroke-width="2" />
      <polygon class="sem-primary-fill" points="156,0 146,-4 146,4" />
      <text x="160" y="4" class="axis sem-primary-text" >+X_w</text>

      <line class="sem-primary-stroke" x1="0" y1="0" x2="0" y2="-70" stroke-width="2" />
      <polygon class="sem-primary-fill" points="0,-76 -4,-66 4,-66" />
      <text x="8" y="-65" class="axis sem-primary-text" >+Y_w</text>

      <circle class="sem-primary-fill" cx="80" cy="-45" r="4" />
      <!-- Shield rect to avoid line collision -->
      <rect class="sem-primary-stroke" x="5" y="-31" width="150" height="22" rx="4" fill="#ffffff" stroke-width="1" />
      <text x="80" y="-16" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">+Y zeigt nach OBEN</text>
    </g>
  </g>

  <!-- Box 2: Screen -->
  <g transform="translate(15, 204)">
    <rect class="sem-danger" width="240" height="140" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-danger-text" >WPF Canvas (Screen / [px])</text>

    <g transform="translate(30, 45)">
      <line class="sem-danger-stroke" x1="0" y1="0" x2="150" y2="0" stroke-width="2" />
      <polygon class="sem-danger-fill" points="156,0 146,-4 146,4" />
      <text x="160" y="4" class="axis sem-danger-text" >+X_s</text>

      <line class="sem-danger-stroke" x1="0" y1="0" x2="0" y2="70" stroke-width="2" />
      <polygon class="sem-danger-fill" points="0,76 -4,66 4,66" />
      <text x="8" y="70" class="axis sem-danger-text" >+Y_s</text>

      <circle class="sem-danger-fill" cx="0" cy="0" r="4" />
      <circle class="sem-danger-fill" cx="80" cy="45" r="4" />
      <rect class="sem-danger-stroke" x="5" y="9" width="150" height="22" rx="4" fill="#ffffff" stroke-width="1" />
      <text x="80" y="24" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">+Y zeigt nach UNTEN!</text>
    </g>
  </g>

  <!-- Footer -->
  <rect class="sem-warning" x="15" y="354" width="240" height="52" rx="6" stroke-width="1.5" />
  <text x="135" y="374" class="lbl sem-warning-text" >Zentrales Problem</text>
  <text x="135" y="393" class="desc sem-neutral-text sem-warning-text" style="font-weight: bold;">Achsen spiegeln erforderlich!</text>
</svg>