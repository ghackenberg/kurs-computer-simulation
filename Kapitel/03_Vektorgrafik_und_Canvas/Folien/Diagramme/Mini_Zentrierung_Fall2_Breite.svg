<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 12px;  text-anchor: middle; }
    </style>
  </defs>

  <!-- Frame -->
  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">Fall 2: Breiten-limitiert</text>
  <text x="135" y="42" class="sub sem-muted-text">s = s_x (vertikaler Freiraum)</text>

  <!-- Canvas Box -->
  <g transform="translate(15, 52)">
    <rect class="sem-muted-stroke" width="240" height="230" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="120" y="20" class="desc sem-neutral-text sem-muted-text" style="font-weight: bold;">Canvas (W_draw × H_draw)</text>

    <!-- Margin Zone (gestrichelt) -->
    <rect class="sem-muted sem-card-stroke" x="15" y="30" width="210" height="185" stroke-dasharray="4,3" stroke-width="1" />

    <!-- Restplatz oben (ΔH / 2) -->
    <rect class="sem-warning" x="15" y="30" width="210" height="45" opacity="0.8"  stroke="none"/>
    <text x="120" y="58" class="fml sem-warning-text">ΔH / 2</text>

    <!-- Modell (horizontal voll belegt, vertikal zentriert) -->
    <g transform="translate(15, 75)">
      <rect class="sem-primary" width="210" height="95" rx="4" stroke-width="2" />
      <!-- Fachwerk flach -->
      <polygon class="sem-primary" points="15,85 195,85 105,15" stroke-width="2.5" />
      <line class="sem-primary-stroke" x1="105" y1="15" x2="105" y2="48" stroke-width="2" />
      <line class="sem-primary-stroke" x1="105" y1="62" x2="105" y2="85" stroke-width="2" />
      <circle class="sem-primary-fill" cx="15" cy="85" r="4.5" />
      <circle class="sem-primary-fill" cx="195" cy="85" r="4.5" />
      <circle class="sem-primary-fill" cx="105" cy="15" r="4.5" />
      
      <!-- Label Modell -->
      <rect class="sem-primary-stroke" x="65" y="44" width="80" height="22" rx="4" fill="#ffffff" stroke-width="1" />
      <text x="105" y="59" class="lbl sem-primary-text" >Modell (s)</text>
    </g>

    <!-- Restplatz unten (ΔH / 2) -->
    <rect class="sem-warning" x="15" y="170" width="210" height="45" opacity="0.8"  stroke="none"/>
    <text x="120" y="198" class="fml sem-warning-text">ΔH / 2</text>
  </g>

  <!-- Erklärung Box -->
  <g transform="translate(15, 292)">
    <rect class="sem-warning" width="240" height="116" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-warning-text" >Offset-Berechnung (Fall 2)</text>
    <text x="120" y="40" class="desc sem-neutral-text sem-warning-text" >Breite füllt voll: ΔW = 0 ⇒ x_off = margin</text>
    <text x="120" y="60" class="fml sem-warning-text">ΔH = H_draw - H_world · s</text>
    <text x="120" y="80" class="fml sem-warning-text">y_off = margin + ΔH / 2</text>
    <text x="120" y="100" class="desc sem-neutral-text sem-warning-text" style="font-weight: bold;">Symmetrischer Ausgleich auf Y!</text>
  </g>
</svg>