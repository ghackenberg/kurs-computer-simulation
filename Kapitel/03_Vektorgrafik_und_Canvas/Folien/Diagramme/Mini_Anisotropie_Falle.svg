<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13px; font-weight: bold; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">Die Anisotropie-Falle</text>
  <text x="135" y="42" class="sub sem-muted-text">Naive Skalierung verzerrt</text>

  <!-- Box 1: Anisotrop -->
  <g transform="translate(15, 54)">
    <rect class="sem-danger" width="240" height="135" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-danger-text" >1. Naiv: s_x ≠ s_y (FALSCH)</text>

    <g transform="translate(25, 20)">
      <ellipse class="sem-danger" cx="50" cy="45" rx="42" ry="20" stroke-width="2" />
      <polygon class="sem-danger-stroke" points="120,65 190,65 155,20" fill="none" stroke-width="2" />
      <circle class="sem-danger-fill" cx="155" cy="20" r="3" />
      <circle class="sem-danger-fill" cx="120" cy="65" r="3" />
      <circle class="sem-danger-fill" cx="190" cy="65" r="3" />
    </g>

    <text x="120" y="110" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">Winkel &amp; Maße verfälscht!</text>
    <text x="120" y="128" class="desc sem-neutral-text sem-danger-text" >Kreis wird zur Ellipse</text>
  </g>

  <!-- Box 2: Isotrop -->
  <g transform="translate(15, 202)">
    <rect class="sem-success" width="240" height="135" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-success-text" >2. Isotrop: s = min(s_x, s_y)</text>

    <g transform="translate(25, 20)">
      <circle class="sem-success" cx="50" cy="45" r="28" stroke-width="2" />
      <polygon class="sem-success-stroke" points="120,70 190,70 155,20" fill="none" stroke-width="2" />
      <circle class="sem-success-fill" cx="155" cy="20" r="3" />
      <circle class="sem-success-fill" cx="120" cy="70" r="3" />
      <circle class="sem-success-fill" cx="190" cy="70" r="3" />
    </g>

    <text x="120" y="110" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">100 % form- &amp; winkeltreu</text>
    <text x="120" y="128" class="desc sem-neutral-text sem-success-text" >Physikalisch korrekt</text>
  </g>

  <!-- Footer -->
  <rect class="sem-primary" x="15" y="348" width="240" height="58" rx="6" stroke-width="1.5" />
  <text x="135" y="370" class="lbl sem-primary-text" >Die Goldene Regel</text>
  <text x="135" y="392" class="math sem-primary-text" style="text-anchor: middle;">s = Math.Min(sx, sy);</text>
</svg>