<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">WPF Retained-Mode Baum</text>
  <text x="135" y="42" class="sub sem-muted-text">Der Visual Tree im RAM</text>

  <!-- Node 1: Window -->
  <g transform="translate(60, 56)">
    <rect class="sem-card-fill sem-neutral-stroke" width="150" height="34" rx="5" stroke-width="1.5" />
    <text x="75" y="22" class="lbl" style="fill: #ffffff;">MainWindow</text>
  </g>

  <line class="sem-muted-stroke" x1="135" y1="90" x2="135" y2="108" stroke-width="2" />
  <polygon class="sem-muted-fill" points="135,112 131,104 139,104" />

  <!-- Node 2: Border -->
  <g transform="translate(60, 114)">
    <rect class="sem-neutral-fill sem-card-stroke" width="150" height="34" rx="5" stroke-width="1.5" />
    <text x="75" y="22" class="lbl sem-card-text" >Border (Clip)</text>
  </g>

  <line class="sem-muted-stroke" x1="135" y1="148" x2="135" y2="166" stroke-width="2" />
  <polygon class="sem-muted-fill" points="135,170 131,162 139,162" />

  <!-- Node 3: Canvas -->
  <g transform="translate(50, 172)">
    <rect class="sem-info-fill sem-info-stroke" width="170" height="38" rx="5" stroke-width="1.5" />
    <text x="85" y="24" class="lbl" style="fill: #ffffff;">Canvas Viewport</text>
  </g>

  <!-- Branches -->
  <path class="sem-info-stroke" d="M 95 210 L 95 230 L 45 230 L 45 248" fill="none" stroke-width="1.5" />
  <path class="sem-info-stroke" d="M 135 210 L 135 248" fill="none" stroke-width="1.5" />
  <path class="sem-info-stroke" d="M 175 210 L 175 230 L 225 230 L 225 248" fill="none" stroke-width="1.5" />

  <!-- Children -->
  <g transform="translate(10, 250)">
    <rect class="sem-primary" width="70" height="42" rx="4" stroke-width="1.2" />
    <text x="35" y="26" class="lbl sem-primary-text" >Line</text>
  </g>
  <g transform="translate(100, 250)">
    <rect class="sem-primary" width="70" height="42" rx="4" stroke-width="1.2" />
    <text x="35" y="26" class="lbl sem-primary-text" >Ellipse</text>
  </g>
  <g transform="translate(190, 250)">
    <rect class="sem-primary" width="70" height="42" rx="4" stroke-width="1.2" />
    <text x="35" y="26" class="lbl sem-primary-text" >Polygon</text>
  </g>

  <!-- Summary Card -->
  <rect class="sem-success" x="15" y="312" width="240" height="94" rx="6" stroke-width="1.5" />
  <text x="135" y="335" class="lbl sem-success-text" >Persistenter Objekt-Baum</text>
  <text x="135" y="358" class="desc sem-neutral-text sem-success-text" >Jedes Shape lebt als C#-Objekt</text>
  <text x="135" y="380" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">WPF zeichnet automatisch neu!</text>
</svg>