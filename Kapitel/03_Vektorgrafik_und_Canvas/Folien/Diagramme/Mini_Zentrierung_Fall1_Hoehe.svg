<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 270 376" width="270" height="376">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0284c7; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0369a1; }
      .sem-info-text { fill: #075985; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 12px;  text-anchor: middle; }
    </style>
  </defs>

  <!-- Frame -->

  <!-- Canvas Box -->
  <g transform="translate(15, 52)">
    <rect class="sem-muted-stroke" width="240" height="230" rx="8" fill="#ffffff" stroke-width="1.5" />
    <text x="120" y="20" class="desc sem-neutral-text sem-muted-text" style="font-weight: bold;">Canvas (W_draw × H_draw)</text>

    <!-- Margin Zone (gestrichelt) -->
    <rect class="sem-muted sem-card-stroke" x="15" y="30" width="210" height="185" stroke-dasharray="4,3" stroke-width="1" />
    
    <!-- Restplatz links (ΔW / 2) -->
    <rect class="sem-info" x="15" y="30" width="35" height="185" opacity="0.8"  stroke="none"/>
    <text x="32" y="125" class="fml sem-info-text" transform="rotate(-90 32 125)">ΔW / 2</text>

    <!-- Modell (vertikal voll belegt, horizontal zentriert) -->
    <g transform="translate(50, 30)">
      <rect class="sem-primary" width="140" height="185" rx="4" stroke-width="2" />
      <!-- Fachwerk Streben -->
      <polygon class="sem-primary" points="10,170 130,170 70,25" stroke-width="2.5" />
      <line class="sem-primary-stroke" x1="70" y1="25" x2="70" y2="85" stroke-width="2" />
      <line class="sem-primary-stroke" x1="70" y1="115" x2="70" y2="170" stroke-width="2" />
      <circle class="sem-primary-fill" cx="10" cy="170" r="5" />
      <circle class="sem-primary-fill" cx="130" cy="170" r="5" />
      <circle class="sem-primary-fill" cx="70" cy="25" r="5" />
      <circle class="sem-primary-fill" cx="70" cy="170" r="4" />
      
      <!-- Label Modell -->
      <rect class="sem-primary" x="15" y="90" width="110" height="24" rx="4" stroke-width="1" />
      <text x="70" y="106" class="lbl sem-primary-text" >Modell (s = s_y)</text>
    </g>

    <!-- Restplatz rechts (ΔW / 2) -->
    <rect class="sem-info" x="190" y="30" width="35" height="185" opacity="0.8"  stroke="none"/>
    <text x="207" y="125" class="fml sem-info-text" transform="rotate(90 207 125)">ΔW / 2</text>
  </g>

  <!-- Erklärung Box -->
  <g transform="translate(15, 292)">
    <rect class="sem-info" width="240" height="116" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-info-text" >Offset-Berechnung (Fall 1)</text>
    <text x="120" y="40" class="desc sem-neutral-text sem-info-text" >Höhe füllt voll: ΔH = 0 ⇒ y_off = margin</text>
    <text x="120" y="60" class="fml sem-info-text">ΔW = W_draw - W_world · s</text>
    <text x="120" y="80" class="fml sem-info-text">x_off = margin + ΔW / 2</text>
    <text x="120" y="100" class="desc sem-neutral-text sem-info-text" style="font-weight: bold;">Symmetrischer Ausgleich auf X!</text>
  </g>
</svg>