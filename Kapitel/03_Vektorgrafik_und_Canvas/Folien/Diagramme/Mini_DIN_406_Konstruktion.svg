<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px;  }
      .dim { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold;  }
      .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Frame -->
  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">DIN 406 Maßkette</text>
  <text x="135" y="42" class="sub sem-muted-text">Geometrische Parameter &amp; Konstruktion</text>

  <!-- Visualisierung Bemaßung -->
  <g transform="translate(15, 52)">
    <rect class="sem-muted-stroke" width="240" height="206" rx="8" fill="#ffffff" stroke-width="1.2" />

    <!-- Vertikale Y-Achse als Konstruktions-Leitlinie (rechts) -->
    <!-- y_1 Ebene (Bauteilknoten) -->
    <line class="sem-card-stroke" x1="20" y1="38" x2="225" y2="38" stroke-width="1" stroke-dasharray="2,2" />
    <rect class="sem-muted sem-card-stroke" x="202" y="28" width="30" height="16" rx="3" stroke-width="1" />
    <text x="217" y="40" class="tag sem-muted-text" style="font-size: 11.5px;">y₁</text>

    <!-- y_dim Ebene (Maßlinie) -->
    <line class="sem-info-stroke" x1="20" y1="126" x2="225" y2="126" stroke-width="1.2" stroke-dasharray="3,2" />
    <rect class="sem-info" x="194" y="117" width="42" height="18" rx="3" stroke-width="1" />
    <text x="215" y="130" class="tag sem-info-text" style="font-size: 11.5px;">y_dim</text>

    <!-- Bauteil / Stab zwischen P1 und P2 -->
    <line class="sem-neutral-stroke" x1="55" y1="38" x2="185" y2="38" stroke-width="5" stroke-linecap="round" />
    <circle class="sem-primary-fill" cx="55" cy="38" r="5" />
    <circle class="sem-primary-fill" cx="185" cy="38" r="5" />

    <!-- Knoten-Labels -->
    <rect class="sem-primary" x="30" y="14" width="50" height="18" rx="3" stroke-width="1" />
    <text x="55" y="27" class="tag sem-primary-text" >P₁(x₁,y₁)</text>

    <rect class="sem-primary" x="160" y="14" width="50" height="18" rx="3" stroke-width="1" />
    <text x="185" y="27" class="tag sem-primary-text" >P₂(x₂,y₂)</text>

    <!-- Maßhilfslinien (mit Gap und Überstand) -->
    <!-- Links: von y=46 (Gap 8) bis y=142 (Überstand 16) -->
    <line class="sem-info-stroke" x1="55" y1="46" x2="55" y2="144" stroke-width="1.5" stroke-dasharray="3,2" />
    <!-- Rechts -->
    <line class="sem-info-stroke" x1="185" y1="46" x2="185" y2="144" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Kennzeichnung Δy_gap links -->
    <line class="sem-danger-stroke" x1="45" y1="38" x2="45" y2="46" stroke-width="1.5" />
    <rect class="sem-danger" x="6" y="44" width="46" height="18" rx="3" stroke-width="1" />
    <text x="29" y="57" class="tag sem-danger-text" style="font-size: 11.5px;">Δy_gap</text>

    <!-- Horizontale Maßlinie auf y_dim -->
    <line class="sem-info-stroke" x1="55" y1="126" x2="185" y2="126" stroke-width="2" />
    <!-- Maßpfeile -->
    <polygon class="sem-info-fill" points="55,126 69,122 69,130" />
    <polygon class="sem-info-fill" points="185,126 171,122 171,130" />

    <!-- Kennzeichnung Δy_over links -->
    <line class="sem-warning-stroke" x1="45" y1="126" x2="45" y2="144" stroke-width="1.5" />
    <rect class="sem-warning" x="4" y="146" width="50" height="18" rx="3" stroke-width="1" />
    <text x="29" y="159" class="tag sem-warning-text" style="font-size: 11.5px;">Δy_over</text>

    <!-- Maßzahl zentriert bei x_mid -->
    <rect class="sem-info-stroke" x="94" y="103" width="52" height="18" rx="3" fill="#ffffff" stroke-width="1.2" />
    <text x="120" y="116" class="tag sem-info-text" >4.00 m</text>

    <!-- Marker für x_mid -->
    <rect class="sem-info" x="94" y="132" width="52" height="18" rx="3" stroke-width="1" />
    <text x="120" y="145" class="tag sem-info-text" style="font-size: 11.5px;">x_mid</text>
  </g>

  <!-- Parameter Legende -->
  <g transform="translate(15, 268)">
    <rect class="sem-info" width="240" height="140" rx="6" stroke-width="1.5" />
    <text x="120" y="18" class="lbl sem-info-text" >Konstruktions-Variablen</text>
    <line class="sem-info-stroke" x1="12" y1="26" x2="228" y2="26" stroke-width="1" />

    <text x="16" y="44" class="desc sem-neutral-text">• <b>P₁, P₂:</b> Bauteilknoten (x₁, y₁), (x₂, y₂)</text>
    <text x="16" y="64" class="desc sem-neutral-text">• <b>y_dim:</b> Y-Höhe der Maßlinie (yScreen)</text>
    <text x="16" y="84" class="desc sem-neutral-text">• <b>Δy_gap = 4 px:</b> Abstand zum Bauteil</text>
    <text x="16" y="104" class="desc sem-neutral-text">• <b>Δy_over = 8 px:</b> Überstand Hilfslinie</text>
    <text x="16" y="124" class="desc sem-neutral-text">• <b>x_mid = (x₁ + x₂) / 2:</b> Textposition</text>
  </g>
</svg>