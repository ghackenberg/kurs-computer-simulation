<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">Shapes vs. DrawingVisual</text>
  <text x="135" y="42" class="sub sem-muted-text">Der interne Overhead</text>

  <!-- Box 1 -->
  <g transform="translate(15, 54)">
    <rect class="sem-danger" width="240" height="135" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-danger-text" >WPF Shapes (Line, Ellipse)</text>
    
    <g transform="translate(15, 30)">
      <rect class="sem-danger" width="210" height="24" rx="3" stroke-width="1" />
      <text x="105" y="17" class="code sem-danger-text" style="text-anchor: middle;">Visual ➔ UIElement ➔ Shape</text>
    </g>

    <text x="120" y="75" class="desc sem-neutral-text sem-danger-text" >• Hunderte Dependency Properties</text>
    <text x="120" y="95" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">• 2-stufiger Layout-Pass!</text>
    <text x="120" y="120" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">Limit: Kollaps ab ~2.000 Shapes</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(15, 202)">
    <rect class="sem-success" width="240" height="135" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-success-text" >DrawingVisual (Low-Level)</text>

    <g transform="translate(15, 30)">
      <rect class="sem-success" width="210" height="24" rx="3" stroke-width="1" />
      <text x="105" y="17" class="code sem-success-text" style="text-anchor: middle;">Erbt direkt von Visual!</text>
    </g>

    <text x="120" y="75" class="desc sem-neutral-text sem-success-text" >• KEIN UIElement, KEIN Layout</text>
    <text x="120" y="95" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">• Direkter GPU-Befehls-Stream</text>
    <text x="120" y="120" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">Performance: &gt; 100.000 Stäbe</text>
  </g>

  <!-- Footer -->
  <rect class="sem-primary" x="15" y="348" width="240" height="58" rx="6" stroke-width="1.5" />
  <text x="135" y="370" class="lbl sem-primary-text" >Empfehlung</text>
  <text x="135" y="392" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">Große Netze mit DrawingVisual!</text>
</svg>