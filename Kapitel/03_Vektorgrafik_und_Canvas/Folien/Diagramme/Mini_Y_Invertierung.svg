<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 295 374" width="295" height="374">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 12.5px;  text-anchor: middle; }
    </style>
  </defs>


  <!-- Welt System -->
  <g transform="translate(15, 54)">
    <rect class="sem-success" width="112" height="145" rx="6" stroke-width="1.5" />
    <text x="56" y="20" class="lbl sem-success-text" >1. Welt-System</text>
    
    <!-- Y-Achse nach oben -->
    <line class="sem-success-stroke" x1="25" y1="125" x2="25" y2="35" stroke-width="2.5" />
    <polygon class="sem-success-fill" points="25,30 20,40 30,40" />
    <text x="42" y="38" class="lbl sem-success-text" >+Y</text>

    <line class="sem-success-stroke" x1="25" y1="125" x2="95" y2="125" stroke-width="2" />
    <text x="90" y="140" class="desc sem-neutral-text sem-success-text" >+X</text>
    <circle class="sem-success-fill" cx="25" cy="125" r="4" />
    <text x="45" y="120" class="desc sem-neutral-text" style="font-size: 12.5px;">(0,0)</text>
    <text x="60" y="75" class="lbl sem-success-text" >Oben</text>
  </g>

  <!-- Screen System -->
  <g transform="translate(143, 54)">
    <rect class="sem-danger" width="112" height="145" rx="6" stroke-width="1.5" />
    <text x="56" y="20" class="lbl sem-danger-text" >2. WPF Screen</text>

    <!-- Y-Achse nach unten -->
    <circle class="sem-danger-fill" cx="25" cy="35" r="4" />
    <text x="45" y="52" class="desc sem-neutral-text" style="font-size: 12.5px;">(0,0)</text>
    <line class="sem-danger-stroke" x1="25" y1="35" x2="95" y2="35" stroke-width="2" />
    <text x="90" y="50" class="desc sem-neutral-text sem-danger-text" >+X</text>

    <line class="sem-danger-stroke" x1="25" y1="35" x2="25" y2="125" stroke-width="2.5" />
    <polygon class="sem-danger-fill" points="25,130 20,120 30,120" />
    <text x="42" y="128" class="lbl sem-danger-text" >+Y</text>
    <text x="60" y="90" class="lbl sem-danger-text" >Unten</text>
  </g>

  <!-- Transformations-Mathematik -->
  <g transform="translate(15, 212)">
    <rect class="sem-card sem-muted-stroke" width="265" height="194" rx="6" stroke-width="1.5" />
    <text x="132.5" y="24" class="lbl sem-neutral-text" >Spiegelung an Y_max</text>
    <line class="sem-card-stroke" x1="15" y1="36" x2="225" y2="36" stroke-width="1" />

    <text x="132.5" y="60" class="fml sem-danger-text" style="font-size: 13px; font-weight: bold;">y_s = y_off + (Y_max - y_w) · s</text>

    <g transform="translate(10, 78)">
      <rect class="sem-primary" width="220" height="46" rx="4" />
      <text x="110" y="18" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">Fall 1: Höchster Punkt (Y_max)</text>
      <text x="110" y="36" class="fml sem-primary-text" style="font-size: 11.5px;">y_s = y_off + 0 (oben)</text>
    </g>

    <g transform="translate(10, 134)">
      <rect class="sem-primary" width="220" height="46" rx="4" />
      <text x="110" y="18" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">Fall 2: Tiefster Punkt (Y_min)</text>
      <text x="110" y="36" class="fml sem-primary-text" style="font-size: 11px;">y_s = y_off + H_world · s (unten)</text>
    </g>
  </g>
</svg>