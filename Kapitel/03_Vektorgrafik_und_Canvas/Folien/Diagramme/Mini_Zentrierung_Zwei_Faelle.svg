<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 12px;  text-anchor: middle; }
      .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <text x="135" y="24" class="hdr sem-primary-text">Das Zentrierungs-Problem</text>
  <text x="135" y="42" class="sub sem-muted-text">Naive Platzierung bei (margin, margin)</text>

  <!-- Fall 1: Höhen-Limitiert (s_y <= s_x) -> Modell klebt links, Restplatz rechts -->
  <g transform="translate(15, 52)">
    <rect class="sem-muted-stroke" width="240" height="116" rx="6" fill="#ffffff" stroke-width="1.2" />
    <rect class="sem-muted" x="0" y="0" width="240" height="22" rx="6"  stroke="none"/>
    <text x="120" y="16" class="lbl sem-primary-text" >Fall 1: Höhen-Limitiert (s = s_y)</text>

    <!-- Viewport Area (breit) -->
    <rect class="sem-card" x="15" y="28" width="210" height="80" rx="4" stroke-dasharray="3,2" />

    <!-- Modell (klebt links am Rand) -->
    <rect class="sem-primary" x="15" y="28" width="120" height="80" stroke-width="1.5" />
    <!-- Fachwerk-Grafik angedeutet -->
    <polygon class="sem-primary" points="25,98 125,98 75,38" stroke-width="1.5" />
    <line class="sem-primary-stroke" x1="75" y1="38" x2="75" y2="58" stroke-width="1.5" />
    <line class="sem-primary-stroke" x1="75" y1="80" x2="75" y2="98" stroke-width="1.5" />
    <circle class="sem-primary-fill" cx="25" cy="98" r="3.5" />
    <circle class="sem-primary-fill" cx="125" cy="98" r="3.5" />
    <circle class="sem-primary-fill" cx="75" cy="38" r="3.5" />
    
    <!-- Shield Pill for Tag -->
    <rect class="sem-primary-stroke" x="44" y="60" width="62" height="18" rx="3" fill="#ffffff" stroke-width="1" />
    <text x="75" y="73" class="tag sem-primary-text" >Modell</text>

    <!-- Ungenutzter Freiraum rechts (ΔW) -->
    <rect class="sem-danger" x="135" y="28" width="90" height="80" stroke-dasharray="3,2" stroke-width="1" />
    <text x="180" y="62" class="fml sem-danger-text" style="font-weight: bold; font-size: 13px;">ΔW</text>
    <text x="180" y="80" class="desc sem-neutral-text sem-danger-text" style="font-size: 11.5px;">Freiraum rechts</text>
  </g>

  <!-- Fall 2: Breiten-Limitiert (s_x < s_y) -> Modell klebt oben, Restplatz unten -->
  <g transform="translate(15, 176)">
    <rect class="sem-muted-stroke" width="240" height="116" rx="6" fill="#ffffff" stroke-width="1.2" />
    <rect class="sem-muted" x="0" y="0" width="240" height="22" rx="6"  stroke="none"/>
    <text x="120" y="16" class="lbl sem-warning-text" >Fall 2: Breiten-Limitiert (s = s_x)</text>

    <!-- Viewport Area (hoch) -->
    <rect class="sem-card" x="15" y="28" width="210" height="80" rx="4" stroke-dasharray="3,2" />

    <!-- Modell (klebt oben am Rand) -->
    <rect class="sem-primary" x="15" y="28" width="210" height="42" stroke-width="1.5" />
    <!-- Flaches Fachwerk -->
    <polygon class="sem-primary" points="25,64 195,64 110,34" stroke-width="1.5" />
    <circle class="sem-primary-fill" cx="25" cy="64" r="3.5" />
    <circle class="sem-primary-fill" cx="195" cy="64" r="3.5" />
    <circle class="sem-primary-fill" cx="110" cy="34" r="3.5" />

    <!-- Shield Pill for Tag -->
    <rect class="sem-primary-stroke" x="85" y="40" width="50" height="18" rx="3" fill="#ffffff" stroke-width="1" />
    <text x="110" y="53" class="tag sem-primary-text" >Modell</text>

    <!-- Ungenutzter Freiraum unten (ΔH) -->
    <rect class="sem-danger" x="15" y="70" width="210" height="38" stroke-dasharray="3,2" stroke-width="1" />
    <text x="120" y="93" class="fml sem-danger-text" style="font-weight: bold; font-size: 12.5px;">ΔH (Freiraum unten)</text>
  </g>

  <!-- Problem & Challenge Summary Box -->
  <g transform="translate(15, 300)">
    <rect class="sem-danger-stroke sem-danger" width="240" height="106" rx="6" stroke-width="1.5"  stroke="none"/>
    <text x="120" y="20" class="lbl sem-danger-text" >Problem: Asymmetrischer Rand!</text>
    <text x="120" y="41" class="desc sem-neutral-text sem-danger-text" >Modell klebt am linken bzw. oberen Rand</text>
    <text x="120" y="59" class="desc sem-neutral-text sem-danger-text" >Freiraum (ΔW bzw. ΔH) klafft einseitig</text>
    <text x="120" y="79" class="lbl sem-primary-text" >Ziel: Symmetrische Offsets x_off, y_off</text>
    <text x="120" y="96" class="desc sem-neutral-text sem-muted-text" >zur mittigen Ausrichtung im Viewport</text>
  </g>
</svg>
