<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: bold; }
      .axis { font-family: 'Cambria Math', serif; font-size: 11.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="19" class="hdr sem-primary-text">Die 3 Koordinatenräume</text>
  <text x="135" y="38" class="sub sem-muted-text">Screen vs. Canvas vs. World</text>

  <!-- 1. Screen Space (Monitor / Viewport) -->
  <g transform="translate(15, 48)">
    <rect class="sem-danger" width="240" height="98" rx="6" stroke-width="1.5" />
    <rect class="sem-danger" x="0" y="0" width="240" height="20" rx="6"  stroke="none"/>
    <text x="10" y="15" class="lbl sem-danger-text" >1. Screen-Raum (Monitor [px])</text>

    <!-- Mini Window Frame -->
    <rect class="sem-danger-stroke" x="10" y="26" width="84" height="64" rx="3" fill="#ffffff" stroke-width="1.2" />
    <line class="sem-danger-stroke" x1="10" y1="36" x2="94" y2="36" stroke-width="0.8" />
    <circle class="sem-danger-fill" cx="16" cy="31" r="1.8" />
    <circle class="sem-warning-fill" cx="21" cy="31" r="1.8" />
    <circle class="sem-success-fill" cx="26" cy="31" r="1.8" />
    
    <!-- Origin text -->
    <text x="14" y="50" class="desc sem-neutral-text sem-danger-text" style="font-size: 11.5px;  font-weight: bold;">(0,0)</text>
    
    <!-- Screen Click Point -->
    <circle class="sem-danger-fill" cx="52" cy="56" r="3.5" />
    <!-- Cursor Icon -->
    <path class="sem-neutral-fill" d="M 52,56 L 58,66 L 55,67 L 58,73 L 56,74 L 53,68 L 49,70 Z" stroke="#ffffff" stroke-width="0.8" />
    <text x="52" y="84" class="fml sem-danger-text" style="font-size: 11.5px;  text-anchor: middle;">P_screen</text>

    <!-- Text description right -->
    <text x="102" y="44" class="fml sem-danger-text" >(x_p, y_p) in [px]</text>
    <text x="102" y="64" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">Mausklick im Viewport</text>
    <text x="102" y="84" class="desc sem-neutral-text sem-danger-text" >+Y zeigt nach UNTEN</text>
  </g>

  <!-- Transition 1 -> 2 (Kamera M) -->
  <g transform="translate(15, 150)">
    <line class="sem-muted-stroke" x1="48" y1="0" x2="48" y2="16" stroke-width="1.8" />
    <polygon class="sem-muted-fill" points="48,20 44,13 52,13" />
    <text x="72" y="14" class="fml sem-primary-text" >GPU-Kamera: M (Pan &amp; Zoom)</text>
  </g>

  <!-- 2. Canvas Space (WPF Canvas) -->
  <g transform="translate(15, 172)">
    <rect class="sem-primary" width="240" height="98" rx="6" stroke-width="1.5" />
    <rect class="sem-primary" x="0" y="0" width="240" height="20" rx="6"  stroke="none"/>
    <text x="10" y="15" class="lbl sem-primary-text" >2. Canvas-Raum (WPF Canvas [px])</text>

    <!-- Virtual Canvas Sheet -->
    <rect class="sem-primary-stroke" x="10" y="26" width="84" height="64" rx="3" fill="#ffffff" stroke-width="1.2" stroke-dasharray="3,2" />
    <!-- Truss Model on Canvas -->
    <polygon class="sem-primary-stroke" points="14,70 74,70 44,46" fill="none" stroke-width="1.5" />
    <circle class="sem-primary-fill" cx="14" cy="70" r="2.5" />
    <circle class="sem-primary-fill" cx="74" cy="70" r="2.5" />
    <circle class="sem-danger-fill" cx="44" cy="46" r="3.5" />
    <text x="44" y="38" class="fml sem-primary-text" style="font-size: 11.5px;  text-anchor: middle;">P_canvas</text>
    <text x="44" y="86" class="desc sem-neutral-text sem-primary-text" style="font-size: 11.5px;  text-anchor: middle;">WPF-Shapes</text>

    <!-- Text description right -->
    <text x="102" y="44" class="fml sem-primary-text" >P_canvas in [px]</text>
    <text x="102" y="64" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">Ruhende Zeichenebene</text>
    <text x="102" y="84" class="desc sem-neutral-text sem-primary-text" >Modell vor Kamera</text>
  </g>

  <!-- Transition 2 -> 3 (Viewport Projection) -->
  <g transform="translate(15, 274)">
    <line class="sem-muted-stroke" x1="48" y1="0" x2="48" y2="16" stroke-width="1.8" />
    <polygon class="sem-muted-fill" points="48,20 44,13 52,13" />
    <text x="72" y="14" class="fml sem-success-text" >Viewport: s, x_off, y_off</text>
  </g>

  <!-- 3. World Space (Physik in Metern) -->
  <g transform="translate(15, 296)">
    <rect class="sem-success" width="240" height="110" rx="6" stroke-width="1.5" />
    <rect class="sem-success" x="0" y="0" width="240" height="20" rx="6"  stroke="none"/>
    <text x="10" y="15" class="lbl sem-success-text" >3. World-Raum (Physik [m])</text>

    <!-- Cartesian World Axis System -->
    <g transform="translate(10, 92)">
      <!-- X-Axis -->
      <line class="sem-success-stroke" x1="0" y1="0" x2="68" y2="0" stroke-width="1.8" />
      <polygon class="sem-success-fill" points="72,0 66,-3 66,3" />
      <text x="50" y="-8" class="axis sem-success-text" >+X_w</text>

      <!-- Y-Axis (UPWARDS!) -->
      <line class="sem-success-stroke" x1="0" y1="0" x2="0" y2="-62" stroke-width="1.8" />
      <polygon class="sem-success-fill" points="0,-66 -3,-59 3,-59" />
      <text x="5" y="-60" class="axis sem-success-text" >+Y_w</text>

      <!-- Physical Truss in World -->
      <polygon class="sem-success-stroke" points="8,0 48,0 28,-34" fill="none" stroke-width="1.5" />
      <circle class="sem-success-fill" cx="8" cy="0" r="2.5" />
      <circle class="sem-success-fill" cx="48" cy="0" r="2.5" />
      <circle class="sem-danger-fill" cx="28" cy="-34" r="3.5" />
      <text x="32" y="-42" class="fml sem-success-text" style="font-size: 11.5px;  text-anchor: middle;">P_world</text>
    </g>

    <!-- Text description right -->
    <text x="104" y="42" class="fml sem-success-text" >(x_w, y_w) in [m]</text>
    <text x="104" y="62" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">Ingenieur-System [m]</text>
    <text x="104" y="82" class="desc sem-neutral-text sem-success-text" >+Y zeigt nach OBEN</text>
    <text x="104" y="100" class="desc sem-neutral-text sem-success-text" style="font-size: 11.5px;">Physikalischer Ursprung</text>
  </g>
</svg>