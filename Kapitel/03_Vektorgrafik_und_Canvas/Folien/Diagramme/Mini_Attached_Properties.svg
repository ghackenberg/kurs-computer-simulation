<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 270 374" width="270" height="374">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-info-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: url(#grad-sem-info-fill); }
      .sem-info-text { fill: #075985; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px;  }
      .code { font-family: 'Consolas', monospace; font-size: 11px;  }
    </style>
  </defs>


  <!-- Box 1: Das C# OOP Dilemma -->
  <g transform="translate(15, 54)">
    <rect class="sem-danger" width="240" height="106" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-danger-text" >1. Das C#-Objekt-Dilemma</text>
    
    <!-- Ellipse Box -->
    <rect class="sem-danger-stroke" x="10" y="32" width="94" height="64" rx="4" fill="#ffffff" stroke-width="1.2" />
    <text x="57" y="48" class="lbl sem-danger-text" style="font-size: 11.5px;  text-anchor: middle;">class Ellipse</text>
    <text x="16" y="66" class="code sem-info-text sem-muted-text" style="font-size: 11px;">Width, Height</text>
    <text x="16" y="82" class="code sem-info-text sem-muted-text" style="font-size: 11px;">Fill, Stroke</text>

    <!-- Trenner & Container-Verwirrung -->
    <text x="120" y="68" class="lbl sem-danger-text" style="font-size: 18px;  text-anchor: middle;">≠</text>
    <g transform="translate(134, 32)">
      <rect class="sem-card-stroke" width="96" height="64" rx="4" fill="#ffffff" stroke-width="1.2" />
      <text x="48" y="22" class="desc sem-neutral-text sem-danger-text" style="font-size: 11.5px; font-weight: bold;  text-anchor: middle;">Kein Left/Top</text>
      <text x="48" y="42" class="desc sem-neutral-text sem-muted-text" style="font-size: 11px;  text-anchor: middle;">Im Grid oder</text>
      <text x="48" y="56" class="desc sem-neutral-text sem-muted-text" style="font-size: 11px;  text-anchor: middle;">StackPanel nutzlos</text>
    </g>
  </g>

  <!-- Box 2: Die Lösung: Angehängte Property -->
  <g transform="translate(15, 170)">
    <rect class="sem-primary" width="240" height="124" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-primary-text" >2. Der Canvas „hängt an“</text>
    
    <g transform="translate(10, 32)">
      <!-- Canvas Box -->
      <rect class="sem-primary-stroke" width="220" height="82" rx="4" fill="#ffffff" stroke-width="1.2" />
      <text x="110" y="20" class="code sem-info-text sem-primary-text" style="font-size: 11.5px;  font-weight: bold; text-anchor: middle;">Canvas.SetLeft(node, 100);</text>
      
      <!-- Store Repräsentation -->
      <g transform="translate(10, 30)">
        <rect class="sem-info" width="200" height="42" rx="3" stroke-width="1" />
        <text x="100" y="16" class="desc sem-neutral-text sem-info-text" style="font-size: 11px;  text-anchor: middle;">Zentraler Property-Store des Objekts:</text>
        <text x="100" y="32" class="code sem-info-text sem-primary-text" style="font-size: 11.5px; font-weight: bold;  text-anchor: middle;">Canvas.LeftProperty ➔ 100</text>
      </g>
    </g>
  </g>

  <!-- Box 3: Layout Auswertung -->
  <g transform="translate(15, 304)">
    <rect class="sem-success" width="240" height="102" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-success-text" >3. Canvas.Arrange() platziert</text>
    
    <text x="14" y="44" class="code sem-success-text" >double x = Canvas.GetLeft(child);</text>
    <text x="14" y="62" class="code sem-success-text" >double y = Canvas.GetTop(child);</text>
    <text x="14" y="82" class="code sem-success-text" style="font-size: 11px; font-weight: bold;">child.Arrange(new Rect(x, y, w, h));</text>
  </g>
</svg>
