<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 270 376" width="270" height="376">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: #0369a1; }
      .sem-info-text { fill: #075985; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .good { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold;  text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px;  text-anchor: middle; }
      .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Frame -->

  <!-- Schritt 1: Während Ziehen (Eingefroren) -->
  <g transform="translate(15, 52)">
    <rect class="sem-muted-stroke" width="240" height="116" rx="6" fill="#ffffff" stroke-width="1.2" />
    <rect class="sem-primary" x="0" y="0" width="240" height="22" rx="6"  stroke="none"/>
    <text x="120" y="16" class="lbl sem-primary-text" >1. Während Dragging: Freeze!</text>

    <!-- Canvas Simulation Area -->
    <rect class="sem-card" x="15" y="28" width="210" height="80" rx="4" stroke-dasharray="3,2" />

    <!-- Basis Fachwerk mit gezogenem K3 -->
    <polygon class="sem-primary" points="50,98 190,98 120,40" stroke-width="1.5" />
    <circle class="sem-primary-fill" cx="50" cy="98" r="3.5" />
    <circle class="sem-primary-fill" cx="190" cy="98" r="3.5" />
    
    <!-- Gezogener Knoten K3 (folgt Cursor perfekt!) -->
    <circle class="sem-success-fill" cx="120" cy="40" r="5" stroke="#ffffff" stroke-width="1" />

    <!-- Maus Cursor exakt auf K3 -->
    <path class="sem-neutral-fill" d="M 120,40 L 128,54 L 123,55 L 127,63 L 124,64 L 120,56 L 116,59 Z" stroke="#ffffff" stroke-width="1" />

    <!-- Freeze Badge links -->
    <rect class="sem-info" x="20" y="32" width="70" height="18" rx="3" stroke-width="1" />
    <text x="55" y="45" class="tag sem-info-text" >s = const</text>

    <!-- 1:1 Tracking Badge rechts -->
    <rect class="sem-success" x="135" y="32" width="85" height="18" rx="3" stroke-width="1" />
    <text x="177" y="45" class="good sem-success-text">K3 folgt 1:1 ✓</text>
  </g>

  <!-- Schritt 2: Nach Loslassen (Auto-Fit) -->
  <g transform="translate(15, 176)">
    <rect class="sem-muted-stroke" width="240" height="116" rx="6" fill="#ffffff" stroke-width="1.2" />
    <rect class="sem-success" x="0" y="0" width="240" height="22" rx="6"  stroke="none"/>
    <text x="120" y="16" class="lbl sem-success-text" >2. Nach MouseUp: Einmaliger Fit</text>

    <!-- Canvas Simulation Area -->
    <rect class="sem-card" x="15" y="28" width="210" height="80" rx="4" stroke-dasharray="3,2" />

    <!-- Neues Fachwerk sauber eingepasst -->
    <polygon class="sem-success" points="55,98 185,98 120,46" stroke-width="1.5" />
    <circle class="sem-success-fill" cx="55" cy="98" r="3.5" />
    <circle class="sem-success-fill" cx="185" cy="98" r="3.5" />
    <circle class="sem-success-fill" cx="120" cy="46" r="4.5" />

    <!-- Badge: Ruhiger Fit -->
    <rect class="sem-success-stroke" x="55" y="60" width="130" height="20" rx="4" fill="#ffffff" stroke-width="1" />
    <text x="120" y="74" class="good sem-success-text">Ruhige Neuberechnung</text>
  </g>

  <!-- Solution Code Box -->
  <g transform="translate(15, 300)">
    <rect class="sem-success" width="240" height="106" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-success-text" >Die Entkopplungs-Regel</text>
    <text x="120" y="42" class="fml sem-success-text" style="font-weight: bold;">if (_draggedNode == null)</text>
    <text x="120" y="62" class="fml sem-success-text">_transform.Update(...);</text>
    <text x="120" y="81" class="desc sem-neutral-text sem-success-text" style="font-size: 11.5px;">Bounds-Update beim Ziehen blockiert</text>
    <text x="120" y="97" class="good sem-success-text">100% flüssig &amp; jitter-frei!</text>
  </g>
</svg>