<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
      .warn { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold;  text-anchor: middle; }
      .step { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: bold;  text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">Die Dragging-Jitter-Falle</text>
  <text x="135" y="42" class="sub sem-muted-text">Der fatale Feedback-Loop (60 Hz)</text>

  <!-- Cycle Box -->
  <g transform="translate(15, 52)">
    <rect class="sem-muted-stroke" width="240" height="232" rx="8" fill="#ffffff" stroke-width="1.2" />

    <!-- Center Warning Pill -->
    <rect class="sem-danger" x="65" y="98" width="110" height="36" rx="4" stroke-width="1.5" />
    <text x="120" y="112" class="warn sem-danger-text" style="font-size: 11.5px;">60 Hz Oszillation</text>
    <text x="120" y="128" class="warn sem-danger-text" style="font-size: 11.5px;">Heftiges Zittern!</text>

    <!-- Step 1: Oben (Maus zieht K3) -->
    <rect class="sem-danger" x="42" y="12" width="156" height="26" rx="4" stroke-width="1.2" />
    <text x="120" y="29" class="step sem-danger-text">1. Maus zieht K3 nach oben</text>

    <!-- Pfeil 1 -> 2 (nach rechts unten) -->
    <path class="sem-danger-stroke" d="M 180,38 L 182,56" fill="none" stroke-width="1.5" />
    <polygon class="sem-danger-fill" points="179,54 182,60 185,54" />

    <!-- Step 2: Rechts (BoundingBox wächst) -->
    <rect class="sem-danger" x="126" y="62" width="108" height="36" rx="4" stroke-width="1.2" />
    <text x="180" y="78" class="step sem-danger-text">2. Bounds steigen</text>
    <text x="181" y="92" class="desc sem-neutral-text sem-danger-text" style="font-size: 11.5px;">H_world steigt</text>

    <!-- Pfeil 2 -> 3 (nach links unten) -->
    <path class="sem-danger-stroke" d="M 170,102 C 180,140 180,165 160,190" fill="none" stroke-width="1.5" />
    <polygon class="sem-danger-fill" points="163,185 158,192 167,189" />

    <!-- Step 3: Unten (Auto-Fit s sinkt) -->
    <rect class="sem-danger" x="42" y="194" width="156" height="26" rx="4" stroke-width="1.2" />
    <text x="120" y="211" class="step sem-danger-text">3. Auto-Fit Maßstab s sinkt</text>

    <!-- Pfeil 3 -> 4 (nach links oben) -->
    <path class="sem-danger-stroke" d="M 80,190 C 60,165 60,140 70,102" fill="none" stroke-width="1.5" />
    <polygon class="sem-danger-fill" points="68,107 72,100 74,108" />

    <!-- Step 4: Links (K3 springt weg) -->
    <rect class="sem-danger" x="6" y="62" width="106" height="36" rx="4" stroke-width="1.2" />
    <text x="59" y="78" class="step sem-danger-text">4. K3 springt weg!</text>
    <text x="59" y="92" class="desc sem-neutral-text sem-danger-text" style="font-size: 11.5px;">Lücke zum Cursor</text>

    <!-- Pfeil 4 -> 1 (nach rechts oben) -->
    <path class="sem-danger-stroke" d="M 58,60 L 60,42" fill="none" stroke-width="1.5" />
    <polygon class="sem-danger-fill" points="57,44 60,38 63,44" />
  </g>

  <!-- Problem Summary Box -->
  <g transform="translate(15, 298)">
    <rect class="sem-danger-stroke sem-danger" width="240" height="108" rx="6" stroke-width="1.5"  stroke="none"/>
    <text x="120" y="20" class="lbl sem-danger-text" >Ursache: Teufelskreis-Kopplung</text>
    <text x="120" y="41" class="desc sem-neutral-text sem-danger-text" >Auto-Fit verändert die Kamera,</text>
    <text x="120" y="59" class="desc sem-neutral-text sem-danger-text" >während die Maus das Modell bewegt.</text>
    <text x="120" y="79" class="lbl sem-primary-text" >Lösung: Transformation einfrieren</text>
    <text x="120" y="96" class="desc sem-neutral-text sem-muted-text" >solange Ziehen aktiv ist!</text>
  </g>
</svg>