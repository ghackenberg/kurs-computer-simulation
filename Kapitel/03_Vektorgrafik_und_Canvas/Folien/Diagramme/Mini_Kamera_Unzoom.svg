<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 270 380" width="270" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->

  <!-- 1. Screen Viewport (Gezoomt & Panned) -->
  <g transform="translate(15, 48)">
    <rect class="sem-danger" width="240" height="130" rx="6" stroke-width="1.5" />
    <rect class="sem-danger" x="0" y="0" width="240" height="20" rx="6"  stroke="none"/>
    <text x="10" y="15" class="lbl sem-danger-text" >1. Bildschirm-Fenster (Kamera aktiv)</text>

    <!-- Mini Window Frame -->
    <rect class="sem-danger-stroke" x="10" y="28" width="105" height="92" rx="3" fill="#ffffff" stroke-width="1.2" />
    <line class="sem-danger-stroke" x1="10" y1="38" x2="115" y2="38" stroke-width="0.8" />
    <circle class="sem-danger-fill" cx="16" cy="33" r="1.8" />
    <circle class="sem-warning-fill" cx="21" cy="33" r="1.8" />
    <circle class="sem-success-fill" cx="26" cy="33" r="1.8" />

    <!-- Gezoomtes / verschobenes Fachwerk -->
    <polygon class="sem-danger-stroke" points="5,94 95,94 50,48" fill="none" stroke-width="2" />
    <circle class="sem-danger-fill" cx="50" cy="48" r="4" />
    <!-- Cursor Icon -->
    <path class="sem-neutral-fill" d="M 50,48 L 56,58 L 53,59 L 56,65 L 54,66 L 51,60 L 47,62 Z" stroke="#ffffff" stroke-width="0.8" />
    <text x="62" y="112" class="desc sem-neutral-text sem-danger-text" style="font-size: 11.5px;  text-anchor: middle;">Ausschnitt</text>

    <!-- Text right -->
    <text x="126" y="48" class="fml sem-danger-text" >P_screen</text>
    <text x="126" y="68" class="fml sem-danger-text" >(x_p, y_p) [px]</text>
    <text x="126" y="90" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">Klick im Fenster</text>
    <text x="126" y="110" class="desc sem-neutral-text sem-danger-text" >Kamera M aktiv</text>
  </g>

  <!-- Transition Arrow M^-1 -->
  <g transform="translate(15, 184)">
    <line class="sem-primary-stroke" x1="45" y1="0" x2="45" y2="28" stroke-width="2.2" />
    <polygon class="sem-primary-fill" points="45,33 40,25 50,25" />
    <rect class="sem-primary-stroke" x="70" y="4" width="162" height="24" rx="4" fill="#ffffff" stroke-width="1" />
    <text x="151" y="20" class="fml sem-primary-text" style="text-anchor: middle;">P_unzoom = M⁻¹ · P_screen</text>
  </g>

  <!-- 2. Resting Canvas (Ruhende Zeichenebene) -->
  <g transform="translate(15, 224)">
    <rect class="sem-primary" width="240" height="136" rx="6" stroke-width="1.5" />
    <rect class="sem-primary" x="0" y="0" width="240" height="20" rx="6"  stroke="none"/>
    <text x="10" y="15" class="lbl sem-primary-text" >2. Ruhende Zeichenebene (Canvas)</text>

    <!-- Resting Canvas Sheet -->
    <rect class="sem-primary-stroke" x="10" y="28" width="96" height="96" rx="3" fill="#ffffff" stroke-width="1.2" stroke-dasharray="3,2" />
    <!-- Vollständiges ruhendes Fachwerk -->
    <polygon class="sem-primary-stroke" points="16,96 90,96 53,54" fill="none" stroke-width="1.8" />
    <circle class="sem-primary-fill" cx="16" cy="96" r="3" />
    <circle class="sem-primary-fill" cx="90" cy="96" r="3" />
    <circle class="sem-danger-fill" cx="53" cy="54" r="4" />
    <text x="53" y="44" class="fml sem-primary-text" style="font-size: 11.5px;  text-anchor: middle;">P_unzoom</text>
    <text x="53" y="116" class="desc sem-neutral-text sem-primary-text" style="font-size: 11.5px;  text-anchor: middle;">Normalansicht</text>

    <!-- Text right -->
    <text x="116" y="48" class="fml sem-primary-text" >P_unzoom</text>
    <text x="116" y="68" class="fml sem-primary-text" >(x_u, y_u) [px]</text>
    <text x="116" y="90" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">Unbewegter Canvas</text>
    <text x="116" y="110" class="desc sem-neutral-text sem-primary-text" >Kamera aufgehoben</text>
  </g>

  <!-- Summary Footer -->
  <rect class="sem-success" x="15" y="368" width="240" height="42" rx="5" stroke-width="1.2" />
  <text x="135" y="386" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;  text-anchor: middle;">Ergebnis von Schicht 1:</text>
  <text x="135" y="402" class="desc sem-neutral-text sem-success-text" style="font-size: 11.5px;  text-anchor: middle;">Exakter Pixelpunkt vor Kamerabewegung</text>
</svg>