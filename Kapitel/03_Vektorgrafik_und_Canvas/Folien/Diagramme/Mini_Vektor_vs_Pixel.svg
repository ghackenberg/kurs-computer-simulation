<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">Rastergrafik vs. Vektor</text>
  <text x="135" y="42" class="sub sem-muted-text">Zoom-Vergleich (800 %)</text>

  <!-- Box 1: Raster -->
  <g transform="translate(15, 54)">
    <rect class="sem-danger" width="240" height="135" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-danger-text" >1. Rastergrafik (Pixel)</text>
    
    <g transform="translate(30, 32)">
      <rect class="sem-danger-fill sem-danger-stroke" x="0" y="48" width="16" height="16" stroke-width="0.5" />
      <rect class="sem-danger-fill sem-danger-stroke" x="16" y="48" width="16" height="16" stroke-width="0.5" />
      <rect class="sem-danger-fill sem-danger-stroke" x="32" y="32" width="16" height="16" stroke-width="0.5" />
      <rect class="sem-danger-fill sem-danger-stroke" x="48" y="32" width="16" height="16" stroke-width="0.5" />
      <rect class="sem-danger-fill sem-danger-stroke" x="64" y="16" width="16" height="16" stroke-width="0.5" />
      <rect class="sem-danger-fill sem-danger-stroke" x="80" y="16" width="16" height="16" stroke-width="0.5" />
      <rect class="sem-danger-fill sem-danger-stroke" x="96" y="0" width="16" height="16" stroke-width="0.5" />
      <rect class="sem-danger-fill sem-danger-stroke" x="112" y="0" width="16" height="16" stroke-width="0.5" />
      <circle class="sem-danger-stroke" cx="150" cy="38" r="18" fill="none" stroke-width="1.5" stroke-dasharray="3,2" />
      <path class="sem-danger-stroke" d="M 140 28 L 160 48 M 140 48 L 160 28" stroke-width="2" />
    </g>

    <text x="120" y="110" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">Treppen &amp; Unschärfe</text>
    <text x="120" y="128" class="desc sem-neutral-text sem-danger-text" >Feste Pixelmatrix</text>
  </g>

  <!-- Box 2: Vektor -->
  <g transform="translate(15, 202)">
    <rect class="sem-success" width="240" height="135" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-success-text" >2. Vektorgrafik (Analytisch)</text>

    <g transform="translate(30, 30)">
      <path class="sem-success-stroke" d="M 16 55 Q 65 55 110 18" fill="none" stroke-width="4" stroke-linecap="round" />
      <circle class="sem-success-fill" cx="16" cy="55" r="4" />
      <circle class="sem-success-fill" cx="110" cy="18" r="4" />
      <text class="sem-success-text" x="14" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold">(x_1, y_1)</text>
      <text class="sem-success-text" x="102" y="8" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end">(x_2, y_2)</text>
      <circle class="sem-success" cx="150" cy="38" r="18" stroke-width="1.5" />
      <path class="sem-success-stroke" d="M 142 38 L 148 44 L 158 32" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="120" y="110" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">Gestochen scharf!</text>
    <text x="120" y="128" class="desc sem-neutral-text sem-success-text" >Auflösungsunabhängig</text>
  </g>

  <!-- Summary Footer -->
  <rect class="sem-primary" x="15" y="348" width="240" height="58" rx="6" stroke-width="1.5" />
  <text x="135" y="370" class="lbl sem-primary-text" >Ingenieur-Fazit</text>
  <text x="135" y="392" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">Fachwerke erfordern Vektoren</text>
</svg>