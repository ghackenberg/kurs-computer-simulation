<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 270 374" width="270" height="374">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: #0369a1; }
      .sem-info-text { fill: #075985; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px;  }
    </style>
  </defs>


  <!-- Box 1: Brush -->
  <g transform="translate(15, 54)">
    <rect class="sem-success" width="240" height="150" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-success-text" style="text-anchor: middle;">1. Brush (Flächenfüllung)</text>
    
    <!-- Visuelles Beispiel: Gefüllte Formen -->
    <g transform="translate(20, 36)">
      <circle class="sem-success-fill" cx="28" cy="28" r="24" />
      <rect x="70" y="6" width="44" height="44" rx="4" fill="url(#grad)" />
      <!-- Farb-Eimer / Tinte Metapher -->
      <path class="sem-success-fill" d="M 140 10 L 160 30 L 150 40 L 130 20 Z" />
      <circle class="sem-success-fill" cx="165" cy="42" r="5" />
    </g>

    <text x="25" y="105" class="desc sem-neutral-text"><b>• Zweck:</b> Füllt Innenbereiche</text>
    <text x="25" y="125" class="desc sem-neutral-text"><b>• Typen:</b> Solid, Gradient, Tile</text>
    <text x="25" y="142" class="desc sem-neutral-text"><b>• Analogie:</b> Die Farbtinte</text>
  </g>

  <!-- Box 2: Pen -->
  <g transform="translate(15, 218)">
    <rect class="sem-primary" width="240" height="150" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-primary-text" style="text-anchor: middle;">2. Pen (Strich / Kontur)</text>

    <!-- Visuelles Beispiel: Konturierte Linien -->
    <g transform="translate(20, 34)">
      <line class="sem-primary-stroke" x1="10" y1="12" x2="80" y2="12" stroke-width="5" stroke-linecap="round" />
      <line class="sem-info-stroke" x1="10" y1="28" x2="80" y2="28" stroke-width="3" stroke-dasharray="6,3" />
      <rect class="sem-primary-stroke" x="110" y="8" width="80" height="34" rx="4" fill="none" stroke-width="3" />
    </g>

    <text x="25" y="95" class="desc sem-neutral-text"><b>• Zweck:</b> Zeichnet Außenlinien</text>
    <text x="25" y="115" class="desc sem-neutral-text"><b>• Attribute:</b> Brush, Thickness,</text>
    <text x="25" y="132" class="desc sem-neutral-text">  DashStyle, LineCap, LineJoin</text>
    <text x="25" y="147" class="desc sem-neutral-text"><b>• Analogie:</b> Der Zeichenstift</text>
  </g>

  <!-- Golden Rule Freeze -->
  <g transform="translate(15, 376)">
    <rect class="sem-warning" width="240" height="32" rx="4" />
    <text x="120" y="20" class="lbl sem-warning-text" style="font-size: 12px;  text-anchor: middle;">Golden Rule: Immer .Freeze()!</text>
  </g>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>
</svg>