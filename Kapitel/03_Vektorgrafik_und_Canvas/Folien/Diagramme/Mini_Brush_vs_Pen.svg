<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; fill: #334155; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">WPF Media: Brush vs. Pen</text>
  <text x="135" y="42" class="sub">Tinte (Fläche) vs. Stift (Kontur)</text>

  <!-- Box 1: Brush -->
  <g transform="translate(15, 54)">
    <rect width="240" height="150" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="120" y="22" class="lbl" style="fill: #15803d; text-anchor: middle;">1. Brush (Flächenfüllung)</text>
    
    <!-- Visuelles Beispiel: Gefüllte Formen -->
    <g transform="translate(20, 36)">
      <circle cx="28" cy="28" r="24" fill="#22c55e" />
      <rect x="70" y="6" width="44" height="44" rx="4" fill="url(#grad)" />
      <!-- Farb-Eimer / Tinte Metapher -->
      <path d="M 140 10 L 160 30 L 150 40 L 130 20 Z" fill="#15803d" />
      <circle cx="165" cy="42" r="5" fill="#22c55e" />
    </g>

    <text x="25" y="105" class="desc"><b>• Zweck:</b> Füllt Innenbereiche</text>
    <text x="25" y="125" class="desc"><b>• Typen:</b> Solid, Gradient, Tile</text>
    <text x="25" y="142" class="desc"><b>• Analogie:</b> Die Farbtinte</text>
  </g>

  <!-- Box 2: Pen -->
  <g transform="translate(15, 218)">
    <rect width="240" height="150" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="120" y="22" class="lbl" style="fill: #1e40af; text-anchor: middle;">2. Pen (Strich / Kontur)</text>

    <!-- Visuelles Beispiel: Konturierte Linien -->
    <g transform="translate(20, 34)">
      <line x1="10" y1="12" x2="80" y2="12" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
      <line x1="10" y1="28" x2="80" y2="28" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,3" />
      <rect x="110" y="8" width="80" height="34" rx="4" fill="none" stroke="#1d4ed8" stroke-width="3" />
    </g>

    <text x="25" y="95" class="desc"><b>• Zweck:</b> Zeichnet Außenlinien</text>
    <text x="25" y="115" class="desc"><b>• Attribute:</b> Brush, Thickness,</text>
    <text x="25" y="132" class="desc">  DashStyle, LineCap, LineJoin</text>
    <text x="25" y="147" class="desc"><b>• Analogie:</b> Der Zeichenstift</text>
  </g>

  <!-- Golden Rule Freeze -->
  <g transform="translate(15, 376)">
    <rect width="240" height="32" rx="4" fill="#fef3c7" stroke="#fcd34d" />
    <text x="120" y="20" class="lbl" style="font-size: 12px; fill: #b45309; text-anchor: middle;">Golden Rule: Immer .Freeze()!</text>
  </g>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>
</svg>