<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 270 374" width="270" height="374">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px;  text-anchor: middle; }
    </style>
  </defs>


  <!-- Phase 1: Measure -->
  <g transform="translate(15, 54)">
    <rect class="sem-primary" width="240" height="150" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-primary-text" >Phase 1: Measure (Wunsch)</text>
    
    <rect class="sem-primary" x="15" y="30" width="75" height="26" rx="4" />
    <text x="52.5" y="47" class="lbl sem-primary-text" style="font-size: 12px;">Parent</text>

    <rect class="sem-primary" x="150" y="30" width="75" height="26" rx="4" />
    <text x="187.5" y="47" class="lbl sem-primary-text" style="font-size: 12px;">Child Shape</text>

    <!-- Pfeil Anfrage -->
    <line class="sem-primary-stroke" x1="55" y1="82" x2="185" y2="82" stroke-width="2" />
    <polygon class="sem-primary-fill" points="185,82 177,78 177,86" />
    <text x="120" y="75" class="desc sem-neutral-text sem-primary-text" style="font-size: 11.5px;">Measure(availSize)</text>

    <!-- Pfeil Antwort -->
    <line class="sem-success-stroke" x1="185" y1="108" x2="55" y2="108" stroke-width="2" />
    <polygon class="sem-success-fill" points="55,108 63,104 63,112" />
    <text x="120" y="101" class="desc sem-neutral-text sem-success-text" style="font-size: 11.5px;">DesiredSize</text>

    <text x="120" y="134" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">„Wie viel Platz willst du?“</text>
  </g>

  <!-- Phase 2: Arrange -->
  <g transform="translate(15, 218)">
    <rect class="sem-success" width="240" height="150" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-success-text" >Phase 2: Arrange (Zuweisung)</text>

    <rect class="sem-success" x="15" y="30" width="75" height="26" rx="4" />
    <text x="52.5" y="47" class="lbl sem-success-text" style="font-size: 12px;">Parent</text>

    <rect class="sem-success" x="150" y="30" width="75" height="26" rx="4" />
    <text x="187.5" y="47" class="lbl sem-success-text" style="font-size: 12px;">Child Shape</text>

    <!-- Pfeil Zuweisung -->
    <line class="sem-success-stroke" x1="55" y1="82" x2="185" y2="82" stroke-width="2" />
    <polygon class="sem-success-fill" points="185,82 177,78 177,86" />
    <text x="120" y="75" class="desc sem-neutral-text sem-success-text" style="font-size: 11.5px;">Arrange(finalRect)</text>

    <!-- Bestätigung -->
    <circle class="sem-success-fill sem-success-stroke" cx="120" cy="106" r="12" />
    <path stroke="#ffffff" d="M 114 106 L 118 110 L 126 102" fill="none" stroke-width="2" />

    <text x="120" y="134" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">„Hier ist dein Platz!“</text>
  </g>

  <g transform="translate(15, 376)">
    <rect class="sem-danger" width="240" height="32" rx="4" />
    <text x="120" y="20" class="lbl sem-danger-text" style="font-size: 12px;">5.000 Shapes = 10.000 Aufrufe!</text>
  </g>
</svg>