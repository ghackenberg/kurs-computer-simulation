<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 295 380" width="295" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  }
      .fml { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: bold; }
      .axis { font-family: 'Cambria Math', serif; font-size: 11.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->

  <!-- 1. Canvas Space (Ruhende Zeichenebene) -->
  <g transform="translate(15, 48)">
    <rect class="sem-primary" width="265" height="136" rx="6" stroke-width="1.5" />
    <rect class="sem-primary" x="0" y="0" width="265" height="20" rx="6"  stroke="none"/>
    <text x="10" y="15" class="lbl sem-primary-text" >1. Ruhender Canvas (Pixel [px])</text>

    <!-- Virtual Canvas Sheet -->
    <rect class="sem-primary-stroke" x="10" y="26" width="82" height="98" rx="3" fill="#ffffff" stroke-width="1.2" stroke-dasharray="3,2" />
    
    <!-- Origin (0,0) -->
    <circle class="sem-primary-fill" cx="10" cy="26" r="2.5" />
    <text x="14" y="36" class="desc sem-neutral-text sem-primary-text" style="font-size: 11.5px;  font-weight: bold;">(0,0)</text>

    <!-- Truss on Canvas -->
    <polygon class="sem-primary-stroke" points="24,94 86,94 55,58" fill="none" stroke-width="1.5" />
    <circle class="sem-primary-fill" cx="24" cy="94" r="2.5" />
    <circle class="sem-primary-fill" cx="86" cy="94" r="2.5" />
    <circle class="sem-danger-fill" cx="55" cy="58" r="3" />
    <text x="56" y="48" class="fml sem-danger-text" style="font-size: 11.5px;  text-anchor: middle;">P_unzoom</text>
    <text x="55" y="116" class="desc sem-neutral-text sem-primary-text" style="font-size: 11.5px;  text-anchor: middle;">WPF-Shapes</text>

    <!-- Text description right -->
    <g transform="translate(104, 28)">
      <text x="0" y="16" class="fml sem-primary-text" >P_unzoom (x_u, y_u)</text>
      <text x="0" y="38" class="desc sem-primary-text" >Offset abziehen:</text>
      <text x="0" y="56" class="fml sem-primary-text" >x_u - x_off</text>
      <text x="0" y="74" class="fml sem-primary-text" >y_u - y_off</text>
      <text x="0" y="94" class="desc sem-neutral-text sem-muted-text" style="font-size: 11.5px;">+Y nach unten</text>
    </g>
  </g>

  <!-- Transition Arrow Viewport^-1 -->
  <g transform="translate(15, 187)">
    <line class="sem-success-stroke" x1="38" y1="0" x2="38" y2="24" stroke-width="2" />
    <polygon class="sem-success-fill" points="38,28 34,21 42,21" />
    <rect class="sem-success-stroke" x="48" y="2" width="194" height="22" rx="4" fill="#ffffff" stroke-width="1" />
    <text x="145" y="17" class="fml sem-success-text" style="font-size: 11.5px;  text-anchor: middle;">Skalierung 1/s &amp; Y-Spiegelung</text>
  </g>

  <!-- 2. World Space (Physikalischer Modellraum) -->
  <g transform="translate(15, 218)">
    <rect class="sem-success" width="265" height="136" rx="6" stroke-width="1.5" />
    <rect class="sem-success" x="0" y="0" width="265" height="20" rx="6"  stroke="none"/>
    <text x="10" y="15" class="lbl sem-success-text" >2. World-Raum (Meter [m])</text>

    <!-- World Axis Frame (Y UPWARDS) -->
    <g transform="translate(14, 114)">
      <!-- X-Axis -->
      <line class="sem-success-stroke" x1="0" y1="0" x2="62" y2="0" stroke-width="1.5" />
      <polygon class="sem-success-fill" points="66,0 60,-3 60,3" />
      <text x="46" y="-8" class="axis sem-success-text" >+X_w</text>

      <!-- Y-Axis (UPWARDS!) -->
      <line class="sem-success-stroke" x1="0" y1="0" x2="0" y2="-76" stroke-width="1.5" />
      <polygon class="sem-success-fill" points="0,-80 -3,-74 3,-74" />
      <text x="6" y="-68" class="axis sem-success-text" >+Y_w</text>

      <!-- Truss Model in World -->
      <polygon class="sem-success-stroke" points="8,0 48,0 28,-42" fill="none" stroke-width="1.5" />
      <circle class="sem-success-fill" cx="8" cy="0" r="2.5" />
      <circle class="sem-success-fill" cx="48" cy="0" r="2.5" />
      <circle class="sem-danger-fill" cx="28" cy="-42" r="3" />
      <text x="28" y="-50" class="fml sem-success-text" style="font-size: 11.5px;  text-anchor: middle;">P_world</text>
      <text x="28" y="14" class="desc sem-neutral-text sem-success-text" style="font-size: 11.5px;  text-anchor: middle;">Physik</text>
    </g>

    <!-- Text description right -->
    <g transform="translate(104, 28)">
      <text x="0" y="16" class="fml sem-success-text" >P_world (x_w, y_w)</text>
      <text x="0" y="38" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">Ingenieur-System:</text>
      <text x="0" y="56" class="desc sem-neutral-text sem-success-text" >X startet bei X_min</text>
      <text x="0" y="74" class="desc sem-neutral-text sem-success-text" >Y startet bei Y_max</text>
      <text x="0" y="94" class="desc sem-neutral-text sem-success-text" style="font-size: 11.5px;  font-weight: bold;">+Y_w zeigt nach OBEN</text>
    </g>
  </g>

  <!-- Formula Card (Footer) -->
  <rect class="sem-success-stroke" x="15" y="362" width="265" height="48" rx="5" fill="#ffffff" stroke-width="1.2" />
  <text x="147.5" y="380" class="fml sem-success-text" style="text-anchor: middle;">x_w = X_min + (x_u - x_off) / s</text>
  <text x="147.5" y="400" class="fml sem-success-text" style="text-anchor: middle;">y_w = Y_max - (y_u - y_off) / s</text>
</svg>
