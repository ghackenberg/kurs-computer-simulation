<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0284c7; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px;  text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 12px;  text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">ScaleAt(C) Prinzip</text>
  <text x="135" y="42" class="sub sem-muted-text">3-Schritt-Matrix-Kaskade</text>

  <!-- 3 Schritte visuell -->
  <!-- Schritt 1 -->
  <g transform="translate(15, 54)">
    <rect class="sem-warning" width="240" height="96" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-warning-text" >1. Translation: -P_cursor</text>
    <text x="120" y="38" class="desc sem-neutral-text">Verschiebt Fixpunkt C in (0,0)</text>
    <line class="sem-warning-stroke" x1="180" y1="65" x2="70" y2="65" stroke-width="2.5" marker-end="url(#arrow)" />
    <circle class="sem-warning-fill" cx="180" cy="65" r="5" />
    <text x="180" y="85" class="lbl sem-warning-text" >Cursor C</text>
    <circle class="sem-success-fill" cx="70" cy="65" r="5" />
    <text x="70" y="85" class="lbl sem-success-text" >(0,0)</text>
  </g>

  <!-- Schritt 2 -->
  <g transform="translate(15, 158)">
    <rect class="sem-primary" width="240" height="96" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-primary-text" >2. Skalierung: Scale(s)</text>
    <text x="120" y="38" class="desc sem-neutral-text">Vergrößert um Ursprung (0,0)</text>
    <!-- Kleines Quadrat wächst zu großem -->
    <rect class="sem-primary-stroke" x="28" y="48" width="25" height="20" fill="none" stroke-width="1.5" stroke-dasharray="3,2" />
    <rect class="sem-primary-stroke" x="28" y="48" width="50" height="36" fill="none" stroke-width="2" />
    <circle class="sem-success-fill" cx="28" cy="48" r="4" />
    <text x="160" y="70" class="fml sem-warning-text sem-primary-text" >P' = s · (P - C)</text>
  </g>

  <!-- Schritt 3 -->
  <g transform="translate(15, 262)">
    <rect class="sem-success" width="240" height="96" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-success-text" >3. Rücktranslation: +P_cursor</text>
    <text x="120" y="38" class="desc sem-neutral-text">Schiebt C zurück an alte Position</text>
    <line class="sem-success-stroke" x1="70" y1="65" x2="180" y2="65" stroke-width="2.5" />
    <circle class="sem-success-fill" cx="180" cy="65" r="5" />
    <text x="180" y="85" class="lbl sem-success-text" >C fixiert!</text>
  </g>

  <g transform="translate(15, 366)">
    <rect class="sem-card-fill" width="240" height="42" rx="4" />
    <text x="120" y="26" class="fml sem-warning-text sem-info-text" style="font-weight: bold;">M = T(+C) · S(s) · T(-C)</text>
  </g>
</svg>