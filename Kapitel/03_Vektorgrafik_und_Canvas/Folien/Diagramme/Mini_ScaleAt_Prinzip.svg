<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; fill: #334155; text-anchor: middle; }
      .fml { font-family: 'Consolas', monospace; font-size: 12px; fill: #b45309; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">ScaleAt(C) Prinzip</text>
  <text x="135" y="42" class="sub">3-Schritt-Matrix-Kaskade</text>

  <!-- 3 Schritte visuell -->
  <!-- Schritt 1 -->
  <g transform="translate(15, 54)">
    <rect width="240" height="96" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #92400e;">1. Translation: -P_cursor</text>
    <text x="120" y="38" class="desc">Verschiebt Fixpunkt C in (0,0)</text>
    <line x1="180" y1="65" x2="70" y2="65" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)" />
    <circle cx="180" cy="65" r="5" fill="#b45309" />
    <text x="180" y="85" class="lbl" style="fill: #b45309;">Cursor C</text>
    <circle cx="70" cy="65" r="5" fill="#047857" />
    <text x="70" y="85" class="lbl" style="fill: #047857;">(0,0)</text>
  </g>

  <!-- Schritt 2 -->
  <g transform="translate(15, 158)">
    <rect width="240" height="96" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #1e40af;">2. Skalierung: Scale(s)</text>
    <text x="120" y="38" class="desc">Vergrößert um Ursprung (0,0)</text>
    <!-- Kleines Quadrat wächst zu großem -->
    <rect x="28" y="48" width="25" height="20" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2" />
    <rect x="28" y="48" width="50" height="36" fill="none" stroke="#2563eb" stroke-width="2" />
    <circle cx="28" cy="48" r="4" fill="#047857" />
    <text x="160" y="70" class="fml" style="fill: #1d4ed8;">P' = s · (P - C)</text>
  </g>

  <!-- Schritt 3 -->
  <g transform="translate(15, 262)">
    <rect width="240" height="96" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #15803d;">3. Rücktranslation: +P_cursor</text>
    <text x="120" y="38" class="desc">Schiebt C zurück an alte Position</text>
    <line x1="70" y1="65" x2="180" y2="65" stroke="#16a34a" stroke-width="2.5" />
    <circle cx="180" cy="65" r="5" fill="#15803d" />
    <text x="180" y="85" class="lbl" style="fill: #15803d;">C fixiert!</text>
  </g>

  <g transform="translate(15, 366)">
    <rect width="240" height="42" rx="4" fill="#1e293b" />
    <text x="120" y="26" class="fml" style="fill: #38bdf8; font-weight: bold;">M = T(+C) · S(s) · T(-C)</text>
  </g>
</svg>