<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 270 374" width="270" height="374">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;  text-anchor: middle; }
      .math { font-family: 'Cambria Math', serif; font-size: 13px; }
    </style>
  </defs>


  <!-- CPU Box -->
  <g transform="translate(15, 54)">
    <rect class="sem-danger" width="240" height="120" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-danger-text" >Ansatz A: CPU-Neuzeichnen</text>
    <text x="120" y="45" class="desc sem-neutral-text sem-danger-text" >10.000 Shapes neu verschieben:</text>
    <text x="120" y="65" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">Canvas.SetLeft(), SetTop()</text>
    <text x="120" y="88" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">UI ruckelt stark (&lt; 15 FPS)</text>
    <text x="120" y="106" class="desc sem-neutral-text sem-danger-text" >O(N) CPU-Aufwand pro Event</text>
  </g>

  <!-- GPU Box -->
  <g transform="translate(15, 186)">
    <rect class="sem-success" width="240" height="125" rx="6" stroke-width="1.5" />
    <text x="120" y="22" class="lbl sem-success-text" >Ansatz B: GPU MatrixTransform</text>
    <text x="120" y="45" class="desc sem-neutral-text sem-success-text" >Modell bleibt starr gezeichnet</text>
    
    <g transform="translate(45, 52)">
      <rect class="sem-success-stroke" width="150" height="38" rx="4" fill="#ffffff" stroke-width="1.2" />
      <text x="75" y="24" class="math sem-success-text" style="text-anchor: middle;">M = [ S,  0,  dx;  0,  S,  dy ]</text>
    </g>

    <text x="120" y="110" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">O(1) Aufwand: Konstant 60+ FPS!</text>
  </g>

  <!-- Footer -->
  <rect class="sem-primary" x="15" y="322" width="240" height="84" rx="6" stroke-width="1.5" />
  <text x="135" y="344" class="lbl sem-primary-text" >Architektur-Vorteil</text>
  <text x="135" y="366" class="desc sem-neutral-text sem-primary-text" >Entkopplung von Geometrie &amp; Kamera</text>
  <text x="135" y="388" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">0 B Allokation im Zoom-Loop!</text>
</svg>