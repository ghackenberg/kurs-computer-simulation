    <linearGradient id="grad-sem-accent-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <!-- Pfeilspitzen -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-muted-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-primary-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
  </defs>

  <style>
    
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: url(#grad-sem-info-fill); }
      .sem-info-text { fill: #075985; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-accent { fill: url(#grad-sem-accent); stroke: #7c3aed; }
      .sem-accent-bg { fill: url(#grad-sem-accent); stroke: none; }
      .sem-accent-stroke { stroke: #7c3aed; }
      .sem-accent-fill { fill: url(#grad-sem-accent-fill); }
      .sem-accent-text { fill: #6d28d9; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .code-font {
      font-family: Consolas, "Courier New", monospace;
    }
  </style>

  <!-- Hauptrahmen & Hintergrund -->
  <rect class="sem-card-stroke" x="5" y="5" width="950" height="410" rx="12" fill="#FFFFFF" stroke-width="1.5" />

  <!-- Titelbanner -->
  <rect class="sem-card" x="5" y="5" width="950" height="42" rx="12"  stroke="none"/>
  <rect class="sem-card" x="5" y="32" width="950" height="15"  stroke="none"/>
  <line class="sem-muted-stroke" x1="5" y1="47" x2="955" y2="47" stroke-width="1.5" />
  <text class="sem-primary-text" x="20" y="30" font-size="16" font-weight="700">Event-Lokalisierung: Nullstelleneinkreisung via Vorzeichenwechsel-Bisektion</text>
  
  <rect class="sem-primary" x="730" y="12" width="210" height="24" rx="5" stroke-width="1.2" />
  <text class="sem-primary-text" x="835" y="28" font-size="12" font-weight="700" text-anchor="middle">Bolzano-Intervallschachtelung</text>

  <!-- ========================================================================= -->
  <!-- 1. BEREICH LINKS: KOORDINATENSYSTEM & BISEKTIONSSCHRITTE                  -->
  <!-- ========================================================================= -->
  <rect class="sem-card sem-muted-stroke" x="15" y="54" width="615" height="240" rx="8" stroke-width="1.2" />
  
  <!-- Header-Band für Zone 1 -->
  <rect class="sem-muted" x="15" y="54" width="615" height="24" rx="8"  stroke="none"/>
  <rect class="sem-muted" x="15" y="66" width="615" height="12"  stroke="none"/>
  <line class="sem-muted-stroke" x1="15" y1="78" x2="630" y2="78" stroke-width="1" />
  <text class="sem-neutral-text" x="25" y="70" font-size="12" font-weight="700">1. Intervallschachtelung im Zeitbereich: Lokalisierung von t*</text>
  <text class="sem-success-text" x="615" y="70" font-size="12" font-weight="700" text-anchor="end">Kriterium: z(t_a) · z(t_b) ≤ 0</text>

  <!-- Toleranzband um t* (grün schattiert) -->
  <rect class="sem-success" x="334" y="82" width="12" height="120" fill-opacity="0.6" stroke-width="1" />

  <!-- Nulllinie z(t) = 0 (Zeitachse t) -->
  <line class="sem-muted-stroke" x1="45" y1="140" x2="595" y2="140" stroke-width="1.5" marker-end="url(#arr-dark)" />
  <rect class="sem-card-stroke" x="42" y="125" width="56" height="16" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-info-text" x="70" y="137" font-size="12" font-weight="700" text-anchor="middle">z(t) = 0</text>

  <rect class="sem-card-stroke" x="548" y="124" width="46" height="16" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-muted-text" x="571" y="136" font-size="12" font-weight="700" text-anchor="middle">Zeit t</text>

  <!-- Vertikale Achse z -->
  <line class="sem-muted-stroke" x1="45" y1="205" x2="45" y2="84" stroke-width="1.5" marker-end="url(#arr-dark)" />
  <rect class="sem-card-stroke" x="30" y="82" width="30" height="16" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-muted-text" x="45" y="94" font-size="12" font-weight="700" text-anchor="middle">z(t)</text>

  <!-- Kontinuierliche Kurve z(t) -->
  <path class="sem-primary-stroke" d="M 75 90 C 160 98, 250 120, 340 140 C 420 158, 490 178, 550 190" fill="none" stroke-width="2.5" />

  <!-- Punkt A bei (85, 93): z(t_a) > 0 -->
  <circle class="sem-primary-fill" cx="85" cy="93" r="5" />
  <rect class="sem-primary-stroke" x="60" y="80" width="105" height="18" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-primary-text" x="112" y="93" font-size="12" font-weight="700" text-anchor="middle">A: z(t_a) &gt; 0</text>

  <!-- Punkt B bei (535, 187): z(t_b) < 0 -->
  <circle class="sem-primary-fill" cx="535" cy="187" r="5" />
  <rect class="sem-primary-stroke" x="445" y="185" width="105" height="18" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-primary-text" x="497" y="198" font-size="12" font-weight="700" text-anchor="middle">B: z(t_b) &lt; 0</text>

  <!-- Exakter Event-Punkt t* bei (340, 140) -->
  <line class="sem-success-stroke" x1="340" y1="84" x2="340" y2="202" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle class="sem-success-fill" cx="340" cy="140" r="5" />
  <rect class="sem-success-stroke" x="275" y="90" width="130" height="18" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-success-text" x="340" y="103" font-size="12" font-weight="700" text-anchor="middle">Exakte Wurzel t*</text>

  <!-- ================= BISEKTIONS-SCHRITTE (INTERVALLBALKEN) ================= -->
  <!-- Vertikale Hilfslinien der Bisektionspunkte (im Hintergrund) -->
  <line class="sem-warning-stroke" x1="310" y1="133" x2="310" y2="242" stroke-width="1.5" stroke-dasharray="2,2" />
  <circle class="sem-warning-fill" cx="310" cy="133" r="4" />

  <line class="sem-accent-stroke" x1="423" y1="158" x2="423" y2="262" stroke-width="1.5" stroke-dasharray="2,2" />
  <circle class="sem-accent-fill" cx="423" cy="158" r="4" />

  <line class="sem-success-stroke" x1="367" y1="147" x2="367" y2="280" stroke-width="1.5" stroke-dasharray="2,2" />
  <circle class="sem-success-fill" cx="367" cy="147" r="4" />

  <!-- Schritt 0: Startintervall [t_a, t_b] -->
  <line class="sem-muted-stroke" x1="85" y1="214" x2="535" y2="214" stroke-width="2" />
  <line class="sem-muted-stroke" x1="85" y1="209" x2="85" y2="219" stroke-width="2" />
  <line class="sem-muted-stroke" x1="535" y1="209" x2="535" y2="219" stroke-width="2" />
  <rect class="sem-card-stroke" x="180" y="206" width="220" height="17" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-muted-text" x="290" y="218" font-size="12" font-weight="600" text-anchor="middle">Schritt 0: [t_a, t_b] mit Breite Δt_0</text>

  <!-- Schritt 1: Mittelpunkt t_mid1 = 310 -->
  <line class="sem-warning-stroke" x1="310" y1="235" x2="535" y2="235" stroke-width="2" />
  <line class="sem-warning-stroke" x1="310" y1="230" x2="310" y2="240" stroke-width="2" />
  <line class="sem-warning-stroke" x1="535" y1="230" x2="535" y2="240" stroke-width="2" />
  <rect class="sem-warning-stroke" x="335" y="227" width="180" height="17" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-warning-text" x="425" y="239" font-size="12" font-weight="600" text-anchor="middle">Schritt 1: Δt_1 = Δt_0 / 2</text>

  <!-- Schritt 2: Mittelpunkt t_mid2 = 423 -->
  <line class="sem-accent-stroke" x1="310" y1="256" x2="423" y2="256" stroke-width="2" />
  <line class="sem-accent-stroke" x1="310" y1="251" x2="310" y2="261" stroke-width="2" />
  <line class="sem-accent-stroke" x1="423" y1="251" x2="423" y2="261" stroke-width="2" />
  <rect class="sem-accent-stroke" x="314" y="248" width="50" height="17" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-accent-text" x="339" y="260" font-size="12" font-weight="600" text-anchor="middle">Δt_0 / 4</text>

  <!-- Schritt 3: Mittelpunkt t_mid3 = 367 -->
  <line class="sem-success-stroke" x1="310" y1="275" x2="367" y2="275" stroke-width="2" />
  <line class="sem-success-stroke" x1="310" y1="271" x2="310" y2="279" stroke-width="2" />
  <line class="sem-success-stroke" x1="367" y1="271" x2="367" y2="279" stroke-width="2" />
  <rect class="sem-success-stroke" x="375" y="268" width="225" height="17" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-success-text" x="487" y="280" font-size="12" font-weight="700" text-anchor="middle">Schritt 3: Δt_0 / 8  ⇒ Konvergenz t*</text>

  <!-- ========================================================================= -->
  <!-- 2. BEREICH RECHTS: ABBRUCHKRITERIEN & WARNUNG                             -->
  <!-- ========================================================================= -->
  <!-- Karte A: Duale Abbruchkriterien -->
  <rect class="sem-success" x="640" y="54" width="305" height="114" rx="8" stroke-width="1.2" />
  <rect class="sem-success" x="640" y="54" width="305" height="22" rx="8"  stroke="none"/>
  <rect class="sem-success" x="640" y="66" width="305" height="10"  stroke="none"/>
  <line class="sem-success-stroke" x1="640" y1="76" x2="945" y2="76" stroke-width="1" />
  <text class="sem-success-text" x="792" y="69" font-size="12" font-weight="700" text-anchor="middle">Duale Abbruchkriterien &amp; Schranke</text>

  <rect class="sem-success-stroke" x="650" y="82" width="285" height="20" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-success-text" x="792" y="96" font-size="12" font-weight="700" text-anchor="middle">1. Residualtoleranz: |z(t_mid)| ≤ ε_z</text>

  <rect class="sem-success-stroke" x="650" y="106" width="285" height="20" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-success-text" x="792" y="120" font-size="12" font-weight="700" text-anchor="middle">2. Zeittoleranz: |t_b - t_a| ≤ ε_t</text>

  <text class="sem-success-text" x="650" y="142" font-size="12" font-weight="600">• Max. Schritte: k_max = ⌈log₂(Δt_0 / ε_t)⌉</text>
  <text class="sem-muted-text" x="650" y="158" font-size="12" font-weight="500">• Bsp: Δt_0=10 ms, ε_t=10 ns ⇒ k_max = 20</text>

  <!-- Karte B: Warnung Häufiger Implementierungsfehler -->
  <rect class="sem-danger" x="640" y="176" width="305" height="118" rx="8" stroke-width="1.2" />
  <rect class="sem-danger" x="640" y="176" width="305" height="22" rx="8"  stroke="none"/>
  <rect class="sem-danger" x="640" y="188" width="305" height="10"  stroke="none"/>
  <line class="sem-danger-stroke" x1="640" y1="198" x2="945" y2="198" stroke-width="1" />
  <text class="sem-danger-text" x="792" y="191" font-size="12" font-weight="700" text-anchor="middle">ACHTUNG: Falsche Zeitschritthalbierung</text>

  <rect class="sem-danger-stroke" x="650" y="204" width="285" height="20" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-danger-text" x="792" y="218" font-size="12" font-weight="700" text-anchor="middle">❌ Naiv: timeStep /= 2; (FALSCH!)</text>

  <text class="sem-danger-text" x="650" y="238" font-size="12" font-weight="600">• Testet starr t_0+0.5h, t_0+0.25h, t_0+0.125h...</text>
  <text class="sem-danger-text" x="650" y="254" font-size="12" font-weight="600">• Verfehlt Nullstellen, falls t* &gt; t_0 + 0.5·Δt_0!</text>
  <text class="sem-success-text" x="650" y="274" font-size="12" font-weight="700">✔ Echte Bisektion schachtelt dynamisch ein</text>

  <!-- ========================================================================= -->
  <!-- 3. BEREICH UNTEN: ALGORITHMUS (CODE) & EIGENSCHAFTEN                      -->
  <!-- ========================================================================= -->
  <!-- Links: C#-Pseudocode -->
  <rect class="sem-card-fill sem-neutral-stroke" x="15" y="302" width="540" height="105" rx="8" stroke-width="1.2" />
  <rect class="sem-neutral-fill" x="25" y="308" width="285" height="18" rx="3" />
  <text class="sem-info-text" x="35" y="321" font-size="12" font-weight="700">C#-Referenz: Robuste Bisektionsschleife</text>

  <text x="25" y="342" font-size="12" font-weight="500" class="code-font sem-card-text">while ((tb - ta) &gt; eps_t &amp;&amp; Math.Abs(z_mid) &gt; eps_z) {</text>
  <text x="45" y="358" font-size="12" font-weight="500" class="code-font sem-card-text">double t_mid = 0.5 * (ta + tb);  double z_mid = EvalZ(t_mid);</text>
  <text x="45" y="374" font-size="12" font-weight="500" class="code-font sem-card-text">if (za * z_mid &lt;= 0.0) { tb = t_mid; zb = z_mid; }</text>
  <text x="45" y="390" font-size="12" font-weight="500" class="code-font sem-card-text">else                  { ta = t_mid; za = z_mid; }</text>
  <text x="25" y="402" font-size="12" font-weight="500" class="code-font sem-card-text">}</text>

  <!-- Rechts: Eigenschaften & Garantien -->
  <rect class="sem-success" x="565" y="302" width="380" height="105" rx="8" stroke-width="1.2" />
  <rect class="sem-success" x="575" y="308" width="235" height="18" rx="3"  stroke="none"/>
  <text class="sem-success-text" x="585" y="321" font-size="12" font-weight="700">Garantierte Konvergenzeigenschaften</text>

  <text class="sem-success-text" x="575" y="343" font-size="12" font-weight="600">• Lineare Konvergenz: Halbiert Intervall in jedem Schritt:</text>
  <rect class="sem-success-stroke" x="590" y="350" width="340" height="18" rx="3" fill="#FFFFFF" stroke-width="1" />
  <text class="sem-success-text" x="760" y="363" font-size="12" font-weight="700" text-anchor="middle">Δt_k = Δt_0 · 2^(-k)   (Exponentielle Schrumpfung)</text>

  <text class="sem-success-text" x="575" y="383" font-size="12" font-weight="600">• Deterministisch: Bolzano garantiert Auffinden der Wurzel</text>
  <text class="sem-success-text" x="575" y="399" font-size="12" font-weight="600">• Zeno-Schutz: Verhindert unendliche Zeitschrittschrumpfung</text>
</svg>
