  <rect x="-45" y="0" width="570" height="380" fill="none"/>

  <rect class="sem-primary" x="-25" y="16" width="530" height="84" rx="10" stroke-width="2"/>
  <text class="sem-primary-text" x="240" y="42" font-size="18" font-weight="bold" text-anchor="middle">T08 &amp; T09: Kontinuierlich vs. Diskret</text>
  <text class="sem-primary-text" x="240" y="67" font-size="16" text-anchor="middle">T08: stetige DGL · T09: diskrete Sprünge</text>
  <text class="sem-muted-text" x="240" y="89" font-size="15.5" text-anchor="middle">Grenze: Tunneling-Fehler am Anschlag</text>

  <line class="sem-primary-stroke" x1="240" y1="100" x2="240" y2="132" stroke-width="2.5" marker-end="url(#arrB)"/>

  <rect class="sem-warning" x="-25" y="138" width="530" height="100" rx="10" stroke-width="2.5"/>
  <text class="sem-warning-text" x="240" y="165" font-size="18" font-weight="bold" text-anchor="middle">T10: Hybride Simulation (Heute)</text>
  <text class="sem-warning-text" x="240" y="192" font-size="16" font-weight="bold" text-anchor="middle">Zero-Crossing-Bisektion &amp; Abtastzeiten</text>
  <text class="sem-warning-text" x="240" y="220" font-size="15.5" text-anchor="middle">ODE + Ereignisse exakt synchronisieren</text>

  <line class="sem-success-stroke" x1="240" y1="238" x2="240" y2="270" stroke-width="2.5" marker-end="url(#arrG)"/>

  <rect class="sem-success" x="-25" y="276" width="530" height="88" rx="10" stroke-width="2"/>
  <text class="sem-success-text" x="240" y="303" font-size="18" font-weight="bold" text-anchor="middle">T11: Epilog &amp; Gesamtsynthese</text>
  <text class="sem-success-text" x="240" y="328" font-size="15.5" text-anchor="middle">Alle 4 Modellarten &amp; Grafik-Säulen vereint</text>
  <text class="sem-success-text" x="240" y="352" font-size="15.5" text-anchor="middle">Architektur für industrielle Zwillinge</text>
</svg>
