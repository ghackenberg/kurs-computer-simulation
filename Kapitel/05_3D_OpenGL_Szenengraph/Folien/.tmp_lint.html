<p><strong>C#-Implementierung:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">private</span> (<span class="hljs-built_in">float</span> x, <span class="hljs-built_in">float</span> y, <span class="hljs-built_in">float</span> z) ComputeCoordinate(
    <span class="hljs-built_in">float</span> radius, <span class="hljs-built_in">int</span> i, <span class="hljs-built_in">int</span> j)
{
    <span class="hljs-built_in">float</span> phi = i / (<span class="hljs-built_in">float</span>)stacks * (<span class="hljs-built_in">float</span>)Math.PI;
    <span class="hljs-built_in">float</span> theta = j / (<span class="hljs-built_in">float</span>)slices * <span class="hljs-number">2.0f</span> * (<span class="hljs-built_in">float</span>)Math.PI;

    <span class="hljs-built_in">float</span> x = radius * (<span class="hljs-built_in">float</span>)(Math.Sin(phi) * Math.Cos(theta));
    <span class="hljs-built_in">float</span> y = radius * (<span class="hljs-built_in">float</span>)Math.Cos(phi);
    <span class="hljs-built_in">float</span> z = radius * (<span class="hljs-built_in">float</span>)(Math.Sin(phi) * Math.Sin(theta));

    <span class="hljs-keyword">return</span> (x, y, z);
}
</code></pre>

<p><strong>C#-Normalen-Berechnung:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-function"><span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title">SphereVertexNormal</span>(<span class="hljs-params">OpenGL gl, <span class="hljs-built_in">int</span> i, <span class="hljs-built_in">int</span> j</span>)</span>
{
    <span class="hljs-comment">// Einheitskugel liefert direkt die Einheitsnormale</span>
    (<span class="hljs-built_in">float</span> nx, <span class="hljs-built_in">float</span> ny, <span class="hljs-built_in">float</span> nz) = 
        ComputeCoordinate(<span class="hljs-number">1.0f</span>, i, j);

    <span class="hljs-comment">// Normalenvektor an OpenGL übergeben</span>
    gl.Normal(nx, ny, nz);
}

<header>Kapitel 5 (Anhang B): 3D-Normalen &amp; Geometrieherleitung</header>
<h3 id="triangulation-der-kugel-via-quad-strips--triangle-fans">Triangulation der Kugel via Quad-Strips &amp; Triangle-Fans</h3>
<p>Um die Kugeloberfläche mit OpenGL effizient zu zeichnen, wird die Kugel in Streifen zerlegt:</p>
<ul>
<li><strong>Polkappen</strong>: Nord- und Südpol werden durch <code>GL_TRIANGLE_FAN</code> geschlossen. Der Mittelpunkt ist der jeweilige Pol, die Fächerknoten liegen auf dem ersten bzw. letzten Breitenkreis.</li>

<p><strong>C#-Methode:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">private</span> (<span class="hljs-built_in">float</span> x, <span class="hljs-built_in">float</span> y, <span class="hljs-built_in">float</span> z) ComputeCoordinate(
    <span class="hljs-built_in">int</span> i, <span class="hljs-built_in">int</span> j)
{
    <span class="hljs-built_in">float</span> phi = i / (<span class="hljs-built_in">float</span>)Stacks;
    <span class="hljs-built_in">float</span> theta = (<span class="hljs-built_in">float</span>)Math.PI * <span class="hljs-number">2.0f</span> / Slices * j;
    <span class="hljs-built_in">float</span> r = Radius1 + phi * (Radius2 - Radius1);

    <span class="hljs-built_in">float</span> x = r * (<span class="hljs-built_in">float</span>)Math.Cos(theta);
    <span class="hljs-built_in">float</span> y = Length * phi;
    <span class="hljs-built_in">float</span> z = r * (<span class="hljs-built_in">float</span>)Math.Sin(theta);

    <span class="hljs-keyword">return</span> (x, y, z);
}

<header>Kapitel 5 (Anhang B): 3D-Normalen &amp; Geometrieherleitung</header>
<h3 id="implementierung-der-zylinder-normalen-in-c">Implementierung der Zylinder-Normalen in C#</h3>
<p>Zur Verwendung in OpenGL muss der analytische Vektor noch auf die euklidische Länge 1 normiert werden:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">private</span> (<span class="hljs-built_in">float</span> nx, <span class="hljs-built_in">float</span> ny, <span class="hljs-built_in">float</span> nz) ComputeNormal(<span class="hljs-built_in">int</span> j)
{
    <span class="hljs-built_in">float</span> theta = (<span class="hljs-built_in">float</span>)Math.PI * <span class="hljs-number">2.0f</span> / Slices * j;

    <span class="hljs-comment">// Unnormierter Normalenvektor aus der 2D/3D-Herleitung</span>
    <span class="hljs-built_in">float</span> nx = Length * (<span class="hljs-built_in">float</span>)Math.Cos(theta);
    <span class="hljs-built_in">float</span> ny = Radius1 - Radius2;
    <span class="hljs-built_in">float</span> nz = Length * (<span class="hljs-built_in">float</span>)Math.Sin(theta);

    <span class="hljs-comment">// Euklidische Norm berechnen</span>
    <span class="hljs-built_in">float</span> norm = (<span class="hljs-built_in">float</span>)Math.Sqrt(nx * nx + ny * ny + nz * nz);

    <span class="hljs-keyword">return</span> (nx / norm, ny / norm, nz / norm);
}
</code></pre>

<header>Kapitel 5 (Anhang B): 3D-Normalen &amp; Geometrieherleitung</header>
<h3 id="triangulation-des-zylindermantels">Triangulation des Zylindermantels</h3>
<p>Der Zylindermantel wird analog zur Kugel als umlaufender <code>GL_QUAD_STRIP</code> erzeugt:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">for</span> (<span class="hljs-built_in">int</span> i = <span class="hljs-number">0</span>; i &lt; Stacks; i++)
{
    gl.Begin(OpenGL.GL_QUAD_STRIP);
    <span class="hljs-keyword">for</span> (<span class="hljs-built_in">int</span> j = <span class="hljs-number">0</span>; j &lt;= Slices; j++)
    {
        <span class="hljs-keyword">var</span> n = ComputeNormal(j);
        gl.Normal(n.nx, n.ny, n.nz);

        <span class="hljs-keyword">var</span> pBottom = ComputeCoordinate(i, j);
        gl.Vertex(pBottom.x, pBottom.y, pBottom.z);

        <span class="hljs-keyword">var</span> pTop = ComputeCoordinate(i + <span class="hljs-number">1</span>, j);
        gl.Vertex(pTop.x, pTop.y, pTop.z);
    }
    gl.End();
}
</code></pre>
