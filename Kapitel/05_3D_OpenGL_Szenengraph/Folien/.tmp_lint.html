<h3 id="schattierungsmodus-flat-shading-gl_flat">Schattierungsmodus: Flat Shading (<code>GL_FLAT</code>)</h3>
<div class="columns">
<div class="two">
<p>Wie werden die berechneten Phong-Farben über ein Polygon gefüllt?</p>
<ul>

<h3 id="schattierungsmodus-smooth-shading-gl_smooth">Schattierungsmodus: Smooth Shading (<code>GL_SMOOTH</code>)</h3>
<div class="columns">
<div class="two">

<header>Kapitel 5 (Anhang): OpenGL-Details, Phong-Mathematik &amp; Projektion</header>
<h3 id="visuelle-referenz-der-opengl-primitive-deep-dive">Visuelle Referenz der OpenGL-Primitive <em>(Deep Dive)</em></h3>
<div class="columns">
<div class="two">
<p>Zwischen <code>gl.Begin(mode)</code> und <code>gl.End()</code> übergeben wir Vertices (<code>gl.Vertex</code>), Normalen (<code>gl.Normal</code>) und Farbe (<code>gl.Color</code>):</p>
<ul>
<li><strong><code>GL_LINES</code> / <code>GL_LINE_STRIP</code>:</strong> <code>DrawFloorGrid</code> &amp; <code>DrawAxes</code> nutzen <code>GL_LINES</code>; Werkzeugbahnen nutzen <code>GL_LINE_STRIP</code>.</li>

<h3 id="getlocalmatrix--getworldmatrix-deep-dive-%E2%80%93-fertig-in-der-vorlage"><code>GetLocalMatrix</code> &amp; <code>GetWorldMatrix</code> <em>(Deep Dive – fertig in der Vorlage)</em></h3>
<p>Für <code>GetWorldPosition()</code> berechnet <code>SceneNode</code> seine <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="5.028ex" height="1.532ex" role="img" focusable="false" viewBox="0 -677 2222.4 677"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g><g data-mml-node="mo" transform="translate(722.2,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z"></path></g><g data-mml-node="mn" transform="translate(1722.4,0)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></svg></mjx-container>-Weltmatrix auf der CPU (bereits fertig in <code>SceneNode.cs</code> implementiert):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-function"><span class="hljs-keyword">public</span> Matrix4x4 <span class="hljs-title">GetLocalMatrix</span>()</span>
{
    <span class="hljs-keyword">var</span> t  = Matrix4x4.CreateTranslation(Tx, Ty, Tz);
    <span class="hljs-keyword">var</span> rx = Matrix4x4.CreateRotationX(Rx * MathF.PI / <span class="hljs-number">180.0f</span>);
    <span class="hljs-keyword">var</span> ry = Matrix4x4.CreateRotationY(Ry * MathF.PI / <span class="hljs-number">180.0f</span>);
    <span class="hljs-keyword">var</span> rz = Matrix4x4.CreateRotationZ(Rz * MathF.PI / <span class="hljs-number">180.0f</span>);
    <span class="hljs-keyword">var</span> s  = Matrix4x4.CreateScale(Sx, Sy, Sz);
    <span class="hljs-keyword">return</span> s * (rz * rx * ry) * t; <span class="hljs-comment">// Zeilenvektor-Konvention: Scale -&gt; Rotate -&gt; Translate</span>
}

<span class="hljs-function"><span class="hljs-keyword">public</span> Matrix4x4 <span class="hljs-title">GetWorldMatrix</span>()</span>
    =&gt; Parent == <span class="hljs-literal">null</span> ? GetLocalMatrix() : GetLocalMatrix() * Parent.GetWorldMatrix();
</code></pre>

<h3 id="der-c-code-gelenk-update--tcp-deckungspr%C3%BCfung">Der C#-Code: Gelenk-Update &amp; TCP-Deckungsprüfung</h3>
<p>Bewegt man einen Slider (<code>_theta1Deg</code>, <code>_theta2Deg</code>, <code>_d3</code>), aktualisiert <code>UpdateJointTransforms()</code> die lokalen Knoten-Properties und <code>CalculateAnalyticTcp()</code> rechnet über <code>t1</code> und <code>t12</code> die analytische Sollposition aus:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-function"><span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title">UpdateJointTransforms</span>()</span>
{
    _arm1Node.Ty   = HBase;
    _arm1Node.Ry   = _theta1Deg;
    _arm2Node.Tx   = L1;
    _arm2Node.Ry   = _theta2Deg;
    _pinoleNode.Tx = L2;
    _pinoleNode.Ty = -_d3;
}

<span class="hljs-keyword">private</span> (<span class="hljs-built_in">float</span> X, <span class="hljs-built_in">float</span> Y, <span class="hljs-built_in">float</span> Z) CalculateAnalyticTcp()
{
    <span class="hljs-built_in">float</span> t1  = _theta1Deg * MathF.PI / <span class="hljs-number">180.0f</span>;
    <span class="hljs-built_in">float</span> t12 = (_theta1Deg + _theta2Deg) * MathF.PI / <span class="hljs-number">180.0f</span>;
    <span class="hljs-keyword">return</span> (L1 * MathF.Cos(t1) + L2 * MathF.Cos(t12), HBase - _d3, -(L1 * MathF.Sin(t1) + L2 * MathF.Sin(t12)));
}

<h3 id="der-c-code-zur-maus-interaktion-mainwindowxamlcs">Der C#-Code zur Maus-Interaktion (<code>MainWindow.xaml.cs</code>)</h3>
<p>Über <code>_isDragging</code>, <code>_lastMousePos</code>, <code>currentPos</code>, <code>dx</code> und <code>dy</code> werden Orbit und Panning gesteuert:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-function"><span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title">OpenGlView_MouseDown</span>(<span class="hljs-params"><span class="hljs-built_in">object</span> sender, MouseButtonEventArgs e</span>)</span>
{
    <span class="hljs-keyword">if</span> (e.LeftButton == MouseButtonState.Pressed || e.RightButton == MouseButtonState.Pressed)
    {
        _isDragging = <span class="hljs-literal">true</span>;
        _lastMousePos = e.GetPosition(OpenGlView);
        OpenGlView.CaptureMouse(); <span class="hljs-comment">// Mausfang auch über den Fensterrand hinaus!</span>
    }
}
<span class="hljs-function"><span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title">OpenGlView_MouseMove</span>(<span class="hljs-params"><span class="hljs-built_in">object</span> sender, MouseButtonEventArgs e</span>)</span>
{
    <span class="hljs-keyword">if</span> (!_isDragging) <span class="hljs-keyword">return</span>;
    Point currentPos = e.GetPosition(OpenGlView);
    <span class="hljs-built_in">double</span> dx = currentPos.X - _lastMousePos.X;
    <span class="hljs-built_in">double</span> dy = currentPos.Y - _lastMousePos.Y;
    <span class="hljs-keyword">if</span> (e.LeftButton == MouseButtonState.Pressed)       _camera.Rotate(-dx * <span class="hljs-number">0.4</span>, dy * <span class="hljs-number">0.4</span>);
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (e.RightButton == MouseButtonState.Pressed) _camera.Pan(dx * <span class="hljs-number">0.01</span>, dy * <span class="hljs-number">0.01</span>);
    _lastMousePos = currentPos;
}
