<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 12.8px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <radialGradient id="grad-phong" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#93c5fd" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
  </defs>

  <text x="240" y="34" class="hdr sem-primary-text">OpenGL-Superposition: Szenen-Ambient &amp; Lichtquellen</text>

  <!-- Box 1: Globales Szenen-Ambient -->
  <rect class="sem-success" x="-25" y="52" width="186" height="82" rx="8" stroke-width="2" />
  <text x="68" y="75" class="code sem-success-text">GL_LIGHT_MODEL_AMBIENT</text>
  <text x="68" y="98" class="code sem-neutral-text">I_a = k_a · I_La</text>
  <text x="68" y="120" class="sub sem-success-text">1x Grundlicht der Szene</text>

  <!-- Box 2: GL_LIGHT0 -->
  <rect class="sem-warning" x="171" y="52" width="160" height="82" rx="8" stroke-width="2" />
  <text x="251" y="75" class="code sem-warning-text">GL_LIGHT0 (i = 1)</text>
  <text x="251" y="98" class="code sem-neutral-text">I_d,1 + I_s,1</text>
  <text x="251" y="120" class="sub sem-warning-text">Hauptlicht links</text>

  <!-- Box 3: GL_LIGHT1 -->
  <rect class="sem-primary" x="341" y="52" width="164" height="82" rx="8" stroke-width="2" />
  <text x="423" y="75" class="code sem-primary-text">GL_LIGHT1 (i = 2)</text>
  <text x="423" y="98" class="code sem-neutral-text">I_d,2 + I_s,2</text>
  <text x="423" y="120" class="sub sem-primary-text">Spotlight rechts</text>

  <!-- Pfeile auf das 3D-Objekt -->
  <line class="sem-success-stroke" x1="98" y1="134" x2="198" y2="195" stroke-width="2.6" stroke-dasharray="5,3" marker-end="url(#arr-green)" />
  <line class="sem-warning-stroke" x1="248" y1="134" x2="242" y2="173" stroke-width="3" marker-end="url(#arr-amber)" />
  <line class="sem-primary-stroke" x1="388" y1="134" x2="282" y2="195" stroke-width="3" marker-end="url(#arr-blue)" />

  <circle class="sem-primary-stroke" cx="240" cy="226" r="46" fill="url(#grad-phong)" stroke-width="2.5" />
  <circle class="sem-warning" cx="222" cy="206" r="8.5" opacity="0.9"  stroke="none"/>
  <circle class="sem-primary" cx="261" cy="213" r="6" opacity="0.9"  stroke="none"/>

  <!-- Formelbox unten -->
  <rect class="sem-success-stroke" x="-20" y="286" width="520" height="72" rx="8" fill="#ffffff" stroke-width="2" />
  <text x="240" y="313" class="math sem-neutral-text">I_f = I_a + sum( I_d,i + I_s,i )   für i = 1 .. n</text>
  <text x="240" y="341" class="sub sem-success-text">I_a global via LightModel; pro Licht GL_AMBIENT auf Standard 0 belassen!</text>
</svg>
