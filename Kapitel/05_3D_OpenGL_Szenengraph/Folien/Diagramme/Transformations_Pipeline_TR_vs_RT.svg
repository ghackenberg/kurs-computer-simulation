<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect x="-35" y="8" width="550" height="364" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="240" y="36" class="hdr" fill="#1e40af">Nicht-Kommutativität in M_model: T · R != R · T</text>

  <!-- Oben: Warum 4x4 statt 3x3? -->
  <rect x="-20" y="50" width="520" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="240" y="73" class="code" fill="#1d4ed8">Homogene 4x4-Koordinaten: v = (x, y, z, 1)^T</text>
  <text x="240" y="96" class="sub" fill="#334155">Eine 3x3-Matrix bildet 0 immer auf 0 ab &#8594; erst 4x4 vereint Translation T und Rotation R!</text>

  <!-- Unten links: T * R (Richtig im Szenengraph) -->
  <rect x="-20" y="122" width="250" height="238" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="105" y="146" class="code" fill="#15803d">1. T · R: Translate &#8594; Rotate</text>
  <text x="105" y="166" class="sub" fill="#166534">(Szenengraph: Drehung im Gelenk!)</text>

  <circle cx="25" cy="260" r="5" fill="#475569" />
  <text x="30" y="282" class="code" fill="#475569">(0,0)</text>
  <line x1="25" y1="260" x2="130" y2="260" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />
  <text x="78" y="246" class="code" fill="#1d4ed8">1. T(L1)</text>

  <circle cx="135" cy="260" r="6" fill="#16a34a" />
  <line x1="135" y1="260" x2="205" y2="195" stroke="#16a34a" stroke-width="6" stroke-linecap="round" />
  <path d="M 175 260 A 40 40 0 0 0 164 232" fill="none" stroke="#d97706" stroke-width="2.5" />
  <text x="198" y="252" class="code" fill="#b45309">2. R</text>
  <text x="105" y="318" class="sub" fill="#15803d">Gelenk bleibt fest bei (L1, 0),</text>
  <text x="105" y="338" class="sub" fill="#15803d">Arm dreht vor Ort &#10003;</text>

  <!-- Unten rechts: R * T (Falsch herum!) -->
  <rect x="250" y="122" width="250" height="238" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text x="375" y="146" class="code" fill="#991b1b">2. R · T: Rotate &#8594; Translate</text>
  <text x="375" y="166" class="sub" fill="#991b1b">(Bauteil kreist um Ursprung!)</text>

  <circle cx="295" cy="275" r="5" fill="#475569" />
  <text x="300" y="296" class="code" fill="#475569">(0,0)</text>
  <path d="M 410 275 A 115 115 0 0 0 380 195" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
  <line x1="295" y1="275" x2="380" y2="195" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="318" y="220" class="code" fill="#991b1b">2. T(L1)</text>
  <line x1="380" y1="195" x2="420" y2="195" stroke="#ef4444" stroke-width="7" stroke-linecap="round" />
  <text x="375" y="318" class="sub" fill="#991b1b">Translation läuft entlang der</text>
  <text x="375" y="338" class="sub" fill="#991b1b">bereits gedrehten Achse!</text>
</svg>
