<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="-35" y="8" width="550" height="364" rx="12" stroke-width="2" />
  <text x="240" y="36" class="hdr sem-primary-text">Nicht-Kommutativität in M_model: T · R != R · T</text>

  <!-- Oben: Warum 4x4 statt 3x3? -->
  <rect class="sem-primary" x="-20" y="50" width="520" height="58" rx="8" stroke-width="1.8" />
  <text x="240" y="73" class="code sem-primary-text">Homogene 4x4-Koordinaten: v = (x, y, z, 1)^T</text>
  <text x="240" y="96" class="sub sem-neutral-text">Eine 3x3-Matrix bildet 0 immer auf 0 ab &#8594; erst 4x4 vereint Translation T und Rotation R!</text>

  <!-- Unten links: T * R (Richtig im Szenengraph) -->
  <rect class="sem-success" x="-20" y="122" width="250" height="238" rx="8" stroke-width="2" />
  <text x="105" y="146" class="code sem-success-text">1. T · R: Translate &#8594; Rotate</text>
  <text x="105" y="166" class="sub sem-success-text">(Szenengraph: Drehung im Gelenk!)</text>

  <circle class="sem-muted-fill" cx="25" cy="260" r="5" />
  <text x="30" y="282" class="code sem-muted-text">(0,0)</text>
  <line class="sem-primary-stroke" x1="25" y1="260" x2="130" y2="260" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />
  <text x="78" y="246" class="code sem-primary-text">1. T(L1)</text>

  <circle class="sem-success-fill" cx="135" cy="260" r="6" />
  <line class="sem-success-stroke" x1="135" y1="260" x2="205" y2="195" stroke-width="6" stroke-linecap="round" />
  <path class="sem-warning-stroke" d="M 175 260 A 40 40 0 0 0 164 232" fill="none" stroke-width="2.5" />
  <text x="198" y="252" class="code sem-warning-text">2. R</text>
  <text x="105" y="318" class="sub sem-success-text">Gelenk bleibt fest bei (L1, 0),</text>
  <text x="105" y="338" class="sub sem-success-text">Arm dreht vor Ort &#10003;</text>

  <!-- Unten rechts: R * T (Falsch herum!) -->
  <rect class="sem-danger" x="250" y="122" width="250" height="238" rx="8" stroke-width="2" />
  <text x="375" y="146" class="code sem-danger-text">2. R · T: Rotate &#8594; Translate</text>
  <text x="375" y="166" class="sub sem-danger-text">(Bauteil kreist um Ursprung!)</text>

  <line class="sem-muted-stroke" x1="295" y1="275" x2="395" y2="275" stroke-width="1.8" stroke-dasharray="4,3" />
  <circle class="sem-muted-fill" cx="295" cy="275" r="5" />
  <text x="295" y="297" class="code sem-muted-text">(0,0)</text>
  <path class="sem-warning-stroke" d="M 333 275 A 38 38 0 0 0 325.7 252.6" fill="none" stroke-width="2.5" />
  <text x="358" y="264" class="code sem-warning-text">1. R</text>
  <path class="sem-danger-stroke" d="M 390.2 275 A 95.2 95.2 0 0 0 372 219" fill="none" stroke-width="2" stroke-dasharray="4,3" />
  <line class="sem-danger-stroke" x1="295" y1="275" x2="367" y2="222.6" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="308" y="226" class="code sem-danger-text">2. T(L1)</text>
  <circle class="sem-danger-fill" cx="372" cy="219" r="5.5" />
  <line class="sem-danger-stroke" x1="372" y1="219" x2="416" y2="187" stroke-width="6.5" stroke-linecap="round" />
  <text x="375" y="318" class="sub sem-danger-text">Translation &amp; Arm folgen der</text>
  <text x="375" y="338" class="sub sem-danger-text">bereits gedrehten Achse!</text>
</svg>
