<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-muted-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="-35" y="8" width="550" height="364" rx="12" stroke-width="2" />
  <text x="240" y="33" class="hdr sem-primary-text">Analytische Lösung in der XZ-Draufsicht (+Y zum Auge)</text>

  <!-- XZ-Achsenkreuz mit Ursprung S = (65, 246) -->
  <line class="sem-muted-stroke" x1="20" y1="246" x2="462" y2="246" stroke-width="2" marker-end="url(#arr-slate)" />
  <line class="sem-primary-stroke" x1="65" y1="246" x2="65" y2="56" stroke-width="2" marker-end="url(#arr-blue)" />
  <line class="sem-danger-stroke" x1="65" y1="246" x2="65" y2="296" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-red)" />

  <text x="485" y="251" class="code sem-muted-text">+X</text>
  <text x="132" y="58" class="code sem-primary-text">-Z (hinten)</text>
  <text x="128" y="296" class="code sem-danger-text">+Z (vorn)</text>

  <!-- Hilfslinien am Ellenbogen E = (210, 174): +X-Parallele & L1-Verlängerung -->
  <line class="sem-muted-stroke" x1="210" y1="174" x2="346" y2="174" stroke-width="1.8" stroke-dasharray="5,4" />
  <line class="sem-primary-stroke" x1="210" y1="174" x2="262" y2="148" stroke-width="2" stroke-dasharray="5,4" />

  <!-- Arm 1 (L1) von S=(65, 246) nach E=(210, 174) -->
  <line class="sem-primary-stroke" x1="65" y1="246" x2="210" y2="174" stroke-width="11" stroke-linecap="round" />
  <!-- Arm 2 (L2) von E=(210, 174) nach P=(276, 60) -->
  <line class="sem-success-stroke" x1="210" y1="174" x2="276" y2="60" stroke-width="10" stroke-linecap="round" />

  <!-- Gelenke + +Y Punkt-Symbol im Ursprung -->
  <circle class="sem-primary-fill" cx="65" cy="246" r="12" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="65" cy="246" r="3.5" fill="#ffffff" />
  <circle class="sem-success-fill" cx="210" cy="174" r="10.5" stroke="#ffffff" stroke-width="2.2" />
  <circle class="sem-warning-stroke sem-warning-fill" cx="276" cy="60" r="10.5" stroke-width="2.4" />

  <!-- 1. Winkelbogen theta_1 an der Schulter (r = 56) -->
  <path class="sem-primary-stroke" d="M 121 246 A 56 56 0 0 0 115 221" fill="none" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="166" y="236" class="code sem-primary-text">theta_1</text>

  <!-- 2. Relativwinkel theta_2 am Ellenbogen (r = 44, zwischen L1-Verlängerung und L2) -->
  <path class="sem-success-stroke" d="M 249 154 A 44 44 0 0 0 232 136" fill="none" stroke-width="2.4" marker-end="url(#arr-green)" />
  <text x="274" y="131" class="code sem-success-text">theta_2</text>

  <!-- 3. Gesamtwinkel theta_1 + theta_2 am Ellenbogen (r = 114, von +X-Parallele bis L2) -->
  <path class="sem-warning-stroke" d="M 324 174 A 114 114 0 0 0 267 75" fill="none" stroke-width="2.5" marker-end="url(#arr-amber)" />
  <text x="414" y="128" class="code sem-warning-text">theta_1 + theta_2</text>

  <!-- Arm- und TCP-Beschriftungen -->
  <text x="30" y="226" class="code sem-primary-text">+Y</text>
  <text x="128" y="192" class="code sem-primary-text">L1</text>
  <text x="212" y="110" class="code sem-success-text">L2</text>
  <text x="358" y="64" class="code sem-warning-text">TCP (x, y, z)</text>

  <!-- Unten: Vorzeichen-Aha & Deckungstest -->
  <rect class="sem-success" x="-25" y="310" width="530" height="52" rx="8" stroke-width="1.8" />
  <text x="240" y="331" class="code sem-success-text">+theta_1, +theta_2 drehen in -Z &#8594; Minus bei z  |  y = HBase - d_3</text>
  <text x="240" y="352" class="sub sem-neutral-text">CalculateAnalyticTcp == GetWorldPosition (M_TCP): 0.000 mm Abweichung!</text>
</svg>
