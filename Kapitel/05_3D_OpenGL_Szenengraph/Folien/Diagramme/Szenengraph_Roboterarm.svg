<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="-35" y="8" width="550" height="364" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="240" y="33" class="hdr" fill="#1e40af">Analytische Lösung in der XZ-Draufsicht (+Y zum Auge)</text>

  <!-- XZ-Achsenkreuz mit Ursprung S = (65, 246) -->
  <line x1="20" y1="246" x2="462" y2="246" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr-slate)" />
  <line x1="65" y1="246" x2="65" y2="56" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <line x1="65" y1="246" x2="65" y2="296" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-red)" />

  <text x="485" y="251" class="code" fill="#475569">+X</text>
  <text x="132" y="58" class="code" fill="#1d4ed8">-Z (hinten)</text>
  <text x="128" y="296" class="code" fill="#dc2626">+Z (vorn)</text>

  <!-- Hilfslinien am Ellenbogen E = (210, 174): +X-Parallele & L1-Verlängerung -->
  <line x1="210" y1="174" x2="346" y2="174" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" />
  <line x1="210" y1="174" x2="262" y2="148" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,4" />

  <!-- Arm 1 (L1) von S=(65, 246) nach E=(210, 174) -->
  <line x1="65" y1="246" x2="210" y2="174" stroke="#2563eb" stroke-width="11" stroke-linecap="round" />
  <!-- Arm 2 (L2) von E=(210, 174) nach P=(276, 60) -->
  <line x1="210" y1="174" x2="276" y2="60" stroke="#16a34a" stroke-width="10" stroke-linecap="round" />

  <!-- Gelenke + +Y Punkt-Symbol im Ursprung -->
  <circle cx="65" cy="246" r="12" fill="#1e40af" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="65" cy="246" r="3.5" fill="#ffffff" />
  <circle cx="210" cy="174" r="10.5" fill="#15803d" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="276" cy="60" r="10.5" fill="#facc15" stroke="#b45309" stroke-width="2.4" />

  <!-- 1. Winkelbogen theta_1 an der Schulter (r = 56) -->
  <path d="M 121 246 A 56 56 0 0 0 115 221" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="166" y="236" class="code" fill="#1d4ed8">theta_1</text>

  <!-- 2. Relativwinkel theta_2 am Ellenbogen (r = 44, zwischen L1-Verlängerung und L2) -->
  <path d="M 249 154 A 44 44 0 0 0 232 136" fill="none" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arr-green)" />
  <text x="274" y="131" class="code" fill="#15803d">theta_2</text>

  <!-- 3. Gesamtwinkel theta_1 + theta_2 am Ellenbogen (r = 114, von +X-Parallele bis L2) -->
  <path d="M 324 174 A 114 114 0 0 0 267 75" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-amber)" />
  <text x="414" y="128" class="code" fill="#b45309">theta_1 + theta_2</text>

  <!-- Arm- und TCP-Beschriftungen -->
  <text x="30" y="226" class="code" fill="#1e40af">+Y</text>
  <text x="128" y="192" class="code" fill="#1d4ed8">L1</text>
  <text x="212" y="110" class="code" fill="#15803d">L2</text>
  <text x="358" y="64" class="code" fill="#92400e">TCP (x, y, z)</text>

  <!-- Unten: Vorzeichen-Aha & Deckungstest -->
  <rect x="-25" y="310" width="530" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
  <text x="240" y="331" class="code" fill="#15803d">+theta_1, +theta_2 drehen in -Z &#8594; Minus bei z  |  y = HBase - d_3</text>
  <text x="240" y="352" class="sub" fill="#334155">CalculateAnalyticTcp == GetWorldPosition (M_TCP): 0.000 mm Abweichung!</text>
</svg>
