<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="-35" y="8" width="550" height="364" rx="12" stroke-width="2" />
  <text x="240" y="34" class="hdr sem-primary-text">Euler-Winkel (Rx, Ry, Rz) im rechtshändigen 3D-Raum</text>

  <!-- Rechte-Hand-Regel Hinweis-Box oben rechts (Breite 212 px) -->
  <rect class="sem-muted-stroke" x="290" y="48" width="212" height="54" rx="8" fill="#ffffff" stroke-width="1.6" />
  <text x="396" y="70" class="code sem-neutral-text">Rechte-Hand-Regel</text>
  <text x="396" y="90" class="sub sem-muted-text">Daumen in +Achse &#8594; +Winkel</text>

  <!-- Zentraler 3D-Körper (Greifer-/Flanschquader im Ursprung (235, 184)) -->
  <polygon class="sem-muted" points="235,156 273,174 235,192 197,174" stroke-width="1.8" />
  <polygon class="sem-card-fill sem-muted-stroke" points="197,174 235,192 235,216 197,198" stroke-width="1.8" />
  <polygon class="sem-muted-fill sem-muted-stroke" points="273,174 235,192 235,216 273,198" stroke-width="1.8" />

  <!-- 1. +Y-Achse (Grün, vertikal nach oben) + Yaw Ry -->
  <line class="sem-success-stroke" x1="235" y1="184" x2="235" y2="62" stroke-width="3.2" marker-end="url(#arr-green)" />
  <text x="255" y="64" class="code sem-success-text">+Y</text>
  <path class="sem-success-stroke" d="M 196 98 A 42 15 0 1 0 274 98" fill="none" stroke-width="2.8" marker-end="url(#arr-green)" />
  <rect class="sem-success" x="-20" y="64" width="194" height="50" rx="7" stroke-width="1.8" />
  <text x="77" y="85" class="code sem-success-text">1. Ry (Yaw / Gieren)</text>
  <text x="77" y="104" class="sub sem-success-text">Schwenken links / rechts</text>

  <!-- 2. +X-Achse (Rot, schräg rechts-vorn) + Pitch Rx -->
  <line class="sem-danger-stroke" x1="235" y1="184" x2="395" y2="246" stroke-width="3.2" marker-end="url(#arr-red)" />
  <text x="415" y="254" class="code sem-danger-text">+X</text>
  <path class="sem-danger-stroke" d="M 332 246 A 18 36 -20 1 0 356 198" fill="none" stroke-width="2.8" marker-end="url(#arr-red)" />
  <rect class="sem-danger" x="314" y="132" width="188" height="50" rx="7" stroke-width="1.8" />
  <text x="408" y="153" class="code sem-danger-text">2. Rx (Pitch / Nicken)</text>
  <text x="408" y="172" class="sub sem-danger-text">Heben / Senken</text>

  <!-- 3. +Z-Achse (Blau, schräg links-vorn zum Betrachter) + Roll Rz -->
  <line class="sem-primary-stroke" x1="235" y1="184" x2="75" y2="246" stroke-width="3.2" marker-end="url(#arr-blue)" />
  <text x="52" y="254" class="code sem-primary-text">+Z</text>
  <path class="sem-primary-stroke" d="M 114 198 A 18 36 20 1 0 138 246" fill="none" stroke-width="2.8" marker-end="url(#arr-blue)" />
  <rect class="sem-primary" x="-20" y="132" width="188" height="50" rx="7" stroke-width="1.8" />
  <text x="74" y="153" class="code sem-primary-text">3. Rz (Roll / Rollen)</text>
  <text x="74" y="172" class="sub sem-primary-text">Seitliches Kippen</text>

  <!-- Unten: Verkettung in SceneNode & Gimbal-Lock-Warnung -->
  <rect class="sem-warning" x="-20" y="282" width="520" height="76" rx="8" stroke-width="2" />
  <text x="240" y="308" class="code sem-warning-text">SceneNode:  R = R_y(Ry) · R_x(Rx) · R_z(Rz)   (Reihenfolge Y &#8594; X &#8594; Z)</text>
  <text x="240" y="336" class="sub sem-warning-text">Folgeachsen drehen mit &#8594; bei Rx von &#177;90&#176; fluchten Y &amp; Z (Gimbal Lock!)</text>
</svg>
