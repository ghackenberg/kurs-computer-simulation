<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="-35" y="8" width="550" height="364" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="240" y="34" class="hdr" fill="#1e40af">3D-Rotation des Normalenvektors um den Winkel theta (XZ-Ebene)</text>
  <text x="240" y="54" class="sub" fill="#475569">Draufsicht von +Y (rechtshändig: +X rechts, +Z zum Betrachter)</text>

  <!-- Zylindermantel-Querschnitt um Ursprung (210, 168), Radius 84 -->
  <circle cx="210" cy="168" r="84" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />

  <!-- Rechtshändige OpenGL-XZ-Achsen (Blick von +Y oben: +X rechts, +Z nach unten) -->
  <line x1="60" y1="168" x2="425" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)" />
  <text x="448" y="173" class="code" fill="#475569">+X</text>

  <line x1="210" y1="68" x2="210" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)" />
  <text x="236" y="74" class="code" fill="#64748b">-Z</text>
  <text x="236" y="290" class="code" fill="#475569">+Z</text>

  <circle cx="210" cy="168" r="4" fill="#475569" />

  <!-- Winkel theta = 40° ab +X in Richtung +Z: Quadrant (+X, +Z) rechts unten -->
  <path d="M 248 168 A 38 38 0 0 1 239 192" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-amber)" />
  <text x="255" y="187" class="code" style="text-anchor: start;" fill="#b45309">theta</text>

  <line x1="210" y1="168" x2="274" y2="222" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" />
  <line x1="274" y1="222" x2="331" y2="270" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arr-green)" />
  <circle cx="274" cy="222" r="4" fill="#2563eb" />
  <text x="372" y="275" class="code" fill="#15803d">P_theta</text>

  <rect x="-20" y="308" width="520" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" />
  <text x="240" y="336" class="code" fill="#0f172a">P_x = h * cos(theta)  |  P_y = r_1 - r_2  |  P_z = h * sin(theta)</text>
</svg>
