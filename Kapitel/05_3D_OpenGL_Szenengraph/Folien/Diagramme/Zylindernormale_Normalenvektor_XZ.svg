<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-muted-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="-35" y="8" width="550" height="364" rx="12" stroke-width="2" />
  <text x="240" y="34" class="hdr sem-primary-text">3D-Rotation des Normalenvektors um den Winkel theta (XZ-Ebene)</text>
  <text x="240" y="54" class="sub sem-muted-text">Draufsicht von +Y (rechtshändig: +X rechts, +Z zum Betrachter)</text>

  <!-- Zylindermantel-Querschnitt um Ursprung (210, 168), Radius 84 -->
  <circle class="sem-primary" cx="210" cy="168" r="84" stroke-width="2" />

  <!-- Rechtshändige OpenGL-XZ-Achsen (Blick von +Y oben: +X rechts, +Z nach unten) -->
  <line class="sem-muted-stroke" x1="60" y1="168" x2="425" y2="168" stroke-width="2" marker-end="url(#arr-slate)" />
  <text x="448" y="173" class="code sem-muted-text">+X</text>

  <line class="sem-muted-stroke" x1="210" y1="68" x2="210" y2="290" stroke-width="2" marker-end="url(#arr-slate)" />
  <text x="236" y="74" class="code sem-muted-text">-Z</text>
  <text x="236" y="290" class="code sem-muted-text">+Z</text>

  <circle class="sem-muted-fill" cx="210" cy="168" r="4" />

  <!-- Winkel theta = 40° ab +X in Richtung +Z: Quadrant (+X, +Z) rechts unten -->
  <path class="sem-warning-stroke" d="M 248 168 A 38 38 0 0 1 239 192" fill="none" stroke-width="2.5" marker-end="url(#arr-amber)" />
  <text x="255" y="187" class="code sem-warning-text" style="text-anchor: start;">theta</text>

  <line class="sem-muted-stroke" x1="210" y1="168" x2="274" y2="222" stroke-width="2" stroke-dasharray="4,3" />
  <line class="sem-success-stroke" x1="274" y1="222" x2="331" y2="270" stroke-width="3.5" marker-end="url(#arr-green)" />
  <circle class="sem-primary-fill" cx="274" cy="222" r="4" />
  <text x="372" y="275" class="code sem-success-text">P_theta</text>

  <rect class="sem-success-stroke" x="-20" y="308" width="520" height="46" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="240" y="336" class="code sem-neutral-text">P_x = h * cos(theta)  |  P_y = r_1 - r_2  |  P_z = h * sin(theta)</text>
</svg>
