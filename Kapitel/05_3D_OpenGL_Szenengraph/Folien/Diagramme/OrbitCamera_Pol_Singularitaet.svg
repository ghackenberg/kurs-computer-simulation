<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="-35" y="8" width="550" height="364" rx="12" stroke-width="2" />
  <text x="240" y="33" class="hdr sem-primary-text">Horizont-Ausrichtung in gl.LookAt: Kreuzprodukt s = f × e_up</text>

  <!-- ====================================================================== -->
  <!-- LINKS: Normalfall (schräger Blick, |phi| <= 85°)                       -->
  <!-- ====================================================================== -->
  <rect class="sem-success" x="-24" y="48" width="256" height="248" rx="8" stroke-width="1.8" />
  <text x="104" y="70" class="code sem-success-text">OK: phi = 40° (schräg)</text>

  <!-- Horizontale Referenz & Ziel p_look bei (38, 232) -->
  <line class="sem-muted-stroke" x1="18" y1="232" x2="124" y2="232" stroke-width="1.8" stroke-dasharray="4,3" />
  <circle class="sem-danger-fill" cx="38" cy="232" r="6" />
  <text x="38" y="256" class="code sem-danger-text">p_look</text>

  <!-- Elevationsbogen phi -->
  <path class="sem-success-stroke" d="M 78 232 A 40 40 0 0 0 68 206" fill="none" stroke-width="2.2" />
  <text x="98" y="220" class="code sem-success-text">phi</text>

  <!-- Kamera p_eye bei (120, 162): f nach links-unten, e_up nach oben -> s = f x e_up nach rechts-oben in die Bildebene (-Z) -->
  <line class="sem-primary-stroke" x1="113" y1="168" x2="47" y2="224" stroke-width="2.8" marker-end="url(#arr-blue)" />
  <line class="sem-success-stroke" x1="120" y1="152" x2="120" y2="94" stroke-width="2.6" marker-end="url(#arr-green)" />
  <line class="sem-warning-stroke" x1="128" y1="157" x2="186" y2="125" stroke-width="2.8" marker-end="url(#arr-amber)" />
  <circle class="sem-primary-fill" cx="120" cy="162" r="8.5" stroke="#ffffff" stroke-width="2" />

  <text x="70" y="152" class="code sem-primary-text">p_eye</text>
  <text x="64" y="190" class="code sem-primary-text">f</text>
  <text x="88" y="106" class="code sem-success-text">e_up</text>
  <text x="176" y="110" class="code sem-warning-text">s (Rechts)</text>

  <text x="104" y="281" class="code sem-success-text">s = f × e_up != 0 (klar!)</text>

  <!-- ====================================================================== -->
  <!-- RECHTS: Pol-Singularität (phi = +90° senkrecht über p_look)            -->
  <!-- ====================================================================== -->
  <rect class="sem-danger" x="248" y="48" width="256" height="248" rx="8" stroke-width="1.8" />
  <text x="376" y="70" class="code sem-danger-text">Falle: phi = 90° (Nordpol)</text>

  <!-- Ziel p_look bei (344, 232) & Kamera p_eye exakt senkrecht darüber bei (344, 150) -->
  <circle class="sem-danger-fill" cx="344" cy="232" r="6" />
  <text x="296" y="236" class="code sem-danger-text">p_look</text>

  <!-- e_up nach oben und f exakt auf derselben Linie nach unten! -->
  <line class="sem-success-stroke" x1="344" y1="139" x2="344" y2="88" stroke-width="2.6" marker-end="url(#arr-green)" />
  <line class="sem-primary-stroke" x1="344" y1="161" x2="344" y2="218" stroke-width="2.8" marker-end="url(#arr-blue)" />
  <line class="sem-danger-stroke" x1="356" y1="150" x2="394" y2="150" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-red)" />
  <circle class="sem-danger-fill" cx="344" cy="150" r="8.5" stroke="#ffffff" stroke-width="2" />

  <text x="296" y="154" class="code sem-danger-text">p_eye</text>
  <text x="426" y="108" class="code sem-success-text">e_up (0,+1,0)</text>
  <text x="430" y="155" class="code sem-danger-text">s = ?</text>
  <text x="422" y="198" class="code sem-primary-text">f (0,-1,0)</text>

  <text x="376" y="281" class="code sem-danger-text">s = f × e_up = 0 (Kollaps!)</text>

  <!-- ====================================================================== -->
  <!-- UNTEN: Lösung durch Winkel-Clamping                                    -->
  <!-- ====================================================================== -->
  <rect class="sem-primary-stroke" x="-24" y="308" width="528" height="52" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="240" y="330" class="code sem-primary-text">Lösung: Math.Clamp(phi, -85°, +85°) sperrt 5°-Polkappe</text>
  <text x="240" y="350" class="sub sem-neutral-text">Blickstrahl f bleibt immer gegen e_up geneigt &#8594; kein 180°-Bildsprung!</text>
</svg>
