<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect x="-35" y="8" width="550" height="364" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="240" y="33" class="hdr" fill="#1e40af">Horizont-Ausrichtung in gl.LookAt: Kreuzprodukt s = f × e_up</text>

  <!-- ====================================================================== -->
  <!-- LINKS: Normalfall (schräger Blick, |phi| <= 85°)                       -->
  <!-- ====================================================================== -->
  <rect x="-24" y="48" width="256" height="248" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
  <text x="104" y="70" class="code" fill="#15803d">OK: phi = 40° (schräg)</text>

  <!-- Horizontale Referenz & Ziel p_look bei (38, 228) -->
  <line x1="18" y1="228" x2="128" y2="228" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4,3" />
  <circle cx="38" cy="228" r="6" fill="#dc2626" />
  <text x="38" y="252" class="code" fill="#991b1b">p_look</text>

  <!-- Elevationsbogen phi -->
  <path d="M 78 228 A 40 40 0 0 0 69 203" fill="none" stroke="#16a34a" stroke-width="2.2" />
  <text x="102" y="216" class="code" fill="#15803d">phi</text>

  <!-- Kamera p_eye bei (130, 148) -->
  <line x1="123" y1="154" x2="47" y2="220" stroke="#2563eb" stroke-width="2.8" marker-end="url(#arr-blue)" />
  <line x1="130" y1="138" x2="130" y2="88" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-green)" />
  <line x1="138" y1="152" x2="194" y2="184" stroke="#d97706" stroke-width="2.8" marker-end="url(#arr-amber)" />
  <circle cx="130" cy="148" r="8.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

  <text x="80" y="132" class="code" fill="#1e40af">p_eye</text>
  <text x="66" y="178" class="code" fill="#1d4ed8">f</text>
  <text x="170" y="106" class="code" fill="#15803d">e_up</text>
  <text x="174" y="210" class="code" fill="#b45309">s (Rechts)</text>

  <text x="104" y="281" class="code" fill="#15803d">s = f × e_up != 0 (klar!)</text>

  <!-- ====================================================================== -->
  <!-- RECHTS: Pol-Singularität (phi = +90° senkrecht über p_look)            -->
  <!-- ====================================================================== -->
  <rect x="248" y="48" width="256" height="248" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
  <text x="376" y="70" class="code" fill="#991b1b">Falle: phi = 90° (Nordpol)</text>

  <!-- Ziel p_look bei (344, 232) & Kamera p_eye exakt senkrecht darüber bei (344, 150) -->
  <circle cx="344" cy="232" r="6" fill="#dc2626" />
  <text x="296" y="236" class="code" fill="#991b1b">p_look</text>

  <!-- e_up nach oben und f exakt auf derselben Linie nach unten! -->
  <line x1="344" y1="139" x2="344" y2="88" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-green)" />
  <line x1="344" y1="161" x2="344" y2="218" stroke="#2563eb" stroke-width="2.8" marker-end="url(#arr-blue)" />
  <line x1="356" y1="150" x2="394" y2="150" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-red)" />
  <circle cx="344" cy="150" r="8.5" fill="#dc2626" stroke="#ffffff" stroke-width="2" />

  <text x="296" y="154" class="code" fill="#991b1b">p_eye</text>
  <text x="426" y="108" class="code" fill="#15803d">e_up (0,+1,0)</text>
  <text x="430" y="155" class="code" fill="#dc2626">s = ?</text>
  <text x="422" y="198" class="code" fill="#1d4ed8">f (0,-1,0)</text>

  <text x="376" y="281" class="code" fill="#991b1b">s = f × e_up = 0 (Kollaps!)</text>

  <!-- ====================================================================== -->
  <!-- UNTEN: Lösung durch Winkel-Clamping                                    -->
  <!-- ====================================================================== -->
  <rect x="-24" y="308" width="528" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
  <text x="240" y="330" class="code" fill="#1e40af">Lösung: Math.Clamp(phi, -85°, +85°) sperrt 5°-Polkappe</text>
  <text x="240" y="350" class="sub" fill="#334155">Blickstrahl f bleibt immer gegen e_up geneigt &#8594; kein 180°-Bildsprung!</text>
</svg>
