<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .code-l { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; }
      .math { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-muted-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <radialGradient id="grad-amb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </radialGradient>
    <radialGradient id="grad-diff" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="65%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="grad-spec" cx="35%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#93c5fd" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="grad-phong" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#93c5fd" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
  </defs>

  <text x="240" y="36" class="hdr sem-primary-text">OpenGL-Primitive: gl.Begin(mode) ... gl.End()</text>

  <!-- 1. GL_LINES -->
  <rect class="sem-primary-stroke" x="-20" y="54" width="250" height="145" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="105" y="76" class="code sem-primary-text">GL_LINES (DrawFloorGrid)</text>
  <line class="sem-primary-stroke" x1="35" y1="145" x2="90" y2="105" stroke-width="3" />
  <line class="sem-primary-stroke" x1="130" y1="145" x2="185" y2="105" stroke-width="3" />
  <circle class="sem-danger-fill" cx="35" cy="145" r="4.5" /><text x="14" y="150" class="code sem-neutral-text">v1</text>
  <circle class="sem-danger-fill" cx="90" cy="105" r="4.5" /><text x="68" y="102" class="code sem-neutral-text">v2</text>
  <circle class="sem-danger-fill" cx="130" cy="145" r="4.5" /><text x="110" y="150" class="code sem-neutral-text">v3</text>
  <circle class="sem-danger-fill" cx="185" cy="105" r="4.5" /><text x="206" y="108" class="code sem-neutral-text">v4</text>
  <text x="105" y="186" class="sub sem-muted-text">Je 2 Vertices = 1 Einzelstrecke</text>

  <!-- 2. GL_LINE_STRIP -->
  <rect class="sem-primary-stroke" x="250" y="54" width="250" height="145" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="375" y="76" class="code sem-primary-text">GL_LINE_STRIP (Bahnspur)</text>
  <polyline class="sem-success-stroke" points="295,145 345,105 400,145 455,105" fill="none" stroke-width="3" />
  <circle class="sem-danger-fill" cx="295" cy="145" r="4.5" /><text x="274" y="150" class="code sem-neutral-text">v1</text>
  <circle class="sem-danger-fill" cx="345" cy="105" r="4.5" /><text x="324" y="102" class="code sem-neutral-text">v2</text>
  <circle class="sem-danger-fill" cx="400" cy="145" r="4.5" /><text x="422" y="152" class="code sem-neutral-text">v3</text>
  <circle class="sem-danger-fill" cx="455" cy="105" r="4.5" /><text x="476" y="108" class="code sem-neutral-text">v4</text>
  <text x="375" y="186" class="sub sem-muted-text">Verbundener Linienzug (v1-v2-v3-v4)</text>

  <!-- 3. GL_QUADS -->
  <rect class="sem-success-stroke" x="-20" y="212" width="250" height="148" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="105" y="234" class="code sem-success-text">GL_QUADS (DrawCube: 6x4)</text>
  <polygon class="sem-success" points="40,315 150,315 168,265 58,265" stroke-width="2.5" />
  <circle class="sem-success-fill" cx="40" cy="315" r="4.5" /><text x="18" y="320" class="code sem-neutral-text">v1</text>
  <circle class="sem-success-fill" cx="150" cy="315" r="4.5" /><text x="172" y="320" class="code sem-neutral-text">v2</text>
  <circle class="sem-success-fill" cx="168" cy="265" r="4.5" /><text x="190" y="269" class="code sem-neutral-text">v3</text>
  <circle class="sem-success-fill" cx="58" cy="265" r="4.5" /><text x="36" y="269" class="code sem-neutral-text">v4</text>
  <line class="sem-danger-stroke" x1="105" y1="292" x2="105" y2="250" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="122" y="258" class="code sem-danger-text">n</text>
  <text x="105" y="348" class="sub sem-muted-text">Je 4 Vertices = 1 Facette + Normale</text>

  <!-- 4. GL_QUAD_STRIP -->
  <rect class="sem-warning-stroke" x="250" y="212" width="250" height="148" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="375" y="234" class="code sem-warning-text">GL_QUAD_STRIP (DrawCylinder)</text>
  <polygon class="sem-warning" points="300,312 300,268 375,262 375,306" stroke-width="2" />
  <polygon class="sem-warning-fill sem-warning-stroke" points="375,306 375,262 450,268 450,312" stroke-width="2" />
  <circle class="sem-warning-fill" cx="300" cy="312" r="4" /><text x="278" y="316" class="code sem-neutral-text">v1</text>
  <circle class="sem-warning-fill" cx="300" cy="268" r="4" /><text x="278" y="272" class="code sem-neutral-text">v2</text>
  <circle class="sem-warning-fill" cx="450" cy="312" r="4" /><text x="472" y="316" class="code sem-neutral-text">v5</text>
  <circle class="sem-warning-fill" cx="450" cy="268" r="4" /><text x="472" y="272" class="code sem-neutral-text">v6</text>
  <text x="375" y="348" class="sub sem-muted-text">Durchgehendes Band (slices = 24)</text>
</svg>
