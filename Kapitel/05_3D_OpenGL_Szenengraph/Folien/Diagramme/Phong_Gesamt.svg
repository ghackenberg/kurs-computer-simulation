<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .code-l { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; }
      .math { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-muted-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <radialGradient id="grad-amb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </radialGradient>
    <radialGradient id="grad-diff" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="65%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="grad-spec" cx="35%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#93c5fd" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="grad-phong" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#93c5fd" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
  </defs>

  <rect class="sem-card" x="-35" y="8" width="550" height="364" rx="12" stroke-width="2" />
  <text x="240" y="36" class="hdr sem-primary-text">Phong-Beleuchtungsmodell: I_f = I_a + I_d + I_s</text>

  <!-- Box 1: Ambient I_a -->
  <rect class="sem-primary" x="-20" y="52" width="160" height="150" rx="8" stroke-width="1.8" />
  <text x="60" y="75" class="code sem-primary-text">1. Ambient I_a</text>
  <circle class="sem-primary-stroke" cx="60" cy="125" r="38" fill="url(#grad-amb)" stroke-width="1.5" />
  <text x="60" y="186" class="sub sem-neutral-text">Grundhelligkeit</text>

  <text x="152" y="132" class="hdr sem-muted-text">+</text>

  <!-- Box 2: Diffuse I_d -->
  <rect class="sem-success" x="165" y="52" width="150" height="150" rx="8" stroke-width="1.8" />
  <text x="240" y="75" class="code sem-success-text">2. Diffuse I_d</text>
  <circle class="sem-success-stroke" cx="240" cy="125" r="38" fill="url(#grad-diff)" stroke-width="1.5" />
  <text x="240" y="186" class="sub sem-neutral-text">Matte Streuung</text>

  <text x="327" y="132" class="hdr sem-muted-text">+</text>

  <!-- Box 3: Specular I_s -->
  <rect class="sem-warning" x="340" y="52" width="160" height="150" rx="8" stroke-width="1.8" />
  <text x="420" y="75" class="code sem-warning-text">3. Specular I_s</text>
  <circle class="sem-warning-stroke" cx="420" cy="125" r="38" fill="url(#grad-spec)" stroke-width="1.5" />
  <text x="420" y="186" class="sub sem-neutral-text">Glanzpunkt</text>

  <!-- Ergebnis unten: I_f -->
  <rect class="sem-primary-stroke" x="-20" y="218" width="520" height="138" rx="10" fill="#ffffff" stroke-width="2.2" />
  <circle class="sem-primary-stroke" cx="75" cy="287" r="46" fill="url(#grad-phong)" stroke-width="2" />
  <text x="310" y="252" class="hdr sem-primary-text">Gesamtintensität I_f am Oberflächenpunkt</text>
  <text x="310" y="284" class="math sem-neutral-text">I_f = I_a + I_d + I_s</text>
  <text x="310" y="314" class="sub sem-success-text">Plastischer 3D-Eindruck durch Summe aller 3 Anteile</text>
  <text x="310" y="338" class="code sem-muted-text">gl.Enable(OpenGL.GL_LIGHTING)</text>
</svg>
