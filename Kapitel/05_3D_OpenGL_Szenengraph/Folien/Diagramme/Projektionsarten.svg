<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" width="1080" height="450">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect x="10" y="8" width="1060" height="434" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- ====================================================================== -->
  <!-- LINKS: Orthogonale Projektion (gl.Ortho)                               -->
  <!-- ====================================================================== -->
  <rect x="24" y="22" width="504" height="406" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <rect x="24" y="22" width="504" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="276" y="50" class="hdr" fill="#1d4ed8">A. Orthogonale Projektion: gl.Ortho(left, right, ...)</text>

  <text x="205" y="92" class="sub" fill="#1e40af">1. Seitenansicht (Quader-Volumen)</text>
  <text x="440" y="92" class="sub" fill="#1e40af">2. 2D-Bild (NDC)</text>

  <!-- Quader-Sichtvolumen (Seitenansicht: x=102 zNear bis x=330 zFar) -->
  <polygon points="102,126 330,126 330,296 102,296" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <!-- zNear Bildebene (grün) & zFar (rot gestrichelt) -->
  <line x1="102" y1="120" x2="102" y2="302" stroke="#16a34a" stroke-width="3.5" />
  <line x1="330" y1="120" x2="330" y2="302" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,4" />
  <text x="102" y="113" class="code" fill="#15803d">near</text>
  <text x="330" y="113" class="code" fill="#dc2626">far</text>

  <!-- Optische Achse beginnt erst rechts von near (x=108..342) -->
  <line x1="108" y1="211" x2="342" y2="211" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Zwei gleich große 3D-Körper (Höhe 80 px): Nah bei z=-2m (x=185), Fern bei z=-4m (x=282) -->
  <line x1="185" y1="171" x2="185" y2="251" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round" />
  <text x="185" y="322" class="code" fill="#1d4ed8">z = -2 m</text>

  <line x1="282" y1="171" x2="282" y2="251" stroke="#60a5fa" stroke-width="9" stroke-linecap="round" />
  <text x="282" y="322" class="code" fill="#2563eb">z = -4 m</text>

  <!-- Parallele Projektionsstrahlen nach links auf Bildebene near (x=102) -->
  <line x1="282" y1="171" x2="108" y2="171" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />
  <line x1="282" y1="251" x2="108" y2="251" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />

  <!-- Abbild auf near: identische Höhe h1 = h2 (Label frei links ohne Linienkontakt) -->
  <line x1="102" y1="171" x2="102" y2="251" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
  <text x="63" y="216" class="code" fill="#b45309">h1=h2</text>

  <!-- Rechts daneben: Resultierendes 2D-Bild (NDC [-1, +1]) -->
  <rect x="368" y="126" width="142" height="180" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <line x1="386" y1="278" x2="386" y2="144" stroke="#334155" stroke-width="1.5" />
  <line x1="492" y1="278" x2="492" y2="144" stroke="#334155" stroke-width="1.5" />
  <polygon points="434,154 486,154 486,206 434,206" fill="#60a5fa" stroke="#dbeafe" stroke-width="1.8" />
  <polygon points="392,204 444,204 444,256 392,256" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  <text x="439" y="294" class="code" fill="#93c5fd">Gleich groß!</text>

  <!-- Fazit-Box Links -->
  <rect x="38" y="340" width="476" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
  <text x="276" y="366" class="code" fill="#15803d">Keine Tiefendivision: Parallelen &amp; Maße bleiben erhalten</text>
  <text x="276" y="394" class="sub" fill="#334155">Quader [left..right, bottom..top, near..far] &#8594; NDC [-1, +1]^3</text>

  <!-- ====================================================================== -->
  <!-- RECHTS: Perspektivische Projektion (gl.Perspective)                    -->
  <!-- ====================================================================== -->
  <rect x="552" y="22" width="504" height="406" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
  <rect x="552" y="22" width="504" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="804" y="50" class="hdr" fill="#6d28d9">B. Perspektivische Projektion: gl.Perspective(fovy, ...)</text>

  <text x="726" y="92" class="sub" fill="#6d28d9">1. Seitenansicht (Frustum-Kegel)</text>
  <text x="968" y="92" class="sub" fill="#6d28d9">2. 2D-Bild (NDC)</text>

  <!-- Kamera im Ursprung (0,0,0) bei (584, 206) -->
  <circle cx="584" cy="206" r="6.5" fill="#6d28d9" />
  <text x="584" y="182" class="code" fill="#5b21b6">(0,0)</text>

  <!-- Frustum von zNear (x=660, y=158..254) bis zFar (x=864, y=112..300) -->
  <polygon points="660,158 864,112 864,300 660,254" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.6" />
  <line x1="584" y1="206" x2="660" y2="158" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="584" y1="206" x2="660" y2="254" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="660" y1="152" x2="660" y2="260" stroke="#16a34a" stroke-width="3.5" />
  <line x1="864" y1="108" x2="864" y2="304" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,4" />
  <text x="660" y="142" class="code" fill="#15803d">zNear</text>
  <text x="864" y="102" class="code" fill="#dc2626">zFar</text>

  <!-- Öffnungswinkel fovy unten frei ohne Sehstrahl-Kollision -->
  <path d="M 618 185 A 40 40 0 0 1 618 227" fill="none" stroke="#d97706" stroke-width="2.4" />
  <text x="614" y="268" class="code" fill="#b45309">fovy</text>

  <!-- Zwei gleich große 3D-Körper (Höhe 70 px): Nah bei z=-2m (x=728), Fern bei z=-4m (x=824) -->
  <line x1="728" y1="171" x2="728" y2="241" stroke="#6d28d9" stroke-width="9" stroke-linecap="round" />
  <text x="728" y="322" class="code" fill="#5b21b6">z = -2 m</text>

  <line x1="824" y1="171" x2="824" y2="241" stroke="#a78bfa" stroke-width="9" stroke-linecap="round" />
  <text x="824" y="322" class="code" fill="#6d28d9">z = -4 m</text>

  <!-- Konvergente Sehstrahlen von den oberen Objektspitzen ins Kameraauge (584, 206) -->
  <line x1="728" y1="171" x2="592" y2="204" stroke="#7c3aed" stroke-width="1.9" stroke-dasharray="4,3" marker-end="url(#arr-purple)" />
  <line x1="824" y1="171" x2="592" y2="205" stroke="#d97706" stroke-width="1.9" stroke-dasharray="4,3" />

  <!-- Abbilder auf zNear (x=660): Groß (Nah) vs. Halb so hoch (Fern) -->
  <line x1="656" y1="188" x2="656" y2="224" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" />
  <line x1="665" y1="197" x2="665" y2="215" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

  <!-- Rechts daneben: Resultierendes 2D-Bild (NDC [-1, +1]) -->
  <rect x="896" y="126" width="142" height="180" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <line x1="908" y1="278" x2="967" y2="148" stroke="#334155" stroke-width="1.5" />
  <line x1="1026" y1="278" x2="967" y2="148" stroke="#334155" stroke-width="1.5" />
  <polygon points="972,164 998,164 998,190 972,190" fill="#c4b5fd" stroke="#f5f3ff" stroke-width="1.8" />
  <polygon points="920,204 972,204 972,256 920,256" fill="#7c3aed" stroke="#ffffff" stroke-width="2" />
  <text x="967" y="294" class="code" fill="#fcd34d">Halb so groß!</text>

  <!-- Fazit-Box Rechts -->
  <rect x="566" y="340" width="476" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
  <text x="804" y="366" class="code" fill="#b45309">Frustum &#8594; NDC [-1, +1]^3 via Division durch -z (~ 1/z)</text>
  <text x="804" y="394" class="sub" fill="#334155">Ferne Körper wirken kleiner; außerhalb [zNear, zFar] wird geclippt</text>
</svg>
