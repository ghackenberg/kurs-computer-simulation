<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" width="1080" height="450">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="grad-sem-accent-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-accent { fill: url(#grad-sem-accent); stroke: #7c3aed; }
      .sem-accent-bg { fill: url(#grad-sem-accent); stroke: none; }
      .sem-accent-stroke { stroke: #7c3aed; }
      .sem-accent-fill { fill: url(#grad-sem-accent-fill); }
      .sem-accent-text { fill: #6d28d9; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-accent-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
  </defs>


  <!-- ====================================================================== -->
  <!-- LINKS: Orthogonale Projektion (gl.Ortho)                               -->
  <!-- ====================================================================== -->
  <rect class="sem-primary-stroke" x="24" y="22" width="504" height="406" rx="10" fill="#ffffff" stroke-width="2" />
  <rect class="sem-primary" x="24" y="22" width="504" height="44" rx="10" stroke-width="1.5" />
  <text x="276" y="50" class="hdr sem-primary-text">A. Orthogonale Projektion: gl.Ortho(left, right, ...)</text>

  <text x="205" y="92" class="sub sem-primary-text">1. Seitenansicht (Quader-Volumen)</text>
  <text x="440" y="92" class="sub sem-primary-text">2. 2D-Bild (NDC)</text>

  <!-- Quader-Sichtvolumen (Seitenansicht: x=102 zNear bis x=330 zFar) -->
  <polygon class="sem-primary" points="102,126 330,126 330,296 102,296" stroke-width="1.5" />
  <!-- zNear Bildebene (grün) & zFar (rot gestrichelt) -->
  <line class="sem-success-stroke" x1="102" y1="120" x2="102" y2="302" stroke-width="3.5" />
  <line class="sem-danger-stroke" x1="330" y1="120" x2="330" y2="302" stroke-width="2.5" stroke-dasharray="5,4" />
  <text x="102" y="113" class="code sem-success-text">near</text>
  <text x="330" y="113" class="code sem-danger-text">far</text>

  <!-- Optische Achse beginnt erst rechts von near (x=108..342) -->
  <line class="sem-card-stroke" x1="108" y1="211" x2="342" y2="211" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Zwei gleich große 3D-Körper (Höhe 80 px): Nah bei z=-2m (x=185), Fern bei z=-4m (x=282) -->
  <line class="sem-primary-stroke" x1="185" y1="171" x2="185" y2="251" stroke-width="9" stroke-linecap="round" />
  <text x="185" y="322" class="code sem-primary-text">z = -2 m</text>

  <line class="sem-primary-stroke" x1="282" y1="171" x2="282" y2="251" stroke-width="9" stroke-linecap="round" />
  <text x="282" y="322" class="code sem-primary-text">z = -4 m</text>

  <!-- Parallele Projektionsstrahlen nach links auf Bildebene near (x=102) -->
  <line class="sem-primary-stroke" x1="282" y1="171" x2="108" y2="171" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />
  <line class="sem-primary-stroke" x1="282" y1="251" x2="108" y2="251" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />

  <!-- Abbild auf near: identische Höhe h1 = h2 (Label frei links ohne Linienkontakt) -->
  <line class="sem-warning-stroke" x1="102" y1="171" x2="102" y2="251" stroke-width="7" stroke-linecap="round" />
  <text x="63" y="216" class="code sem-warning-text">h1=h2</text>

  <!-- Rechts daneben: Resultierendes 2D-Bild (NDC [-1, +1]) -->
  <rect class="sem-card sem-muted-stroke" x="368" y="126" width="142" height="180" rx="6" stroke-width="2" />
  <line class="sem-neutral-stroke" x1="386" y1="278" x2="386" y2="144" stroke-width="1.5" />
  <line class="sem-neutral-stroke" x1="492" y1="278" x2="492" y2="144" stroke-width="1.5" />
  <polygon class="sem-primary-fill sem-primary-stroke" points="434,154 486,154 486,206 434,206" stroke-width="1.8" />
  <polygon class="sem-primary-fill" points="392,204 444,204 444,256 392,256" stroke="#ffffff" stroke-width="2" />
  <text x="439" y="294" class="code sem-primary-text">Gleich groß!</text>

  <!-- Fazit-Box Links -->
  <rect class="sem-success" x="38" y="340" width="476" height="72" rx="8" stroke-width="1.8" />
  <text x="276" y="366" class="code sem-success-text">Keine Tiefendivision: Parallelen &amp; Maße bleiben erhalten</text>
  <text x="276" y="394" class="sub sem-neutral-text">Quader [left..right, bottom..top, near..far] &#8594; NDC [-1, +1]^3</text>

  <!-- ====================================================================== -->
  <!-- RECHTS: Perspektivische Projektion (gl.Perspective)                    -->
  <!-- ====================================================================== -->
  <rect class="sem-accent-stroke" x="552" y="22" width="504" height="406" rx="10" fill="#ffffff" stroke-width="2" />
  <rect class="sem-accent" x="552" y="22" width="504" height="44" rx="10" stroke-width="1.5" />
  <text x="804" y="50" class="hdr sem-accent-text">B. Perspektivische Projektion: gl.Perspective(fovy, ...)</text>

  <text x="726" y="92" class="sub sem-accent-text">1. Seitenansicht (Frustum-Kegel)</text>
  <text x="968" y="92" class="sub sem-accent-text">2. 2D-Bild (NDC)</text>

  <!-- Kamera im Ursprung (0,0,0) bei (584, 206) -->
  <circle class="sem-accent-fill" cx="584" cy="206" r="6.5" />
  <text x="584" y="182" class="code sem-accent-text">(0,0)</text>

  <!-- Frustum von zNear (x=660, y=158..254) bis zFar (x=864, y=112..300) -->
  <polygon class="sem-accent" points="660,158 864,112 864,300 660,254" stroke-width="1.6" />
  <line class="sem-muted-stroke" x1="584" y1="206" x2="660" y2="158" stroke-width="1.5" stroke-dasharray="4,3" />
  <line class="sem-muted-stroke" x1="584" y1="206" x2="660" y2="254" stroke-width="1.5" stroke-dasharray="4,3" />
  <line class="sem-success-stroke" x1="660" y1="152" x2="660" y2="260" stroke-width="3.5" />
  <line class="sem-danger-stroke" x1="864" y1="108" x2="864" y2="304" stroke-width="2.5" stroke-dasharray="5,4" />
  <text x="660" y="142" class="code sem-success-text">zNear</text>
  <text x="864" y="102" class="code sem-danger-text">zFar</text>

  <!-- Öffnungswinkel fovy unten frei ohne Sehstrahl-Kollision -->
  <path class="sem-warning-stroke" d="M 618 185 A 40 40 0 0 1 618 227" fill="none" stroke-width="2.4" />
  <text x="614" y="268" class="code sem-warning-text">fovy</text>

  <!-- Zwei gleich große 3D-Körper (Höhe 70 px): Nah bei z=-2m (x=728), Fern bei z=-4m (x=824) -->
  <line class="sem-accent-stroke" x1="728" y1="171" x2="728" y2="241" stroke-width="9" stroke-linecap="round" />
  <text x="728" y="322" class="code sem-accent-text">z = -2 m</text>

  <line class="sem-accent-stroke" x1="824" y1="171" x2="824" y2="241" stroke-width="9" stroke-linecap="round" />
  <text x="824" y="322" class="code sem-accent-text">z = -4 m</text>

  <!-- Konvergente Sehstrahlen von den oberen Objektspitzen ins Kameraauge (584, 206) -->
  <line class="sem-accent-stroke" x1="728" y1="171" x2="592" y2="204" stroke-width="1.9" stroke-dasharray="4,3" marker-end="url(#arr-purple)" />
  <line class="sem-warning-stroke" x1="824" y1="171" x2="592" y2="205" stroke-width="1.9" stroke-dasharray="4,3" />

  <!-- Abbilder auf zNear (x=660): Groß (Nah) vs. Halb so hoch (Fern) -->
  <line class="sem-accent-stroke" x1="656" y1="188" x2="656" y2="224" stroke-width="6" stroke-linecap="round" />
  <line class="sem-warning-stroke" x1="665" y1="197" x2="665" y2="215" stroke-width="6" stroke-linecap="round" />

  <!-- Rechts daneben: Resultierendes 2D-Bild (NDC [-1, +1]) -->
  <rect class="sem-card sem-muted-stroke" x="896" y="126" width="142" height="180" rx="6" stroke-width="2" />
  <line class="sem-neutral-stroke" x1="908" y1="278" x2="967" y2="148" stroke-width="1.5" />
  <line class="sem-neutral-stroke" x1="1026" y1="278" x2="967" y2="148" stroke-width="1.5" />
  <polygon class="sem-accent-fill sem-accent-stroke" points="972,164 998,164 998,190 972,190" stroke-width="1.8" />
  <polygon class="sem-accent-fill" points="920,204 972,204 972,256 920,256" stroke="#ffffff" stroke-width="2" />
  <text x="967" y="294" class="code sem-warning-text">Halb so groß!</text>

  <!-- Fazit-Box Rechts -->
  <rect class="sem-warning" x="566" y="340" width="476" height="72" rx="8" stroke-width="1.8" />
  <text x="804" y="366" class="code sem-warning-text">Frustum &#8594; NDC [-1, +1]^3 via Division durch -z (~ 1/z)</text>
  <text x="804" y="394" class="sub sem-neutral-text">Ferne Körper wirken kleiner; außerhalb [zNear, zFar] wird geclippt</text>
</svg>
