<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="-35" y="8" width="550" height="364" rx="12" stroke-width="2" />
  <text x="240" y="34" class="hdr sem-primary-text">GL_MODELVIEW = M_view · M_model: Vom Bauteil zur Kamera</text>

  <!-- Panel 1: Objekt-Raum (Breite 136 px: x=-26..110) -->
  <rect class="sem-muted-stroke" x="-26" y="52" width="136" height="218" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="42" y="74" class="code sem-neutral-text">1. Objekt</text>
  <text x="42" y="93" class="code sem-primary-text">v_obj</text>

  <line class="sem-danger-stroke" x1="42" y1="168" x2="88" y2="168" stroke-width="2.2" marker-end="url(#arr-red)" />
  <line class="sem-success-stroke" x1="42" y1="168" x2="42" y2="122" stroke-width="2.2" marker-end="url(#arr-green)" />
  <polygon class="sem-primary" points="26,152 58,152 58,184 26,184" stroke-width="2.2" />
  <circle class="sem-neutral-fill" cx="42" cy="168" r="4" />

  <text x="42" y="226" class="sub sem-neutral-text">Im Ursprung</text>
  <text x="42" y="248" class="code sem-muted-text">(0, 0, 0)</text>

  <!-- Pfeil M_model in breiter 62 px Lücke (x=110..172) -->
  <line class="sem-warning-stroke" x1="114" y1="162" x2="166" y2="162" stroke-width="2.8" marker-end="url(#arr-amber)" />
  <text x="141" y="146" class="code sem-warning-text">M_model</text>

  <!-- Panel 2: Welt-Raum (Breite 136 px: x=172..308) -->
  <rect class="sem-warning" x="172" y="52" width="136" height="218" rx="8" stroke-width="1.8" />
  <text x="240" y="74" class="code sem-warning-text">2. Welt</text>
  <text x="240" y="93" class="code sem-warning-text">v_world</text>

  <line class="sem-danger-stroke" x1="190" y1="196" x2="228" y2="196" stroke-width="2" marker-end="url(#arr-red)" />
  <line class="sem-success-stroke" x1="190" y1="196" x2="190" y2="158" stroke-width="2" marker-end="url(#arr-green)" />
  <polygon class="sem-primary-fill sem-primary-stroke" points="222,126 248,116 258,142 232,152" stroke-width="2.2" />
  <polygon class="sem-muted-fill" points="274,192 294,180 294,204" />
  <line class="sem-muted-stroke" x1="272" y1="192" x2="254" y2="156" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-blue)" />

  <text x="240" y="226" class="sub sem-warning-text">Bauteil &amp; p_eye</text>
  <text x="240" y="248" class="sub sem-warning-text">frei im Raum</text>

  <!-- Pfeil M_view in breiter 62 px Lücke (x=308..370) -->
  <line class="sem-success-stroke" x1="312" y1="162" x2="364" y2="162" stroke-width="2.8" marker-end="url(#arr-green)" />
  <text x="339" y="146" class="code sem-success-text">M_view</text>

  <!-- Panel 3: Kamera-Raum (Breite 136 px: x=370..506) -->
  <rect class="sem-success" x="370" y="52" width="136" height="218" rx="8" stroke-width="2" />
  <text x="438" y="74" class="code sem-success-text">3. Kamera</text>
  <text x="438" y="93" class="code sem-success-text">v_eye</text>

  <polygon class="sem-neutral-fill" points="396,166 382,154 382,178" />
  <line class="sem-primary-stroke" x1="398" y1="166" x2="488" y2="166" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />
  <text x="425" y="150" class="code sem-primary-text">-Z_eye</text>
  <polygon class="sem-success-fill sem-success-stroke" points="458,150 486,150 486,182 458,182" stroke-width="2.2" />

  <text x="438" y="226" class="sub sem-success-text">Auge in (0,0,0)!</text>
  <text x="438" y="248" class="code sem-success-text">z_eye = -4 m</text>

  <!-- Unten: Erklärung der Verschmelzung zu GL_MODELVIEW -->
  <rect class="sem-primary" x="-24" y="284" width="528" height="74" rx="8" stroke-width="2" />
  <text x="240" y="311" class="math sem-primary-text">v_eye = M_view · (M_model · v_obj) = M_modelview · v_obj</text>
  <text x="240" y="339" class="sub sem-neutral-text">Kamera um +4 m zurückziehen == Gesamte Welt um -4 m vor die Linse schieben!</text>
</svg>
