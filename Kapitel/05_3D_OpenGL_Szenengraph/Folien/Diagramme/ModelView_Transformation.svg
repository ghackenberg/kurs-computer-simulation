<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706" />
    </marker>
  </defs>

  <rect x="-35" y="8" width="550" height="364" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="240" y="34" class="hdr" fill="#1e40af">GL_MODELVIEW = M_view · M_model: Vom Bauteil zur Kamera</text>

  <!-- Panel 1: Objekt-Raum (Breite 136 px: x=-26..110) -->
  <rect x="-26" y="52" width="136" height="218" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.8" />
  <text x="42" y="74" class="code" fill="#334155">1. Objekt</text>
  <text x="42" y="93" class="code" fill="#2563eb">v_obj</text>

  <line x1="42" y1="168" x2="88" y2="168" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)" />
  <line x1="42" y1="168" x2="42" y2="122" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-green)" />
  <polygon points="26,152 58,152 58,184 26,184" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2" />
  <circle cx="42" cy="168" r="4" fill="#0f172a" />

  <text x="42" y="226" class="sub" fill="#334155">Im Ursprung</text>
  <text x="42" y="248" class="code" fill="#475569">(0, 0, 0)</text>

  <!-- Pfeil M_model in breiter 62 px Lücke (x=110..172) -->
  <line x1="114" y1="162" x2="166" y2="162" stroke="#d97706" stroke-width="2.8" marker-end="url(#arr-amber)" />
  <text x="141" y="146" class="code" fill="#b45309">M_model</text>

  <!-- Panel 2: Welt-Raum (Breite 136 px: x=172..308) -->
  <rect x="172" y="52" width="136" height="218" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
  <text x="240" y="74" class="code" fill="#92400e">2. Welt</text>
  <text x="240" y="93" class="code" fill="#b45309">v_world</text>

  <line x1="190" y1="196" x2="228" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)" />
  <line x1="190" y1="196" x2="190" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
  <polygon points="222,126 248,116 258,142 232,152" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.2" />
  <polygon points="274,192 294,180 294,204" fill="#475569" />
  <line x1="272" y1="192" x2="254" y2="156" stroke="#475569" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-blue)" />

  <text x="240" y="226" class="sub" fill="#92400e">Bauteil &amp; p_eye</text>
  <text x="240" y="248" class="sub" fill="#78350f">frei im Raum</text>

  <!-- Pfeil M_view in breiter 62 px Lücke (x=308..370) -->
  <line x1="312" y1="162" x2="364" y2="162" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arr-green)" />
  <text x="339" y="146" class="code" fill="#15803d">M_view</text>

  <!-- Panel 3: Kamera-Raum (Breite 136 px: x=370..506) -->
  <rect x="370" y="52" width="136" height="218" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="438" y="74" class="code" fill="#15803d">3. Kamera</text>
  <text x="438" y="93" class="code" fill="#166534">v_eye</text>

  <polygon points="396,166 382,154 382,178" fill="#0f172a" />
  <line x1="398" y1="166" x2="488" y2="166" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />
  <text x="425" y="150" class="code" fill="#1d4ed8">-Z_eye</text>
  <polygon points="458,150 486,150 486,182 458,182" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.2" />

  <text x="438" y="226" class="sub" fill="#166534">Auge in (0,0,0)!</text>
  <text x="438" y="248" class="code" fill="#15803d">z_eye = -4 m</text>

  <!-- Unten: Erklärung der Verschmelzung zu GL_MODELVIEW -->
  <rect x="-24" y="284" width="528" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text x="240" y="311" class="math" fill="#1e3a8a">v_eye = M_view · (M_model · v_obj) = M_modelview · v_obj</text>
  <text x="240" y="339" class="sub" fill="#334155">Kamera um +4 m zurückziehen == Gesamte Welt um -4 m vor die Linse schieben!</text>
</svg>
