  <text x="240" y="320" class="code sem-warning-text">gl.ShadeModel(OpenGL.GL_FLAT) &#8594; Konstante Farbe pro Facette</text>
  <text x="240" y="344" class="sub sem-neutral-text">Sichtbare Farbsprünge an den Kanten (Ideal für scharfkantige Quader)</text>
