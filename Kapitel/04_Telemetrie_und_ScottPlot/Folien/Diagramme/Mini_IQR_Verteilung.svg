<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Interquartilsabstand (IQR)</text>
  <text x="135" y="42" class="sub">Robuste Streuung &amp; Bins</text>

  <!-- Distribution Canvas -->
  <g transform="translate(20, 56)">
    <rect width="230" height="190" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Distribution Curve Shaded Area for IQR (Q1 to Q3) -->
    <path d="M 82 155 L 82 105 Q 98 62 115 55 Q 132 62 148 105 L 148 155 Z" fill="#bbf7d0" fill-opacity="0.6" />

    <!-- Baseline Axis -->
    <line x1="20" y1="155" x2="210" y2="155" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Full Distribution Bell Curve -->
    <path d="M 25 153 Q 55 150 82 105 Q 98 62 115 55 Q 132 62 148 105 Q 170 148 195 153" fill="none" stroke="#2563eb" stroke-width="2" />

    <!-- Q1 Vertical Line -->
    <line x1="82" y1="95" x2="82" y2="155" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="3,2" />
    <text x="82" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">Q_1</text>

    <!-- Q3 Vertical Line -->
    <line x1="148" y1="95" x2="148" y2="155" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="3,2" />
    <text x="148" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">Q_3</text>

    <!-- Median Q2 Line -->
    <line x1="115" y1="58" x2="115" y2="155" stroke="#b91c1c" stroke-width="1.5" />
    <text x="115" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#b91c1c" text-anchor="middle">Median</text>

    <!-- IQR Double Arrow -->
    <line x1="86" y1="120" x2="144" y2="120" stroke="#15803d" stroke-width="2" />
    <polygon points="84,120 90,117 90,123" fill="#15803d" />
    <polygon points="146,120 140,117 140,123" fill="#15803d" />
    
    <rect x="94" y="110" width="42" height="18" rx="2" fill="#ffffff" opacity="0.95" />
    <text x="115" y="123" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#15803d" text-anchor="middle">IQR</text>

    <!-- Outlier Point on Far Right with solid shielding -->
    <circle cx="185" cy="155" r="4.5" fill="#dc2626" />
    <rect x="156" y="120" width="58" height="16" rx="2" fill="#ffffff" />
    <text x="185" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#dc2626" text-anchor="middle">Ausreißer</text>
  </g>

  <!-- Formula Details Box -->
  <g transform="translate(15, 258)">
    <rect width="240" height="74" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #1d4ed8;">Freedman-Diaconis (Bins)</text>
    <text x="120" y="40" class="desc" style="font-weight: bold; fill: #1e40af;">h = 2 * IQR / N^(1/3)</text>
    <text x="120" y="58" class="desc" style="fill: #1e3a8a;">IQR = Q_3 - Q_1 (robust ggü. sigma)</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #004B96;">Zentrale 50 % der Daten</text>
  <text x="135" y="388" class="desc" style="font-weight: bold; fill: #334155;">Immun gegen extreme Ausreißer</text>
</svg>