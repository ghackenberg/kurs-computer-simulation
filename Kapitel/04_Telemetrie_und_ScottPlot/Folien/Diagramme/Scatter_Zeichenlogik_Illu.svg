<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .idx { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; }
    </style>
    <marker id="sc-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="sc-back" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Oben: Sequenzieller SKPath über alle N Punkte in O(N) -->
  <rect class="sem-card sem-primary-stroke" x="15" y="12" width="450" height="190" rx="10" stroke-width="2" />
  <text x="240" y="36" class="hdr sem-primary-text">1. Sequenzielle Pfad-Konstruktion (SKPath) in O(N)</text>

  <line class="sem-muted-stroke" x1="45" y1="168" x2="435" y2="168" stroke-width="2" />
  <line class="sem-muted-stroke" x1="45" y1="52" x2="45" y2="168" stroke-width="2" />

  <!-- Phasenraum-Trajektorie mit Rücklauf in x -->
  <line class="sem-primary-stroke" x1="65" y1="155" x2="145" y2="75" stroke-width="3" marker-end="url(#sc-arr)" />
  <line class="sem-primary-stroke" x1="155" y1="72" x2="295" y2="78" stroke-width="3" marker-end="url(#sc-arr)" />
  <line class="sem-primary-stroke" x1="305" y1="82" x2="365" y2="142" stroke-width="3" marker-end="url(#sc-arr)" />
  <line class="sem-danger-stroke" x1="362" y1="148" x2="225" y2="115" stroke-width="3" marker-end="url(#sc-back)" />

  <circle class="sem-primary-fill" cx="65" cy="155" r="5.5" />
  <text x="82" y="158" class="idx sem-primary-text">[0]</text>
  <circle class="sem-primary-fill" cx="150" cy="72" r="5.5" />
  <text x="148" y="60" class="idx sem-primary-text">[1]</text>
  <circle class="sem-primary-fill" cx="302" cy="78" r="5.5" />
  <text x="302" y="64" class="idx sem-primary-text">[2]</text>
  <circle class="sem-primary-fill" cx="370" cy="146" r="5.5" />
  <text x="392" y="152" class="idx sem-primary-text">[3]</text>
  <circle class="sem-danger-fill" cx="215" cy="112" r="6.5" stroke="#ffffff" stroke-width="1.5" />
  <rect class="sem-danger-stroke" x="142" y="122" width="146" height="22" rx="4" fill="#ffffff" stroke-width="1.2" />
  <text x="215" y="138" class="idx sem-danger-text" text-anchor="middle">[4] (x rückwärts!)</text>

  <text x="240" y="192" class="code sem-neutral-text">Keine Sortierung von xs &#8594; Voller Durchlauf i = 0 ... N-1</text>

  <!-- Unten: 2 Modi (ScatterLine vs. Reine Punktwolke LineWidth = 0) -->
  <rect class="sem-primary" x="15" y="214" width="218" height="152" rx="10" stroke-width="2" />
  <text x="124" y="238" class="hdr sem-primary-text">Modus A: ScatterLine</text>
  <polyline class="sem-primary-stroke" points="38,315 80,265 135,280 175,255 208,295" fill="none" stroke-width="3.5" />
  <text x="124" y="335" class="code sem-primary-text">LineWidth &gt; 0</text>
  <text x="124" y="355" class="code sem-muted-text">MarkerSize = 0</text>

  <rect class="sem-success" x="247" y="214" width="218" height="152" rx="10" stroke-width="2" />
  <text x="356" y="238" class="hdr sem-success-text">Modus B: Punktwolke</text>
  <g class="sem-success-fill">
    <circle cx="285" cy="295" r="5.5" />
    <circle cx="315" cy="268" r="5.5" />
    <circle cx="345" cy="305" r="5.5" />
    <circle cx="365" cy="262" r="5.5" />
    <circle cx="395" cy="285" r="5.5" />
    <circle cx="422" cy="270" r="5.5" />
  </g>
  <text x="356" y="335" class="code sem-success-text">LineWidth = 0</text>
  <text x="356" y="355" class="code sem-muted-text">MarkerSize = 10</text>
</svg>
