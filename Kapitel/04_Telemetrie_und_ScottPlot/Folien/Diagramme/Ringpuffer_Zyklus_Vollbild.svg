<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 470" width="1110" height="470">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .idx { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold;  text-anchor: middle; }
    </style>
    <marker id="arr-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-wrap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Phase 1: Normaler Schreibvorgang -->
  <rect class="sem-card sem-primary-stroke" x="15" y="15" width="345" height="275" rx="10" stroke-width="2" />
  <text x="187" y="45" class="title sem-primary-text">Phase 1: Puffer füllt sich</text>
  <text x="187" y="72" class="code sem-neutral-text">cap = 5 · Enqueue(18.4)</text>

  <!-- 5 Array-Zellen -->
  <g transform="translate(32, 115)">
    <rect class="sem-primary" x="0" y="0" width="58" height="48" stroke-width="2" />
    <text x="29" y="30" class="code sem-primary-text">12.1</text>
    <text x="29" y="68" class="idx sem-muted-text">[0]</text>

    <rect class="sem-primary" x="62" y="0" width="58" height="48" stroke-width="2" />
    <text x="91" y="30" class="code sem-primary-text">14.5</text>
    <text x="91" y="68" class="idx sem-muted-text">[1]</text>

    <rect class="sem-primary" x="124" y="0" width="58" height="48" stroke-width="2" />
    <text x="153" y="30" class="code sem-primary-text">15.0</text>
    <text x="153" y="68" class="idx sem-muted-text">[2]</text>

    <rect class="sem-success" x="186" y="0" width="58" height="48" stroke-width="2.5" />
    <text x="215" y="30" class="code sem-success-text">18.4</text>
    <text x="215" y="68" class="idx sem-muted-text">[3]</text>

    <rect class="sem-muted" x="248" y="0" width="58" height="48" stroke-width="1.5" stroke-dasharray="4,3" />
    <text x="277" y="30" class="code sem-muted-text">--</text>
    <text x="277" y="68" class="idx sem-muted-text">[4]</text>
  </g>
  <line class="sem-danger-stroke" x1="247" y1="82" x2="247" y2="110" stroke-width="3" marker-end="url(#arr-head)" />
  <text x="247" y="218" class="code sem-danger-text">head: 3 &#8594; 4</text>
  <text x="187" y="265" class="lbl sem-muted-text">Schreibt in _data[head] in O(1)</text>

  <!-- Phase 2: Letzte Zelle erreicht & Modulo-Sprung -->
  <rect class="sem-warning" x="382" y="15" width="345" height="275" rx="10" stroke-width="2" />
  <text x="554" y="45" class="title sem-warning-text">Phase 2: Ende erreicht (Wrap-Around)</text>
  <text x="554" y="72" class="code sem-warning-text">head = (4 + 1) % 5 = 0</text>

  <g transform="translate(399, 115)">
    <rect class="sem-primary" x="0" y="0" width="58" height="48" stroke-width="2" />
    <text x="29" y="30" class="code sem-primary-text">12.1</text>
    <text x="29" y="68" class="idx sem-muted-text">[0]</text>

    <rect class="sem-primary" x="62" y="0" width="58" height="48" stroke-width="2" />
    <text x="91" y="30" class="code sem-primary-text">14.5</text>
    <text x="91" y="68" class="idx sem-muted-text">[1]</text>

    <rect class="sem-primary" x="124" y="0" width="58" height="48" stroke-width="2" />
    <text x="153" y="30" class="code sem-primary-text">15.0</text>
    <text x="153" y="68" class="idx sem-muted-text">[2]</text>

    <rect class="sem-primary" x="186" y="0" width="58" height="48" stroke-width="2" />
    <text x="215" y="30" class="code sem-primary-text">18.4</text>
    <text x="215" y="68" class="idx sem-muted-text">[3]</text>

    <rect class="sem-warning" x="248" y="0" width="58" height="48" stroke-width="2.5" />
    <text x="277" y="30" class="code sem-warning-text">19.2</text>
    <text x="277" y="68" class="idx sem-muted-text">[4]</text>
  </g>
  <path class="sem-success-stroke" d="M 676 112 C 676 75, 428 75, 428 110" fill="none" stroke-width="3" marker-end="url(#arr-wrap)" />
  <text x="554" y="218" class="code sem-success-text">Modulo (%) springt auf Index [0]</text>
  <text x="554" y="265" class="lbl sem-muted-text">Kein Resize, kein neues Array!</text>

  <!-- Phase 3: Ältester Wert wird überschrieben -->
  <rect class="sem-success" x="750" y="15" width="345" height="275" rx="10" stroke-width="2" />
  <text x="922" y="45" class="title sem-success-text">Phase 3: Ältester Wert überschrieben</text>
  <text x="922" y="72" class="code sem-success-text">Enqueue(21.0) auf Index [0]</text>

  <g transform="translate(767, 115)">
    <rect class="sem-success" x="0" y="0" width="58" height="48" stroke-width="3" />
    <text x="29" y="30" class="code sem-success-text">21.0</text>
    <text x="29" y="68" class="idx sem-muted-text">[0]</text>

    <rect class="sem-danger" x="62" y="0" width="58" height="48" stroke-width="2" />
    <text x="91" y="30" class="code sem-danger-text">14.5</text>
    <text x="91" y="68" class="idx sem-muted-text">[1]</text>

    <rect class="sem-primary" x="124" y="0" width="58" height="48" stroke-width="2" />
    <text x="153" y="30" class="code sem-primary-text">15.0</text>
    <text x="153" y="68" class="idx sem-muted-text">[2]</text>

    <rect class="sem-primary" x="186" y="0" width="58" height="48" stroke-width="2" />
    <text x="215" y="30" class="code sem-primary-text">18.4</text>
    <text x="215" y="68" class="idx sem-muted-text">[3]</text>

    <rect class="sem-primary" x="248" y="0" width="58" height="48" stroke-width="2" />
    <text x="277" y="30" class="code sem-primary-text">19.2</text>
    <text x="277" y="68" class="idx sem-muted-text">[4]</text>
  </g>
  <line class="sem-danger-stroke" x1="796" y1="82" x2="796" y2="110" stroke-width="3" marker-end="url(#arr-head)" />
  <text x="922" y="218" class="code sem-success-text">[0] = Neu (21.0) · [1] = Ältester</text>
  <text x="922" y="265" class="lbl sem-muted-text">Endloser Dauerbetrieb (24/7)</text>

  <!-- Unten: Die zwei Darstellungsmodi von ScottPlot DataStreamer -->
  <rect class="sem-primary" x="15" y="310" width="530" height="145" rx="10" stroke-width="2" />
  <text x="280" y="340" class="title sem-primary-text">DataStreamer Modus 1: ViewScrollLeft() (Rollband)</text>
  <polyline class="sem-primary-stroke" points="45,415 110,390 175,420 240,380 305,410 370,375 435,405 495,365" fill="none" stroke-width="3.5" />
  <circle class="sem-danger-fill" cx="495" cy="365" r="6" />
  <text x="280" y="442" class="code sem-primary-text">Neuester Wert rechts · Kurve wandert nach links</text>

  <rect class="sem-success sem-success-stroke" x="565" y="310" width="530" height="145" rx="10" stroke-width="2" />
  <text x="830" y="340" class="title sem-success-text">DataStreamer Modus 2: ViewWipeRight() (EKG-Wischer)</text>
  <polyline class="sem-success-stroke" points="595,405 660,375 725,415 790,368 835,392" fill="none" stroke-width="3.5" />
  <line class="sem-danger-stroke" x1="845" y1="355" x2="845" y2="425" stroke-width="3" stroke-dasharray="4,3" />
  <polyline class="sem-muted-stroke" points="875,410 940,385 1005,415 1065,390" fill="none" stroke-width="2.5" stroke-dasharray="3,3" />
  <text x="830" y="442" class="code sem-success-text">Schreibzeiger wandert von links nach rechts über Altwerte</text>
</svg>
