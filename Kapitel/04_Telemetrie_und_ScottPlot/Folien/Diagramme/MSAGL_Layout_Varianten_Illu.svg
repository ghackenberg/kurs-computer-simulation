<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -37 570 455" width="570" height="455">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="lv-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="lv-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Oben: Variante 1 - Hierarchisches Schicht-Layout (Sugiyama) -->
  <rect class="sem-primary" x="10" y="12" width="460" height="170" rx="10" stroke-width="2" />
  <text x="240" y="38" class="hdr sem-primary-text">1. Hierarchisches Schicht-Layout (Sugiyama)</text>
  <text x="240" y="58" class="sub sem-muted-text">Kausaler Signalfluss (Links &#8594; Rechts) + Rückführung</text>

  <!-- Schicht-Linien -->
  <line class="sem-primary-stroke" x1="90" y1="70" x2="90" y2="145" stroke-width="2" stroke-dasharray="4,4" />
  <line class="sem-primary-stroke" x1="240" y1="70" x2="240" y2="145" stroke-width="2" stroke-dasharray="4,4" />
  <line class="sem-primary-stroke" x1="390" y1="70" x2="390" y2="145" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Vorwärts-Pfeile -->
  <line class="sem-primary-stroke" x1="132" y1="102" x2="190" y2="102" stroke-width="2.5" marker-end="url(#lv-b)" />
  <line class="sem-primary-stroke" x1="282" y1="102" x2="340" y2="102" stroke-width="2.5" marker-end="url(#lv-b)" />

  <!-- Blöcke -->
  <rect class="sem-primary-stroke" x="48" y="84" width="84" height="36" rx="6" fill="#ffffff" stroke-width="2" />
  <text x="90" y="107" class="code sem-primary-text">Sum</text>

  <rect class="sem-primary" x="198" y="84" width="84" height="36" rx="6" stroke-width="2" />
  <text x="240" y="107" class="code sem-primary-text">Regler</text>

  <rect class="sem-primary-stroke" x="348" y="84" width="84" height="36" rx="6" fill="#ffffff" stroke-width="2" />
  <text x="390" y="107" class="code sem-primary-text">Strecke</text>

  <!-- Feedback-Schleife unten -->
  <path class="sem-danger-stroke" d="M 390 120 C 390 162, 90 162, 90 125" fill="none" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lv-r)" />
  <text x="240" y="172" class="code sem-primary-text">SugiyamaLayoutSettings (Standard)</text>

  <!-- Unten: Variante 2 - Organisches Kräfte-Layout (Force-Directed / MDS) -->
  <rect class="sem-success" x="10" y="196" width="460" height="172" rx="10" stroke-width="2" />
  <text x="240" y="222" class="hdr sem-success-text">2. Organisches Kräfte-Layout (Force-Directed)</text>
  <text x="240" y="242" class="sub sem-muted-text">Vermaschte Topologie &#8594; Automatische Nachbarschafts-Cluster</text>

  <!-- Kanten (ungerichtet) -->
  <line class="sem-success-stroke" x1="145" y1="295" x2="75" y2="268" stroke-width="2.5" />
  <line class="sem-success-stroke" x1="145" y1="295" x2="75" y2="325" stroke-width="2.5" />
  <line class="sem-neutral-stroke" x1="145" y1="295" x2="335" y2="295" stroke-width="3" />
  <line class="sem-warning-stroke" x1="335" y1="295" x2="405" y2="268" stroke-width="2.5" />
  <line class="sem-warning-stroke" x1="335" y1="295" x2="405" y2="325" stroke-width="2.5" />

  <!-- Knoten Cluster A -->
  <circle class="sem-success" cx="75" cy="268" r="16" stroke-width="2" />
  <text x="75" y="273" class="code sem-success-text">S1</text>
  <circle class="sem-success" cx="75" cy="325" r="16" stroke-width="2" />
  <text x="75" y="330" class="code sem-success-text">S2</text>
  <rect class="sem-success-stroke" x="112" y="277" width="66" height="34" rx="6" fill="#ffffff" stroke-width="2.5" />
  <text x="145" y="299" class="code sem-success-text">GW-A</text>

  <!-- Knoten Cluster B -->
  <rect class="sem-warning-stroke" x="302" y="277" width="66" height="34" rx="6" fill="#ffffff" stroke-width="2.5" />
  <text x="335" y="299" class="code sem-warning-text">GW-B</text>
  <circle class="sem-warning" cx="405" cy="268" r="16" stroke-width="2" />
  <text x="405" y="273" class="code sem-warning-text">R1</text>
  <circle class="sem-warning" cx="405" cy="325" r="16" stroke-width="2" />
  <text x="405" y="330" class="code sem-warning-text">R2</text>

  <text x="240" y="356" class="code sem-success-text">MdsLayoutSettings (Feder- &amp; Abstoßungskräfte)</text>
</svg>
