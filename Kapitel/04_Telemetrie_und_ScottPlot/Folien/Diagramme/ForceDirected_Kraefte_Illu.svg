<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 15px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="fd-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="fd-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Oben: Anziehende Federkraft zwischen verbundenen Knoten -->
  <rect class="sem-primary" x="15" y="15" width="450" height="165" rx="10" stroke-width="2" />
  <text x="240" y="42" class="hdr sem-primary-text">1. Kanten als Zugfedern (Anziehung)</text>

  <!-- Zickzack-Feder -->
  <polyline class="sem-muted-stroke" points="118,105 145,105 155,88 175,122 195,88 215,122 235,88 255,122 275,88 295,122 315,88 325,105 362,105" fill="none" stroke-width="2.5" />
  <line class="sem-primary-stroke" x1="122" y1="75" x2="185" y2="75" stroke-width="3.5" marker-end="url(#fd-blue)" />
  <line class="sem-primary-stroke" x1="358" y1="75" x2="295" y2="75" stroke-width="3.5" marker-end="url(#fd-blue)" />

  <circle class="sem-primary" cx="95" cy="105" r="24" stroke-width="2.5" />
  <text x="95" y="110" class="code sem-primary-text">v_1</text>
  <circle class="sem-primary" cx="385" cy="105" r="24" stroke-width="2.5" />
  <text x="385" y="110" class="code sem-primary-text">v_2</text>
  <text x="240" y="160" class="code sem-primary-text">Zieht verbundene Nachbarn auf Sollabstand d_0</text>

  <!-- Unten: Abstoßende Coulomb-Kraft zwischen allen Knoten -->
  <rect class="sem-danger" x="15" y="200" width="450" height="165" rx="10" stroke-width="2" />
  <text x="240" y="227" class="hdr sem-danger-text">2. Knoten als gleiche Ladungen (Abstoßung)</text>

  <line class="sem-danger-stroke" x1="145" y1="290" x2="72" y2="290" stroke-width="3.5" marker-end="url(#fd-red)" />
  <line class="sem-danger-stroke" x1="335" y1="290" x2="408" y2="290" stroke-width="3.5" marker-end="url(#fd-red)" />

  <circle class="sem-danger" cx="175" cy="290" r="24" stroke-width="2.5" />
  <text x="175" y="295" class="code sem-danger-text">+q</text>
  <circle class="sem-danger" cx="305" cy="290" r="24" stroke-width="2.5" />
  <text x="305" y="295" class="code sem-danger-text">+q</text>
  <text x="240" y="345" class="code sem-danger-text">Verhindert Überlappung nicht-verbundener Knoten</text>
</svg>
