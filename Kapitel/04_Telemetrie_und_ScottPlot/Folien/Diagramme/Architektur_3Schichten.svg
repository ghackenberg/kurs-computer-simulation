<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 470" width="1110" height="470">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.layer-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: bold; }
      .box-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: bold; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .tag { font-family: 'Consolas', monospace; font-size: 14.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-up" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path class="sem-muted-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Schicht 3 (Oben): Termin 04 - Diagramm- & Graph-Bibliotheken -->
  <rect class="sem-primary" x="20" y="12" width="1070" height="142" rx="12" stroke-width="2.5" />
  <text x="45" y="42" class="layer-title sem-primary-text">Schicht 3 (Termin 04): Spezialisierte Diagramm- &amp; Graph-Bibliotheken</text>

  <!-- ScottPlot Box -->
  <rect class="sem-primary-stroke" x="45" y="56" width="640" height="84" rx="8" fill="#ffffff" stroke-width="2" />
  <text x="195" y="88" class="box-title sem-primary-text">ScottPlot 5 (WpfPlot)</text>
  <text x="195" y="116" class="lbl sem-muted-text">Achsen, Ticks, Legenden, AutoScale, Zoom</text>
  <!-- Mini Plot Icons inside ScottPlot Box -->
  <g transform="translate(380, 64)">
    <rect class="sem-card" x="0" y="0" width="135" height="68" rx="6" stroke-width="1.5" />
    <polyline class="sem-primary-stroke" points="12,46 38,18 65,34 95,12 122,24" fill="none" stroke-width="3" />
    <text x="67" y="61" class="tag sem-primary-text">Signal / Scatter</text>
  </g>
  <g transform="translate(530, 64)">
    <rect class="sem-card" x="0" y="0" width="135" height="68" rx="6" stroke-width="1.5" />
    <rect class="sem-primary-fill" x="18" y="10" width="24" height="30" />
    <rect class="sem-warning-fill" x="44" y="10" width="24" height="30" />
    <rect class="sem-danger-fill" x="70" y="10" width="24" height="30" />
    <rect class="sem-success-fill" x="96" y="10" width="24" height="30" />
    <text x="67" y="61" class="tag sem-warning-text">Heatmap</text>
  </g>

  <!-- MSAGL Box -->
  <rect class="sem-success-stroke" x="715" y="56" width="350" height="84" rx="8" fill="#ffffff" stroke-width="2" />
  <text x="890" y="88" class="box-title sem-success-text">MSAGL (GraphControl)</text>
  <text x="890" y="116" class="lbl sem-muted-text">Sugiyama &amp; Force-Directed Layout</text>

  <!-- Kurze Verbindungspfeile im Zwischenraum Schicht 2 -> Schicht 3 -->
  <line class="sem-primary-stroke" x1="290" y1="192" x2="290" y2="158" stroke-width="3.5" marker-end="url(#arr-blue)" />
  <line class="sem-muted-stroke" x1="890" y1="192" x2="890" y2="158" stroke-width="3.5" marker-end="url(#arr-up)" />

  <!-- Schicht 2 (Mitte): Termin 03 - 2D-Vektorgrafik & Canvas -->
  <rect class="sem-success" x="20" y="194" width="1070" height="122" rx="12" stroke-width="2" />
  <text x="45" y="224" class="layer-title sem-success-text">Schicht 2 (Termin 03): 2D-Vektorgrafik &amp; Koordinatentransformation</text>

  <rect class="sem-success-stroke" x="45" y="238" width="490" height="64" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="290" y="264" class="box-title sem-success-text">Immediate-Mode Vektorpfade (SKCanvas / DrawingVisual)</text>
  <text x="290" y="290" class="tag sem-success-text">DrawLine() · DrawPath() · DrawRect()</text>

  <rect class="sem-success-stroke" x="565" y="238" width="500" height="64" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="815" y="264" class="box-title sem-success-text">Retained-Mode Szenengraph (WPF Canvas &amp; Shapes)</text>
  <text x="815" y="290" class="tag sem-success-text">Path · Rectangle · Ellipse · Hit-Testing</text>

  <!-- Kurze Verbindungspfeile im Zwischenraum Schicht 1 -> Schicht 2 -->
  <line class="sem-muted-stroke" x1="290" y1="350" x2="290" y2="320" stroke-width="3.5" marker-end="url(#arr-up)" />
  <line class="sem-muted-stroke" x1="815" y1="350" x2="815" y2="320" stroke-width="3.5" marker-end="url(#arr-up)" />

  <!-- Schicht 1 (Unten): Termin 02 - Raw Pixel Puffer -->
  <rect class="sem-warning" x="20" y="352" width="1070" height="106" rx="12" stroke-width="2" />
  <text x="45" y="382" class="layer-title sem-warning-text">Schicht 1 (Termin 02): Raw-Pixel-Speicher &amp; Rastergrafik</text>

  <rect class="sem-warning-stroke" x="45" y="394" width="1020" height="50" rx="8" fill="#ffffff" stroke-width="1.8" />
  <text x="555" y="425" class="box-title sem-warning-text">Flacher 32-Bit-Pixelpuffer im RAM (WriteableBitmap.BackBuffer / SKBitmap · uint[] argb)</text>
</svg>
