<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" x="15" y="15" width="450" height="350" rx="10" stroke-width="2" />
  <text x="240" y="42" class="hdr sem-primary-text">Positions-Arithmetik für gruppierte Balken</text>

  <!-- X-Achse -->
  <line class="sem-neutral-stroke" x1="45" y1="265" x2="435" y2="265" stroke-width="2.5" />

  <!-- Gruppen-Zentrum positions[i] (nur im unteren Bereich bis y=150, damit kein Text geschnitten wird) -->
  <line class="sem-danger-stroke" x1="240" y1="155" x2="240" y2="285" stroke-width="2" stroke-dasharray="6,4" />
  <circle class="sem-danger-fill" cx="240" cy="265" r="5" />
  <text x="240" y="305" class="code sem-danger-text">positions[i]</text>

  <!-- Linker Balken (Modell A): pos - width/2 -->
  <rect class="sem-primary-fill sem-primary-stroke" x="105" y="105" width="122" height="160" rx="4" fill-opacity="0.88" stroke-width="2" />
  <circle class="sem-primary-fill" cx="166" cy="265" r="4.5" />
  <text x="166" y="90" class="code sem-primary-text">barsA</text>
  <text x="166" y="155" class="code" fill="#ffffff">pos - width/2</text>
  <text x="166" y="215" class="code sem-info-text">Breite: width</text>

  <!-- Rechter Balken (Modell B): pos + width/2 -->
  <rect class="sem-warning-fill sem-warning-stroke" x="253" y="140" width="122" height="125" rx="4" fill-opacity="0.88" stroke-width="2" />
  <circle class="sem-warning-fill" cx="314" cy="265" r="4.5" />
  <text x="314" y="125" class="code sem-warning-text">barsB</text>
  <text x="314" y="195" class="code" fill="#ffffff">pos + width/2</text>

  <!-- Komplexität unten -->
  <rect class="sem-success" x="35" y="322" width="410" height="30" rx="5" stroke-width="1.5" />
  <text x="240" y="342" class="code sem-success-text">Zeichenaufwand: O(G · M) Vektor-Rechtecke</text>
</svg>
