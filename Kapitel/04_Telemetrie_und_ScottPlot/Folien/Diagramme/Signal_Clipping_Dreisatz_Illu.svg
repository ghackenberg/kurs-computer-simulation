<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="cl-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Oben: Zoom-Fenster auf der Zeitachse [t_min = 5.000 s ... t_max = 5.010 s] -->
  <rect class="sem-primary" x="15" y="15" width="450" height="145" rx="10" stroke-width="2" />
  <text x="240" y="40" class="hdr sem-primary-text">1. Reinzoomen: Sichtbares Zeitfenster [5.000 s ... 5.010 s]</text>

  <!-- Gesamte Zeitachse 0 s bis 10.000 s -->
  <line class="sem-muted-stroke" x1="40" y1="95" x2="440" y2="95" stroke-width="4" />
  <text x="52" y="122" class="code sem-muted-text">0 s</text>
  <text x="420" y="122" class="code sem-muted-text">10.000 s</text>

  <!-- Hervorgehobener Zoom-Ausschnitt in der Mitte -->
  <rect class="sem-success" x="175" y="62" width="130" height="62" rx="6" stroke-width="2.5" />
  <polyline class="sem-success-stroke" points="182,105 202,75 225,98 248,72 272,92 298,80" fill="none" stroke-width="3" />
  <text x="175" y="145" class="code sem-primary-text">t_min = 5.000 s</text>
  <text x="325" y="145" class="code sem-primary-text">t_max = 5.010 s</text>

  <!-- Dreisatz-Pfeile nach unten -->
  <line class="sem-success-stroke" x1="195" y1="160" x2="195" y2="205" stroke-width="3" marker-end="url(#cl-arr)" />
  <line class="sem-success-stroke" x1="285" y1="160" x2="285" y2="205" stroke-width="3" marker-end="url(#cl-arr)" />
  <rect class="sem-success-stroke" x="95" y="170" width="290" height="26" rx="5" fill="#ffffff" stroke-width="1.5" />
  <text x="240" y="188" class="code sem-success-text">Dreisatz: i = (t - t_0) / dt</text>

  <!-- Unten: Array ys[0 ... 9.999.999] im RAM -->
  <rect class="sem-card" x="15" y="212" width="450" height="153" rx="10" stroke-width="2" />
  <text x="240" y="238" class="hdr sem-neutral-text">2. Array-Ausschnitt im RAM (O(1) = Nur 2 Divisionen!)</text>

  <!-- Links ausgegraut -->
  <rect class="sem-muted" x="30" y="254" width="135" height="52" rx="4" stroke-width="1.5" />
  <text x="97" y="276" class="code sem-muted-text">ys[0..4999]</text>
  <text x="97" y="296" class="sub sem-muted-text">Ignoriert!</text>

  <!-- Mitte aktiv (nur 11 Werte!) -->
  <rect class="sem-success" x="170" y="250" width="140" height="60" rx="6" stroke-width="2.5" />
  <text x="240" y="275" class="code sem-success-text">ys[5000..5010]</text>
  <text x="240" y="298" class="sub sem-success-text">Nur 11 Werte gelesen!</text>

  <!-- Rechts ausgegraut -->
  <rect class="sem-muted" x="315" y="254" width="135" height="52" rx="4" stroke-width="1.5" />
  <text x="382" y="276" class="code sem-muted-text">ys[5011..N]</text>
  <text x="382" y="296" class="sub sem-muted-text">Ignoriert!</text>

  <text x="240" y="345" class="code sem-success-text">9.999.989 Punkte werden im RAM gar nicht erst berührt!</text>
</svg>
