<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 470" width="1110" height="470">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      /* @svg-palette:end */
.title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .code { font-family: 'Consolas', monospace; font-size: 15px; font-weight: bold; }
    </style>
    <marker id="arr-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Kachel 1: 5.000 Punkte in einer Pixelspalte p -->
  <rect class="sem-danger" x="15" y="15" width="345" height="440" rx="10" stroke-width="2" />
  <text x="187" y="46" class="title sem-danger-text">1. Naives Zeichnen: 5.000 Linien</text>

  <!-- Pixelspalten-Hintergrund (breit genug für Textabstand) -->
  <rect class="sem-card-stroke" x="45" y="70" width="285" height="310" rx="6" fill="#ffffff" stroke-width="1.5" />
  <rect class="sem-danger" x="115" y="70" width="145" height="310" opacity="0.65"  stroke="none"/>
  <line class="sem-danger-stroke" x1="115" y1="70" x2="115" y2="380" stroke-width="1.5" stroke-dasharray="5,5" />
  <line class="sem-danger-stroke" x1="260" y1="70" x2="260" y2="380" stroke-width="1.5" stroke-dasharray="5,5" />
  <text x="187" y="96" class="lbl sem-danger-text" text-anchor="middle">Pixelspalte p</text>

  <!-- Dichtes Zickzack in Spalte p -->
  <polyline class="sem-danger-stroke" points="60,240 100,220 135,230 140,180 145,290 150,160 155,310 160,200 165,270 170,115 175,330 180,190 185,350 190,150 195,280 200,170 205,300 210,140 215,260 220,210 225,295 230,185 240,215 280,195 315,210" fill="none" stroke-width="2" />
  <text x="187" y="418" class="code sem-danger-text" text-anchor="middle">Scatter: O(N) Übermalungen</text>

  <!-- Kachel 2: Die 4 Kennwerte pro Pixelspalte in Signal -->
  <rect class="sem-primary" x="382" y="15" width="345" height="440" rx="10" stroke-width="2" />
  <text x="554" y="46" class="title sem-primary-text">2. Signal-Reduktion: 4 Eckpunkte</text>

  <rect class="sem-card-stroke" x="412" y="70" width="285" height="310" rx="6" fill="#ffffff" stroke-width="1.5" />
  <rect class="sem-primary" x="470" y="70" width="150" height="310" opacity="0.55"  stroke="none"/>
  <line class="sem-primary-stroke" x1="470" y1="70" x2="470" y2="380" stroke-width="1.5" stroke-dasharray="5,5" />
  <line class="sem-primary-stroke" x1="620" y1="70" x2="620" y2="380" stroke-width="1.5" stroke-dasharray="5,5" />
  <text x="545" y="96" class="lbl sem-primary-text" text-anchor="middle">Pixelspalte p</text>

  <!-- Vertikaler Strich yMin bis yMax -->
  <line class="sem-primary-stroke" x1="545" y1="120" x2="545" y2="345" stroke-width="7" stroke-linecap="round" />

  <!-- 4 Schlüsselpunkte: yEnter, yMax, yMin, yExit -->
  <circle class="sem-success-fill" cx="485" cy="230" r="6.5" stroke="#ffffff" stroke-width="2" />
  <text x="462" y="235" class="code sem-success-text" text-anchor="end">yEnter</text>

  <circle class="sem-danger-fill" cx="545" cy="120" r="6.5" stroke="#ffffff" stroke-width="2" />
  <text x="562" y="125" class="code sem-primary-text" text-anchor="start">yMax</text>

  <circle class="sem-danger-fill" cx="545" cy="345" r="6.5" stroke="#ffffff" stroke-width="2" />
  <text x="562" y="350" class="code sem-primary-text" text-anchor="start">yMin</text>

  <circle class="sem-warning-fill" cx="605" cy="215" r="6.5" stroke="#ffffff" stroke-width="2" />
  <text x="628" y="242" class="code sem-warning-text" text-anchor="start">yExit</text>

  <!-- Übergang zur Nachbarspalte p+1 -->
  <circle class="sem-success-fill" cx="660" cy="145" r="6.5" stroke="#ffffff" stroke-width="2" />
  <line class="sem-success-stroke" x1="605" y1="215" x2="653" y2="152" stroke-width="3" marker-end="url(#arr-g)" />

  <text x="554" y="418" class="code sem-primary-text" text-anchor="middle">yEnter &#8594; yMin &#8594; yMax &#8594; yExit</text>

  <!-- Kachel 3: Nachbarspalten-Verbindung ohne Aliasing -->
  <rect class="sem-success" x="750" y="15" width="345" height="440" rx="10" stroke-width="2" />
  <text x="922" y="46" class="title sem-success-text">3. Ergebnis: Exakte Hüllkurve</text>

  <rect class="sem-card-stroke" x="780" y="70" width="285" height="310" rx="6" fill="#ffffff" stroke-width="1.5" />

  <!-- Vertikale Spalten-Balken + Verbindungsbrücken -->
  <path class="sem-primary-stroke" d="M 800,250 L 800,220 L 800,275 L 800,240 L 840,235 L 840,210 L 840,265 L 840,230 L 880,220 L 880,105 L 880,270 L 880,245 L 920,240 L 920,215 L 920,280 L 920,250 L 960,245 L 960,190 L 960,295 L 960,235 L 1000,230 L 1000,210 L 1000,265 L 1000,240 L 1040,235 L 1040,215 L 1040,260" fill="none" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Hervorhebung Peak-Spalte -->
  <line class="sem-success-stroke" x1="880" y1="105" x2="880" y2="270" stroke-width="6" stroke-linecap="round" />
  <circle class="sem-danger-fill" cx="880" cy="105" r="6.5" />
  <text x="900" y="110" class="lbl sem-danger-text">Peak erhalten!</text>

  <text x="922" y="418" class="code sem-success-text" text-anchor="middle">Max. 4·W Punkte auf GPU: O(W)</text>
</svg>
