<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">VectorField: Richtungsfeld</text>
  <text x="135" y="42" class="sub">Phasenraum dx/dt = f(x)</text>

  <!-- Vector Field Diagram -->
  <g transform="translate(20, 56)">
    <rect width="230" height="190" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Coordinate Cross -->
    <line x1="115" y1="20" x2="115" y2="175" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="15" y1="95" x2="215" y2="95" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5px" font-weight="bold" fill="#475569" text-anchor="middle">Zustand x_2</text>
    <text x="220" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5px" font-weight="bold" fill="#475569" text-anchor="end">x_1</text>

    <!-- Grid of Vector Arrows (Harmonic Oscillator Flow) -->
    <line x1="50" y1="50" x2="70" y2="58" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="80" y1="45" x2="105" y2="52" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="130" y1="45" x2="155" y2="52" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="170" y1="50" x2="190" y2="65" stroke="#3b82f6" stroke-width="1.5" />

    <line x1="45" y1="80" x2="52" y2="105" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="185" y1="110" x2="178" y2="85" stroke="#3b82f6" stroke-width="1.5" />

    <line x1="50" y1="140" x2="35" y2="125" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="85" y1="145" x2="60" y2="138" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="135" y1="145" x2="110" y2="138" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="175" y1="140" x2="155" y2="132" stroke="#3b82f6" stroke-width="1.5" />

    <!-- Trajectory orbiting through field -->
    <ellipse cx="115" cy="95" rx="55" ry="38" fill="none" stroke="#ea580c" stroke-width="2.5" />
    <circle cx="170" cy="95" r="4" fill="#c2410c" />
    <rect x="65" y="84" width="100" height="22" fill="#ffffff" rx="3" stroke="#fed7aa" stroke-width="1" />
    <text x="115" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="13px" font-weight="bold" fill="#ea580c" text-anchor="middle">Trajektorie x(t)</text>
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 258)">
    <rect width="240" height="74" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="24" class="lbl" style="fill: #1d4ed8;">Systemdynamik vorab</text>
    <text x="120" y="46" class="desc" style="font-weight: bold; fill: #1e40af;">Gitter von Tangentenvektoren</text>
    <text x="120" y="66" class="desc" style="fill: #1e3a8a;">Zeigt Attraktoren und Zyklen</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="240" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="364" class="lbl" style="fill: #004B96;">C#-API</text>
  <text x="135" y="388" class="desc" style="font-weight: bold; fill: #334155;">Plot.Add.VectorField(vectors)</text>
</svg>