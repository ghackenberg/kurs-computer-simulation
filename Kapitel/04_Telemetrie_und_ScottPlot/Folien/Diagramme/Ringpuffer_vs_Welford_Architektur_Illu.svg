<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="rw-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="rw-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Oben: Eingehender Messwert x -->
  <rect class="sem-card sem-muted-stroke" x="95" y="12" width="290" height="48" rx="8" stroke-width="2" />
  <text x="240" y="42" class="hdr sem-neutral-text">Neuer Simulationswert x (1.000 Hz)</text>

  <!-- Verzweigungspfeile -->
  <line class="sem-primary-stroke" x1="175" y1="60" x2="115" y2="92" stroke-width="3" marker-end="url(#rw-b)" />
  <line class="sem-success-stroke" x1="305" y1="60" x2="365" y2="92" stroke-width="3" marker-end="url(#rw-g)" />

  <!-- Links: Kurzzeit-Gedächtnis (Ringpuffer) -->
  <rect class="sem-primary" x="-15" y="98" width="242" height="265" rx="10" stroke-width="2" />
  <text x="106" y="124" class="hdr sem-primary-text">1. Kurzzeit-Gedächtnis</text>
  <text x="106" y="146" class="code sem-primary-text">Ringpuffer (DataStreamer)</text>

  <rect class="sem-primary-stroke" x="5" y="162" width="202" height="68" rx="6" fill="#ffffff" stroke-width="1.5" />
  <text x="106" y="188" class="code sem-primary-text">double[500] im RAM</text>
  <text x="106" y="214" class="sub sem-muted-text">Kennt nur letzte 0,5 s</text>

  <rect class="sem-primary" x="5" y="246" width="202" height="100" rx="6" stroke-width="1.5" />
  <text x="106" y="272" class="sub sem-primary-text">Rolle im Dashboard:</text>
  <text x="106" y="298" class="code sem-primary-text">Rollende Signalkurve</text>
  <text x="106" y="324" class="sub sem-muted-text">(Alte Werte überschrieben)</text>

  <!-- Rechts: Langzeit-Gedächtnis (Welford) -->
  <rect class="sem-success" x="253" y="98" width="242" height="265" rx="10" stroke-width="2" />
  <text x="374" y="124" class="hdr sem-success-text">2. Langzeit-Gedächtnis</text>
  <text x="374" y="146" class="code sem-success-text">Welford-Rekursion</text>

  <rect class="sem-success-stroke" x="273" y="162" width="202" height="68" rx="6" fill="#ffffff" stroke-width="1.5" />
  <text x="374" y="188" class="code sem-success-text">Count · Mean · M2</text>
  <text x="374" y="214" class="sub sem-success-text">Nur 3 Zahlen (24 Byte RAM!)</text>

  <rect class="sem-success" x="273" y="246" width="202" height="100" rx="6" stroke-width="1.5" />
  <text x="374" y="272" class="sub sem-success-text">Rolle im Dashboard:</text>
  <text x="374" y="298" class="code sem-success-text">HorizontalLine (&#177;3&#963;)</text>
  <text x="374" y="324" class="code sem-success-text">&amp; Live-Gauß-Kurve</text>
</svg>
