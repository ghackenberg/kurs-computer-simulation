<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .step { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .val { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .idx { font-family: 'Consolas', monospace; font-size: 12.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Kopfbereich: Suchauftrag -->
  <rect class="sem-primary" x="-25" y="10" width="530" height="38" rx="8" stroke-width="2" />
  <text x="240" y="35" class="hdr sem-primary-text">Gesucht in xs[0..7]: Start-Index für Zoom-Grenze t_min = 0.20 s</text>

  <!-- SCHRITT 1 -->
  <rect class="sem-card" x="-25" y="58" width="530" height="96" rx="8" stroke-width="1.5" />
  <text x="-10" y="80" class="step sem-primary-text">1. Schritt: Mitte [3] prüfen &#8594; 0.08 &lt; 0.20 (zu klein &#8594; [0..3] fällt weg!)</text>

  <g transform="translate(-12, 92)">
    <!-- [0..2] fällt weg -->
    <rect class="sem-danger" x="0"   y="0" width="60" height="34" stroke-width="1.5" />
    <text x="30"  y="22" class="val sem-danger-text">0.00</text>
    <text x="30"  y="50" class="idx sem-danger-text">[0]</text>

    <rect class="sem-danger" x="63"  y="0" width="60" height="34" stroke-width="1.5" />
    <text x="93"  y="22" class="val sem-danger-text">0.01</text>
    <text x="93"  y="50" class="idx sem-danger-text">[1]</text>

    <rect class="sem-danger" x="126" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="156" y="22" class="val sem-danger-text">0.03</text>
    <text x="156" y="50" class="idx sem-danger-text">[2]</text>

    <!-- [3] Geprüfte Mitte -->
    <rect class="sem-warning" x="189" y="0" width="60" height="34" stroke-width="2.5" />
    <text x="219" y="22" class="val sem-warning-text">0.08</text>
    <text x="219" y="50" class="idx sem-warning-text">[3] &lt;</text>

    <!-- [4..7] Verbleibende rechte Hälfte -->
    <rect class="sem-primary-stroke" x="252" y="0" width="60" height="34" fill="#ffffff" stroke-width="2" />
    <text x="282" y="22" class="val sem-primary-text">0.20</text>
    <text x="282" y="50" class="idx sem-primary-text">[4]</text>

    <rect class="sem-primary-stroke" x="315" y="0" width="60" height="34" fill="#ffffff" stroke-width="2" />
    <text x="345" y="22" class="val sem-primary-text">0.42</text>
    <text x="345" y="50" class="idx sem-primary-text">[5]</text>

    <rect class="sem-primary-stroke" x="378" y="0" width="60" height="34" fill="#ffffff" stroke-width="2" />
    <text x="408" y="22" class="val sem-primary-text">0.85</text>
    <text x="408" y="50" class="idx sem-primary-text">[6]</text>

    <rect class="sem-primary-stroke" x="441" y="0" width="60" height="34" fill="#ffffff" stroke-width="2" />
    <text x="471" y="22" class="val sem-primary-text">1.50</text>
    <text x="471" y="50" class="idx sem-primary-text">[7]</text>
  </g>

  <!-- SCHRITT 2 -->
  <rect class="sem-card" x="-25" y="164" width="530" height="96" rx="8" stroke-width="1.5" />
  <text x="-10" y="186" class="step sem-warning-text">2. Schritt: Neue Mitte [5] prüfen &#8594; 0.42 &gt; 0.20 (zu groß &#8594; [5..7] fällt weg!)</text>

  <g transform="translate(-12, 198)">
    <!-- [0..3] bereits ausgeschlossen -->
    <rect class="sem-muted sem-card-stroke" x="0"   y="0" width="60" height="34" stroke-width="1.5" />
    <text x="30"  y="22" class="val sem-muted-text">0.00</text>
    <rect class="sem-muted sem-card-stroke" x="63"  y="0" width="60" height="34" stroke-width="1.5" />
    <text x="93"  y="22" class="val sem-muted-text">0.01</text>
    <rect class="sem-muted sem-card-stroke" x="126" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="156" y="22" class="val sem-muted-text">0.03</text>
    <rect class="sem-muted sem-card-stroke" x="189" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="219" y="22" class="val sem-muted-text">0.08</text>

    <!-- [4] bleibt übrig -->
    <rect class="sem-primary-stroke" x="252" y="0" width="60" height="34" fill="#ffffff" stroke-width="2" />
    <text x="282" y="22" class="val sem-primary-text">0.20</text>
    <text x="282" y="50" class="idx sem-primary-text">[4]</text>

    <!-- [5] Geprüfte neue Mitte -->
    <rect class="sem-warning" x="315" y="0" width="60" height="34" stroke-width="2.5" />
    <text x="345" y="22" class="val sem-warning-text">0.42</text>
    <text x="345" y="50" class="idx sem-warning-text">[5] &gt;</text>

    <!-- [6..7] fällt weg -->
    <rect class="sem-danger" x="378" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="408" y="22" class="val sem-danger-text">0.85</text>
    <text x="408" y="50" class="idx sem-danger-text">[6]</text>

    <rect class="sem-danger" x="441" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="471" y="22" class="val sem-danger-text">1.50</text>
    <text x="471" y="50" class="idx sem-danger-text">[7]</text>
  </g>

  <!-- SCHRITT 3 -->
  <rect class="sem-success" x="-25" y="270" width="530" height="98" rx="8" stroke-width="2" />
  <text x="-10" y="292" class="step sem-success-text">3. Schritt: Treffer bei [4] &#8594; xs[4] = 0.20 s (Gefunden in nur 3 Vergleichen!)</text>

  <g transform="translate(-12, 304)">
    <rect class="sem-muted sem-card-stroke" x="0"   y="0" width="60" height="34" stroke-width="1.5" />
    <text x="30"  y="22" class="val sem-muted-text">0.00</text>
    <rect class="sem-muted sem-card-stroke" x="63"  y="0" width="60" height="34" stroke-width="1.5" />
    <text x="93"  y="22" class="val sem-muted-text">0.01</text>
    <rect class="sem-muted sem-card-stroke" x="126" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="156" y="22" class="val sem-muted-text">0.03</text>
    <rect class="sem-muted sem-card-stroke" x="189" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="219" y="22" class="val sem-muted-text">0.08</text>

    <!-- [4] TREFFER -->
    <rect class="sem-success" x="252" y="0" width="60" height="34" stroke-width="3" />
    <text x="282" y="22" class="val sem-success-text">0.20</text>
    <text x="282" y="52" class="idx sem-success-text">[4] Ziel!</text>

    <rect class="sem-muted sem-card-stroke" x="315" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="345" y="22" class="val sem-muted-text">0.42</text>
    <rect class="sem-muted sem-card-stroke" x="378" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="408" y="22" class="val sem-muted-text">0.85</text>
    <rect class="sem-muted sem-card-stroke" x="441" y="0" width="60" height="34" stroke-width="1.5" />
    <text x="471" y="22" class="val sem-muted-text">1.50</text>
  </g>
</svg>
