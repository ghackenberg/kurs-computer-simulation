<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -37 570 455" width="570" height="455">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="sk-arr-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="sk-arr-o" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Links oben: SKPath (Vektorpfad) -->
  <rect class="sem-primary" x="15" y="15" width="218" height="190" rx="10" stroke-width="2" />
  <text x="124" y="40" class="hdr sem-primary-text">1. SKPath (Vektorpfad)</text>
  <rect class="sem-primary-stroke" x="32" y="54" width="184" height="92" rx="6" fill="#ffffff" stroke-width="1.5" />
  <polyline class="sem-primary-stroke" points="48,125 88,72 135,108 175,68 198,92" fill="none" stroke-width="3.5" />
  <circle class="sem-primary-fill" cx="48" cy="125" r="4.5" />
  <circle class="sem-primary-fill" cx="88" cy="72" r="4.5" />
  <circle class="sem-primary-fill" cx="135" cy="108" r="4.5" />
  <circle class="sem-primary-fill" cx="175" cy="68" r="4.5" />
  <circle class="sem-primary-fill" cx="198" cy="92" r="4.5" />
  <text x="124" y="168" class="code sem-primary-text">MoveTo / LineTo / Close</text>
  <text x="124" y="190" class="sub sem-muted-text">Wie Termin 03 (Vektor)</text>

  <!-- Rechts oben: SKBitmap (Raw-Pixel-Puffer) -->
  <rect class="sem-warning" x="247" y="15" width="218" height="190" rx="10" stroke-width="2" />
  <text x="356" y="40" class="hdr sem-warning-text">2. SKBitmap (Pixel-Array)</text>
  <rect class="sem-warning-stroke" x="264" y="54" width="184" height="92" rx="6" fill="#ffffff" stroke-width="1.5" />
  <!-- 4x2 Pixel-Matrix -->
  <g transform="translate(284, 66)">
    <rect class="sem-primary-fill" x="0" y="0" width="34" height="32" />
    <rect class="sem-success-fill" x="36" y="0" width="34" height="32" />
    <rect class="sem-warning-fill" x="72" y="0" width="34" height="32" />
    <rect class="sem-danger-fill" x="108" y="0" width="34" height="32" />
    <rect class="sem-primary-fill" x="0" y="34" width="34" height="32" />
    <rect class="sem-success-fill" x="36" y="34" width="34" height="32" />
    <rect class="sem-warning-fill" x="72" y="34" width="34" height="32" />
    <rect class="sem-danger-fill" x="108" y="34" width="34" height="32" />
  </g>
  <text x="356" y="168" class="code sem-warning-text">32-Bit Pixel (uint[])</text>
  <text x="356" y="190" class="sub sem-muted-text">1:1 wie WriteableBitmap</text>

  <!-- Pfeile nach unten in SKCanvas -->
  <line class="sem-primary-stroke" x1="124" y1="205" x2="124" y2="238" stroke-width="3" marker-end="url(#sk-arr-b)" />
  <line class="sem-warning-stroke" x1="356" y1="205" x2="356" y2="238" stroke-width="3" marker-end="url(#sk-arr-o)" />

  <!-- Unten: SKCanvas (Immediate-Mode Zeichenfläche) -->
  <rect class="sem-success" x="15" y="245" width="450" height="120" rx="10" stroke-width="2.5" />
  <text x="240" y="274" class="hdr sem-success-text">3. SKCanvas (Immediate-Mode Zeichenfläche in WpfPlot)</text>
  <rect class="sem-success-stroke" x="35" y="288" width="410" height="34" rx="6" fill="#ffffff" stroke-width="1.5" />
  <text x="240" y="310" class="code sem-success-text">DrawPath(SKPath)  &#183;  DrawBitmap(SKBitmap)</text>
  <text x="240" y="348" class="sub sem-success-text">Rendert bei Refresh() direkt in 1 Bild (0 WPF-Shape-Objekte!)</text>
</svg>
