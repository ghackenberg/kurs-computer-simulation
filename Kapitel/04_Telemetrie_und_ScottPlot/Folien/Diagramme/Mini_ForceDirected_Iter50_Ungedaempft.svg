<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="280" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arr-red-limit" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="280" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="24" class="hdr">Force-Directed: Naiv Iteration 50</text>
  <text x="140" y="42" class="sub">Ungedämpft: Endloser Grenzzyklus</text>

  <!-- Graphic canvas -->
  <g transform="translate(15, 54)">
    <rect width="250" height="184" rx="6" fill="#fff5f5" stroke="#fca5a5" stroke-width="1" />

    <!-- 1. Limit cycle oscillation path for Hub node -->
    <rect x="55" y="9" width="140" height="20" rx="4" fill="#ffffff" opacity="0.95" stroke="#fca5a5" stroke-width="1" />
    <text x="125" y="23" class="desc" style="fill: #b91c1c; font-size: 11.5px; font-weight: bold; text-anchor: middle;">Oszillations-Spur</text>
    <path d="M 151.3 78.5 L 220.0 136.4 L 108.6 97.2 L 175.4 85.7 L 88.5 123.2 L 30.0 112.2 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7" />

    <!-- 2. Draw Edges -->
    <line x1="194.0" y1="103.5" x2="207.6" y2="160.0" stroke="#f87171" stroke-width="2" />
    <line x1="207.6" y1="160.0" x2="172.8" y2="54.4" stroke="#f87171" stroke-width="2" />
    <line x1="172.8" y1="54.4" x2="130.1" y2="25.0" stroke="#f87171" stroke-width="2" />
    <line x1="130.1" y1="25.0" x2="194.0" y2="103.5" stroke="#f87171" stroke-width="2" />
    <line x1="30.0" y1="112.2" x2="194.0" y2="103.5" stroke="#f87171" stroke-width="2" />
    <line x1="30.0" y1="112.2" x2="207.6" y2="160.0" stroke="#f87171" stroke-width="2" />
    <line x1="30.0" y1="112.2" x2="172.8" y2="54.4" stroke="#f87171" stroke-width="2" />
    <line x1="30.0" y1="112.2" x2="130.1" y2="25.0" stroke="#f87171" stroke-width="2" />

    <!-- 3. Draw Nodes as circles -->
    <circle cx="194.0" cy="103.5" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="207.6" cy="160.0" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="172.8" cy="54.4" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="130.1" cy="25.0" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="30.0" cy="112.2" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.8" />

    <!-- 4. Draw violent remaining force vectors in bold red -->
    <line x1="194.0" y1="103.5" x2="158.5" y2="96.5" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red-limit)" />
    <line x1="207.6" y1="160.0" x2="169.9" y2="155.1" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red-limit)" />
    <line x1="172.8" y1="54.4" x2="161.8" y2="75.8" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red-limit)" />
    <line x1="130.1" y1="25.0" x2="101.4" y2="31.0" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red-limit)" />
    <line x1="30.0" y1="112.2" x2="142.9" y2="96.7" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red-limit)" />
  </g>

  <!-- Explanation Card -->
  <g transform="translate(15, 248)">
    <rect width="250" height="84" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
    <text x="125" y="20" class="lbl" style="fill: #be123c;">Kein Stillstand (Limit Cycle)</text>
    <text x="125" y="38" class="desc" style="fill: #9f1239;">Knoten springen permanent hin und her</text>
    <text x="125" y="54" class="desc" style="fill: #9f1239;">Hohe Restkräfte ||F_net|| treiben Schwingung</text>
    <text x="125" y="72" class="desc" style="font-weight: bold; fill: #e11d48;">System findet niemals Ruhe!</text>
  </g>

  <!-- Summary Footer -->
  <rect x="15" y="342" width="250" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="364" class="lbl" style="fill: #004B96;">Das Oszillations-Dilemma</text>
  <text x="140" y="382" class="desc" style="font-weight: bold; fill: #334155;">Overshooting durch Coulomb-Kräfte (1/d²)</text>
  <text x="140" y="398" class="desc" style="fill: #64748b;">Erfordert zwingend Energiedämpfung!</text>
</svg>
