<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="vf-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="sem-muted-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="tr-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="15" y="15" width="450" height="350" rx="10" stroke-width="2" />
  <text x="240" y="42" class="hdr sem-primary-text">Layer-Prinzip: VectorField O(G_x·G_y) + ScatterLine</text>

  <!-- Plotfeld -->
  <rect class="sem-muted-stroke" x="45" y="58" width="390" height="255" rx="6" fill="#ffffff" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="45" y1="185" x2="435" y2="185" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="240" y1="58" x2="240" y2="313" stroke-width="1.5" />

  <!-- Ebene 1: Grobes Vektorgitter (Richtungsfeld im Hintergrund) -->
  <g class="sem-muted-stroke" stroke-width="2" marker-end="url(#vf-arr)">
    <line x1="90" y1="95" x2="122" y2="95" />
    <line x1="185" y1="95" x2="218" y2="102" />
    <line x1="285" y1="95" x2="312" y2="115" />
    <line x1="375" y1="95" x2="388" y2="128" />

    <line x1="90" y1="155" x2="105" y2="130" />
    <line x1="185" y1="155" x2="210" y2="150" />
    <line x1="285" y1="155" x2="295" y2="180" />
    <line x1="375" y1="155" x2="365" y2="190" />

    <line x1="105" y1="215" x2="95" y2="185" />
    <line x1="185" y1="215" x2="175" y2="192" />
    <line x1="295" y1="215" x2="270" y2="222" />
    <line x1="385" y1="215" x2="355" y2="235" />

    <line x1="110" y1="275" x2="90" y2="245" />
    <line x1="205" y1="275" x2="175" y2="268" />
    <line x1="305" y1="275" x2="272" y2="275" />
    <line x1="395" y1="275" x2="362" y2="275" />
  </g>

  <!-- Ebene 2: Überlagerte Trajektorie im Vordergrund -->
  <path class="sem-warning-stroke" d="M 385,185 C 385,275 115,280 120,185 C 125,105 335,105 330,185 C 326,238 175,238 180,185 C 184,152 275,152 248,182" fill="none" stroke-width="4" marker-end="url(#tr-arr)" />
  <circle class="sem-success-fill" cx="385" cy="185" r="6" stroke="#ffffff" stroke-width="2" />
  <circle class="sem-danger-fill" cx="240" cy="185" r="6" stroke="#ffffff" stroke-width="2" />

  <!-- Legenden-Badges unten -->
  <rect class="sem-muted" x="45" y="324" width="185" height="28" rx="5" stroke-width="1.5" />
  <text x="137" y="343" class="code sem-neutral-text">1. VectorField (Gitter)</text>

  <rect class="sem-warning-stroke sem-warning" x="250" y="324" width="185" height="28" rx="5" stroke-width="1.5"  stroke="none"/>
  <text x="342" y="343" class="code sem-warning-text">2. ScatterLine (Spirale)</text>
</svg>
