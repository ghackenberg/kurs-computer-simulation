<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .cell { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .math { font-family: 'Consolas', monospace; font-size: 14.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Oben: Scatter (2 Arrays: xs und ys) -->
  <rect class="sem-danger" x="15" y="15" width="450" height="160" rx="10" stroke-width="2" />
  <text x="30" y="42" class="hdr sem-danger-text">Scatter(xs, ys) — 2 Arrays im RAM (2·N)</text>

  <!-- xs Array -->
  <text x="52" y="78" class="cell sem-danger-text">xs:</text>
  <g transform="translate(80, 56)">
    <rect class="sem-danger-stroke" x="0" y="0" width="68" height="32" fill="#ffffff" stroke-width="1.5" />
    <text x="34" y="21" class="cell sem-neutral-text">t_0</text>
    <rect class="sem-danger-stroke" x="68" y="0" width="68" height="32" fill="#ffffff" stroke-width="1.5" />
    <text x="102" y="21" class="cell sem-neutral-text">0.01</text>
    <rect class="sem-danger-stroke" x="136" y="0" width="68" height="32" fill="#ffffff" stroke-width="1.5" />
    <text x="170" y="21" class="cell sem-neutral-text">t_i</text>
    <rect class="sem-danger-stroke" x="204" y="0" width="68" height="32" fill="#ffffff" stroke-width="1.5" />
    <text x="238" y="21" class="cell sem-neutral-text">0.03</text>
    <rect class="sem-danger" x="272" y="0" width="85" height="32" stroke-width="1.5" />
    <text x="314" y="21" class="cell sem-danger-text">... N</text>
  </g>

  <!-- ys Array -->
  <text x="52" y="122" class="cell sem-danger-text">ys:</text>
  <g transform="translate(80, 100)">
    <rect class="sem-danger-stroke" x="0" y="0" width="68" height="32" fill="#ffffff" stroke-width="1.5" />
    <text x="34" y="21" class="cell sem-neutral-text">1.24</text>
    <rect class="sem-danger-stroke" x="68" y="0" width="68" height="32" fill="#ffffff" stroke-width="1.5" />
    <text x="102" y="21" class="cell sem-neutral-text">1.85</text>
    <rect class="sem-danger-stroke" x="136" y="0" width="68" height="32" fill="#ffffff" stroke-width="1.5" />
    <text x="170" y="21" class="cell sem-neutral-text">2.10</text>
    <rect class="sem-danger-stroke" x="204" y="0" width="68" height="32" fill="#ffffff" stroke-width="1.5" />
    <text x="238" y="21" class="cell sem-neutral-text">1.92</text>
    <rect class="sem-danger" x="272" y="0" width="85" height="32" stroke-width="1.5" />
    <text x="314" y="21" class="cell sem-danger-text">... N</text>
  </g>
  <text x="240" y="160" class="math sem-danger-text">Kompletter Schleifendurchlauf: O(N)</text>

  <!-- Unten: Signal (1 Array ys + Skalar dt) -->
  <rect class="sem-success" x="15" y="195" width="450" height="170" rx="10" stroke-width="2" />
  <text x="30" y="222" class="hdr sem-success-text">Signal(ys) — Nur 1 Array + Skalar dt (1·N)</text>

  <!-- Skalar Box -->
  <rect class="sem-success" x="30" y="240" width="115" height="58" rx="6" stroke-width="2" />
  <text x="87" y="264" class="cell sem-success-text">Period dt</text>
  <text x="87" y="286" class="cell sem-success-text">XOffset t_0</text>

  <!-- ys Array -->
  <g transform="translate(160, 253)">
    <rect class="sem-success-stroke" x="0" y="0" width="58" height="34" fill="#ffffff" stroke-width="1.5" />
    <text x="29" y="22" class="cell sem-neutral-text">1.24</text>
    <rect class="sem-success-stroke" x="58" y="0" width="58" height="34" fill="#ffffff" stroke-width="1.5" />
    <text x="87" y="22" class="cell sem-neutral-text">1.85</text>
    <rect class="sem-success" x="116" y="0" width="58" height="34" stroke-width="2.5" />
    <text x="145" y="22" class="cell sem-success-text">ys[i]</text>
    <rect class="sem-success-stroke" x="174" y="0" width="58" height="34" fill="#ffffff" stroke-width="1.5" />
    <text x="203" y="22" class="cell sem-neutral-text">1.92</text>
    <rect class="sem-success-stroke" x="232" y="0" width="58" height="34" fill="#ffffff" stroke-width="1.5" />
    <text x="261" y="22" class="cell sem-success-text">... N</text>
  </g>

  <rect class="sem-success-stroke" x="30" y="314" width="420" height="36" rx="6" fill="#ffffff" stroke-width="1.5" />
  <text x="240" y="338" class="math sem-success-text">Direktzugriff in O(1): (t_i - t_0) / dt</text>
</svg>
