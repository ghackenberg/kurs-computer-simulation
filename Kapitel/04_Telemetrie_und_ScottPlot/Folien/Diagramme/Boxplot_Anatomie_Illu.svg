<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .code { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <rect class="sem-card" x="15" y="15" width="450" height="350" rx="10" stroke-width="2" />
  <text x="240" y="42" class="hdr sem-primary-text">Box-Plot: 5 Kennwerte &#8594; O(1) Geometrie pro Box</text>

  <!-- Vertikaler Box-Plot in der Mitte -->
  <!-- Obere Antenne (WhiskerMax) -->
  <line class="sem-primary-stroke" x1="205" y1="78" x2="205" y2="135" stroke-width="3" stroke-dasharray="5,3" />
  <line class="sem-primary-stroke" x1="170" y1="78" x2="240" y2="78" stroke-width="3.5" />
  <text x="260" y="83" class="code sem-primary-text">WhiskerMax</text>

  <!-- Box (Q_1 bis Q_3) -->
  <rect class="sem-primary" x="145" y="135" width="120" height="120" rx="4" stroke-width="3" />
  <text x="280" y="142" class="code sem-primary-text">BoxMax (Q_3, 75%)</text>

  <!-- Median (BoxMiddle, Q_2) -->
  <line class="sem-danger-stroke" x1="145" y1="198" x2="265" y2="198" stroke-width="4.5" />
  <text x="280" y="203" class="code sem-danger-text">BoxMiddle (Q_2)</text>

  <text x="280" y="260" class="code sem-primary-text">BoxMin (Q_1, 25%)</text>

  <!-- IQR Klammer links -->
  <line class="sem-success-stroke" x1="120" y1="135" x2="120" y2="255" stroke-width="2.5" />
  <line class="sem-success-stroke" x1="120" y1="135" x2="133" y2="135" stroke-width="2.5" />
  <line class="sem-success-stroke" x1="120" y1="255" x2="133" y2="255" stroke-width="2.5" />
  <text x="108" y="200" class="lbl sem-success-text" text-anchor="end">IQR (50%)</text>

  <!-- Untere Antenne (WhiskerMin) -->
  <line class="sem-primary-stroke" x1="205" y1="255" x2="205" y2="308" stroke-width="3" stroke-dasharray="5,3" />
  <line class="sem-primary-stroke" x1="170" y1="308" x2="240" y2="308" stroke-width="3.5" />
  <text x="260" y="313" class="code sem-primary-text">WhiskerMin</text>

  <!-- Komplexitäts-Leiste unten (ausreichend breit ohne Randkollision) -->
  <rect class="sem-primary" x="28" y="324" width="424" height="30" rx="5" stroke-width="1.5" />
  <text x="240" y="344" class="code sem-primary-text" text-anchor="middle">Sortieren: O(N log N) · Zeichnen: O(1) pro Box</text>
</svg>
