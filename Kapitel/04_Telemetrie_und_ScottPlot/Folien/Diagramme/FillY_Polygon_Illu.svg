<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-fw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-bw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="15" y="15" width="450" height="350" rx="10" stroke-width="2" />
  <text x="240" y="42" class="hdr sem-primary-text">FillY(xs, yLower, yUpper): Polygon-Konstruktion</text>

  <rect class="sem-muted-stroke" x="35" y="58" width="410" height="240" rx="6" fill="#ffffff" stroke-width="1.5" />

  <!-- Gefülltes Polygon (Vorwärts oben, Rückwärts unten) -->
  <path class="sem-primary-fill" d="M 65,135 L 150,95 L 240,125 L 330,85 L 415,115 L 415,225 L 330,195 L 240,235 L 150,205 L 65,245 Z" fill-opacity="0.45" stroke="none" />

  <!-- Obere Kante: Vorwärts 0 -> N-1 -->
  <path class="sem-primary-stroke" d="M 65,135 L 150,95 L 240,125 L 330,85 L 410,113" fill="none" stroke-width="3.5" marker-end="url(#arr-fw)" />
  <text x="240" y="80" class="code sem-primary-text">1. Vorwärts entlang yUpper[0 ... N-1] &#8594;</text>

  <!-- Rechte Verbindung -->
  <line class="sem-muted-stroke" x1="415" y1="115" x2="415" y2="225" stroke-width="2.5" stroke-dasharray="4,3" />

  <!-- Untere Kante: Rückwärts N-1 -> 0 -->
  <path class="sem-success-stroke" d="M 415,225 L 330,195 L 240,235 L 150,205 L 70,243" fill="none" stroke-width="3.5" marker-end="url(#arr-bw)" />
  <text x="240" y="268" class="code sem-success-text">&#8592; 2. Rückwärts entlang yLower[N-1 ... 0]</text>

  <!-- Sollkurve mu(t) in der Mitte -->
  <path class="sem-primary-stroke" d="M 65,190 L 150,150 L 240,180 L 330,140 L 415,170" fill="none" stroke-width="2.5" stroke-dasharray="5,4" />

  <!-- Fußzeile -->
  <rect class="sem-primary" x="35" y="312" width="410" height="36" rx="6" stroke-width="1.5" />
  <text x="240" y="335" class="code sem-primary-text">1 geschlossener SKPath mit 2·N Eckpunkten in O(N)</text>
</svg>
