<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Oben: 3 Binning-Fälle nebeneinander -->
  <!-- Links: Zu breit -->
  <rect class="sem-danger" x="15" y="15" width="142" height="175" rx="8" stroke-width="1.8" />
  <text x="86" y="38" class="hdr sem-danger-text">h zu groß</text>
  <line class="sem-muted-stroke" x1="28" y1="152" x2="144" y2="152" stroke-width="2" />
  <rect class="sem-danger-fill sem-danger-stroke" x="36" y="95" width="48" height="57" stroke-width="1.5" />
  <rect class="sem-danger-fill sem-danger-stroke" x="86" y="65" width="48" height="87" stroke-width="1.5" />
  <text x="86" y="176" class="code sem-danger-text">Überglättet</text>

  <!-- Mitte: Optimal (Q_3 - Q_1) -->
  <rect class="sem-success" x="169" y="15" width="142" height="175" rx="8" stroke-width="2" />
  <text x="240" y="38" class="hdr sem-success-text">h via Q_3 - Q_1</text>
  <line class="sem-muted-stroke" x1="182" y1="152" x2="298" y2="152" stroke-width="2" />
  <rect class="sem-success-fill sem-success-stroke" x="188" y="130" width="18" height="22" stroke-width="1.2" />
  <rect class="sem-success-fill sem-success-stroke" x="208" y="98" width="18" height="54" stroke-width="1.2" />
  <rect class="sem-success-fill sem-success-stroke" x="228" y="62" width="18" height="90" stroke-width="1.2" />
  <rect class="sem-success-fill sem-success-stroke" x="248" y="88" width="18" height="64" stroke-width="1.2" />
  <rect class="sem-success-fill sem-success-stroke" x="268" y="122" width="18" height="30" stroke-width="1.2" />
  <text x="240" y="176" class="code sem-success-text">Optimal (IQR)</text>

  <!-- Rechts: Zu schmal -->
  <rect class="sem-warning" x="323" y="15" width="142" height="175" rx="8" stroke-width="1.8" />
  <text x="394" y="38" class="hdr sem-warning-text">h zu klein</text>
  <line class="sem-muted-stroke" x1="336" y1="152" x2="452" y2="152" stroke-width="2" />
  <g class="sem-warning-fill sem-warning-stroke" stroke-width="1">
    <rect x="342" y="125" width="6" height="27" />
    <rect x="352" y="142" width="6" height="10" />
    <rect x="362" y="85" width="6" height="67" />
    <rect x="372" y="132" width="6" height="20" />
    <rect x="382" y="60" width="6" height="92" />
    <rect x="392" y="115" width="6" height="37" />
    <rect x="402" y="68" width="6" height="84" />
    <rect x="412" y="138" width="6" height="14" />
    <rect x="422" y="95" width="6" height="57" />
    <rect x="432" y="128" width="6" height="24" />
  </g>
  <text x="394" y="176" class="code sem-warning-text">Verrauscht</text>

  <!-- Unten: Zweistufige Pipeline O(N) Binning -> O(k) Bars -->
  <rect class="sem-primary" x="15" y="208" width="450" height="157" rx="10" stroke-width="2" />
  <text x="240" y="236" class="hdr sem-primary-text">Zweistufige Pipeline in ScottPlot 5</text>

  <rect class="sem-primary-stroke" x="32" y="255" width="185" height="88" rx="8" fill="#ffffff" stroke-width="2" />
  <text x="124" y="284" class="hdr sem-primary-text">1. Zählen (Binning)</text>
  <text x="124" y="312" class="code sem-primary-text">N = 10.000 &#8594; O(N)</text>
  <text x="124" y="332" class="code sem-muted-text">Einmalig im RAM</text>

  <path class="sem-primary-stroke" d="M 225 298 L 255 298" stroke-width="3" />
  <polygon class="sem-primary-fill" points="260,298 250,292 250,304" />

  <rect class="sem-success-stroke" x="265" y="255" width="185" height="88" rx="8" fill="#ffffff" stroke-width="2" />
  <text x="357" y="284" class="hdr sem-success-text">2. Zeichnen (Bars)</text>
  <text x="357" y="312" class="code sem-success-text">Nur k = 24 &#8594; O(k)</text>
  <text x="357" y="332" class="code sem-muted-text">24 Rechtecke pro Frame</text>
</svg>
