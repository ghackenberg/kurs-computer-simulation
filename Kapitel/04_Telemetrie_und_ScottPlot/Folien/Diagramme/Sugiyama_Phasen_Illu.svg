<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .node { font-family: 'Consolas', monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="sg-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path class="sem-muted-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="sg-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- 1. Cycle Removal -->
  <rect class="sem-card sem-primary-stroke" x="15" y="15" width="215" height="165" rx="10" stroke-width="2" />
  <text x="122" y="38" class="hdr sem-primary-text">1. Cycle Removal</text>
  <line class="sem-muted-stroke" x1="78" y1="95" x2="152" y2="95" stroke-width="2.5" marker-end="url(#sg-arr)" />
  <path class="sem-danger-stroke" d="M 65 112 Q 122 155 168 112" fill="none" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#sg-red)" />
  <circle class="sem-primary" cx="62" cy="95" r="16" stroke-width="2" />
  <text x="62" y="100" class="node sem-primary-text">A</text>
  <circle class="sem-primary" cx="175" cy="95" r="16" stroke-width="2" />
  <text x="175" y="100" class="node sem-primary-text">B</text>

  <!-- 2. Layering (L_1, L_2, L_3) -->
  <rect class="sem-card sem-primary-stroke" x="250" y="15" width="215" height="165" rx="10" stroke-width="2" />
  <text x="357" y="38" class="hdr sem-primary-text">2. Layering (L_1..L_3)</text>
  <line class="sem-card-stroke" x1="290" y1="55" x2="290" y2="145" stroke-width="2" stroke-dasharray="4,4" />
  <line class="sem-card-stroke" x1="357" y1="55" x2="357" y2="145" stroke-width="2" stroke-dasharray="4,4" />
  <line class="sem-card-stroke" x1="424" y1="55" x2="424" y2="145" stroke-width="2" stroke-dasharray="4,4" />
  <line class="sem-muted-stroke" x1="304" y1="105" x2="340" y2="85" stroke-width="2" marker-end="url(#sg-arr)" />
  <line class="sem-muted-stroke" x1="372" y1="85" x2="408" y2="105" stroke-width="2" marker-end="url(#sg-arr)" />
  <circle class="sem-primary" cx="290" cy="105" r="14" stroke-width="2" />
  <circle class="sem-primary" cx="357" cy="80" r="14" stroke-width="2" />
  <circle class="sem-primary" cx="424" cy="105" r="14" stroke-width="2" />
  <text x="290" y="166" class="node sem-primary-text">L_1</text>
  <text x="357" y="166" class="node sem-primary-text">L_2</text>
  <text x="424" y="166" class="node sem-primary-text">L_3</text>

  <!-- 3. Crossing Minimization -->
  <rect class="sem-card sem-success-stroke" x="15" y="200" width="215" height="165" rx="10" stroke-width="2" />
  <text x="122" y="223" class="hdr sem-success-text">3. Crossing Minimization</text>
  <!-- Vorher: Kreuzung (links gedimmt) -->
  <line class="sem-danger-stroke" x1="45" y1="260" x2="95" y2="325" stroke-width="2" />
  <line class="sem-danger-stroke" x1="45" y1="325" x2="95" y2="260" stroke-width="2" />
  <!-- Nachher: Parallel (rechts grün) -->
  <line class="sem-success-stroke" x1="145" y1="260" x2="198" y2="260" stroke-width="2.5" marker-end="url(#sg-arr)" />
  <line class="sem-success-stroke" x1="145" y1="325" x2="198" y2="325" stroke-width="2.5" marker-end="url(#sg-arr)" />
  <circle class="sem-success" cx="145" cy="260" r="11" stroke-width="2" />
  <circle class="sem-success" cx="145" cy="325" r="11" stroke-width="2" />
  <circle class="sem-success" cx="205" cy="260" r="11" stroke-width="2" />
  <circle class="sem-success" cx="205" cy="325" r="11" stroke-width="2" />

  <!-- 4. Spline Routing -->
  <rect class="sem-card sem-success-stroke" x="250" y="200" width="215" height="165" rx="10" stroke-width="2" />
  <text x="357" y="223" class="hdr sem-success-text">4. Spline Routing</text>
  <rect class="sem-primary" x="272" y="268" width="44" height="30" rx="5" stroke-width="2" />
  <rect class="sem-warning" x="336" y="268" width="44" height="30" rx="5" stroke-width="2" />
  <rect class="sem-primary" x="400" y="268" width="44" height="30" rx="5" stroke-width="2" />
  <line class="sem-muted-stroke" x1="316" y1="283" x2="332" y2="283" stroke-width="2" marker-end="url(#sg-arr)" />
  <line class="sem-muted-stroke" x1="380" y1="283" x2="396" y2="283" stroke-width="2" marker-end="url(#sg-arr)" />
  <path class="sem-primary-stroke" d="M 422 298 C 422 342, 294 342, 294 302" fill="none" stroke-width="2.5" marker-end="url(#sg-arr)" />
</svg>
