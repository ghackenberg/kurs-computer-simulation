<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <rect class="sem-card" x="15" y="15" width="450" height="350" rx="10" stroke-width="2" />
  <text x="240" y="42" class="hdr sem-primary-text">Live-Monitoring: HorizontalLine mit Welford</text>

  <!-- Plotfläche -->
  <rect class="sem-muted-stroke" x="35" y="58" width="410" height="240" rx="6" fill="#ffffff" stroke-width="1.5" />

  <!-- 3-Sigma Band Hintergrund -->
  <rect class="sem-success" x="36" y="105" width="408" height="145" opacity="0.55"  stroke="none"/>

  <!-- Obere Grenze: Mean + 3*StdDev -->
  <line class="sem-danger-stroke" x1="35" y1="105" x2="445" y2="105" stroke-width="2.5" stroke-dasharray="6,4" />
  <text x="45" y="96" class="code sem-danger-text">Obere Linie: Mean + 3·StdDev</text>

  <!-- Mittelwert: Mean -->
  <line class="sem-success-stroke" x1="35" y1="178" x2="445" y2="178" stroke-width="2.5" />
  <text x="45" y="170" class="code sem-success-text">Mittelwert-Linie: Mean</text>

  <!-- Untere Grenze: Mean - 3*StdDev -->
  <line class="sem-danger-stroke" x1="35" y1="250" x2="445" y2="250" stroke-width="2.5" stroke-dasharray="6,4" />
  <text x="45" y="270" class="code sem-danger-text">Untere Linie: Mean - 3·StdDev</text>

  <!-- Live-Messsignal mit Ausreißer-Peak -->
  <polyline class="sem-primary-stroke" points="45,182 80,165 115,192 150,170 185,188 220,160 255,185 290,172 325,72 355,190 390,175 430,180" fill="none" stroke-width="3" />
  <circle class="sem-danger-fill" cx="325" cy="72" r="7" stroke="#ffffff" stroke-width="2" />
  <text x="340" y="77" class="code sem-danger-text">Alarm!</text>

  <!-- Fußzeile: Welford O(1) -->
  <rect class="sem-primary" x="35" y="312" width="410" height="36" rx="6" stroke-width="1.5" />
  <text x="240" y="335" class="code sem-primary-text" text-anchor="middle">3 Ebenen: DataStreamer + HorizontalLine + Alarm</text>
</svg>
