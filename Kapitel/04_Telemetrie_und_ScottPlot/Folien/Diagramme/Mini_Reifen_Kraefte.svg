<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #004B96; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="270" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="24" class="hdr">Kräfte am Reifen</text>
  <text x="135" y="42" class="sub">Von mu(s) zur Beschleunigung</text>

  <!-- Canvas Graphic: Forces at Tire -->
  <g transform="translate(20, 56)">
    <rect width="230" height="186" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Road Surface -->
    <line x1="15" y1="140" x2="215" y2="140" stroke="#334155" stroke-width="3" />
    <line x1="25" y1="146" x2="35" y2="154" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="65" y1="146" x2="75" y2="154" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="105" y1="146" x2="115" y2="154" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="145" y1="146" x2="155" y2="154" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="185" y1="146" x2="195" y2="154" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Tire Outer Circle (Center at 76, 80, Radius 52) -->
    <circle cx="76" cy="80" r="52" fill="#334155" />
    <circle cx="76" cy="80" r="32" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <circle cx="76" cy="80" r="8" fill="#0f172a" />

    <!-- Normal Force F_z (pointing down to axle) -->
    <line x1="76" y1="12" x2="76" y2="58" stroke="#dc2626" stroke-width="2.5" />
    <polygon points="76,64 72,54 80,54" fill="#dc2626" />
    <rect x="28" y="10" width="96" height="16" rx="2" fill="#ffffff" />
    <text x="76" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#dc2626" text-anchor="middle">F_z = m * g</text>

    <!-- Longitudinal Friction Force F_x (at contact patch pointing right) -->
    <line x1="76" y1="140" x2="140" y2="140" stroke="#16a34a" stroke-width="3" />
    <polygon points="146,140 137,135 137,145" fill="#16a34a" />
    <rect x="135" y="148" width="86" height="18" rx="2" fill="#ffffff" />
    <text x="178" y="161" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#16a34a" text-anchor="middle">F_x = mu(s)*F_z</text>

    <!-- Acceleration Result a_x (at vehicle center pointing right) -->
    <line x1="76" y1="80" x2="135" y2="80" stroke="#004B96" stroke-width="2.5" />
    <polygon points="141,80 132,76 132,84" fill="#004B96" />
    <rect x="136" y="66" width="82" height="18" rx="2" fill="#ffffff" />
    <text x="177" y="79" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#004B96" text-anchor="middle">a_x = mu(s)*g</text>
  </g>

  <!-- Calculation Card -->
  <g transform="translate(15, 252)">
    <rect width="240" height="76" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" />
    <text x="120" y="20" class="lbl" style="fill: #c2410c;">Newton: Masse m kürzt sich!</text>
    <text x="120" y="42" class="desc" style="font-weight: bold; fill: #9a3412;">m * a_x = F_x = mu(s) * m * g</text>
    <text x="120" y="62" class="desc" style="fill: #ea580c;">a_x = mu(s) * g  [m/s^2]</text>
  </g>

  <!-- Lateral Extension Card -->
  <rect x="15" y="336" width="240" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="356" class="lbl" style="fill: #004B96;">Telemetrie-Bedeutung</text>
  <text x="135" y="376" class="desc" style="font-weight: bold; fill: #15803d;">a_x / g = mu(s)</text>
  <text x="135" y="394" class="desc" style="fill: #475569;">G-Kraft entspricht Reibwert!</text>
</svg>