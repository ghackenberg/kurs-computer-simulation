<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arr-mr1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
    <marker id="arr-mr2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <!-- Links/Oben: Schneller Simulations-Thread (1000 Hz) -->
  <rect class="sem-primary" x="20" y="18" width="440" height="95" rx="10" stroke-width="2" />
  <text x="240" y="46" class="hdr sem-primary-text">1. Simulations-Task (1.000 Hz · 1 ms)</text>
  <text x="240" y="74" class="code sem-primary-text">Berechnet y &#8594; _streamer.Add(y)</text>
  <text x="240" y="98" class="code sem-danger-text">Kein WpfPlot1.Refresh() hier!</text>

  <!-- Pfeil in den Puffer -->
  <line class="sem-primary-stroke" x1="240" y1="113" x2="240" y2="148" stroke-width="3.5" marker-end="url(#arr-mr1)" />

  <!-- Mitte: Ringpuffer / DataStreamer -->
  <rect class="sem-warning" x="75" y="152" width="330" height="72" rx="10" stroke-width="2" />
  <text x="240" y="182" class="hdr sem-warning-text">Puffer im RAM (DataStreamer)</text>
  <text x="240" y="208" class="code sem-warning-text">20 neue Punkte pro UI-Frame</text>

  <!-- Pfeil zum UI-Timer -->
  <line class="sem-success-stroke" x1="240" y1="224" x2="240" y2="259" stroke-width="3.5" marker-end="url(#arr-mr2)" />

  <!-- Unten: Langsamer UI-Timer (50 Hz) -->
  <rect class="sem-success" x="20" y="264" width="440" height="98" rx="10" stroke-width="2" />
  <text x="240" y="292" class="hdr sem-success-text">2. WPF DispatcherTimer (50 Hz · 20 ms)</text>
  <text x="240" y="320" class="code sem-success-text">OnUiTimerTick &#8594; WpfPlot1.Refresh()</text>
  <text x="240" y="344" class="code sem-success-text">Zeichnet nur 50-mal pro Sekunde neu</text>
</svg>
