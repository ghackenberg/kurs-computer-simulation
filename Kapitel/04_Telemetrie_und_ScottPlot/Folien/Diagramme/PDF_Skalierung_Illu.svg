<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .code { font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; }
    </style>
    <marker id="arr-up-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 9 5 L 0 8.5 z" />
    </marker>
  </defs>

  <rect class="sem-card" x="15" y="15" width="450" height="350" rx="10" stroke-width="2" />
  <text x="240" y="42" class="hdr sem-primary-text">Skalierung der Gauß-Dichte f(x) auf Balkenhöhe</text>

  <!-- Achsen -->
  <line class="sem-neutral-stroke" x1="75" y1="300" x2="435" y2="300" stroke-width="2.5" />
  <line class="sem-neutral-stroke" x1="75" y1="65" x2="75" y2="300" stroke-width="2.5" />
  <text x="65" y="85" class="code sem-primary-text" text-anchor="end">1200</text>
  <text x="65" y="192" class="code sem-primary-text" text-anchor="end">600</text>
  <text x="65" y="300" class="code sem-neutral-text" text-anchor="end">0</text>

  <!-- Histogramm-Balken (Absolute Häufigkeit) -->
  <g class="sem-primary-fill sem-primary-stroke" fill-opacity="0.22" stroke-width="1.5">
    <rect x="105" y="270" width="36" height="30" />
    <rect x="145" y="215" width="36" height="85" />
    <rect x="185" y="135" width="36" height="165" />
    <rect x="225" y="80" width="36" height="220" />
    <rect x="265" y="130" width="36" height="170" />
    <rect x="305" y="210" width="36" height="90" />
    <rect x="345" y="265" width="36" height="35" />
  </g>

  <!-- Unskalierte Dichte f(x) <= 0.08 klebt flach auf der X-Achse -->
  <line class="sem-muted-stroke" x1="95" y1="297" x2="415" y2="297" stroke-width="3.5" stroke-dasharray="6,4" />

  <!-- Skalierte Kurve cy = pdf * n * binWidth -->
  <path class="sem-danger-stroke" d="M 95,294 C 145,285 190,78 243,78 C 296,78 340,285 395,294" fill="none" stroke-width="4" />

  <!-- Skalierungspfeil * (n * binWidth) -->
  <line class="sem-danger-stroke" x1="243" y1="290" x2="243" y2="96" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arr-up-red)" />
  <rect class="sem-danger-stroke" x="295" y="72" width="140" height="30" rx="6" fill="#ffffff" stroke-width="1.8" />
  <text x="365" y="92" class="code sem-danger-text" text-anchor="middle">&#183; n &#183; binWidth</text>

  <rect class="sem-primary" x="60" y="316" width="360" height="34" rx="6" stroke-width="1.5" />
  <text x="240" y="338" class="code sem-primary-text" text-anchor="middle">A_Balken = n &#183; binWidth (pdf)</text>
</svg>
