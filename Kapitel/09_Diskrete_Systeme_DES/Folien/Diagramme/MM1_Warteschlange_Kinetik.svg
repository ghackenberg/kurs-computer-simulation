<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Pfeilspitzen -->
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803D" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C2410C" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1D4ED8" />
    </marker>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Hauptrahmen & Hintergrund -->
  <rect x="5" y="5" width="950" height="370" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Titelbanner -->
  <rect x="5" y="5" width="950" height="42" rx="12" fill="#F8FAFC" />
  <rect x="5" y="32" width="950" height="15" fill="#F8FAFC" />
  <line x1="5" y1="47" x2="955" y2="47" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="20" y="30" font-size="16" font-weight="700" fill="#004B96">M/M/1-Warteschlangensystem: Kinetik, Markov-Kette &amp; Little's Gesetz</text>
  
  <rect x="715" y="12" width="225" height="24" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2" />
  <text x="827" y="28" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Geburts- und Todesprozess (BDP)</text>

  <!-- ========================================================================= -->
  <!-- 1. BEREICH OBEN: MARKOV-ZUSTANDSKETTE                                     -->
  <!-- ========================================================================= -->
  <rect x="15" y="52" width="930" height="138" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
  
  <!-- Header-Band für Zone 1 -->
  <rect x="15" y="52" width="930" height="24" rx="8" fill="#F1F5F9" />
  <rect x="15" y="64" width="930" height="12" fill="#F1F5F9" />
  <line x1="15" y1="76" x2="945" y2="76" stroke="#E2E8F0" stroke-width="1" />
  <text x="25" y="68" font-size="12" font-weight="700" fill="#334155">Markov-Zustandsgraph: Kontinuierlicher Geburts- und Todesprozess</text>
  <text x="805" y="68" font-size="12" font-weight="700" fill="#15803D" text-anchor="end">Grün: Ankunft λ  |</text>
  <text x="935" y="68" font-size="12" font-weight="700" fill="#C2410C" text-anchor="end">Orange: Bedienung μ</text>

  <!-- Zustände (Kreise bei cy=130) -->
  <!-- Zustand 0 -->
  <circle cx="85" cy="130" r="21" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.2" />
  <text x="85" y="135" font-size="15" font-weight="700" fill="#0284C7" text-anchor="middle">0</text>
  <rect x="62" y="157" width="46" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="85" y="170" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">leer</text>

  <!-- Zustand 1 -->
  <circle cx="215" cy="130" r="21" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.2" />
  <text x="215" y="135" font-size="15" font-weight="700" fill="#0284C7" text-anchor="middle">1</text>
  <rect x="187" y="157" width="56" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="215" y="170" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">1 Kunde</text>

  <!-- Zustand 2 -->
  <circle cx="345" cy="130" r="21" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.2" />
  <text x="345" y="135" font-size="15" font-weight="700" fill="#0284C7" text-anchor="middle">2</text>
  <rect x="314" y="157" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="345" y="170" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">2 Kunden</text>

  <!-- Zustand 3 -->
  <circle cx="475" cy="130" r="21" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.2" />
  <text x="475" y="135" font-size="15" font-weight="700" fill="#0284C7" text-anchor="middle">3</text>
  <rect x="444" y="157" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="475" y="170" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">3 Kunden</text>

  <!-- Auslassungspunkte Mitte -->
  <text x="555" y="135" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">• • •</text>

  <!-- Zustand k -->
  <circle cx="645" cy="130" r="21" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.2" />
  <text x="645" y="135" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">k</text>
  <rect x="614" y="157" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="645" y="170" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">k Kunden</text>

  <!-- Zustand k+1 -->
  <circle cx="785" cy="130" r="21" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.2" />
  <text x="785" y="135" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">k+1</text>
  <rect x="748" y="157" width="74" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="785" y="170" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">k+1 Kunden</text>

  <!-- Auslassungspunkte Ende -->
  <text x="870" y="135" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">• • •</text>
  <rect x="844" y="157" width="52" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="870" y="170" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">k → ∞</text>

  <!-- Vorwärts-Pfeile λ (oben) -->
  <!-- 0 -> 1 -->
  <path d="M 103 115 Q 150 94 195 115" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arr-green)" />
  <rect x="139" y="85" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="150" y="98" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">λ</text>

  <!-- 1 -> 2 -->
  <path d="M 233 115 Q 280 94 325 115" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arr-green)" />
  <rect x="269" y="85" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="280" y="98" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">λ</text>

  <!-- 2 -> 3 -->
  <path d="M 363 115 Q 410 94 455 115" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arr-green)" />
  <rect x="399" y="85" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="410" y="98" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">λ</text>

  <!-- 3 -> dots -->
  <path d="M 493 115 Q 518 99 538 114" fill="none" stroke="#15803D" stroke-width="1.8" marker-end="url(#arr-green)" />
  <rect x="506" y="88" width="18" height="16" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="515" y="100" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">λ</text>

  <!-- dots -> k -->
  <path d="M 578 114 Q 600 99 625 115" fill="none" stroke="#15803D" stroke-width="1.8" marker-end="url(#arr-green)" />
  <rect x="593" y="88" width="18" height="16" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="602" y="100" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">λ</text>

  <!-- k -> k+1 -->
  <path d="M 663 115 Q 715 94 765 115" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arr-green)" />
  <rect x="704" y="85" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="715" y="98" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">λ</text>

  <!-- k+1 -> dots -->
  <path d="M 803 115 Q 828 99 848 114" fill="none" stroke="#15803D" stroke-width="1.8" marker-end="url(#arr-green)" />
  <rect x="817" y="88" width="18" height="16" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="826" y="100" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">λ</text>

  <!-- Rückwärts-Pfeile μ (unten) -->
  <!-- 1 -> 0 -->
  <path d="M 197 145 Q 150 166 105 145" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arr-orange)" />
  <rect x="139" y="154" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
  <text x="150" y="167" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">μ</text>

  <!-- 2 -> 1 -->
  <path d="M 327 145 Q 280 166 235 145" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arr-orange)" />
  <rect x="269" y="154" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
  <text x="280" y="167" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">μ</text>

  <!-- 3 -> 2 -->
  <path d="M 457 145 Q 410 166 365 145" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arr-orange)" />
  <rect x="399" y="154" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
  <text x="410" y="167" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">μ</text>

  <!-- dots -> 3 -->
  <path d="M 538 145 Q 518 159 495 145" fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#arr-orange)" />
  <rect x="506" y="153" width="18" height="16" rx="3" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
  <text x="515" y="165" font-size="12" font-weight="700" fill="#C2410C" text-anchor="middle">μ</text>

  <!-- k -> dots -->
  <path d="M 625 145 Q 600 159 578 145" fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#arr-orange)" />
  <rect x="593" y="153" width="18" height="16" rx="3" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
  <text x="602" y="165" font-size="12" font-weight="700" fill="#C2410C" text-anchor="middle">μ</text>

  <!-- k+1 -> k -->
  <path d="M 765 145 Q 715 166 665 145" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arr-orange)" />
  <rect x="704" y="154" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
  <text x="715" y="167" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">μ</text>

  <!-- dots -> k+1 -->
  <path d="M 848 145 Q 828 159 805 145" fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#arr-orange)" />
  <rect x="817" y="153" width="18" height="16" rx="3" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
  <text x="826" y="165" font-size="12" font-weight="700" fill="#C2410C" text-anchor="middle">μ</text>

  <!-- ========================================================================= -->
  <!-- 2. BEREICH MITTE: PHYSISCHES SCHEMA & FLUSSGLEICHGEWICHT                  -->
  <!-- ========================================================================= -->
  <!-- Links: Physisches Schema der Warteschlange -->
  <rect x="15" y="196" width="525" height="74" rx="8" fill="#F0F7FF" stroke="#BFDBFE" stroke-width="1.2" />
  
  <!-- Umrahmung Gesamtsystem (gestrichelt) -->
  <rect x="90" y="202" width="315" height="62" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="150" y="197" width="195" height="16" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
  <text x="247" y="209" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Gesamtsystem (N Kunden, Zeit W)</text>

  <!-- Ankunftspfeil -->
  <line x1="22" y1="233" x2="88" y2="233" stroke="#15803D" stroke-width="2.5" marker-end="url(#arr-green)" />
  <rect x="25" y="215" width="60" height="16" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="55" y="227" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Zustrom λ</text>

  <!-- Warteschlange (FIFO-Puffer) -->
  <rect x="100" y="218" width="130" height="30" rx="4" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5" />
  <line x1="132" y1="218" x2="132" y2="248" stroke="#0284C7" stroke-width="1.2" />
  <line x1="165" y1="218" x2="165" y2="248" stroke="#0284C7" stroke-width="1.2" />
  <line x1="198" y1="218" x2="198" y2="248" stroke="#0284C7" stroke-width="1.2" />
  <circle cx="116" cy="233" r="8" fill="#93C5FD" />
  <circle cx="148" cy="233" r="8" fill="#93C5FD" />
  <circle cx="181" cy="233" r="8" fill="#93C5FD" />
  <text x="165" y="260" font-size="12" font-weight="600" fill="#0369A1" text-anchor="middle">Warteschlange (L_q, W_q)</text>

  <!-- Pfeil Puffer -> Server -->
  <line x1="232" y1="233" x2="268" y2="233" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)" />

  <!-- Server (Bedienstation) -->
  <circle cx="295" cy="233" r="16" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
  <circle cx="295" cy="233" r="6" fill="#F59E0B" />
  <text x="295" y="260" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Server (μ)</text>

  <!-- Pfeil Server -> Abgang -->
  <line x1="313" y1="233" x2="390" y2="233" stroke="#15803D" stroke-width="2" marker-end="url(#arr-green)" />
  <line x1="407" y1="233" x2="518" y2="233" stroke="#15803D" stroke-width="2.5" marker-end="url(#arr-green)" />
  <rect x="425" y="222" width="75" height="20" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="462" y="236" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Abgang (bedient)</text>

  <!-- Rechts: Ratenbilanz / Flussgleichgewicht Box -->
  <rect x="548" y="196" width="397" height="74" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
  <rect x="558" y="202" width="220" height="18" rx="3" fill="#DCFCE7" />
  <text x="668" y="215" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Globale Ratenbilanz (Flussgleichgewicht)</text>
  
  <text x="560" y="235" font-size="13" font-weight="700" fill="#15803D">λ · P_k = μ · P_{k+1}</text>
  <text x="735" y="235" font-size="12" font-weight="600" fill="#334155">⇒  P_{k+1} = (λ/μ) · P_k = ρ · P_k</text>

  <text x="560" y="258" font-size="12" font-weight="700" fill="#047857">Zustandswahrsch.:</text>
  <rect x="690" y="244" width="240" height="22" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
  <text x="810" y="259" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">P_k = (1 - ρ) · ρ^k    (k ∈ ℕ_0)</text>

  <!-- ========================================================================= -->
  <!-- 3. BEREICH UNTEN: KENNWERTE, LITTLE'S GESETZ & FORMELN                    -->
  <!-- ========================================================================= -->
  <!-- Karte 1: Auslastung & Stabilität -->
  <rect x="15" y="278" width="275" height="92" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="25" y="284" width="255" height="20" rx="4" fill="#E2E8F0" />
  <text x="152" y="298" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Auslastung &amp; Stabilität</text>

  <rect x="25" y="308" width="255" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="152" y="324" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">ρ = λ / μ &lt; 1  (Traffic Intensity)</text>

  <text x="25" y="347" font-size="12" font-weight="600" fill="#DC2626">• Wenn ρ ≥ 1: Warteschlange divergiert → ∞!</text>
  <text x="25" y="362" font-size="12" font-weight="600" fill="#059669">• Leerwahrscheinlichkeit: P_0 = 1 - ρ</text>

  <!-- Karte 2: Gesetz von Little -->
  <rect x="298" y="278" width="310" height="92" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.2" />
  <rect x="308" y="284" width="290" height="20" rx="4" fill="#FDE68A" />
  <text x="453" y="298" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Little's Gesetz (Little's Law)</text>

  <rect x="308" y="308" width="290" height="24" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1" />
  <text x="453" y="324" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">L = λ · W   und   L_q = λ · W_q</text>

  <text x="308" y="347" font-size="12" font-weight="500" fill="#78350F">• Gilt exakt und verteilungsfrei für alle Wartesysteme</text>
  <text x="308" y="362" font-size="12" font-weight="600" fill="#92400E">• Verweilzeit: W = W_q + E[T_S] = W_q + 1/μ</text>

  <!-- Karte 3: M/M/1 Gleichgewichtskennwerte -->
  <rect x="616" y="278" width="329" height="92" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
  <rect x="626" y="284" width="309" height="20" rx="4" fill="#DBEAFE" />
  <text x="780" y="298" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">M/M/1-Gleichgewichtskennwerte</text>

  <rect x="626" y="307" width="150" height="26" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
  <text x="701" y="324" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">L = ρ / (1 - ρ)</text>

  <rect x="782" y="307" width="153" height="26" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
  <text x="858" y="324" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">L_q = ρ² / (1 - ρ)</text>

  <rect x="626" y="337" width="150" height="26" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
  <text x="701" y="354" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">W = 1 / (μ - λ)</text>

  <rect x="782" y="337" width="153" height="26" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
  <text x="858" y="354" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">W_q = ρ / (μ - λ)</text>
</svg>
