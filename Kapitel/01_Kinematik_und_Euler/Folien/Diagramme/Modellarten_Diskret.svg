<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrowJump" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="-38" y="8" width="556" height="364" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Subtle Grid Lines -->
  <line x1="36" y1="230" x2="480" y2="230" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="170" x2="480" y2="170" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="110" x2="480" y2="110" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="50" x2="480" y2="50" stroke="#E2E8F0" stroke-width="1"/>

  <line x1="126" y1="40" x2="126" y2="290" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="216" y1="40" x2="216" y2="290" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="306" y1="40" x2="306" y2="290" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="396" y1="40" x2="396" y2="290" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Coordinate Axes -->
  <line x1="36" y1="298" x2="36" y2="30" stroke="#334155" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line x1="28" y1="290" x2="500" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Axis Ticks -->
  <line x1="30" y1="230" x2="36" y2="230" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="170" x2="36" y2="170" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="110" x2="36" y2="110" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="50" x2="36" y2="50" stroke="#334155" stroke-width="1.5"/>

  <line x1="126" y1="290" x2="126" y2="296" stroke="#334155" stroke-width="1.5"/>
  <line x1="216" y1="290" x2="216" y2="296" stroke="#334155" stroke-width="1.5"/>
  <line x1="306" y1="290" x2="306" y2="296" stroke="#334155" stroke-width="1.5"/>
  <line x1="396" y1="290" x2="396" y2="296" stroke="#334155" stroke-width="1.5"/>

  <!-- Vertical Jump Connectors (Dashed) -->
  <line x1="146" y1="230" x2="146" y2="170" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="246" y1="170" x2="246" y2="80" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="326" y1="80" x2="326" y2="140" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="416" y1="140" x2="416" y2="200" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Piecewise Constant Horizontal State Segments -->
  <line x1="36" y1="230" x2="146" y2="230" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="146" y1="170" x2="246" y2="170" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="246" y1="80" x2="326" y2="80" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="326" y1="140" x2="416" y2="140" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="416" y1="200" x2="482" y2="200" stroke="#2563EB" stroke-width="3.2"/>

  <!-- Jump Nodes (Open = before jump, Filled = new state) -->
  <circle cx="36" cy="230" r="4.5" fill="#2563EB"/>
  <circle cx="146" cy="230" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="146" cy="170" r="4.5" fill="#2563EB"/>
  <circle cx="246" cy="170" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="246" cy="80" r="4.5" fill="#2563EB"/>
  <circle cx="326" cy="80" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="326" cy="140" r="4.5" fill="#2563EB"/>
  <circle cx="416" cy="140" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="416" cy="200" r="4.5" fill="#2563EB"/>

  <!-- Callout Arrow & Badge -->
  <line x1="204" y1="115" x2="238" y2="115" stroke="#D97706" stroke-width="2" marker-end="url(#arrowJump)"/>
  <rect x="52" y="101" width="150" height="28" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="127" y="120" font-size="13.5" font-weight="bold" fill="#B45309" text-anchor="middle">Zustandsübergang</text>

  <rect x="210" y="236" width="200" height="26" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="310" y="254" font-size="13.5" font-weight="bold" fill="#1E40AF" text-anchor="middle">Stückweise konstant</text>

  <!-- Axis Labels & Numeric Ticks -->
  <text x="-14" y="165" font-size="14.5" font-weight="bold" fill="#1E293B" text-anchor="middle" transform="rotate(-90 -14 165)">Zustand s(t)</text>

  <text x="24" y="294" class="code" font-size="13.5" fill="#475569" text-anchor="end">0</text>
  <text x="24" y="235" class="code" font-size="13.5" fill="#475569" text-anchor="end">2</text>
  <text x="24" y="175" class="code" font-size="13.5" fill="#475569" text-anchor="end">4</text>
  <text x="24" y="115" class="code" font-size="13.5" fill="#475569" text-anchor="end">6</text>
  <text x="24" y="55" class="code" font-size="13.5" fill="#475569" text-anchor="end">8</text>

  <text x="36" y="315" class="code" font-size="13.5" fill="#475569" text-anchor="middle">0</text>
  <text x="126" y="315" class="code" font-size="13.5" fill="#475569" text-anchor="middle">1</text>
  <text x="216" y="315" class="code" font-size="13.5" fill="#475569" text-anchor="middle">2</text>
  <text x="306" y="315" class="code" font-size="13.5" fill="#475569" text-anchor="middle">3</text>
  <text x="396" y="315" class="code" font-size="13.5" fill="#475569" text-anchor="middle">4</text>

  <rect x="428" y="300" width="80" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="468" y="317" font-size="13.5" font-weight="bold" fill="#1E293B" text-anchor="middle">Zeit t [s]</text>
</svg>
