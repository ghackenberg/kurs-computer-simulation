<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-neutral-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrowJump" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path class="sem-warning-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: #ffffff; stroke: #334155; }
      .sem-neutral-bg { fill: #ffffff; stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect class="sem-card" x="-38" y="8" width="556" height="364" rx="10" stroke-width="1.5"/>

  <!-- Subtle Grid Lines -->
  <line class="sem-muted-stroke" x1="36" y1="230" x2="480" y2="230" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="170" x2="480" y2="170" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="110" x2="480" y2="110" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="50" x2="480" y2="50" stroke-width="1"/>

  <line class="sem-muted-stroke" x1="126" y1="40" x2="126" y2="290" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="216" y1="40" x2="216" y2="290" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="306" y1="40" x2="306" y2="290" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="396" y1="40" x2="396" y2="290" stroke-width="1"/>

  <!-- Coordinate Axes -->
  <line class="sem-neutral-stroke" x1="36" y1="298" x2="36" y2="30" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line class="sem-neutral-stroke" x1="28" y1="290" x2="500" y2="290" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Axis Ticks -->
  <line class="sem-neutral-stroke" x1="30" y1="230" x2="36" y2="230" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="170" x2="36" y2="170" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="110" x2="36" y2="110" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="50" x2="36" y2="50" stroke-width="1.5"/>

  <line class="sem-neutral-stroke" x1="126" y1="290" x2="126" y2="296" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="216" y1="290" x2="216" y2="296" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="306" y1="290" x2="306" y2="296" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="396" y1="290" x2="396" y2="296" stroke-width="1.5"/>

  <!-- Vertical Jump Connectors (Dashed) -->
  <line class="sem-warning-stroke" x1="146" y1="230" x2="146" y2="170" stroke-width="2" stroke-dasharray="4,3"/>
  <line class="sem-warning-stroke" x1="246" y1="170" x2="246" y2="80" stroke-width="2" stroke-dasharray="4,3"/>
  <line class="sem-warning-stroke" x1="326" y1="80" x2="326" y2="140" stroke-width="2" stroke-dasharray="4,3"/>
  <line class="sem-warning-stroke" x1="416" y1="140" x2="416" y2="200" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Piecewise Constant Horizontal State Segments -->
  <line class="sem-primary-stroke" x1="36" y1="230" x2="146" y2="230" stroke-width="3.2"/>
  <line class="sem-primary-stroke" x1="146" y1="170" x2="246" y2="170" stroke-width="3.2"/>
  <line class="sem-primary-stroke" x1="246" y1="80" x2="326" y2="80" stroke-width="3.2"/>
  <line class="sem-primary-stroke" x1="326" y1="140" x2="416" y2="140" stroke-width="3.2"/>
  <line class="sem-primary-stroke" x1="416" y1="200" x2="482" y2="200" stroke-width="3.2"/>

  <!-- Jump Nodes (Open = before jump, Filled = new state) -->
  <circle class="sem-primary-fill" cx="36" cy="230" r="4.5"/>
  <circle class="sem-primary-stroke" cx="146" cy="230" r="4.5" fill="#FFFFFF" stroke-width="2"/>
  <circle class="sem-primary-fill" cx="146" cy="170" r="4.5"/>
  <circle class="sem-primary-stroke" cx="246" cy="170" r="4.5" fill="#FFFFFF" stroke-width="2"/>
  <circle class="sem-primary-fill" cx="246" cy="80" r="4.5"/>
  <circle class="sem-primary-stroke" cx="326" cy="80" r="4.5" fill="#FFFFFF" stroke-width="2"/>
  <circle class="sem-primary-fill" cx="326" cy="140" r="4.5"/>
  <circle class="sem-primary-stroke" cx="416" cy="140" r="4.5" fill="#FFFFFF" stroke-width="2"/>
  <circle class="sem-primary-fill" cx="416" cy="200" r="4.5"/>

  <!-- Callout Arrow & Badge -->
  <line class="sem-warning-stroke" x1="204" y1="115" x2="238" y2="115" stroke-width="2" marker-end="url(#arrowJump)"/>
  <rect class="sem-warning" x="52" y="101" width="150" height="28" rx="5" stroke-width="1.2"/>
  <text class="sem-warning-text" x="127" y="120" font-size="13.5" font-weight="bold" text-anchor="middle">Zustandsübergang</text>

  <rect class="sem-primary" x="210" y="236" width="200" height="26" rx="5" stroke-width="1.2"/>
  <text class="sem-primary-text" x="310" y="254" font-size="13.5" font-weight="bold" text-anchor="middle">Stückweise konstant</text>

  <!-- Axis Labels & Numeric Ticks -->
  <text class="sem-card-text" x="-14" y="165" font-size="14.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 -14 165)">Zustand s(t)</text>

  <text x="24" y="294" class="code sem-muted-text" font-size="13.5" text-anchor="end">0</text>
  <text x="24" y="235" class="code sem-muted-text" font-size="13.5" text-anchor="end">2</text>
  <text x="24" y="175" class="code sem-muted-text" font-size="13.5" text-anchor="end">4</text>
  <text x="24" y="115" class="code sem-muted-text" font-size="13.5" text-anchor="end">6</text>
  <text x="24" y="55" class="code sem-muted-text" font-size="13.5" text-anchor="end">8</text>

  <text x="36" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">0</text>
  <text x="126" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">1</text>
  <text x="216" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">2</text>
  <text x="306" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">3</text>
  <text x="396" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">4</text>

  <rect class="sem-card-stroke" x="428" y="300" width="80" height="24" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-card-text" x="468" y="317" font-size="13.5" font-weight="bold" text-anchor="middle">Zeit t [s]</text>
</svg>
