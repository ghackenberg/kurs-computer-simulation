<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrowStep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="-38" y="8" width="556" height="364" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Uniform Time Grid Vertical Guides -->
  <line x1="126" y1="40" x2="126" y2="280" stroke="#DCFCE7" stroke-width="2"/>
  <line x1="216" y1="40" x2="216" y2="280" stroke="#DCFCE7" stroke-width="2"/>
  <line x1="306" y1="40" x2="306" y2="280" stroke="#DCFCE7" stroke-width="2"/>
  <line x1="396" y1="40" x2="396" y2="280" stroke="#DCFCE7" stroke-width="2"/>

  <line x1="36" y1="224" x2="480" y2="224" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="168" x2="480" y2="168" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="112" x2="480" y2="112" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="56" x2="480" y2="56" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Coordinate Axes -->
  <line x1="36" y1="288" x2="36" y2="28" stroke="#334155" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line x1="28" y1="280" x2="500" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Axis Ticks -->
  <line x1="30" y1="224" x2="36" y2="224" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="168" x2="36" y2="168" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="112" x2="36" y2="112" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="56" x2="36" y2="56" stroke="#334155" stroke-width="1.5"/>

  <line x1="36" y1="280" x2="36" y2="338" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="126" y1="280" x2="126" y2="338" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="216" y1="280" x2="216" y2="338" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="306" y1="280" x2="306" y2="338" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="396" y1="280" x2="396" y2="338" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- Vertical Step Transitions on Equidistant Grid -->
  <line x1="126" y1="224" x2="126" y2="168" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="216" y1="168" x2="216" y2="84" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="306" y1="84" x2="306" y2="140" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="396" y1="140" x2="396" y2="196" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Horizontal Constant Segments -->
  <line x1="36" y1="224" x2="126" y2="224" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="126" y1="168" x2="216" y2="168" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="216" y1="84" x2="306" y2="84" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="306" y1="140" x2="396" y2="140" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="396" y1="196" x2="466" y2="196" stroke="#2563EB" stroke-width="3.2"/>

  <!-- Sample Points -->
  <circle cx="36" cy="224" r="4.5" fill="#2563EB"/>
  <circle cx="126" cy="168" r="4.5" fill="#2563EB"/>
  <circle cx="216" cy="84" r="4.5" fill="#2563EB"/>
  <circle cx="306" cy="140" r="4.5" fill="#2563EB"/>
  <circle cx="396" cy="196" r="4.5" fill="#2563EB"/>

  <!-- Equidistant Delta t Arrows -->
  <line x1="42" y1="330" x2="120" y2="330" stroke="#16A34A" stroke-width="2" marker-start="url(#arrowStep)" marker-end="url(#arrowStep)"/>
  <line x1="132" y1="330" x2="210" y2="330" stroke="#16A34A" stroke-width="2" marker-start="url(#arrowStep)" marker-end="url(#arrowStep)"/>
  <line x1="222" y1="330" x2="300" y2="330" stroke="#16A34A" stroke-width="2" marker-start="url(#arrowStep)" marker-end="url(#arrowStep)"/>
  <line x1="312" y1="330" x2="390" y2="330" stroke="#16A34A" stroke-width="2" marker-start="url(#arrowStep)" marker-end="url(#arrowStep)"/>

  <!-- Top Info Badge -->
  <rect x="54" y="34" width="212" height="26" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="160" y="52" font-size="13.5" font-weight="bold" fill="#15803D" text-anchor="middle">Festes Zeitraster (Takt <tspan>Δ</tspan><tspan>t</tspan>)</text>

  <!-- Axis Labels & Numeric Ticks -->
  <text x="-14" y="160" font-size="14.5" font-weight="bold" fill="#1E293B" text-anchor="middle" transform="rotate(-90 -14 160)">Zustand s(t)</text>

  <text x="24" y="284" class="code" font-size="13.5" fill="#475569" text-anchor="end">0</text>
  <text x="24" y="229" class="code" font-size="13.5" fill="#475569" text-anchor="end">2</text>
  <text x="24" y="173" class="code" font-size="13.5" fill="#475569" text-anchor="end">4</text>
  <text x="24" y="117" class="code" font-size="13.5" fill="#475569" text-anchor="end">6</text>
  <text x="24" y="61" class="code" font-size="13.5" fill="#475569" text-anchor="end">8</text>

  <rect x="24" y="290" width="24" height="20" rx="3" fill="#FAFAFA"/>
  <text x="36" y="305" class="code" font-size="13.5" fill="#475569" text-anchor="middle">0</text>
  <rect x="114" y="290" width="24" height="20" rx="3" fill="#FAFAFA"/>
  <text x="126" y="305" class="code" font-size="13.5" fill="#475569" text-anchor="middle">1</text>
  <rect x="204" y="290" width="24" height="20" rx="3" fill="#FAFAFA"/>
  <text x="216" y="305" class="code" font-size="13.5" fill="#475569" text-anchor="middle">2</text>
  <rect x="294" y="290" width="24" height="20" rx="3" fill="#FAFAFA"/>
  <text x="306" y="305" class="code" font-size="13.5" fill="#475569" text-anchor="middle">3</text>
  <rect x="384" y="290" width="24" height="20" rx="3" fill="#FAFAFA"/>
  <text x="396" y="305" class="code" font-size="13.5" fill="#475569" text-anchor="middle">4</text>

  <text x="81" y="355" class="code" font-size="14" fill="#15803D" text-anchor="middle"><tspan>Δ</tspan><tspan>t</tspan></text>
  <text x="171" y="355" class="code" font-size="14" fill="#15803D" text-anchor="middle"><tspan>Δ</tspan><tspan>t</tspan></text>
  <text x="261" y="355" class="code" font-size="14" fill="#15803D" text-anchor="middle"><tspan>Δ</tspan><tspan>t</tspan></text>
  <text x="351" y="355" class="code" font-size="14" fill="#15803D" text-anchor="middle"><tspan>Δ</tspan><tspan>t</tspan></text>

  <rect x="428" y="290" width="80" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="468" y="307" font-size="13.5" font-weight="bold" fill="#1E293B" text-anchor="middle">Zeit t [s]</text>
</svg>
