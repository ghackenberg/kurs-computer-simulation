<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-neutral-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrowStep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="sem-success-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect class="sem-card" x="-38" y="8" width="556" height="364" rx="10" stroke-width="1.5"/>

  <!-- Uniform Time Grid Vertical Guides -->
  <line class="sem-success-stroke" x1="126" y1="40" x2="126" y2="280" stroke-width="2"/>
  <line class="sem-success-stroke" x1="216" y1="40" x2="216" y2="280" stroke-width="2"/>
  <line class="sem-success-stroke" x1="306" y1="40" x2="306" y2="280" stroke-width="2"/>
  <line class="sem-success-stroke" x1="396" y1="40" x2="396" y2="280" stroke-width="2"/>

  <line class="sem-muted-stroke" x1="36" y1="224" x2="480" y2="224" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="168" x2="480" y2="168" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="112" x2="480" y2="112" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="56" x2="480" y2="56" stroke-width="1"/>

  <!-- Coordinate Axes -->
  <line class="sem-neutral-stroke" x1="36" y1="288" x2="36" y2="28" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line class="sem-neutral-stroke" x1="28" y1="280" x2="500" y2="280" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Axis Ticks -->
  <line class="sem-neutral-stroke" x1="30" y1="224" x2="36" y2="224" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="168" x2="36" y2="168" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="112" x2="36" y2="112" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="56" x2="36" y2="56" stroke-width="1.5"/>

  <line class="sem-muted-stroke" x1="36" y1="280" x2="36" y2="338" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line class="sem-muted-stroke" x1="126" y1="280" x2="126" y2="338" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line class="sem-muted-stroke" x1="216" y1="280" x2="216" y2="338" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line class="sem-muted-stroke" x1="306" y1="280" x2="306" y2="338" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line class="sem-muted-stroke" x1="396" y1="280" x2="396" y2="338" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- Vertical Step Transitions on Equidistant Grid -->
  <line class="sem-primary-stroke" x1="126" y1="224" x2="126" y2="168" stroke-width="2" stroke-dasharray="4,3"/>
  <line class="sem-primary-stroke" x1="216" y1="168" x2="216" y2="84" stroke-width="2" stroke-dasharray="4,3"/>
  <line class="sem-primary-stroke" x1="306" y1="84" x2="306" y2="140" stroke-width="2" stroke-dasharray="4,3"/>
  <line class="sem-primary-stroke" x1="396" y1="140" x2="396" y2="196" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Horizontal Constant Segments -->
  <line class="sem-primary-stroke" x1="36" y1="224" x2="126" y2="224" stroke-width="3.2"/>
  <line class="sem-primary-stroke" x1="126" y1="168" x2="216" y2="168" stroke-width="3.2"/>
  <line class="sem-primary-stroke" x1="216" y1="84" x2="306" y2="84" stroke-width="3.2"/>
  <line class="sem-primary-stroke" x1="306" y1="140" x2="396" y2="140" stroke-width="3.2"/>
  <line class="sem-primary-stroke" x1="396" y1="196" x2="466" y2="196" stroke-width="3.2"/>

  <!-- Sample Points -->
  <circle class="sem-primary-fill" cx="36" cy="224" r="4.5"/>
  <circle class="sem-primary-fill" cx="126" cy="168" r="4.5"/>
  <circle class="sem-primary-fill" cx="216" cy="84" r="4.5"/>
  <circle class="sem-primary-fill" cx="306" cy="140" r="4.5"/>
  <circle class="sem-primary-fill" cx="396" cy="196" r="4.5"/>

  <!-- Equidistant Delta t Arrows -->
  <line class="sem-success-stroke" x1="42" y1="330" x2="120" y2="330" stroke-width="2" marker-start="url(#arrowStep)" marker-end="url(#arrowStep)"/>
  <line class="sem-success-stroke" x1="132" y1="330" x2="210" y2="330" stroke-width="2" marker-start="url(#arrowStep)" marker-end="url(#arrowStep)"/>
  <line class="sem-success-stroke" x1="222" y1="330" x2="300" y2="330" stroke-width="2" marker-start="url(#arrowStep)" marker-end="url(#arrowStep)"/>
  <line class="sem-success-stroke" x1="312" y1="330" x2="390" y2="330" stroke-width="2" marker-start="url(#arrowStep)" marker-end="url(#arrowStep)"/>

  <!-- Top Info Badge -->
  <rect class="sem-success" x="54" y="34" width="212" height="26" rx="5" stroke-width="1.2"/>
  <text class="sem-success-text" x="160" y="52" font-size="13.5" font-weight="bold" text-anchor="middle">Festes Zeitraster (Takt <tspan>Δ</tspan><tspan>t</tspan>)</text>

  <!-- Axis Labels & Numeric Ticks -->
  <text class="sem-card-text" x="-14" y="160" font-size="14.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 -14 160)">Zustand s(t)</text>

  <text x="24" y="284" class="code sem-muted-text" font-size="13.5" text-anchor="end">0</text>
  <text x="24" y="229" class="code sem-muted-text" font-size="13.5" text-anchor="end">2</text>
  <text x="24" y="173" class="code sem-muted-text" font-size="13.5" text-anchor="end">4</text>
  <text x="24" y="117" class="code sem-muted-text" font-size="13.5" text-anchor="end">6</text>
  <text x="24" y="61" class="code sem-muted-text" font-size="13.5" text-anchor="end">8</text>

  <rect class="sem-card" x="24" y="290" width="24" height="20" rx="3" stroke="none"/>
  <text x="36" y="305" class="code sem-muted-text" font-size="13.5" text-anchor="middle">0</text>
  <rect class="sem-card" x="114" y="290" width="24" height="20" rx="3" stroke="none"/>
  <text x="126" y="305" class="code sem-muted-text" font-size="13.5" text-anchor="middle">1</text>
  <rect class="sem-card" x="204" y="290" width="24" height="20" rx="3" stroke="none"/>
  <text x="216" y="305" class="code sem-muted-text" font-size="13.5" text-anchor="middle">2</text>
  <rect class="sem-card" x="294" y="290" width="24" height="20" rx="3" stroke="none"/>
  <text x="306" y="305" class="code sem-muted-text" font-size="13.5" text-anchor="middle">3</text>
  <rect class="sem-card" x="384" y="290" width="24" height="20" rx="3" stroke="none"/>
  <text x="396" y="305" class="code sem-muted-text" font-size="13.5" text-anchor="middle">4</text>

  <text x="81" y="355" class="code sem-success-text" font-size="14" text-anchor="middle"><tspan>Δ</tspan><tspan>t</tspan></text>
  <text x="171" y="355" class="code sem-success-text" font-size="14" text-anchor="middle"><tspan>Δ</tspan><tspan>t</tspan></text>
  <text x="261" y="355" class="code sem-success-text" font-size="14" text-anchor="middle"><tspan>Δ</tspan><tspan>t</tspan></text>
  <text x="351" y="355" class="code sem-success-text" font-size="14" text-anchor="middle"><tspan>Δ</tspan><tspan>t</tspan></text>

  <rect class="sem-card-stroke" x="428" y="290" width="80" height="24" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-card-text" x="468" y="307" font-size="13.5" font-weight="bold" text-anchor="middle">Zeit t [s]</text>
</svg>
