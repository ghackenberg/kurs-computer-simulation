<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-neutral-fill" d="M 0 1.5 L 8.5 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- Card Background -->

  <!-- Subtle Grid Lines -->
  <line class="sem-muted-stroke" x1="36" y1="230" x2="480" y2="230" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="170" x2="480" y2="170" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="110" x2="480" y2="110" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="36" y1="50" x2="480" y2="50" stroke-width="1"/>

  <line class="sem-muted-stroke" x1="126" y1="40" x2="126" y2="290" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="216" y1="40" x2="216" y2="290" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="306" y1="40" x2="306" y2="290" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="396" y1="40" x2="396" y2="290" stroke-width="1"/>

  <!-- Outer Confidence Cone (Min-Max Spread) -->
  <polygon class="sem-primary" points="36,245 396,60 396,220" opacity="0.85" stroke="none"/>
  <!-- Inner Confidence Cone (1-Sigma Spread) -->
  <polygon class="sem-primary-fill" points="36,245 396,102 396,178" opacity="0.75"/>

  <!-- Coordinate Axes -->
  <line class="sem-neutral-stroke" x1="36" y1="298" x2="36" y2="30" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line class="sem-neutral-stroke" x1="28" y1="290" x2="500" y2="290" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Axis Ticks -->
  <line class="sem-neutral-stroke" x1="30" y1="230" x2="36" y2="230" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="170" x2="36" y2="170" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="110" x2="36" y2="110" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="30" y1="50" x2="36" y2="50" stroke-width="1.5"/>

  <line class="sem-neutral-stroke" x1="126" y1="290" x2="126" y2="296" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="216" y1="290" x2="216" y2="296" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="306" y1="290" x2="306" y2="296" stroke-width="1.5"/>
  <line class="sem-neutral-stroke" x1="396" y1="290" x2="396" y2="296" stroke-width="1.5"/>

  <!-- Envelope & Mean Lines -->
  <line class="sem-primary-stroke" x1="36" y1="245" x2="396" y2="60" stroke-width="1.8" stroke-dasharray="5,4"/>
  <line class="sem-primary-stroke" x1="36" y1="245" x2="396" y2="220" stroke-width="1.8" stroke-dasharray="5,4"/>
  <line class="sem-primary-stroke" x1="36" y1="245" x2="396" y2="140" stroke-width="3.2"/>

  <!-- Nodes -->
  <circle class="sem-primary" cx="36" cy="245" r="5" stroke-width="2"/>
  <circle class="sem-primary-fill" cx="396" cy="60" r="4"/>
  <circle class="sem-primary-fill" cx="396" cy="140" r="5"/>
  <circle class="sem-primary-fill" cx="396" cy="220" r="4"/>

  <!-- Callout Badges -->
  <rect class="sem-primary" x="54" y="34" width="218" height="26" rx="5" stroke-width="1.2"/>
  <text class="sem-primary-text" x="163" y="52" font-size="13.5" font-weight="bold" text-anchor="middle">Streukegel (Monte-Carlo)</text>

  <rect class="sem-primary-stroke" x="406" y="47" width="60" height="24" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-primary-text" x="436" y="64" font-size="13.5" font-weight="bold" text-anchor="middle">max</text>

  <rect class="sem-primary" x="406" y="128" width="98" height="24" rx="4" stroke-width="1.2"/>
  <text class="sem-primary-text" x="455" y="145" font-size="13.5" font-weight="bold" text-anchor="middle">Mittelwert</text>

  <rect class="sem-primary-stroke" x="406" y="208" width="60" height="24" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-primary-text" x="436" y="225" font-size="13.5" font-weight="bold" text-anchor="middle">min</text>

  <!-- Axis Labels & Numeric Ticks -->
  <text class="sem-card-text" x="-14" y="165" font-size="14.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 -14 165)">Zustand s(t)</text>

  <text x="24" y="294" class="code sem-muted-text" font-size="13.5" text-anchor="end">0</text>
  <text x="24" y="235" class="code sem-muted-text" font-size="13.5" text-anchor="end">2</text>
  <text x="24" y="175" class="code sem-muted-text" font-size="13.5" text-anchor="end">4</text>
  <text x="24" y="115" class="code sem-muted-text" font-size="13.5" text-anchor="end">6</text>
  <text x="24" y="55" class="code sem-muted-text" font-size="13.5" text-anchor="end">8</text>

  <text x="36" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">0</text>
  <text x="126" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">1</text>
  <text x="216" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">2</text>
  <text x="306" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">3</text>
  <text x="396" y="315" class="code sem-muted-text" font-size="13.5" text-anchor="middle">4</text>

  <rect class="sem-card-stroke" x="428" y="300" width="80" height="24" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-card-text" x="468" y="317" font-size="13.5" font-weight="bold" text-anchor="middle">Zeit t [s]</text>
</svg>
