<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <!-- Arrow Markers -->
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-muted-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrowSkyBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-info-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrowFHBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-primary-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-accent-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-warning-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>

    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: #0369a1; }
      .sem-info-text { fill: #075985; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-accent { fill: url(#grad-sem-accent); stroke: #7c3aed; }
      .sem-accent-bg { fill: url(#grad-sem-accent); stroke: none; }
      .sem-accent-stroke { stroke: #7c3aed; }
      .sem-accent-fill { fill: #7c3aed; }
      .sem-accent-text { fill: #6d28d9; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      }
      .math-italic {
        font-family: 'Cambria Math', 'Times New Roman', serif;
        font-style: italic;
      }
    </style>
  </defs>

  <!-- Outer Background Canvas -->

  <!-- Top Title Banner -->
  <path class="sem-muted sem-card-stroke" d="M 5 15 Q 5 5 15 5 L 945 5 Q 955 5 955 15 L 955 42 L 5 42 Z" stroke-width="1"/>
  <text class="sem-primary-text" x="24" y="27" font-size="15" font-weight="bold">Schiefer Wurf mit Luftwiderstand: Vektoren &amp; Kräftebilanz</text>
  <text class="sem-muted-text" x="936" y="27" font-size="12" font-weight="bold" text-anchor="end">Kapitel 01: Physikalische Grundlagen &amp; Modellbildung</text>

  <!-- ==================== DIAGRAM REGION (LEFT) ==================== -->
  <!-- Ground shading & Line -->
  <rect class="sem-muted" x="60" y="370" width="550" height="45" stroke="none"/>
  <line class="sem-muted-stroke" x1="60" y1="370" x2="615" y2="370" stroke-width="2"/>

  <!-- Coordinate Axes -->
  <!-- X-Axis -->
  <line class="sem-muted-stroke" x1="85" y1="370" x2="605" y2="370" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <!-- Y-Axis -->
  <line class="sem-muted-stroke" x1="90" y1="380" x2="90" y2="60" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Trajectory 1: Ungedämpfte Parabel (Vakuum) -->
  <path class="sem-muted-stroke" d="M 90 310 Q 330 90 570 370" fill="none" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Trajectory 2: Gedämpfte Bahn mit Luftwiderstand -->
  <path class="sem-primary-stroke" d="M 90 310 C 160 230, 230 188, 290 195 C 350 203, 410 265, 460 370" fill="none" stroke-width="3.5"/>

  <!-- Launch Angle & Components Construction (P0 at 90, 310) -->
  <!-- Horizontal reference line for angle alpha -->
  <line class="sem-card-stroke" x1="90" y1="310" x2="200" y2="310" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Arc for alpha (angle ~ 45 deg, radius 38) -->
  <path class="sem-warning-stroke" d="M 128 310 A 38 38 0 0 0 117 283" fill="none" stroke-width="2"/>
  <!-- v0x component vector -->
  <line class="sem-info-stroke" x1="90" y1="310" x2="162" y2="310" stroke-width="2" marker-end="url(#arrowSkyBlue)"/>
  <!-- v0y projection dashed line -->
  <line class="sem-muted-stroke" x1="164" y1="310" x2="164" y2="236" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- v0y component vector on Y axis -->
  <line class="sem-info-stroke" x1="90" y1="310" x2="90" y2="236" stroke-width="2" marker-end="url(#arrowSkyBlue)"/>
  <!-- Initial Velocity Vector v0 -->
  <line class="sem-info-stroke" x1="90" y1="310" x2="162" y2="238" stroke-width="3" marker-end="url(#arrowSkyBlue)"/>

  <!-- Current State Point P(x, y) at (340, 215) -->
  <!-- Tangent Velocity Vector v -->
  <line class="sem-info-stroke" x1="340" y1="215" x2="415" y2="260" stroke-width="3" marker-end="url(#arrowSkyBlue)"/>

  <!-- Gravity Force F_G (blue, straight down) -->
  <line class="sem-primary-stroke" x1="340" y1="215" x2="340" y2="295" stroke-width="3.5" marker-end="url(#arrowFHBlue)"/>

  <!-- Drag Force F_R (red, antiparallel to v) -->
  <!-- v direction is dx=75, dy=45 => unit is (0.857, 0.514). Opposite is dx=-55, dy=-33 => (285, 182) -->
  <line class="sem-danger-stroke" x1="340" y1="215" x2="285" y2="182" stroke-width="3.5" marker-end="url(#arrowRed)"/>

  <!-- Parallelogram lines for F_ges = F_G + F_R -->
  <!-- From tip of F_R (285, 182) adding F_G (dy=+80) -> (285, 262) -->
  <line class="sem-accent-stroke" x1="285" y1="182" x2="285" y2="262" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- From tip of F_G (340, 295) adding F_R (dx=-55, dy=-33) -> (285, 262) -->
  <line class="sem-accent-stroke" x1="340" y1="295" x2="285" y2="262" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Resultant Force F_ges -->
  <line class="sem-accent-stroke" x1="340" y1="215" x2="286" y2="261" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- Point Marker Dots -->
  <!-- Origin P0 -->
  <circle class="sem-primary-fill" cx="90" cy="310" r="5" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Point P -->
  <circle class="sem-danger-fill" cx="340" cy="215" r="5.5" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Impact Point -->
  <circle class="sem-primary-fill" cx="460" cy="370" r="4.5"/>

  <!-- ==================== SHIELD BADGES & LABELS ==================== -->
  <!-- Axis Labels -->
  <rect class="sem-card-stroke" x="604" y="358" width="40" height="24" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-neutral-text" x="624" y="374" font-size="12.5" font-weight="bold" text-anchor="middle">x [m]</text>

  <rect class="sem-card-stroke" x="70" y="48" width="40" height="24" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-neutral-text" x="90" y="64" font-size="12.5" font-weight="bold" text-anchor="middle">y [m]</text>

  <rect class="sem-card-stroke" x="62" y="374" width="24" height="20" rx="3" fill="#FFFFFF" stroke-width="0.8"/>
  <text class="sem-muted-text" x="74" y="388" font-size="12.5" text-anchor="middle">0</text>

  <!-- P0 & y0 Labels -->
  <rect class="sem-card-stroke" x="16" y="300" width="68" height="22" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-primary-text" x="50" y="315" font-size="12.5" font-weight="bold" text-anchor="middle">P₀ (0, y₀)</text>

  <!-- Angle alpha label -->
  <rect class="sem-warning" x="125" y="285" width="22" height="22" rx="3" stroke-width="1"/>
  <text class="sem-warning-text" x="136" y="300" font-size="12.5" font-weight="bold" text-anchor="middle">α</text>

  <!-- Velocity Components Labels -->
  <rect class="sem-info" x="168" y="221" width="32" height="22" rx="3" stroke-width="1"/>
  <text class="sem-info-text" x="184" y="236" font-size="12.5" font-weight="bold" text-anchor="middle">v₀</text>

  <rect class="sem-info-stroke" x="96" y="324" width="112" height="22" rx="3" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-info-text" x="152" y="339" font-size="12.5" text-anchor="middle">v₀ₓ = v₀ · cos(α)</text>

  <rect class="sem-info-stroke" x="34" y="206" width="112" height="22" rx="3" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-info-text" x="90" y="221" font-size="12.5" text-anchor="middle">v₀ᵧ = v₀ · sin(α)</text>

  <!-- Ungedämpft Curve Label -->
  <rect class="sem-card-stroke" x="240" y="104" width="240" height="24" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-muted-text" x="360" y="120" font-size="12.5" text-anchor="middle">Ungedämpft (Vakuum): Parabelbahn</text>

  <!-- Gedämpft Curve Label -->
  <rect class="sem-primary" x="350" y="144" width="230" height="24" rx="4" stroke-width="1"/>
  <text class="sem-primary-text" x="465" y="160" font-size="12.5" font-weight="bold" text-anchor="middle">Gedämpft: Mit Luftwiderstand F_R</text>

  <!-- Point P(x, y) Label -->
  <rect class="sem-card-stroke" x="311" y="184" width="64" height="22" rx="4" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-neutral-text" x="343" y="199" font-size="12.5" font-weight="bold" text-anchor="middle">P(x, y)</text>

  <!-- Force Labels on Flight Point P -->
  <!-- Drag F_R -->
  <rect class="sem-danger" x="150" y="159" width="140" height="24" rx="4" stroke-width="1"/>
  <text class="sem-danger-text" x="220" y="175" font-size="12.5" font-weight="bold" text-anchor="middle">F_R (Luftwiderstand)</text>

  <!-- Gravity F_G -->
  <rect class="sem-primary" x="348" y="294" width="96" height="24" rx="4" stroke-width="1"/>
  <text class="sem-primary-text" x="396" y="310" font-size="12.5" font-weight="bold" text-anchor="middle">F_G = m · g</text>

  <!-- Resultant F_ges -->
  <rect class="sem-accent" x="164" y="257" width="122" height="24" rx="4" stroke-width="1"/>
  <text class="sem-accent-text" x="225" y="273" font-size="12.5" font-weight="bold" text-anchor="middle">F_ges = F_G + F_R</text>

  <!-- Velocity v -->
  <rect class="sem-info" x="420" y="247" width="120" height="24" rx="4" stroke-width="1"/>
  <text class="sem-info-text" x="480" y="263" font-size="12.5" font-weight="bold" text-anchor="middle">v (Tangential)</text>

  <!-- Landing Point Label -->
  <rect class="sem-card-stroke" x="420" y="380" width="90" height="22" rx="3" fill="#FFFFFF" stroke-width="1"/>
  <text class="sem-primary-text" x="465" y="395" font-size="12.5" text-anchor="middle">x_Landung</text>

  <!-- ==================== RIGHT FORMULA & PHYSICS PANEL ==================== -->
  <rect class="sem-card-stroke" x="648" y="52" width="298" height="372" rx="8" fill="#FFFFFF" stroke-width="1.2"/>
  <path class="sem-muted sem-card-stroke" d="M 648 60 Q 648 52 656 52 L 938 52 Q 946 52 946 60 L 946 80 L 648 80 Z" stroke-width="1"/>
  <text class="sem-neutral-text" x="660" y="72" font-size="13" font-weight="bold">Physikalisches Modell (DGL-System)</text>

  <!-- Box 1: Aerodynamischer Widerstand F_R -->
  <rect class="sem-danger" x="656" y="88" width="282" height="88" rx="6" stroke-width="1"/>
  <text class="sem-danger-text" x="666" y="106" font-size="12" font-weight="bold">Aerodynamische Luftwiderstandskraft:</text>
  <rect class="sem-danger-stroke" x="666" y="112" width="262" height="24" rx="4" fill="#FFFFFF" stroke-width="0.8"/>
  <text class="sem-danger-text" x="797" y="128" font-size="12" font-weight="bold" text-anchor="middle">F_R = - ½ · c_w · ρ · A · ||v|| · v</text>
  <text class="sem-danger-text" x="666" y="150" font-size="12">• Richtung: Streng antiparallel zu v</text>
  <text class="sem-danger-text" x="666" y="166" font-size="12">• Betrag wächst quadratisch mit ||v||²</text>

  <!-- Box 2: Bewegungsgleichungen (Newton II) -->
  <rect class="sem-primary" x="656" y="184" width="282" height="106" rx="6" stroke-width="1"/>
  <text class="sem-primary-text" x="666" y="202" font-size="12" font-weight="bold">Newton II &amp; Komponenten-DGL:</text>
  <text class="sem-primary-text" x="666" y="222" font-size="12">m · ẍ = - ½ · c_w · ρ · A · ||v|| · ẋ</text>
  <text class="sem-primary-text" x="666" y="244" font-size="12">m · ÿ = - m·g - ½ · c_w · ρ · A · ||v|| · ẏ</text>
  <rect class="sem-primary-stroke" x="666" y="254" width="262" height="26" rx="4" fill="#FFFFFF" stroke-width="0.8"/>
  <text class="sem-primary-text" x="797" y="271" font-size="12" font-weight="bold" text-anchor="middle">Zustand: v = (ẋ, ẏ)ᵀ,  ||v|| = √(ẋ² + ẏ²)</text>

  <!-- Box 3: Parameter & SI-Einheiten nach DIN 1304 -->
  <rect class="sem-card sem-muted-stroke" x="656" y="298" width="282" height="118" rx="6" stroke-width="1"/>
  <text class="sem-neutral-text" x="666" y="316" font-size="12" font-weight="bold">Parameter &amp; Einheiten (DIN / ISO):</text>
  <text class="sem-muted-text" x="666" y="335" font-size="12">• c_w : Widerstandsbeiwert [-] (Kugel: ≈ 0.45)</text>
  <text class="sem-muted-text" x="666" y="353" font-size="12">• ρ : Luftdichte [kg/m³] (Standardluft: 1.225)</text>
  <text class="sem-muted-text" x="666" y="371" font-size="12">• A : Stirnfläche / Querschnitt [m²]</text>
  <text class="sem-muted-text" x="666" y="389" font-size="12">• m : Masse [kg],  g = 9.81 m/s² [m/s²]</text>
  <text class="sem-muted-text" x="666" y="407" font-size="12">• x, y : Position [m],  v : Geschwindigkeit [m/s]</text>
</svg>
