<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="-38" y="8" width="556" height="364" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Horizontal Grid Lines -->
  <line x1="36" y1="224" x2="480" y2="224" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="168" x2="480" y2="168" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="112" x2="480" y2="112" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="36" y1="56" x2="480" y2="56" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Irregular Event Vertical Guides (e1..e5) -->
  <line x1="96" y1="168" x2="96" y2="288" stroke="#FDE68A" stroke-width="2"/>
  <line x1="198" y1="84" x2="198" y2="288" stroke="#FDE68A" stroke-width="2"/>
  <line x1="258" y1="84" x2="258" y2="288" stroke="#FDE68A" stroke-width="2"/>
  <line x1="336" y1="140" x2="336" y2="288" stroke="#FDE68A" stroke-width="2"/>
  <line x1="396" y1="140" x2="396" y2="288" stroke="#FDE68A" stroke-width="2"/>

  <!-- Coordinate Axes -->
  <line x1="36" y1="288" x2="36" y2="28" stroke="#334155" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line x1="28" y1="280" x2="500" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Axis Ticks -->
  <line x1="30" y1="224" x2="36" y2="224" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="168" x2="36" y2="168" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="112" x2="36" y2="112" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="56" x2="36" y2="56" stroke="#334155" stroke-width="1.5"/>

  <line x1="96" y1="276" x2="96" y2="288" stroke="#D97706" stroke-width="2.2"/>
  <line x1="198" y1="276" x2="198" y2="288" stroke="#D97706" stroke-width="2.2"/>
  <line x1="258" y1="276" x2="258" y2="288" stroke="#D97706" stroke-width="2.2"/>
  <line x1="336" y1="276" x2="336" y2="288" stroke="#D97706" stroke-width="2.2"/>
  <line x1="396" y1="276" x2="396" y2="288" stroke="#D97706" stroke-width="2.2"/>

  <!-- Event-Driven Vertical Jumps -->
  <line x1="96" y1="224" x2="96" y2="168" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="198" y1="168" x2="198" y2="84" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="258" y1="84" x2="258" y2="140" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="336" y1="140" x2="336" y2="196" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="396" y1="196" x2="396" y2="112" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Piecewise Constant Segments -->
  <line x1="36" y1="224" x2="96" y2="224" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="96" y1="168" x2="198" y2="168" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="198" y1="84" x2="258" y2="84" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="258" y1="140" x2="336" y2="140" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="336" y1="196" x2="396" y2="196" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="396" y1="112" x2="472" y2="112" stroke="#2563EB" stroke-width="3.2"/>

  <!-- Event Points -->
  <circle cx="36" cy="224" r="4.5" fill="#2563EB"/>
  <circle cx="96" cy="168" r="4.5" fill="#2563EB"/>
  <circle cx="198" cy="84" r="4.5" fill="#2563EB"/>
  <circle cx="258" cy="140" r="4.5" fill="#2563EB"/>
  <circle cx="336" cy="196" r="4.5" fill="#2563EB"/>
  <circle cx="396" cy="112" r="4.5" fill="#2563EB"/>

  <!-- Top Info Badge -->
  <rect x="54" y="34" width="236" height="26" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="172" y="52" font-size="13.5" font-weight="bold" fill="#B45309" text-anchor="middle">Asynchrone Ereignisse (Events)</text>

  <!-- Axis Labels & Event Badges -->
  <text x="-14" y="160" font-size="14.5" font-weight="bold" fill="#1E293B" text-anchor="middle" transform="rotate(-90 -14 160)">Zustand s(t)</text>

  <text x="24" y="284" class="code" font-size="13.5" fill="#475569" text-anchor="end">0</text>
  <text x="24" y="229" class="code" font-size="13.5" fill="#475569" text-anchor="end">2</text>
  <text x="24" y="173" class="code" font-size="13.5" fill="#475569" text-anchor="end">4</text>
  <text x="24" y="117" class="code" font-size="13.5" fill="#475569" text-anchor="end">6</text>
  <text x="24" y="61" class="code" font-size="13.5" fill="#475569" text-anchor="end">8</text>

  <text x="36" y="308" class="code" font-size="13.5" fill="#475569" text-anchor="middle">0</text>

  <rect x="78" y="294" width="36" height="24" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="96" y="311" class="code" font-size="13.5" fill="#B45309" text-anchor="middle">e1</text>
  <text x="96" y="344" class="code" font-size="13" fill="#64748B" text-anchor="middle">0.7s</text>

  <rect x="180" y="294" width="36" height="24" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="198" y="311" class="code" font-size="13.5" fill="#B45309" text-anchor="middle">e2</text>
  <text x="198" y="344" class="code" font-size="13" fill="#64748B" text-anchor="middle">1.8s</text>

  <rect x="240" y="294" width="36" height="24" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="258" y="311" class="code" font-size="13.5" fill="#B45309" text-anchor="middle">e3</text>
  <text x="258" y="344" class="code" font-size="13" fill="#64748B" text-anchor="middle">2.5s</text>

  <rect x="318" y="294" width="36" height="24" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="336" y="311" class="code" font-size="13.5" fill="#B45309" text-anchor="middle">e4</text>
  <text x="336" y="344" class="code" font-size="13" fill="#64748B" text-anchor="middle">3.3s</text>

  <rect x="378" y="294" width="36" height="24" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="396" y="311" class="code" font-size="13.5" fill="#B45309" text-anchor="middle">e5</text>
  <text x="396" y="344" class="code" font-size="13" fill="#64748B" text-anchor="middle">4.0s</text>

  <rect x="428" y="294" width="80" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="468" y="311" font-size="13.5" font-weight="bold" fill="#1E293B" text-anchor="middle">Zeit t [s]</text>
</svg>
