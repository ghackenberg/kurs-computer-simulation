<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">DFS-Zykluserkennung</text>
  <text x="135" y="42" class="sub sem-muted-text">3-Farben-Tiefensuche in O(V+E)</text>

  <!-- Graphic Display of 3 Colors -->
  <g transform="translate(25, 54)">
    <rect class="sem-card-stroke" width="220" height="180" rx="6" fill="#ffffff" stroke-width="1" />

    <!-- Node 1 (Gray, Active) -->
    <circle class="sem-muted-fill sem-muted-stroke" cx="50" cy="50" r="16" stroke-width="2" />
    <text x="50" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">v_1</text>
    <text class="sem-muted-text" x="50" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">Grau (Stack)</text>

    <!-- Node 2 (Gray, Active) -->
    <circle class="sem-muted-fill sem-muted-stroke" cx="170" cy="50" r="16" stroke-width="2" />
    <text x="170" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">v_2</text>

    <!-- Node 3 (Gray, Active) -->
    <circle class="sem-muted-fill sem-muted-stroke" cx="170" cy="140" r="16" stroke-width="2" />
    <text x="170" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">v_3</text>

    <!-- Node 4 (White, Unvisited) -->
    <circle class="sem-card sem-muted-stroke" cx="50" cy="140" r="16" stroke-width="2" />
    <text class="sem-muted-text" x="50" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">v_4</text>
    <text class="sem-muted-text" x="50" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" text-anchor="middle">Weiß (Neu)</text>

    <!-- Forward Edges -->
    <line class="sem-muted-stroke" x1="66" y1="50" x2="154" y2="50" stroke-width="2" />
    <line class="sem-muted-stroke" x1="170" y1="66" x2="170" y2="124" stroke-width="2" />

    <!-- Red Back-Edge from v_3 to v_1 -->
    <path class="sem-danger-stroke" d="M 156 130 L 64 62" stroke-width="2.5" stroke-dasharray="3,2" />
    
    <!-- Shielded badge for text -->
    <rect class="sem-danger-stroke" x="58" y="90" width="104" height="20" rx="3" fill="#ffffff" stroke-width="1" />
    <text class="sem-danger-text" x="110" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">Rückwärtskante!</text>
  </g>

  <!-- Algorithm Legend -->
  <g transform="translate(15, 246)">
    <rect class="sem-primary" width="240" height="84" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-primary-text" >Die 3 Markierungsfarben</text>
    <text x="120" y="38" class="desc sem-neutral-text sem-muted-text" >1. Weiß: Noch nicht besucht</text>
    <text x="120" y="54" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">2. Grau: Im aktuellen Rekursionspfad</text>
    <text x="120" y="72" class="desc sem-neutral-text sem-primary-text" >3. Schwarz: Vollständig abgeschlossen</text>
  </g>

  <!-- Summary Footer -->
  <rect class="sem-danger" x="15" y="342" width="240" height="64" rx="6" stroke-width="1.5" />
  <text x="135" y="364" class="lbl sem-danger-text" >Zyklen-Bedingung</text>
  <text x="135" y="388" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">Kante auf grauen Knoten = Zyklus!</text>
</svg>