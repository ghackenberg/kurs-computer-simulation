<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 420" width="270" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
.hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold;  text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px;  text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px;  text-anchor: middle; }
    </style>
  </defs>

  <rect class="sem-card" width="270" height="420" rx="10" stroke-width="1.5" />
  <text x="135" y="24" class="hdr sem-primary-text">Algebraische Schleifen</text>
  <text x="135" y="42" class="sub sem-muted-text">Integrator vs. Direkter Durchgriff</text>

  <!-- Box 1: Healthy Loop with Integrator -->
  <g transform="translate(15, 54)">
    <rect class="sem-success" width="240" height="130" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-success-text" >1. Zulässig: Mit Integrator 1/s</text>
    
    <g transform="translate(20, 28)">
      <circle class="sem-success" cx="20" cy="25" r="12" />
      <text class="sem-success-text" x="20" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">+</text>

      <rect class="sem-success" x="65" y="10" width="45" height="30" rx="3" />
      <text class="sem-success-text" x="87" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">1/s</text>

      <rect class="sem-success" x="135" y="10" width="45" height="30" rx="3" />
      <text class="sem-success-text" x="157" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">k</text>

      <!-- Connections -->
      <line class="sem-success-stroke" x1="32" y1="25" x2="65" y2="25" stroke-width="1.5" />
      <line class="sem-success-stroke" x1="110" y1="25" x2="135" y2="25" stroke-width="1.5" />
      <!-- Feedback with delay -->
      <path class="sem-success-stroke" d="M 180 25 L 195 25 L 195 55 L 20 55 L 20 37" fill="none" stroke-width="1.5" />
    </g>

    <text x="120" y="102" class="desc sem-neutral-text sem-success-text" style="font-weight: bold;">Kausale Zeitverzögerung</text>
    <text x="120" y="118" class="desc sem-neutral-text sem-success-text" >Explizit lösbar: dx/dt = f(x, u)</text>
  </g>

  <!-- Box 2: Algebraic Loop (Direct Feedthrough) -->
  <g transform="translate(15, 196)">
    <rect class="sem-danger" width="240" height="134" rx="6" stroke-width="1.5" />
    <text x="120" y="20" class="lbl sem-danger-text" >2. Algebraische Schleife (D != 0)</text>

    <g transform="translate(20, 28)">
      <circle class="sem-danger" cx="20" cy="25" r="12" />
      <text class="sem-danger-text" x="20" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">+</text>

      <rect class="sem-danger" x="65" y="10" width="45" height="30" rx="3" />
      <text class="sem-danger-text" x="87" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">k_1</text>

      <rect class="sem-danger" x="135" y="10" width="45" height="30" rx="3" />
      <text class="sem-danger-text" x="157" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle">k_2</text>

      <!-- Connections in red loop -->
      <line class="sem-danger-stroke" x1="32" y1="25" x2="65" y2="25" stroke-width="2" />
      <line class="sem-danger-stroke" x1="110" y1="25" x2="135" y2="25" stroke-width="2" />
      <path class="sem-danger-stroke" d="M 180 25 L 195 25 L 195 55 L 20 55 L 20 37" fill="none" stroke-width="2" />
    </g>

    <text x="120" y="102" class="desc sem-neutral-text sem-danger-text" style="font-weight: bold;">Kein Speicherbaustein!</text>
    <text x="120" y="118" class="desc sem-neutral-text sem-danger-text" >y = g(y, u) erzwingt Nullstellensuche</text>
  </g>

  <!-- Summary Footer -->
  <rect class="sem-primary" x="15" y="342" width="240" height="64" rx="6" stroke-width="1.5" />
  <text x="135" y="364" class="lbl sem-primary-text" >MSAGL Visualisierung</text>
  <text x="135" y="383" class="desc sem-neutral-text sem-primary-text" style="font-weight: bold;">Schleifenkanten auffällig rot färben</text>
  <text x="135" y="398" class="desc sem-neutral-text sem-primary-text" >Diagnose vor Solver-Start</text>
</svg>