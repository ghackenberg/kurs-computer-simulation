<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-info-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-warning-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
  </defs>
  <style>
    
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: url(#grad-sem-info-fill); }
      .sem-info-text { fill: #075985; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: url(#grad-sem-neutral-fill); }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>

  <!-- Spalten-Header über K, u, f -->
  <text class="sem-success-text" x="135" y="24" font-size="15" font-weight="700" text-anchor="middle">f (n_f = 3)</text>
  <text class="sem-muted-text" x="285" y="24" font-size="15" font-weight="700" text-anchor="middle">p (n_p = 3)</text>
  <text class="sem-neutral-text" x="425" y="24" font-size="15" font-weight="700" text-anchor="middle">u</text>
  <text class="sem-neutral-text" x="555" y="24" font-size="15" font-weight="700" text-anchor="middle">f</text>

  <!-- Matrix K Klammern -->
  <path class="sem-neutral-stroke" d="M 45 40 L 34 40 L 34 320 L 45 320" fill="none" stroke-width="3" />
  <path class="sem-neutral-stroke" d="M 335 40 L 346 40 L 346 320 L 335 320" fill="none" stroke-width="3" />

  <!-- K_ff (oben links) -->
  <rect class="sem-success" x="52" y="46" width="166" height="148" rx="8" stroke-width="2.5" />
  <text class="sem-success-text" x="135" y="96" font-size="22" font-weight="700" text-anchor="middle">K_ff</text>
  <text class="sem-success-text" x="135" y="124" font-size="15" font-weight="700" text-anchor="middle">n_f &#215; n_f (SPD)</text>
  <text class="sem-success-text" x="135" y="150" font-size="14" text-anchor="middle">Cholesky: L &#183; L&#7488;</text>

  <!-- K_fp (oben rechts) -->
  <rect class="sem-muted" x="226" y="46" width="104" height="148" rx="8" stroke-width="1.5" stroke-dasharray="5,4" />
  <text class="sem-muted-text" x="278" y="96" font-size="20" font-weight="700" text-anchor="middle">K_fp</text>
  <text class="sem-danger-text" x="278" y="126" font-size="15" font-weight="700" text-anchor="middle">&#183; u_p = 0</text>
  <text class="sem-muted-text" x="278" y="152" font-size="14" text-anchor="middle">(entfällt)</text>

  <!-- K_pf (unten links) -->
  <rect class="sem-info" x="52" y="204" width="166" height="110" rx="8" stroke-width="2" />
  <text class="sem-info-text" x="135" y="250" font-size="20" font-weight="700" text-anchor="middle">K_pf</text>
  <text class="sem-info-text" x="135" y="278" font-size="14.5" font-weight="700" text-anchor="middle">n_p &#215; n_f (Reaktion)</text>

  <!-- K_pp (unten rechts) -->
  <rect class="sem-muted" x="226" y="204" width="104" height="110" rx="8" stroke-width="1.5" />
  <text class="sem-muted-text" x="278" y="250" font-size="20" font-weight="700" text-anchor="middle">K_pp</text>
  <text class="sem-muted-text" x="278" y="278" font-size="14.5" text-anchor="middle">&#183; u_p = 0</text>

  <!-- Malpunkt -->
  <text class="sem-neutral-text" x="364" y="188" font-size="26" font-weight="700" text-anchor="middle">&#183;</text>

  <!-- Vektor u Klammern -->
  <path class="sem-neutral-stroke" d="M 386 40 L 378 40 L 378 320 L 386 320" fill="none" stroke-width="2.5" />
  <path class="sem-neutral-stroke" d="M 464 40 L 472 40 L 472 320 L 464 320" fill="none" stroke-width="2.5" />

  <!-- u_f -->
  <rect class="sem-danger" x="386" y="46" width="78" height="148" rx="8" stroke-width="2.5" />
  <text class="sem-danger-text" x="425" y="106" font-size="22" font-weight="700" text-anchor="middle">u_f</text>
  <text class="sem-danger-text" x="425" y="136" font-size="14.5" font-weight="700" text-anchor="middle">gesucht</text>
  <text class="sem-danger-text" x="425" y="160" font-size="14" text-anchor="middle">[m]</text>

  <!-- u_p = 0 -->
  <rect class="sem-muted" x="386" y="204" width="78" height="110" rx="8" stroke-width="1.5" />
  <text class="sem-muted-text" x="425" y="254" font-size="19" font-weight="700" text-anchor="middle">u_p = 0</text>
  <text class="sem-muted-text" x="425" y="280" font-size="14" text-anchor="middle">Lager</text>

  <!-- Gleichheitszeichen -->
  <text class="sem-neutral-text" x="492" y="188" font-size="26" font-weight="700" text-anchor="middle">=</text>

  <!-- Vektor f Klammern -->
  <path class="sem-neutral-stroke" d="M 514 40 L 506 40 L 506 320 L 514 320" fill="none" stroke-width="2.5" />
  <path class="sem-neutral-stroke" d="M 596 40 L 604 40 L 604 320 L 596 320" fill="none" stroke-width="2.5" />

  <!-- f_f -->
  <rect class="sem-primary" x="514" y="46" width="82" height="148" rx="8" stroke-width="2.5" />
  <text class="sem-primary-text" x="555" y="106" font-size="22" font-weight="700" text-anchor="middle">f_f</text>
  <text class="sem-primary-text" x="555" y="136" font-size="14.5" font-weight="700" text-anchor="middle">bekannt</text>
  <text class="sem-primary-text" x="555" y="160" font-size="14" text-anchor="middle">[N]</text>

  <!-- f_p -->
  <rect class="sem-warning" x="514" y="204" width="82" height="110" rx="8" stroke-width="2.5" />
  <text class="sem-warning-text" x="555" y="250" font-size="21" font-weight="700" text-anchor="middle">f_p</text>
  <text class="sem-warning-text" x="555" y="278" font-size="14.5" font-weight="700" text-anchor="middle">Reaktion</text>

  <!-- Pfeile rechts zu den 2 Rechenschritten -->
  <line class="sem-success-stroke" x1="614" y1="120" x2="652" y2="120" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line class="sem-warning-stroke" x1="614" y1="259" x2="652" y2="259" stroke-width="3.5" marker-end="url(#arrow-amber)" />

  <!-- Schritt 1 rechts (kompakt & konkret) -->
  <rect class="sem-success" x="660" y="46" width="405" height="148" rx="10" stroke-width="2" />
  <text class="sem-success-text" x="680" y="76" font-size="16" font-weight="700">1. Verschiebungen (Cholesky)</text>
  <text class="sem-neutral-text" x="680" y="106" font-size="15.5" font-weight="700">K_ff &#183; u_f = f_f   &#8658;   L &#183; y = f_f,  L&#7488; &#183; u_f = y</text>
  <text class="sem-success-text" x="680" y="138" font-size="14.5">Aufwand: 1/3 n_f&#179; Ops (2&#215; schneller als LU)</text>
  <text class="sem-neutral-text" x="680" y="168" font-size="14.5" font-weight="700">Stufe 1 (3-Knoten):  u_y3 = -1,823 mm</text>

  <!-- Schritt 2 rechts -->
  <rect class="sem-warning" x="660" y="204" width="405" height="110" rx="10" stroke-width="2" />
  <text class="sem-warning-text" x="680" y="234" font-size="16" font-weight="700">2. Lagerreaktionen (Post-Processing)</text>
  <text class="sem-neutral-text" x="680" y="264" font-size="15.5" font-weight="700">f_p = K_pf &#183; u_f   (keine Inversion nötig!)</text>
  <text class="sem-neutral-text" x="680" y="294" font-size="14.5" font-weight="700">Stufe 1 (3-Knoten):  F_y1 = F_y2 = +5,00 kN</text>

  <!-- Fußzeile: DOF-Beispiel aus Stufe 1 -->
  <rect class="sem-card" x="34" y="346" width="1031" height="54" rx="8" stroke-width="1.2" />
  <text class="sem-card-text" x="550" y="378" font-size="15" font-weight="700" text-anchor="middle">Beispiel 3-Knoten-Träger (Stufe 1):   f = [2, 4, 5] (3 freie DOFs)   |   p = [0, 1, 3] (3 gesperrte Lager-DOFs)</text>
</svg>
