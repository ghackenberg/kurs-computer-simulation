<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 10 440 340" width="440" height="340">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-info-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-muted-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arrow-force-info" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-info-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arrow-force-danger" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
  </defs>
  <style>
    
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: url(#grad-sem-info-fill); }
      .sem-info-text { fill: #075985; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>

  <!-- 3D-Koordinatenachsen um Knoten i (250, 175) -->
  <!-- x-Achse (vorne links) -->
  <line class="sem-muted-stroke" x1="250" y1="175" x2="115" y2="255" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-axis)" />
  <text class="sem-muted-text" x="95" y="268" font-size="16" font-weight="700" text-anchor="middle">x</text>

  <!-- y-Achse (rechts) -->
  <line class="sem-muted-stroke" x1="250" y1="175" x2="455" y2="175" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-axis)" />
  <text class="sem-muted-text" x="472" y="180" font-size="16" font-weight="700">y</text>

  <!-- z-Achse (oben) -->
  <line class="sem-muted-stroke" x1="250" y1="175" x2="250" y2="28" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-axis)" />
  <text class="sem-muted-text" x="266" y="34" font-size="16" font-weight="700">z</text>

  <!-- Stabachsen (grau, hinter den Kraftpfeilen) -->
  <line class="sem-muted-stroke" x1="250" y1="175" x2="430" y2="68" stroke-width="5" stroke-linecap="round" />
  <line class="sem-muted-stroke" x1="250" y1="175" x2="95" y2="75" stroke-width="5" stroke-linecap="round" />
  <line class="sem-muted-stroke" x1="250" y1="175" x2="420" y2="275" stroke-width="5" stroke-linecap="round" />

  <!-- Stabkraftvektoren S_j * e_j -->
  <!-- Stab 1 -->
  <line class="sem-info-stroke" x1="250" y1="175" x2="375" y2="101" stroke-width="3.5" marker-end="url(#arrow-force-info)" />
  <text class="sem-info-text" x="348" y="72" font-size="16" font-weight="700" text-anchor="middle">S_1 &#183; e_1</text>

  <!-- Stab 2 -->
  <line class="sem-info-stroke" x1="250" y1="175" x2="140" y2="104" stroke-width="3.5" marker-end="url(#arrow-force-info)" />
  <text class="sem-info-text" x="108" y="138" font-size="16" font-weight="700" text-anchor="middle">S_2 &#183; e_2</text>

  <!-- Stab 3 -->
  <line class="sem-info-stroke" x1="250" y1="175" x2="365" y2="243" stroke-width="3.5" marker-end="url(#arrow-force-info)" />
  <text class="sem-info-text" x="368" y="218" font-size="16" font-weight="700" text-anchor="middle">S_3 &#183; e_3</text>

  <!-- Externe Knotenlast F_ext -->
  <line class="sem-danger-stroke" x1="250" y1="175" x2="215" y2="275" stroke-width="3.5" marker-end="url(#arrow-force-danger)" />
  <text class="sem-danger-text" x="174" y="282" font-size="16" font-weight="700" text-anchor="middle">F_ext</text>

  <!-- Knoten i (Zentrum) -->
  <circle class="sem-primary" cx="250" cy="175" r="11" stroke-width="3" />
  <text class="sem-primary-text" x="252" y="255" font-size="15" font-weight="700">Knoten i</text>

  <!-- Gleichgewichts-Pill unten -->
  <rect class="sem-card" x="70" y="308" width="400" height="36" rx="8" stroke-width="1.2" />
  <text class="sem-card-text" x="270" y="331" font-size="15.5" font-weight="700" text-anchor="middle">&#931; (S_j &#183; e_j) + F_ext = 0</text>
</svg>
