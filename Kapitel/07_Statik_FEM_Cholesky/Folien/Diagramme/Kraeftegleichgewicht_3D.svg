<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="100%" height="100%">
  <defs>
    <!-- Pfeilspitze für Koordinatenachsen -->
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-muted-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <!-- Pfeilspitze für Stabkräfte (Blau) -->
    <marker id="arrow-force-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-info-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <!-- Pfeilspitze für externe Kraft (Rot) -->
    <marker id="arrow-force-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: #e0f2fe; stroke: #0284c7; }
      .sem-info-bg { fill: #e0f2fe; stroke: none; }
      .sem-info-stroke { stroke: #0284c7; }
      .sem-info-fill { fill: #0284c7; }
      .sem-info-text { fill: #0369a1; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Rahmen & Hintergrund -->
  <rect class="sem-card-stroke" x="5" y="5" width="370" height="330" rx="12" fill="#FFFFFF" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Titelbanner -->
  <rect class="sem-muted" x="5" y="5" width="370" height="36" rx="12"  stroke="none"/>
  <rect class="sem-muted" x="5" y="29" width="370" height="12"  stroke="none"/>
  <line class="sem-muted-stroke" x1="5" y1="41" x2="375" y2="41" stroke-width="1.5" />
  <text class="sem-primary-text" x="18" y="27" font-size="16" font-weight="700">3D-Kräfte am Knoten i</text>

  <!-- 3D-KOORDINATENACHSEN (grau, dezent) -->
  <!-- Knoten i liegt bei (170, 175) -->
  <!-- x-Achse (schräg nach links unten) -->
  <line class="sem-muted-stroke" x1="170" y1="175" x2="75" y2="232" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-axis)" />
  <text class="sem-muted-text" x="60" y="245" font-size="16" font-weight="700">x</text>

  <!-- y-Achse (nach rechts) -->
  <line class="sem-muted-stroke" x1="170" y1="175" x2="315" y2="175" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-axis)" />
  <text class="sem-muted-text" x="325" y="180" font-size="16" font-weight="700">y</text>

  <!-- z-Achse (nach oben) -->
  <line class="sem-muted-stroke" x1="170" y1="175" x2="170" y2="52" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-axis)" />
  <text class="sem-muted-text" x="170" y="46" font-size="16" font-weight="700" text-anchor="middle">z</text>

  <!-- STABACHSEN (3D-Stäbe) -->
  <!-- Stab 1 -->
  <line class="sem-muted-stroke" x1="170" y1="175" x2="305" y2="95" stroke-width="4.5" stroke-linecap="round" />
  <!-- Stab 2 -->
  <line class="sem-muted-stroke" x1="170" y1="175" x2="70" y2="98" stroke-width="4.5" stroke-linecap="round" />
  <!-- Stab 3 -->
  <line class="sem-muted-stroke" x1="170" y1="175" x2="295" y2="250" stroke-width="4.5" stroke-linecap="round" />

  <!-- STABKRÄFTE (Vektoren S_j · e_j) -->
  <!-- Kraft Stab 1 -->
  <line class="sem-info-stroke" x1="170" y1="175" x2="265" y2="119" stroke-width="3" marker-end="url(#arrow-force-blue)" />
  <text class="sem-info-text" x="240" y="105" font-size="15" font-weight="700">S1 · e1</text>

  <!-- Kraft Stab 2 (mit Shield-Badge) -->
  <line class="sem-info-stroke" x1="170" y1="175" x2="98" y2="120" stroke-width="3" marker-end="url(#arrow-force-blue)" />
  <g transform="translate(50, 95)">
    <rect class="sem-info" x="0" y="0" width="62" height="22" rx="3" stroke-width="1" />
    <text class="sem-info-text" x="31" y="16" font-size="14" font-weight="700" text-anchor="middle">S2 · e2</text>
  </g>

  <!-- Kraft Stab 3 -->
  <line class="sem-info-stroke" x1="170" y1="175" x2="255" y2="227" stroke-width="3" marker-end="url(#arrow-force-blue)" />
  <text class="sem-info-text" x="250" y="215" font-size="15" font-weight="700">S3 · e3</text>

  <!-- EXTERNE LAST (F_ext) -->
  <line class="sem-danger-stroke" x1="170" y1="175" x2="128" y2="255" stroke-width="3.5" marker-end="url(#arrow-force-red)" />
  <text class="sem-danger-text" x="95" y="272" font-size="16" font-weight="700">F_ext</text>

  <!-- KNOTEN i (Zentrum, mit Shield-Badge) -->
  <circle class="sem-primary-stroke" cx="170" cy="175" r="8" fill="#FFFFFF" stroke-width="3" />
  <g transform="translate(185, 150)">
    <rect class="sem-primary" x="0" y="0" width="68" height="22" rx="3" stroke-width="1" />
    <text class="sem-primary-text" x="34" y="16" font-size="14" font-weight="700" text-anchor="middle">Knoten i</text>
  </g>

  <!-- GLEICHGEWICHTS-INFOBOX UNTEN -->
  <rect class="sem-card" x="15" y="285" width="350" height="38" rx="8" stroke-width="1.2" />
  <text class="sem-card-text" x="190" y="309" font-size="15" font-weight="700" text-anchor="middle">
    Σ (S_j · e_j) + F_ext = 0
  </text>
</svg>
