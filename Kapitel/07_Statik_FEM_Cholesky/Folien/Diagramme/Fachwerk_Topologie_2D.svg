<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="100%" height="100%">
  <defs>
    <!-- Pfeilspitze Last / Kraft -->
    <marker id="arrow-force" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <!-- Pfeilspitze Lagerreaktion -->
    <marker id="arrow-reaction" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: #f8fafc; stroke: #cbd5e1; }
      .sem-card-bg { fill: #f8fafc; stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Karte & Hintergrund -->
  <rect class="sem-card-stroke" x="5" y="5" width="530" height="360" rx="12" fill="#FFFFFF" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Titelbanner -->
  <rect class="sem-muted" x="5" y="5" width="530" height="40" rx="12"  stroke="none"/>
  <rect class="sem-muted" x="5" y="33" width="530" height="12"  stroke="none"/>
  <line class="sem-muted-stroke" x1="5" y1="45" x2="535" y2="45" stroke-width="1.5" />
  <text class="sem-primary-text" x="20" y="30" font-size="17" font-weight="700">Topologie eines 2D-Fachwerks (5 Knoten, 7 Stäbe)</text>

  <!-- STÄBE (Truss Members) -->
  <!-- S1: 1 -> 2 -->
  <line class="sem-primary-stroke" x1="95" y1="240" x2="265" y2="240" stroke-width="4.5" stroke-linecap="round" />
  <!-- S2: 2 -> 3 -->
  <line class="sem-primary-stroke" x1="265" y1="240" x2="435" y2="240" stroke-width="4.5" stroke-linecap="round" />
  <!-- S3: 4 -> 5 -->
  <line class="sem-primary-stroke" x1="180" y1="120" x2="350" y2="120" stroke-width="4.5" stroke-linecap="round" />
  <!-- S4: 1 -> 4 -->
  <line class="sem-primary-stroke" x1="95" y1="240" x2="180" y2="120" stroke-width="4.5" stroke-linecap="round" />
  <!-- S5: 2 -> 4 -->
  <line class="sem-primary-stroke" x1="265" y1="240" x2="180" y2="120" stroke-width="4.5" stroke-linecap="round" />
  <!-- S6: 2 -> 5 -->
  <line class="sem-primary-stroke" x1="265" y1="240" x2="350" y2="120" stroke-width="4.5" stroke-linecap="round" />
  <!-- S7: 3 -> 5 -->
  <line class="sem-primary-stroke" x1="435" y1="240" x2="350" y2="120" stroke-width="4.5" stroke-linecap="round" />

  <!-- STAB-BESCHRIFTUNGEN (Badges, font-size: 16px) -->
  <!-- S1 -->
  <rect class="sem-primary" x="162" y="227" width="36" height="26" rx="5" stroke-width="1.5" />
  <text class="sem-primary-text" x="180" y="245" font-size="16" font-weight="700" text-anchor="middle">S1</text>

  <!-- S2 -->
  <rect class="sem-primary" x="332" y="227" width="36" height="26" rx="5" stroke-width="1.5" />
  <text class="sem-primary-text" x="350" y="245" font-size="16" font-weight="700" text-anchor="middle">S2</text>

  <!-- S3 -->
  <rect class="sem-primary" x="247" y="107" width="36" height="26" rx="5" stroke-width="1.5" />
  <text class="sem-primary-text" x="265" y="125" font-size="16" font-weight="700" text-anchor="middle">S3</text>

  <!-- S4 -->
  <rect class="sem-primary" x="115" y="167" width="36" height="26" rx="5" stroke-width="1.5" />
  <text class="sem-primary-text" x="133" y="185" font-size="16" font-weight="700" text-anchor="middle">S4</text>

  <!-- S5 -->
  <rect class="sem-primary" x="202" y="167" width="36" height="26" rx="5" stroke-width="1.5" />
  <text class="sem-primary-text" x="220" y="185" font-size="16" font-weight="700" text-anchor="middle">S5</text>

  <!-- S6 -->
  <rect class="sem-primary" x="292" y="167" width="36" height="26" rx="5" stroke-width="1.5" />
  <text class="sem-primary-text" x="310" y="185" font-size="16" font-weight="700" text-anchor="middle">S6</text>

  <!-- S7 -->
  <rect class="sem-primary" x="380" y="167" width="36" height="26" rx="5" stroke-width="1.5" />
  <text class="sem-primary-text" x="398" y="185" font-size="16" font-weight="700" text-anchor="middle">S7</text>

  <!-- LAGERUNGEN -->
  <!-- Festlager bei Knoten 1 (95, 240) -->
  <polygon class="sem-muted" points="95,240 82,260 108,260" stroke-width="1.8" />
  <line class="sem-muted-stroke" x1="72" y1="260" x2="118" y2="260" stroke-width="2.5" />
  <line class="sem-muted-stroke" x1="76" y1="260" x2="71" y2="268" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="86" y1="260" x2="81" y2="268" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="96" y1="260" x2="91" y2="268" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="106" y1="260" x2="101" y2="268" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="116" y1="260" x2="111" y2="268" stroke-width="1.5" />
  <!-- Lagerreaktionskräfte Ax, Ay -->
  <line class="sem-success-stroke" x1="25" y1="240" x2="78" y2="240" stroke-width="2.5" marker-end="url(#arrow-reaction)" />
  <text class="sem-success-text" x="45" y="232" font-size="16" font-weight="700">A_x</text>

  <line class="sem-success-stroke" x1="95" y1="305" x2="95" y2="268" stroke-width="2.5" marker-end="url(#arrow-reaction)" />
  <text class="sem-success-text" x="105" y="295" font-size="16" font-weight="700">A_y</text>
  <text class="sem-muted-text" x="35" y="278" font-size="15" font-weight="600">Festlager</text>

  <!-- Loslager bei Knoten 3 (435, 240) -->
  <polygon class="sem-muted" points="435,240 422,258 448,258" stroke-width="1.8" />
  <!-- Rollen -->
  <circle class="sem-muted-stroke" cx="428" cy="263" r="3.5" fill="#FFFFFF" stroke-width="1.5" />
  <circle class="sem-muted-stroke" cx="442" cy="263" r="3.5" fill="#FFFFFF" stroke-width="1.5" />
  <!-- Bodenlinie -->
  <line class="sem-muted-stroke" x1="412" y1="268" x2="458" y2="268" stroke-width="2.5" />
  <line class="sem-muted-stroke" x1="416" y1="268" x2="411" y2="276" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="426" y1="268" x2="421" y2="276" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="436" y1="268" x2="431" y2="276" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="446" y1="268" x2="441" y2="276" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="456" y1="268" x2="451" y2="276" stroke-width="1.5" />
  <!-- Lagerreaktionskraft Cy -->
  <line class="sem-success-stroke" x1="435" y1="305" x2="435" y2="276" stroke-width="2.5" marker-end="url(#arrow-reaction)" />
  <text class="sem-success-text" x="445" y="295" font-size="16" font-weight="700">C_y</text>
  <text class="sem-muted-text" x="465" y="265" font-size="15" font-weight="600">Loslager</text>

  <!-- ÄUSSERE LASTEN -->
  <!-- Last F bei Knoten 5 (350, 120) -->
  <line class="sem-danger-stroke" x1="350" y1="52" x2="350" y2="105" stroke-width="3" marker-end="url(#arrow-force)" />
  <text class="sem-danger-text" x="362" y="75" font-size="18" font-weight="700">F</text>
  <text class="sem-danger-text" x="362" y="93" font-size="15">(Last)</text>

  <!-- KNOTEN -->
  <!-- Knoten 1 -->
  <circle class="sem-primary-stroke" cx="95" cy="240" r="14" fill="#FFFFFF" stroke-width="3" />
  <text class="sem-primary-text" x="95" y="246" font-size="16" font-weight="700" text-anchor="middle">1</text>

  <!-- Knoten 2 -->
  <circle class="sem-primary-stroke" cx="265" cy="240" r="14" fill="#FFFFFF" stroke-width="3" />
  <text class="sem-primary-text" x="265" y="246" font-size="16" font-weight="700" text-anchor="middle">2</text>

  <!-- Knoten 3 -->
  <circle class="sem-primary-stroke" cx="435" cy="240" r="14" fill="#FFFFFF" stroke-width="3" />
  <text class="sem-primary-text" x="435" y="246" font-size="16" font-weight="700" text-anchor="middle">3</text>

  <!-- Knoten 4 -->
  <circle class="sem-primary-stroke" cx="180" cy="120" r="14" fill="#FFFFFF" stroke-width="3" />
  <text class="sem-primary-text" x="180" y="126" font-size="16" font-weight="700" text-anchor="middle">4</text>

  <!-- Knoten 5 -->
  <circle class="sem-primary-stroke" cx="350" cy="120" r="14" fill="#FFFFFF" stroke-width="3" />
  <text class="sem-primary-text" x="350" y="126" font-size="16" font-weight="700" text-anchor="middle">5</text>

  <!-- LEGENDE / STATIK-INFO BOX -->
  <rect class="sem-card" x="20" y="320" width="500" height="36" rx="8" stroke-width="1.2" />
  <text class="sem-card-text" x="270" y="343" font-size="15" text-anchor="middle">
    <tspan class="sem-primary-text" font-weight="700">5 Knoten</tspan>  •  
    <tspan class="sem-primary-text" font-weight="700">7 Stäbe</tspan>  •  
    <tspan class="sem-success-text" font-weight="700">3 Lagerreaktionen</tspan>  •  
    <tspan font-weight="700">2k = s + l</tspan>
  </text>
</svg>
