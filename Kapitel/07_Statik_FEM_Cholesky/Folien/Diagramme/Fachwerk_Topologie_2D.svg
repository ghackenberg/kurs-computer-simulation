<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 560 360" width="560" height="360">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrow-force" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arrow-reaction" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
  </defs>
  <style>
    
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>

  <!-- Stäbe (5 Knoten, 7 Stäbe) -->
  <!-- S1: 1 (100,220) -> 2 (260,220) -->
  <line class="sem-primary-stroke" x1="100" y1="220" x2="260" y2="220" stroke-width="5" stroke-linecap="round" />
  <!-- S2: 2 (260,220) -> 3 (420,220) -->
  <line class="sem-primary-stroke" x1="260" y1="220" x2="420" y2="220" stroke-width="5" stroke-linecap="round" />
  <!-- S3: 4 (180,100) -> 5 (340,100) -->
  <line class="sem-primary-stroke" x1="180" y1="100" x2="340" y2="100" stroke-width="5" stroke-linecap="round" />
  <!-- S4: 1 (100,220) -> 4 (180,100) -->
  <line class="sem-primary-stroke" x1="100" y1="220" x2="180" y2="100" stroke-width="5" stroke-linecap="round" />
  <!-- S5: 2 (260,220) -> 4 (180,100) -->
  <line class="sem-primary-stroke" x1="260" y1="220" x2="180" y2="100" stroke-width="5" stroke-linecap="round" />
  <!-- S6: 2 (260,220) -> 5 (340,100) -->
  <line class="sem-primary-stroke" x1="260" y1="220" x2="340" y2="100" stroke-width="5" stroke-linecap="round" />
  <!-- S7: 3 (420,220) -> 5 (340,100) -->
  <line class="sem-primary-stroke" x1="420" y1="220" x2="340" y2="100" stroke-width="5" stroke-linecap="round" />

  <!-- Stab-Labels (sauber neben den Stäben, keine engen Rects) -->
  <text class="sem-primary-text" x="180" y="208" font-size="15" font-weight="700" text-anchor="middle">S1</text>
  <text class="sem-primary-text" x="340" y="208" font-size="15" font-weight="700" text-anchor="middle">S2</text>
  <text class="sem-primary-text" x="260" y="88" font-size="15" font-weight="700" text-anchor="middle">S3</text>
  <text class="sem-primary-text" x="120" y="154" font-size="15" font-weight="700" text-anchor="middle">S4</text>
  <text class="sem-primary-text" x="200" y="164" font-size="15" font-weight="700" text-anchor="middle">S5</text>
  <text class="sem-primary-text" x="320" y="164" font-size="15" font-weight="700" text-anchor="middle">S6</text>
  <text class="sem-primary-text" x="400" y="154" font-size="15" font-weight="700" text-anchor="middle">S7</text>

  <!-- Festlager bei Knoten 1 (100, 220) -->
  <polygon class="sem-muted" points="100,220 86,242 114,242" stroke-width="2" />
  <line class="sem-muted-stroke" x1="76" y1="242" x2="124" y2="242" stroke-width="2.5" />
  <line class="sem-muted-stroke" x1="82" y1="242" x2="76" y2="250" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="94" y1="242" x2="88" y2="250" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="106" y1="242" x2="100" y2="250" stroke-width="1.5" />
  <line class="sem-muted-stroke" x1="118" y1="242" x2="112" y2="250" stroke-width="1.5" />

  <!-- Reaktionen Festlager: A_x, A_y -->
  <line class="sem-success-stroke" x1="25" y1="220" x2="80" y2="220" stroke-width="3" marker-end="url(#arrow-reaction)" />
  <text class="sem-success-text" x="45" y="206" font-size="15" font-weight="700" text-anchor="middle">A_x = 0 kN</text>

  <line class="sem-success-stroke" x1="100" y1="305" x2="100" y2="256" stroke-width="3" marker-end="url(#arrow-reaction)" />
  <text class="sem-success-text" x="114" y="295" font-size="15" font-weight="700">A_y = +2,5 kN</text>
  <text class="sem-muted-text" x="14" y="266" font-size="15" font-weight="600">Festlager</text>

  <!-- Loselager bei Knoten 3 (420, 220) -->
  <polygon class="sem-muted" points="420,220 406,240 434,240" stroke-width="2" />
  <circle class="sem-muted-stroke" cx="412" cy="245" r="3.5" fill="none" stroke-width="1.8" />
  <circle class="sem-muted-stroke" cx="428" cy="245" r="3.5" fill="none" stroke-width="1.8" />
  <line class="sem-muted-stroke" x1="396" y1="250" x2="444" y2="250" stroke-width="2.5" />

  <!-- Reaktion Loselager: C_y -->
  <line class="sem-success-stroke" x1="420" y1="305" x2="420" y2="256" stroke-width="3" marker-end="url(#arrow-reaction)" />
  <text class="sem-success-text" x="434" y="295" font-size="15" font-weight="700">C_y = +7,5 kN</text>
  <text class="sem-muted-text" x="448" y="246" font-size="15" font-weight="600">Loselager</text>

  <!-- Äußere Last F bei Knoten 5 (340, 100) -->
  <line class="sem-danger-stroke" x1="340" y1="18" x2="340" y2="80" stroke-width="3.5" marker-end="url(#arrow-force)" />
  <text class="sem-danger-text" x="354" y="42" font-size="16" font-weight="700">F = 10 kN</text>
  <text class="sem-danger-text" x="354" y="62" font-size="15">(Knotenlast)</text>

  <!-- Knoten 1..5 -->
  <circle class="sem-primary" cx="100" cy="220" r="14" stroke-width="2.5" />
  <text class="sem-primary-text" x="100" y="225" font-size="15" font-weight="700" text-anchor="middle">1</text>

  <circle class="sem-primary" cx="260" cy="220" r="14" stroke-width="2.5" />
  <text class="sem-primary-text" x="260" y="225" font-size="15" font-weight="700" text-anchor="middle">2</text>

  <circle class="sem-primary" cx="420" cy="220" r="14" stroke-width="2.5" />
  <text class="sem-primary-text" x="420" y="225" font-size="15" font-weight="700" text-anchor="middle">3</text>

  <circle class="sem-primary" cx="180" cy="100" r="14" stroke-width="2.5" />
  <text class="sem-primary-text" x="180" y="105" font-size="15" font-weight="700" text-anchor="middle">4</text>

  <circle class="sem-primary" cx="340" cy="100" r="14" stroke-width="2.5" />
  <text class="sem-primary-text" x="340" y="105" font-size="15" font-weight="700" text-anchor="middle">5</text>

  <!-- Statik-Bilanz unten (organische Pill) -->
  <rect class="sem-card" x="40" y="320" width="440" height="32" rx="8" stroke-width="1.2" />
  <text class="sem-card-text" x="260" y="341" font-size="15" font-weight="700" text-anchor="middle">2k = s + l  (10 = 7 + 3, Spannweite 4 m)</text>
</svg>
