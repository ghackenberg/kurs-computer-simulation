<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-danger-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-primary-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z" />
    </marker>
  </defs>
  <style>
    
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: url(#grad-sem-danger-fill); }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>

  <!-- Titelbanner -->
  <rect class="sem-muted" x="15" y="10" width="530" height="34" rx="8" stroke-width="1" />
  <text class="sem-primary-text" x="280" y="32" font-size="15" font-weight="700" text-anchor="middle">Kräftepaar am gedehnten Stab (Zug: S &gt; 0, &#916;L &gt; 0)</text>

  <!-- Stabachse -->
  <line class="sem-primary-stroke" x1="150" y1="155" x2="410" y2="155" stroke-width="7" stroke-linecap="round" />

  <!-- Einheitsvektor e = n in Stabmitte -->
  <line class="sem-success-stroke" x1="250" y1="130" x2="310" y2="130" stroke-width="3" marker-end="url(#arrow-green)" />
  <text class="sem-success-text" x="280" y="118" font-size="15" font-weight="700" text-anchor="middle">e = n</text>

  <!-- Knotenkraft f_i = -S * e (nach links) -->
  <line class="sem-danger-stroke" x1="138" y1="155" x2="55" y2="155" stroke-width="3.5" marker-end="url(#arrow-red)" />
  <text class="sem-danger-text" x="92" y="138" font-size="15" font-weight="700" text-anchor="middle">f_i = -S &#183; e</text>

  <!-- Knotenkraft f_j = +S * e (nach rechts) -->
  <line class="sem-danger-stroke" x1="422" y1="155" x2="505" y2="155" stroke-width="3.5" marker-end="url(#arrow-red)" />
  <text class="sem-danger-text" x="468" y="138" font-size="15" font-weight="700" text-anchor="middle">f_j = +S &#183; e</text>

  <!-- Verschiebungsvektoren u_i, u_j -->
  <line class="sem-primary-stroke" x1="150" y1="175" x2="120" y2="205" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)" />
  <text class="sem-primary-text" x="95" y="218" font-size="14" font-weight="700" text-anchor="middle">u_i</text>

  <line class="sem-primary-stroke" x1="410" y1="175" x2="445" y2="205" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)" />
  <text class="sem-primary-text" x="470" y="218" font-size="14" font-weight="700" text-anchor="middle">u_j</text>

  <!-- Knoten i und j -->
  <circle class="sem-primary" cx="150" cy="155" r="14" stroke-width="2.5" />
  <text class="sem-primary-text" x="150" y="160" font-size="15" font-weight="700" text-anchor="middle">i</text>

  <circle class="sem-primary" cx="410" cy="155" r="14" stroke-width="2.5" />
  <text class="sem-primary-text" x="410" y="160" font-size="15" font-weight="700" text-anchor="middle">j</text>

  <!-- Untere Herleitungsbox -->
  <rect class="sem-card" x="20" y="242" width="520" height="62" rx="8" stroke-width="1.2" />
  <text class="sem-card-text" x="280" y="266" font-size="14" font-weight="700" text-anchor="middle">1. Dehnung: &#916;L = [-e&#7488;, +e&#7488;] &#183; u_e    |    2. Kräfte: f_e = [-e; +e] &#183; (EA/L) &#183; &#916;L</text>
  <text class="sem-primary-text" x="280" y="290" font-size="14" font-weight="700" text-anchor="middle">&#8658; Gleichgewicht am Stab: f_i + f_j = 0  (actio = reactio)</text>
</svg>
