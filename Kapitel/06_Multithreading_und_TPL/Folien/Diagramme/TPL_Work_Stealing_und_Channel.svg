<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 438" width="570" height="438">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-primary-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-success-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-muted-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" class="sem-primary-fill"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" class="sem-warning-fill"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" class="sem-success-fill"/>
    </marker>
    <style>
      /* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: url(#grad-sem-primary-fill); }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: url(#grad-sem-success-fill); }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: url(#grad-sem-warning-fill); }
      .sem-warning-text { fill: #92400e; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: url(#grad-sem-muted-fill); }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
      .sec { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: 500; }
      .code { font-family: 'Consolas', monospace; font-size: 12.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Section 1: Work-Stealing -->
  <text x="10" y="26" class="sec sem-muted-text">1. TPL ThreadPool: Lokale Queues &amp; Work-Stealing</text>

  <!-- Worker 0 -->
  <rect x="10" y="42" width="230" height="148" rx="10" class="sem-primary"/>
  <text x="24" y="66" class="lbl sem-primary-text">Worker 0 (ausgelastet)</text>
  <rect x="24" y="82" width="56" height="40" rx="6" class="sem-muted sem-primary-stroke"/>
  <text x="52" y="107" text-anchor="middle" class="code sem-primary-text">T1</text>
  <rect x="90" y="82" width="56" height="40" rx="6" class="sem-muted sem-primary-stroke"/>
  <text x="118" y="107" text-anchor="middle" class="code sem-primary-text">T2</text>
  <rect x="156" y="82" width="56" height="40" rx="6" class="sem-primary"/>
  <text x="184" y="107" text-anchor="middle" class="code sem-primary-text">T3</text>
  <text x="125" y="150" text-anchor="middle" class="sub sem-muted-text">Push / Pop lokal (LIFO)</text>
  <text x="125" y="170" text-anchor="middle" class="sub sem-muted-text">hohe Cache-Lokalität</text>

  <!-- Worker 1 -->
  <rect x="330" y="42" width="230" height="148" rx="10" class="sem-success"/>
  <text x="344" y="66" class="lbl sem-success-text">Worker 1 (Queue leer)</text>
  <rect x="344" y="82" width="202" height="40" rx="6" class="sem-muted sem-success-stroke" stroke-dasharray="4,3"/>
  <text x="445" y="107" text-anchor="middle" class="sub sem-success-text">übernimmt T1 sperrfrei</text>
  <text x="445" y="150" text-anchor="middle" class="sub sem-muted-text">Steal am FIFO-Ende</text>
  <text x="445" y="170" text-anchor="middle" class="sub sem-muted-text">automatischer Lastausgleich</text>

  <!-- Work-Stealing Arrow -->
  <path d="M 338 102 L 246 102" class="sem-warning-stroke" stroke-width="2.5" fill="none" marker-end="url(#arr-amber)"/>
  <text x="292" y="88" text-anchor="middle" class="lbl sem-warning-text">Steal</text>

  <!-- Divider -->
  <line x1="10" y1="214" x2="560" y2="214" class="sem-muted-stroke" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Section 2: Bounded Channel<T> -->
  <text x="10" y="242" class="sec sem-muted-text">2. Lock-freie Telemetrie: Bounded Channel&lt;T&gt;</text>

  <!-- Producer -->
  <rect x="10" y="264" width="132" height="114" rx="10" class="sem-primary"/>
  <text x="76" y="298" text-anchor="middle" class="lbl sem-primary-text">Simulation</text>
  <text x="76" y="324" text-anchor="middle" class="code sem-primary-text">TryWrite()</text>
  <text x="76" y="352" text-anchor="middle" class="sub sem-muted-text">blockiert nie</text>

  <!-- Arrow Producer -> Ringbuffer -->
  <path d="M 146 321 L 184 321" class="sem-primary-stroke" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- Bounded Buffer -->
  <rect x="190" y="264" width="190" height="114" rx="10" class="sem-warning"/>
  <text x="285" y="290" text-anchor="middle" class="lbl sem-warning-text">Ringpuffer (Cap = 3)</text>
  <rect x="204" y="308" width="48" height="42" rx="6" class="sem-muted sem-warning-stroke"/>
  <text x="228" y="334" text-anchor="middle" class="code sem-warning-text">F3</text>
  <rect x="261" y="308" width="48" height="42" rx="6" class="sem-muted sem-warning-stroke"/>
  <text x="285" y="334" text-anchor="middle" class="code sem-warning-text">F4</text>
  <rect x="318" y="308" width="48" height="42" rx="6" class="sem-warning"/>
  <text x="342" y="334" text-anchor="middle" class="code sem-warning-text">F5</text>

  <!-- DropOldest note -->
  <text x="285" y="408" text-anchor="middle" class="sub sem-warning-text">DropOldest verwirft F1/F2 bei Rückstau</text>

  <!-- Arrow Ringbuffer -> Consumer -->
  <path d="M 384 321 L 422 321" class="sem-success-stroke" stroke-width="2.5" fill="none" marker-end="url(#arr-green)"/>

  <!-- Consumer -->
  <rect x="428" y="264" width="132" height="114" rx="10" class="sem-success"/>
  <text x="494" y="298" text-anchor="middle" class="lbl sem-success-text">UI / Logger</text>
  <text x="494" y="324" text-anchor="middle" class="code sem-success-text">ReadAllAsync</text>
  <text x="494" y="352" text-anchor="middle" class="sub sem-muted-text">kein Polling</text>
</svg>
