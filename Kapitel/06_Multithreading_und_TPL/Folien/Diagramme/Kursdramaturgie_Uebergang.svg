<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1160 390" width="1080" height="390">
  <defs>
    <marker id="arrRoad" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .sem-muted-bg { fill: #f1f5f9; stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect x="-40" y="0" width="1160" height="390" fill="none"/>

  <!-- LEFT: Block 1 Werkzeuge T01-T06 -->
  <rect class="sem-primary" x="10" y="16" width="490" height="354" rx="12" stroke-width="2"/>
  <rect class="sem-primary" x="10" y="16" width="490" height="44" rx="12" stroke-width="1.5"/>
  <text class="sem-primary-text" x="255" y="44" font-size="16" font-weight="bold" text-anchor="middle">Block 1: Werkzeuge &amp; Infrastruktur (T01–T06)</text>

  <rect class="sem-primary-stroke" x="34" y="80" width="442" height="54" rx="8" fill="#FFFFFF"/>
  <text class="sem-primary-text" x="52" y="103" font-size="14" font-weight="bold">T01: Kinematik &amp; Expliziter Euler</text>
  <text class="sem-muted-text" x="52" y="123" font-size="13">Grundbegriffe &amp; Zeitschritt-Schleife</text>

  <rect class="sem-primary-stroke" x="34" y="146" width="442" height="54" rx="8" fill="#FFFFFF"/>
  <text class="sem-primary-text" x="52" y="169" font-size="14" font-weight="bold">T02–T04: 2D-Visualisierung (WPF &amp; ScottPlot)</text>
  <text class="sem-muted-text" x="52" y="189" font-size="13">WriteableBitmap, Vektorgrafik-Canvas &amp; 1-kHz-Telemetrie</text>

  <rect class="sem-primary-stroke" x="34" y="212" width="442" height="54" rx="8" fill="#FFFFFF"/>
  <text class="sem-primary-text" x="52" y="235" font-size="14" font-weight="bold">T05: 3D-Szenengraph &amp; OpenGL (SharpGL)</text>
  <text class="sem-muted-text" x="52" y="255" font-size="13">Hierarchische Transformationen, Licht &amp; Orbit-Kamera</text>

  <rect class="sem-warning" x="34" y="278" width="442" height="70" rx="8" stroke-width="2"/>
  <text class="sem-warning-text" x="52" y="305" font-size="14.5" font-weight="bold">T06 (Heute): Multithreading &amp; TPL</text>
  <text class="sem-warning-text" x="52" y="330" font-size="13">Parallel.For, Task.Run, IProgress &amp; CancellationToken</text>

  <!-- Arrow -->
  <line class="sem-primary-stroke" x1="506" y1="193" x2="572" y2="193" stroke-width="4" marker-end="url(#arrRoad)"/>

  <!-- RIGHT: Block 2 Physikalische Modelle T07-T11 -->
  <rect class="sem-success" x="580" y="16" width="490" height="354" rx="12" stroke-width="2"/>
  <rect class="sem-success" x="580" y="16" width="490" height="44" rx="12" stroke-width="1.5"/>
  <text class="sem-success-text" x="825" y="44" font-size="16" font-weight="bold" text-anchor="middle">Block 2: Physikalische Modelle &amp; Solver (T07–T11)</text>

  <rect class="sem-success-stroke" x="604" y="80" width="442" height="54" rx="8" fill="#FFFFFF"/>
  <text class="sem-success-text" x="622" y="103" font-size="14" font-weight="bold">T07: Statische Gleichgewichtsmodelle (FEM)</text>
  <text class="sem-muted-text" x="622" y="123" font-size="13">Lineare Gleichungssysteme &amp; Cholesky-Zerlegung</text>

  <rect class="sem-success-stroke" x="604" y="146" width="442" height="54" rx="8" fill="#FFFFFF"/>
  <text class="sem-success-text" x="622" y="169" font-size="14" font-weight="bold">T08: Kontinuierliche Dynamik (DGL / ODE)</text>
  <text class="sem-muted-text" x="622" y="189" font-size="13">Heun, Runge-Kutta 4 &amp; geschlossene Regelkreise</text>

  <rect class="sem-success-stroke" x="604" y="212" width="442" height="54" rx="8" fill="#FFFFFF"/>
  <text class="sem-success-text" x="622" y="235" font-size="14" font-weight="bold">T09: Diskrete Ereignissysteme (DES)</text>
  <text class="sem-muted-text" x="622" y="255" font-size="13">Ereignis-Warteschlangen &amp; parallele Monte-Carlo-Läufe</text>

  <rect class="sem-success-stroke" x="604" y="278" width="442" height="70" rx="8" fill="#FFFFFF"/>
  <text class="sem-success-text" x="622" y="305" font-size="14" font-weight="bold">T10 &amp; T11: Hybride Dynamik &amp; Synthese</text>
  <text class="sem-muted-text" x="622" y="330" font-size="13">Zero-Crossing-Bisektion &amp; industrieller Digitaler Zwilling</text>
</svg>
