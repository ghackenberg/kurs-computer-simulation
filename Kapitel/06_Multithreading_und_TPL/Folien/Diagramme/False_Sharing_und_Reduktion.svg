<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 1220 450" width="1080" height="450">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>


  <!-- LEFT PANEL: NAIV / FALSCH (False Sharing) -->
  <rect class="sem-danger" x="16" y="14" width="516" height="422" rx="10" stroke-width="2"/>
  <rect class="sem-danger" x="16" y="14" width="516" height="40" rx="10" stroke-width="1.5"/>
  <text class="sem-danger-text" x="274" y="40" font-size="16" font-weight="bold" text-anchor="middle">Naiv: False Sharing auf einer 64-Byte-Cache-Line</text>

  <!-- Cores Left -->
  <rect class="sem-primary" x="44" y="76" width="190" height="64" rx="8" stroke-width="1.5"/>
  <text class="sem-primary-text" x="139" y="102" font-size="14" font-weight="bold" text-anchor="middle">Core 0 (Thread 0)</text>
  <text x="139" y="124" font-size="13" class="code sem-primary-text" text-anchor="middle">localSum[0] += 1;</text>

  <rect class="sem-warning" x="314" y="76" width="190" height="64" rx="8" stroke-width="1.5"/>
  <text class="sem-warning-text" x="409" y="102" font-size="14" font-weight="bold" text-anchor="middle">Core 1 (Thread 1)</text>
  <text x="409" y="124" font-size="13" class="code sem-warning-text" text-anchor="middle">localSum[1] += 1;</text>

  <!-- Arrows down to shared cache line -->
  <line class="sem-danger-stroke" x1="139" y1="140" x2="180" y2="205" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line class="sem-danger-stroke" x1="409" y1="140" x2="368" y2="205" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- Shared Cache Line -->
  <rect class="sem-danger-stroke" x="44" y="212" width="460" height="106" rx="8" fill="#FFFFFF" stroke-width="2"/>
  <text class="sem-danger-text" x="274" y="236" font-size="14" font-weight="bold" text-anchor="middle">Gemeinsame 64-Byte Cache-Line (8 × long)</text>

  <rect class="sem-danger" x="64" y="252" width="96" height="46" rx="4" stroke-width="1.5"/>
  <text x="112" y="272" font-size="13" class="code sem-danger-text" text-anchor="middle">[0] (8 B)</text>
  <text class="sem-danger-text" x="112" y="290" font-size="12.5" text-anchor="middle">Byte 0..7</text>

  <rect class="sem-warning" x="166" y="252" width="96" height="46" rx="4" stroke-width="1.5"/>
  <text x="214" y="272" font-size="13" class="code sem-warning-text" text-anchor="middle">[1] (8 B)</text>
  <text class="sem-warning-text" x="214" y="290" font-size="12.5" text-anchor="middle">Byte 8..15</text>

  <rect class="sem-muted" x="268" y="252" width="216" height="46" rx="4" stroke-width="1"/>
  <text class="sem-muted-text" x="376" y="280" font-size="13" text-anchor="middle">[2..7] ungenutzt (48 B)</text>

  <!-- Explanation Box Left -->
  <rect class="sem-danger-stroke" x="44" y="334" width="460" height="84" rx="6" fill="#FFFFFF" stroke-width="1.2"/>
  <text class="sem-danger-text" x="60" y="358" font-size="13.5" font-weight="bold">Cache-Line Ping-Pong (MESI-Invalidierung):</text>
  <text class="sem-danger-text" x="60" y="380" font-size="13">• Schreibzugriff auf [0] invalidiert gesamte 64-Byte-Line auf Core 1.</text>
  <text class="sem-danger-text" x="60" y="402" font-size="13">• Folge: Speedup bricht trotz getrennter Indizes auf S &lt; 1 ein!</text>

  <!-- RIGHT PANEL: RICHTIG (ThreadLocal + Interlocked / Padding) -->
  <rect class="sem-success" x="548" y="14" width="516" height="422" rx="10" stroke-width="2"/>
  <rect class="sem-success" x="548" y="14" width="516" height="40" rx="10" stroke-width="1.5"/>
  <text class="sem-success-text" x="806" y="40" font-size="16" font-weight="bold" text-anchor="middle">Richtig: Thread-lokal (Register / Padding) + Interlocked</text>

  <!-- Cores Right -->
  <rect class="sem-primary" x="576" y="76" width="190" height="64" rx="8" stroke-width="1.5"/>
  <text class="sem-primary-text" x="671" y="102" font-size="14" font-weight="bold" text-anchor="middle">Core 0 (Register / L1)</text>
  <text x="671" y="124" font-size="13" class="code sem-primary-text" text-anchor="middle">long local = 0;</text>

  <rect class="sem-warning" x="846" y="76" width="190" height="64" rx="8" stroke-width="1.5"/>
  <text class="sem-warning-text" x="941" y="102" font-size="14" font-weight="bold" text-anchor="middle">Core 1 (Register / L1)</text>
  <text x="941" y="124" font-size="13" class="code sem-warning-text" text-anchor="middle">long local = 0;</text>

  <!-- Separate Cache Lines -->
  <rect class="sem-success-stroke" x="576" y="160" width="190" height="58" rx="6" fill="#FFFFFF" stroke-width="1.5"/>
  <text class="sem-success-text" x="671" y="184" font-size="13" font-weight="bold" text-anchor="middle">Cache-Line A (Byte 0..63)</text>
  <text x="671" y="205" font-size="12.5" class="code sem-success-text" text-anchor="middle">localSum[0 * 16]</text>

  <rect class="sem-success-stroke" x="846" y="160" width="190" height="58" rx="6" fill="#FFFFFF" stroke-width="1.5"/>
  <text class="sem-success-text" x="941" y="184" font-size="13" font-weight="bold" text-anchor="middle">Cache-Line B (Byte 128..)</text>
  <text x="941" y="205" font-size="12.5" class="code sem-success-text" text-anchor="middle">localSum[1 * 16]</text>

  <!-- Arrows down to final Interlocked.Add -->
  <line class="sem-success-stroke" x1="671" y1="218" x2="750" y2="258" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <line class="sem-success-stroke" x1="941" y1="218" x2="862" y2="258" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Final Reduction Box -->
  <rect class="sem-success" x="616" y="264" width="380" height="54" rx="8" stroke-width="2"/>
  <text class="sem-success-text" x="806" y="287" font-size="14" font-weight="bold" text-anchor="middle">1× am Schleifenende (Reduktion):</text>
  <text x="806" y="307" font-size="13.5" class="code sem-success-text" text-anchor="middle">Interlocked.Add(ref totalCount, local);</text>

  <!-- Explanation Box Right -->
  <rect class="sem-success-stroke" x="576" y="334" width="460" height="84" rx="6" fill="#FFFFFF" stroke-width="1.2"/>
  <text class="sem-success-text" x="592" y="358" font-size="13.5" font-weight="bold">Kein Lock- &amp; Cache-Stau (Lineare Skalierung):</text>
  <text class="sem-success-text" x="592" y="380" font-size="13">• 10 Mio. Updates komplett lokal im CPU-Register (0 Cache-Konflikte).</text>
  <text class="sem-success-text" x="592" y="402" font-size="13">• Erst im localFinally-Block genau p atomare Interlocked.Add-Aufrufe.</text>
</svg>
