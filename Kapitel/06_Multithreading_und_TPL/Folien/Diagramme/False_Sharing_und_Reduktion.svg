<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 1220 450" width="1080" height="450">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <rect x="-70" y="0" width="1220" height="450" fill="#FFFFFF"/>

  <!-- LEFT PANEL: NAIV / FALSCH (False Sharing) -->
  <rect x="16" y="14" width="516" height="422" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <rect x="16" y="14" width="516" height="40" rx="10" fill="#FEE2e2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="274" y="40" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Naiv: False Sharing auf einer 64-Byte-Cache-Line</text>

  <!-- Cores Left -->
  <rect x="44" y="76" width="190" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="139" y="102" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">Core 0 (Thread 0)</text>
  <text x="139" y="124" font-size="13" class="code" fill="#1E3A8A" text-anchor="middle">localSum[0] += 1;</text>

  <rect x="314" y="76" width="190" height="64" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="409" y="102" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">Core 1 (Thread 1)</text>
  <text x="409" y="124" font-size="13" class="code" fill="#92400E" text-anchor="middle">localSum[1] += 1;</text>

  <!-- Arrows down to shared cache line -->
  <line x1="139" y1="140" x2="180" y2="205" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="409" y1="140" x2="368" y2="205" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- Shared Cache Line -->
  <rect x="44" y="212" width="460" height="106" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="274" y="236" font-size="14" font-weight="bold" fill="#991B1B" text-anchor="middle">Gemeinsame 64-Byte Cache-Line (8 × long)</text>

  <rect x="64" y="252" width="96" height="46" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="112" y="272" font-size="13" class="code" fill="#991B1B" text-anchor="middle">[0] (8 B)</text>
  <text x="112" y="290" font-size="12.5" fill="#7F1D1D" text-anchor="middle">Byte 0..7</text>

  <rect x="166" y="252" width="96" height="46" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="214" y="272" font-size="13" class="code" fill="#92400E" text-anchor="middle">[1] (8 B)</text>
  <text x="214" y="290" font-size="12.5" fill="#92400E" text-anchor="middle">Byte 8..15</text>

  <rect x="268" y="252" width="216" height="46" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="376" y="280" font-size="13" fill="#475569" text-anchor="middle">[2..7] ungenutzt (48 B)</text>

  <!-- Explanation Box Left -->
  <rect x="44" y="334" width="460" height="84" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="60" y="358" font-size="13.5" font-weight="bold" fill="#991B1B">Cache-Line Ping-Pong (MESI-Invalidierung):</text>
  <text x="60" y="380" font-size="13" fill="#7F1D1D">• Schreibzugriff auf [0] invalidiert gesamte 64-Byte-Line auf Core 1.</text>
  <text x="60" y="402" font-size="13" fill="#7F1D1D">• Folge: Speedup bricht trotz getrennter Indizes auf S &lt; 1 ein!</text>

  <!-- RIGHT PANEL: RICHTIG (ThreadLocal + Interlocked / Padding) -->
  <rect x="548" y="14" width="516" height="422" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <rect x="548" y="14" width="516" height="40" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="806" y="40" font-size="16" font-weight="bold" fill="#15803D" text-anchor="middle">Richtig: Thread-lokal (Register / Padding) + Interlocked</text>

  <!-- Cores Right -->
  <rect x="576" y="76" width="190" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="671" y="102" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">Core 0 (Register / L1)</text>
  <text x="671" y="124" font-size="13" class="code" fill="#1E3A8A" text-anchor="middle">long local = 0;</text>

  <rect x="846" y="76" width="190" height="64" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="941" y="102" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">Core 1 (Register / L1)</text>
  <text x="941" y="124" font-size="13" class="code" fill="#92400E" text-anchor="middle">long local = 0;</text>

  <!-- Separate Cache Lines -->
  <rect x="576" y="160" width="190" height="58" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="671" y="184" font-size="13" font-weight="bold" fill="#15803D" text-anchor="middle">Cache-Line A (Byte 0..63)</text>
  <text x="671" y="205" font-size="12.5" class="code" fill="#166534" text-anchor="middle">localSum[0 * 16]</text>

  <rect x="846" y="160" width="190" height="58" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="941" y="184" font-size="13" font-weight="bold" fill="#15803D" text-anchor="middle">Cache-Line B (Byte 128..)</text>
  <text x="941" y="205" font-size="12.5" class="code" fill="#166534" text-anchor="middle">localSum[1 * 16]</text>

  <!-- Arrows down to final Interlocked.Add -->
  <line x1="671" y1="218" x2="750" y2="258" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <line x1="941" y1="218" x2="862" y2="258" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Final Reduction Box -->
  <rect x="616" y="264" width="380" height="54" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="806" y="287" font-size="14" font-weight="bold" fill="#15803D" text-anchor="middle">1× am Schleifenende (Reduktion):</text>
  <text x="806" y="307" font-size="13.5" class="code" fill="#14532D" text-anchor="middle">Interlocked.Add(ref totalCount, local);</text>

  <!-- Explanation Box Right -->
  <rect x="576" y="334" width="460" height="84" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="592" y="358" font-size="13.5" font-weight="bold" fill="#15803D">Kein Lock- &amp; Cache-Stau (Lineare Skalierung):</text>
  <text x="592" y="380" font-size="13" fill="#14532D">• 10 Mio. Updates komplett lokal im CPU-Register (0 Cache-Konflikte).</text>
  <text x="592" y="402" font-size="13" fill="#14532D">• Erst im localFinally-Block genau p atomare Interlocked.Add-Aufrufe.</text>
</svg>
