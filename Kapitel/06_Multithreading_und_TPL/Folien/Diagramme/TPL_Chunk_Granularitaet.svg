<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1160 390" width="1080" height="390">
  <defs>
    <marker id="arrRedC" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreenC" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <rect x="-40" y="0" width="1160" height="390" fill="none"/>

  <!-- LEFT: Zu feine Granularität -->
  <rect x="10" y="10" width="515" height="366" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <rect x="10" y="10" width="515" height="40" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="267" y="36" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Zu fein: 100 000 Mini-Tasks (Overhead &gt; Arbeit)</text>

  <rect x="34" y="68" width="467" height="58" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="267" y="92" font-size="14" font-weight="bold" fill="#991B1B" text-anchor="middle">1 Iteration = 50 ns Rechenzeit (z. B. x[i] *= 2)</text>
  <text x="267" y="114" font-size="13.5" fill="#7F1D1D" text-anchor="middle">ThreadPool-Scheduling pro Paket: ~1 000 ns (20× teurer!)</text>

  <rect x="34" y="144" width="467" height="86" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="52" y="170" font-size="13.5" font-weight="bold" fill="#991B1B">Core 0:</text>
  <rect x="125" y="153" width="60" height="22" rx="3" fill="#DC2626"/>
  <rect x="190" y="153" width="16" height="22" rx="3" fill="#2563EB"/>
  <rect x="212" y="153" width="60" height="22" rx="3" fill="#DC2626"/>
  <rect x="277" y="153" width="16" height="22" rx="3" fill="#2563EB"/>
  <rect x="299" y="153" width="60" height="22" rx="3" fill="#DC2626"/>
  <rect x="364" y="153" width="16" height="22" rx="3" fill="#2563EB"/>
  <text x="392" y="170" font-size="13" fill="#991B1B">Rot = Overhead</text>

  <text x="52" y="206" font-size="13.5" font-weight="bold" fill="#991B1B">Core 1:</text>
  <rect x="125" y="189" width="60" height="22" rx="3" fill="#DC2626"/>
  <rect x="190" y="189" width="16" height="22" rx="3" fill="#2563EB"/>
  <rect x="212" y="189" width="60" height="22" rx="3" fill="#DC2626"/>
  <rect x="277" y="189" width="16" height="22" rx="3" fill="#2563EB"/>
  <text x="305" y="206" font-size="13" fill="#1E40AF">Blau = Nutzarbeit</text>

  <rect x="34" y="248" width="467" height="110" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
  <text x="267" y="278" font-size="15" font-weight="bold" fill="#B91C1C" text-anchor="middle">Ergebnis: Speedup S(4) ≈ 0,4× (langsamer!)</text>
  <text x="267" y="306" font-size="13.5" fill="#7F1D1D" text-anchor="middle">• Niemals innerste Trivialschleifen blind parallelisieren.</text>
  <text x="267" y="332" font-size="13.5" fill="#7F1D1D" text-anchor="middle">• Erst messen nach JIT-Warmup (Stopwatch)!</text>

  <!-- RIGHT: TPL Chunk-Partitionierung -->
  <rect x="555" y="10" width="515" height="366" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <rect x="555" y="10" width="515" height="40" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="812" y="36" font-size="16" font-weight="bold" fill="#15803D" text-anchor="middle">Richtig: TPL Range-Chunks (4 Kerne, 25 000 je Block)</text>

  <rect x="579" y="68" width="467" height="58" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="812" y="92" font-size="14" font-weight="bold" fill="#15803D" text-anchor="middle">4 grobe Chunks à 25 000 Partikel = 1,25 ms Nutzarbeit</text>
  <text x="812" y="114" font-size="13.5" fill="#166534" text-anchor="middle">ThreadPool-Overhead fällt nur 4× an (&lt; 0,5 % Verlust)</text>

  <rect x="579" y="144" width="467" height="86" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="597" y="170" font-size="13.5" font-weight="bold" fill="#15803D">Core 0:</text>
  <rect x="668" y="153" width="12" height="22" rx="2" fill="#DC2626"/>
  <rect x="684" y="153" width="340" height="22" rx="3" fill="#16A34A"/>
  <text x="854" y="169" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Chunk 0: 0 .. 24 999</text>

  <text x="597" y="206" font-size="13.5" font-weight="bold" fill="#15803D">Core 1:</text>
  <rect x="668" y="189" width="12" height="22" rx="2" fill="#DC2626"/>
  <rect x="684" y="189" width="340" height="22" rx="3" fill="#16A34A"/>
  <text x="854" y="205" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Chunk 1: 25 000 .. 49 999</text>

  <rect x="579" y="248" width="467" height="110" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="812" y="278" font-size="15" font-weight="bold" fill="#15803D" text-anchor="middle">Ergebnis: Speedup S(4) ≈ 3,8× (Effizienz 95 %)</text>
  <text x="812" y="306" font-size="13.5" fill="#14532D" text-anchor="middle">• Parallel.For nutzt Range-Partitioning + Work-Stealing.</text>
  <text x="812" y="332" font-size="13.5" fill="#14532D" text-anchor="middle">• ParallelOptions steuert MaxDegreeOfParallelism = p.</text>
</svg>
