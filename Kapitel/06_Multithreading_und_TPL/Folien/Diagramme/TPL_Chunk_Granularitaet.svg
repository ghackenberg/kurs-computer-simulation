<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1160 390" width="1080" height="390">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrRedC" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrGreenC" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <rect x="-40" y="0" width="1160" height="390" fill="none"/>

  <!-- LEFT: Zu feine Granularität -->
  <rect class="sem-danger" x="10" y="10" width="515" height="366" rx="10" stroke-width="2"/>
  <rect class="sem-danger" x="10" y="10" width="515" height="40" rx="10" stroke-width="1.5"/>
  <text class="sem-danger-text" x="267" y="36" font-size="16" font-weight="bold" text-anchor="middle">Zu fein: 100 000 Mini-Tasks (Overhead &gt; Arbeit)</text>

  <rect class="sem-danger-stroke" x="34" y="68" width="467" height="58" rx="6" fill="#FFFFFF"/>
  <text class="sem-danger-text" x="267" y="92" font-size="14" font-weight="bold" text-anchor="middle">1 Iteration = 50 ns Rechenzeit (z. B. x[i] *= 2)</text>
  <text class="sem-danger-text" x="267" y="114" font-size="13.5" text-anchor="middle">ThreadPool-Scheduling pro Paket: ~1 000 ns (20× teurer!)</text>

  <rect class="sem-danger-stroke" x="34" y="144" width="467" height="86" rx="6" fill="#FFFFFF"/>
  <text class="sem-danger-text" x="52" y="170" font-size="13.5" font-weight="bold">Core 0:</text>
  <rect class="sem-danger-fill" x="125" y="153" width="60" height="22" rx="3"/>
  <rect class="sem-primary-fill" x="190" y="153" width="16" height="22" rx="3"/>
  <rect class="sem-danger-fill" x="212" y="153" width="60" height="22" rx="3"/>
  <rect class="sem-primary-fill" x="277" y="153" width="16" height="22" rx="3"/>
  <rect class="sem-danger-fill" x="299" y="153" width="60" height="22" rx="3"/>
  <rect class="sem-primary-fill" x="364" y="153" width="16" height="22" rx="3"/>
  <text class="sem-danger-text" x="392" y="170" font-size="13">Rot = Overhead</text>

  <text class="sem-danger-text" x="52" y="206" font-size="13.5" font-weight="bold">Core 1:</text>
  <rect class="sem-danger-fill" x="125" y="189" width="60" height="22" rx="3"/>
  <rect class="sem-primary-fill" x="190" y="189" width="16" height="22" rx="3"/>
  <rect class="sem-danger-fill" x="212" y="189" width="60" height="22" rx="3"/>
  <rect class="sem-primary-fill" x="277" y="189" width="16" height="22" rx="3"/>
  <text class="sem-primary-text" x="305" y="206" font-size="13">Blau = Nutzarbeit</text>

  <rect class="sem-danger-stroke" x="34" y="248" width="467" height="110" rx="8" fill="#FFFFFF" stroke-width="1.5"/>
  <text class="sem-danger-text" x="267" y="278" font-size="15" font-weight="bold" text-anchor="middle">Ergebnis: Speedup S(4) ≈ 0,4× (langsamer!)</text>
  <text class="sem-danger-text" x="267" y="306" font-size="13.5" text-anchor="middle">• Niemals innerste Trivialschleifen blind parallelisieren.</text>
  <text class="sem-danger-text" x="267" y="332" font-size="13.5" text-anchor="middle">• Erst messen nach JIT-Warmup (Stopwatch)!</text>

  <!-- RIGHT: TPL Chunk-Partitionierung -->
  <rect class="sem-success" x="555" y="10" width="515" height="366" rx="10" stroke-width="2"/>
  <rect class="sem-success" x="555" y="10" width="515" height="40" rx="10" stroke-width="1.5"/>
  <text class="sem-success-text" x="812" y="36" font-size="16" font-weight="bold" text-anchor="middle">Richtig: TPL Range-Chunks (4 Kerne, 25 000 je Block)</text>

  <rect class="sem-success-stroke" x="579" y="68" width="467" height="58" rx="6" fill="#FFFFFF"/>
  <text class="sem-success-text" x="812" y="92" font-size="14" font-weight="bold" text-anchor="middle">4 grobe Chunks à 25 000 Partikel = 1,25 ms Nutzarbeit</text>
  <text class="sem-success-text" x="812" y="114" font-size="13.5" text-anchor="middle">ThreadPool-Overhead fällt nur 4× an (&lt; 0,5 % Verlust)</text>

  <rect class="sem-success-stroke" x="579" y="144" width="467" height="86" rx="6" fill="#FFFFFF"/>
  <text class="sem-success-text" x="597" y="170" font-size="13.5" font-weight="bold">Core 0:</text>
  <rect class="sem-danger-fill" x="668" y="153" width="12" height="22" rx="2"/>
  <rect class="sem-success-fill" x="684" y="153" width="340" height="22" rx="3"/>
  <text x="854" y="169" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Chunk 0: 0 .. 24 999</text>

  <text class="sem-success-text" x="597" y="206" font-size="13.5" font-weight="bold">Core 1:</text>
  <rect class="sem-danger-fill" x="668" y="189" width="12" height="22" rx="2"/>
  <rect class="sem-success-fill" x="684" y="189" width="340" height="22" rx="3"/>
  <text x="854" y="205" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Chunk 1: 25 000 .. 49 999</text>

  <rect class="sem-success-stroke" x="579" y="248" width="467" height="110" rx="8" fill="#FFFFFF" stroke-width="1.5"/>
  <text class="sem-success-text" x="812" y="278" font-size="15" font-weight="bold" text-anchor="middle">Ergebnis: Speedup S(4) ≈ 3,8× (Effizienz 95 %)</text>
  <text class="sem-success-text" x="812" y="306" font-size="13.5" text-anchor="middle">• Parallel.For nutzt Range-Partitioning + Work-Stealing.</text>
  <text class="sem-success-text" x="812" y="332" font-size="13.5" text-anchor="middle">• ParallelOptions steuert MaxDegreeOfParallelism = p.</text>
</svg>
