<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-info" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="sem-muted-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-info { fill: url(#grad-sem-info); stroke: #0369a1; }
      .sem-info-bg { fill: url(#grad-sem-info); stroke: none; }
      .sem-info-stroke { stroke: #0369a1; }
      .sem-info-fill { fill: #0369a1; }
      .sem-info-text { fill: #075985; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    </style>
  </defs>


  <!-- Plot Area -->
  <rect class="sem-card sem-muted-stroke" x="25" y="24" width="480" height="300" stroke-width="1"/>

  <!-- Horizontal Grid & Asymptotes (y = 324 - S * 13.2) -->
  <!-- S = 2 (y = 297.6) -->
  <line class="sem-danger-stroke" x1="25" y1="298" x2="505" y2="298" stroke-width="1.3" stroke-dasharray="4,4"/>
  <!-- S = 4 (y = 271.2) -->
  <line class="sem-warning-stroke" x1="25" y1="271" x2="505" y2="271" stroke-width="1.3" stroke-dasharray="4,4"/>
  <!-- S = 10 (y = 192.0) -->
  <line class="sem-info-stroke" x1="25" y1="192" x2="505" y2="192" stroke-width="1.3" stroke-dasharray="4,4"/>
  <!-- S = 20 (y = 60.0) -->
  <line class="sem-primary-stroke" x1="25" y1="60" x2="505" y2="60" stroke-width="1.6" stroke-dasharray="5,4"/>

  <!-- Vertical Grid (p = 1, 2, 4, 8, 16, 32, 64 -> x = 25 + k * 75) -->
  <line class="sem-muted-stroke" x1="100" y1="24" x2="100" y2="324" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="175" y1="24" x2="175" y2="324" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="250" y1="24" x2="250" y2="324" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="325" y1="24" x2="325" y2="324" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="400" y1="24" x2="400" y2="324" stroke-width="1"/>
  <line class="sem-muted-stroke" x1="475" y1="24" x2="475" y2="324" stroke-width="1"/>

  <!-- Ideal Linear Speedup S(p) = p (exponential curve on log2 X-axis: p=1->1, 2->2, 4->4, 8->8, 16->16, ~22.7->22.7) -->
  <path class="sem-muted-stroke" d="M 25 310.8 C 75 304, 130 292, 175 271.2 C 215 252, 238 236, 250 218.4 C 280 175, 308 138, 325 112.8 C 342 82, 354 50, 362 24" fill="none" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Speedup Curves (exact points computed for p = 1,2,4,8,16,32,64) -->
  <!-- s = 50% (S_max = 2) -->
  <path class="sem-danger-stroke" d="M 25 310.8 C 70 307, 130 304, 175 302.9 C 250 300.5, 360 299.2, 475 298.4" fill="none" stroke-width="2.5"/>
  <!-- s = 25% (S_max = 4) -->
  <path class="sem-warning-stroke" d="M 25 310.8 C 70 305, 130 297, 175 293.8 C 250 286, 360 278, 475 273.5" fill="none" stroke-width="2.5"/>
  <!-- s = 10% (S_max = 10) -->
  <path class="sem-info-stroke" d="M 25 310.8 C 70 304, 130 290, 175 283.3 C 250 267, 360 227, 475 208.1" fill="none" stroke-width="2.5"/>
  <!-- s = 5% (S_max = 20) -->
  <path class="sem-primary-stroke" d="M 25 310.8 C 70 302, 130 286, 175 278.0 C 250 245, 360 155, 475 119.5" fill="none" stroke-width="3.5"/>

  <!-- End points at p = 64 -->
  <circle class="sem-danger-fill" cx="475" cy="298.4" r="4"/>
  <circle class="sem-warning-fill" cx="475" cy="273.5" r="4"/>
  <circle class="sem-info-fill" cx="475" cy="208.1" r="4"/>
  <circle class="sem-primary-fill" cx="475" cy="119.5" r="5" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Coordinate Axes -->
  <line class="sem-muted-stroke" x1="25" y1="324" x2="512" y2="324" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line class="sem-muted-stroke" x1="25" y1="324" x2="25" y2="16" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Y-Axis Ticks -->
  <text class="sem-muted-text" x="17" y="328" font-size="12.5" text-anchor="end">0</text>
  <text class="sem-muted-text" x="17" y="302" font-size="12.5" text-anchor="end">2</text>
  <text class="sem-muted-text" x="17" y="275" font-size="12.5" text-anchor="end">4</text>
  <text class="sem-muted-text" x="17" y="196" font-size="12.5" text-anchor="end">10</text>
  <text class="sem-primary-text" x="17" y="64" font-size="13" font-weight="bold" text-anchor="end">20</text>
  <text class="sem-neutral-text" x="-38" y="18" font-size="13" font-weight="bold">Speedup S</text>

  <!-- X-Axis Ticks -->
  <text class="sem-muted-text" x="25" y="344" font-size="12.5" text-anchor="middle">1</text>
  <text class="sem-muted-text" x="100" y="344" font-size="12.5" text-anchor="middle">2</text>
  <text class="sem-muted-text" x="175" y="344" font-size="12.5" text-anchor="middle">4</text>
  <text class="sem-muted-text" x="250" y="344" font-size="12.5" text-anchor="middle">8</text>
  <text class="sem-muted-text" x="325" y="344" font-size="12.5" text-anchor="middle">16</text>
  <text class="sem-muted-text" x="400" y="344" font-size="12.5" text-anchor="middle">32</text>
  <text class="sem-primary-text" x="475" y="344" font-size="12.5" font-weight="bold" text-anchor="middle">64</text>
  <text class="sem-neutral-text" x="498" y="368" font-size="13" font-weight="bold" text-anchor="end">Kerne p →</text>

  <!-- Clean Curve & Asymptote Badges -->
  <rect class="sem-muted-stroke" x="190" y="26" width="136" height="22" rx="4" fill="#FFFFFF" stroke-width="0.9"/>
  <text class="sem-muted-text" x="258" y="42" font-size="12.5" text-anchor="middle">Ideal: S(p) = p</text>

  <rect class="sem-primary" x="336" y="32" width="164" height="24" rx="4" stroke-width="1.2"/>
  <text class="sem-primary-text" x="418" y="49" font-size="12.5" font-weight="bold" text-anchor="middle">S_max = 20 (s = 5 %)</text>

  <rect class="sem-danger" x="296" y="108" width="170" height="24" rx="4" stroke-width="1.2"/>
  <text class="sem-danger-text" x="381" y="125" font-size="12.5" font-weight="bold" text-anchor="middle">p = 64: nur 15,4× !</text>

  <rect class="sem-info" x="285" y="164" width="166" height="22" rx="4" stroke-width="0.9"/>
  <text class="sem-info-text" x="368" y="180" font-size="12.5" font-weight="bold" text-anchor="middle">s = 10 % (S_max = 10)</text>

  <rect class="sem-warning" x="285" y="259" width="158" height="22" rx="4" stroke-width="0.9"/>
  <text class="sem-warning-text" x="364" y="275" font-size="12.5" font-weight="bold" text-anchor="middle">s = 25 % (S_max = 4)</text>

  <rect class="sem-danger" x="92" y="286" width="158" height="22" rx="4" stroke-width="0.9"/>
  <text class="sem-danger-text" x="171" y="302" font-size="12.5" font-weight="bold" text-anchor="middle">s = 50 % (S_max = 2)</text>
</svg>
