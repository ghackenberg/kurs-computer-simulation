<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect x="-45" y="0" width="570" height="380" fill="#FFFFFF"/>

  <!-- Plot Area -->
  <rect x="25" y="24" width="480" height="300" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Horizontal Grid & Asymptotes (y = 324 - S * 13.2) -->
  <!-- S = 2 (y = 297.6) -->
  <line x1="25" y1="298" x2="505" y2="298" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="4,4"/>
  <!-- S = 4 (y = 271.2) -->
  <line x1="25" y1="271" x2="505" y2="271" stroke="#D97706" stroke-width="1.3" stroke-dasharray="4,4"/>
  <!-- S = 10 (y = 192.0) -->
  <line x1="25" y1="192" x2="505" y2="192" stroke="#0284C7" stroke-width="1.3" stroke-dasharray="4,4"/>
  <!-- S = 20 (y = 60.0) -->
  <line x1="25" y1="60" x2="505" y2="60" stroke="#004B96" stroke-width="1.6" stroke-dasharray="5,4"/>

  <!-- Vertical Grid (p = 1, 2, 4, 8, 16, 32, 64 -> x = 25 + k * 75) -->
  <line x1="100" y1="24" x2="100" y2="324" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="175" y1="24" x2="175" y2="324" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="250" y1="24" x2="250" y2="324" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="325" y1="24" x2="325" y2="324" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="400" y1="24" x2="400" y2="324" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="475" y1="24" x2="475" y2="324" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Ideal Linear Speedup S(p) = p -->
  <line x1="25" y1="311" x2="345" y2="32" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Speedup Curves (exact points computed for p = 1,2,4,8,16,32,64) -->
  <!-- s = 50% (S_max = 2) -->
  <path d="M 25 310.8 C 70 307, 130 304, 175 302.9 C 250 300.5, 360 299.2, 475 298.4" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <!-- s = 25% (S_max = 4) -->
  <path d="M 25 310.8 C 70 305, 130 297, 175 293.8 C 250 286, 360 278, 475 273.5" fill="none" stroke="#D97706" stroke-width="2.5"/>
  <!-- s = 10% (S_max = 10) -->
  <path d="M 25 310.8 C 70 304, 130 290, 175 283.3 C 250 267, 360 227, 475 208.1" fill="none" stroke="#0284C7" stroke-width="2.5"/>
  <!-- s = 5% (S_max = 20) -->
  <path d="M 25 310.8 C 70 302, 130 286, 175 278.0 C 250 245, 360 155, 475 119.5" fill="none" stroke="#004B96" stroke-width="3.5"/>

  <!-- End points at p = 64 -->
  <circle cx="475" cy="298.4" r="4" fill="#DC2626"/>
  <circle cx="475" cy="273.5" r="4" fill="#D97706"/>
  <circle cx="475" cy="208.1" r="4" fill="#0284C7"/>
  <circle cx="475" cy="119.5" r="5" fill="#004B96" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Coordinate Axes -->
  <line x1="25" y1="324" x2="512" y2="324" stroke="#475569" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line x1="25" y1="324" x2="25" y2="16" stroke="#475569" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Y-Axis Ticks -->
  <text x="17" y="328" font-size="12.5" fill="#64748B" text-anchor="end">0</text>
  <text x="17" y="302" font-size="12.5" fill="#64748B" text-anchor="end">2</text>
  <text x="17" y="275" font-size="12.5" fill="#64748B" text-anchor="end">4</text>
  <text x="17" y="196" font-size="12.5" fill="#64748B" text-anchor="end">10</text>
  <text x="17" y="64" font-size="13" font-weight="bold" fill="#004B96" text-anchor="end">20</text>
  <text x="-38" y="18" font-size="13" font-weight="bold" fill="#334155">Speedup S</text>

  <!-- X-Axis Ticks -->
  <text x="25" y="344" font-size="12.5" fill="#64748B" text-anchor="middle">1</text>
  <text x="100" y="344" font-size="12.5" fill="#64748B" text-anchor="middle">2</text>
  <text x="175" y="344" font-size="12.5" fill="#64748B" text-anchor="middle">4</text>
  <text x="250" y="344" font-size="12.5" fill="#64748B" text-anchor="middle">8</text>
  <text x="325" y="344" font-size="12.5" fill="#64748B" text-anchor="middle">16</text>
  <text x="400" y="344" font-size="12.5" fill="#64748B" text-anchor="middle">32</text>
  <text x="475" y="344" font-size="12.5" font-weight="bold" fill="#004B96" text-anchor="middle">64</text>
  <text x="498" y="368" font-size="13" font-weight="bold" fill="#334155" text-anchor="end">Kerne p →</text>

  <!-- Clean Curve & Asymptote Badges -->
  <rect x="190" y="26" width="136" height="22" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.9"/>
  <text x="258" y="42" font-size="12.5" fill="#475569" text-anchor="middle">Ideal: S(p) = p</text>

  <rect x="336" y="32" width="164" height="24" rx="4" fill="#EFF6FF" stroke="#004B96" stroke-width="1.2"/>
  <text x="418" y="49" font-size="12.5" font-weight="bold" fill="#004B96" text-anchor="middle">S_max = 20 (s = 5 %)</text>

  <rect x="296" y="108" width="170" height="24" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="381" y="125" font-size="12.5" font-weight="bold" fill="#B91C1C" text-anchor="middle">p = 64: nur 15,5× !</text>

  <rect x="285" y="164" width="166" height="22" rx="4" fill="#E0F2FE" stroke="#38BDF8" stroke-width="0.9"/>
  <text x="368" y="180" font-size="12.5" font-weight="bold" fill="#0284C7" text-anchor="middle">s = 10 % (S_max = 10)</text>

  <rect x="285" y="259" width="158" height="22" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.9"/>
  <text x="364" y="275" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">s = 25 % (S_max = 4)</text>

  <rect x="92" y="286" width="158" height="22" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="0.9"/>
  <text x="171" y="302" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">s = 50 % (S_max = 2)</text>
</svg>
