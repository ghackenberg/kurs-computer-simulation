<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1040 450" width="960" height="450">
  <defs>
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="450" fill="#FFFFFF"/>
  <rect x="5" y="5" width="950" height="440" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <path d="M 5 15 Q 5 5 15 5 L 945 5 Q 955 5 955 15 L 955 42 L 5 42 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="24" y="28" font-size="15" font-weight="bold" fill="#004B96">Amdahlsches Gesetz: Speedup-Grenzen &amp; Skalierungsverläufe</text>
  <text x="936" y="28" font-size="12.5" font-weight="bold" fill="#64748B" text-anchor="end">Kapitel 06: Multithreading &amp; Parallele Simulation</text>

  <!-- ==================== PLOT REGION (LEFT) ==================== -->
  <rect x="95" y="65" width="510" height="325" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Horizontal Grid Lines -->
  <line x1="95" y1="361" x2="605" y2="361" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="95" y1="332" x2="605" y2="332" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="95" y1="245" x2="605" y2="245" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="95" y1="99" x2="605" y2="99" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Vertical Grid Lines -->
  <line x1="175" y1="65" x2="175" y2="390" stroke="#F8FAFC" stroke-width="1"/>
  <line x1="255" y1="65" x2="255" y2="390" stroke="#F8FAFC" stroke-width="1"/>
  <line x1="335" y1="65" x2="335" y2="390" stroke="#F8FAFC" stroke-width="1"/>
  <line x1="415" y1="65" x2="415" y2="390" stroke="#F8FAFC" stroke-width="1"/>
  <line x1="495" y1="65" x2="495" y2="390" stroke="#F8FAFC" stroke-width="1"/>
  <line x1="575" y1="65" x2="575" y2="390" stroke="#F8FAFC" stroke-width="1"/>

  <!-- Asymptote lines -->
  <line x1="95" y1="361" x2="605" y2="361" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="95" y1="332" x2="605" y2="332" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="95" y1="245" x2="605" y2="245" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="95" y1="99" x2="605" y2="99" stroke="#004B96" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Ideal linear Speedup line S = p -->
  <line x1="95" y1="375" x2="455" y2="70" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Speedup Curves -->
  <path d="M 95 375.5 Q 175 368, 255 366.7 T 415 362.6 T 575 361.3" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <path d="M 95 375.5 C 145 370, 205 362, 255 356.7 C 305 351, 365 344, 415 341.0 C 465 338, 525 335.5, 575 334.4" fill="none" stroke="#D97706" stroke-width="2.5"/>
  <path d="M 95 375.5 C 145 369, 205 355, 255 345.2 C 305 333, 365 308, 415 296.9 C 465 285, 525 269, 575 262.4" fill="none" stroke="#0284C7" stroke-width="2.5"/>
  <path d="M 95 375.5 C 145 368, 205 352, 255 339.4 C 305 322, 365 278, 415 257.1 C 465 230, 525 185, 575 165.7" fill="none" stroke="#004B96" stroke-width="3.5"/>

  <circle cx="575" cy="361.3" r="4" fill="#DC2626"/>
  <circle cx="575" cy="334.4" r="4" fill="#D97706"/>
  <circle cx="575" cy="262.4" r="4" fill="#0284C7"/>
  <circle cx="575" cy="165.7" r="5" fill="#004B96" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Callout pointer -->
  <line x1="510" y1="158" x2="570" y2="165" stroke="#004B96" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Coordinate Axes -->
  <line x1="95" y1="390" x2="610" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line x1="95" y1="390" x2="95" y2="55" stroke="#475569" stroke-width="2" marker-end="url(#arrowAxis)"/>

  <!-- Axis Labels -->
  <rect x="530" y="415" width="88" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="574" y="430" font-size="12.5" font-weight="bold" fill="#334155" text-anchor="middle">Kerne p →</text>

  <rect x="14" y="50" width="76" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="52" y="65" font-size="12.5" font-weight="bold" fill="#334155" text-anchor="middle">Speedup S</text>

  <!-- Y-Axis Tick Labels -->
  <rect x="66" y="381" width="24" height="17" rx="2" fill="#FFFFFF"/>
  <text x="86" y="394" font-size="12.5" fill="#64748B" text-anchor="end">0</text>
  <rect x="66" y="352" width="24" height="17" rx="2" fill="#FFFFFF"/>
  <text x="86" y="365" font-size="12.5" fill="#64748B" text-anchor="end">2</text>
  <rect x="66" y="323" width="24" height="17" rx="2" fill="#FFFFFF"/>
  <text x="86" y="336" font-size="12.5" fill="#64748B" text-anchor="end">4</text>
  <rect x="66" y="236" width="24" height="17" rx="2" fill="#FFFFFF"/>
  <text x="86" y="249" font-size="12.5" fill="#64748B" text-anchor="end">10</text>
  <rect x="66" y="90" width="24" height="17" rx="2" fill="#FFFFFF"/>
  <text x="86" y="103" font-size="12.5" font-weight="bold" fill="#004B96" text-anchor="end">20</text>

  <!-- X-Axis Tick Labels -->
  <rect x="86" y="395" width="18" height="18" rx="2" fill="#FFFFFF"/>
  <text x="95" y="409" font-size="12.5" fill="#64748B" text-anchor="middle">1</text>
  <rect x="166" y="395" width="18" height="18" rx="2" fill="#FFFFFF"/>
  <text x="175" y="409" font-size="12.5" fill="#64748B" text-anchor="middle">2</text>
  <rect x="246" y="395" width="18" height="18" rx="2" fill="#FFFFFF"/>
  <text x="255" y="409" font-size="12.5" fill="#64748B" text-anchor="middle">4</text>
  <rect x="326" y="395" width="18" height="18" rx="2" fill="#FFFFFF"/>
  <text x="335" y="409" font-size="12.5" fill="#64748B" text-anchor="middle">8</text>
  <rect x="404" y="395" width="22" height="18" rx="2" fill="#FFFFFF"/>
  <text x="415" y="409" font-size="12.5" fill="#64748B" text-anchor="middle">16</text>
  <rect x="484" y="395" width="22" height="18" rx="2" fill="#FFFFFF"/>
  <text x="495" y="409" font-size="12.5" fill="#64748B" text-anchor="middle">32</text>
  <rect x="564" y="395" width="22" height="18" rx="2" fill="#FFFFFF"/>
  <text x="575" y="409" font-size="12.5" font-weight="bold" fill="#004B96" text-anchor="middle">64</text>

  <!-- Ideal Speedup Label -->
  <rect x="255" y="70" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.9"/>
  <text x="330" y="85" font-size="12.5" fill="#475569" text-anchor="middle">Linear: S(p) = p (Ideal)</text>

  <!-- Curve Labels (positioned cleanly without line intersections) -->
  <rect x="435" y="72" width="160" height="22" rx="4" fill="#EFF6FF" stroke="#004B96" stroke-width="1"/>
  <text x="515" y="87" font-size="12.5" font-weight="bold" fill="#004B96" text-anchor="middle">S_max = 20 (Asymptote)</text>

  <rect x="372" y="114" width="228" height="44" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="486" y="132" font-size="12.5" font-weight="bold" fill="#B91C1C" text-anchor="middle">s = 5 % seriell: Max. 20× Speedup</text>
  <text x="486" y="150" font-size="12.5" fill="#7F1D1D" text-anchor="middle">selbst bei p = 1 000 Kernen!</text>

  <rect x="355" y="216" width="166" height="22" rx="4" fill="#E0F2FE" stroke="#38BDF8" stroke-width="0.9"/>
  <text x="438" y="231" font-size="12.5" font-weight="bold" fill="#0284C7" text-anchor="middle">s = 10 % (S_max = 10)</text>

  <rect x="355" y="302" width="160" height="22" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.9"/>
  <text x="435" y="317" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">s = 25 % (S_max = 4)</text>

  <rect x="130" y="348" width="160" height="22" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="0.9"/>
  <text x="210" y="363" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">s = 50 % (S_max = 2)</text>

  <!-- ==================== RIGHT PANEL: THEORIE & FORMELN ==================== -->
  <rect x="620" y="52" width="327" height="382" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <path d="M 620 60 Q 620 52 628 52 L 939 52 Q 947 52 947 60 L 947 80 L 620 80 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="632" y="72" font-size="13.5" font-weight="bold" fill="#0F172A">Skalierungsgesetze im Detail</text>

  <!-- Box 1: Amdahl -->
  <rect x="628" y="88" width="311" height="128" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="638" y="106" font-size="12.5" font-weight="bold" fill="#1E40AF">Amdahlsches Gesetz (Strong Scaling):</text>
  <text x="638" y="124" font-size="12.5" fill="#1E3A8A">Problemgröße konstant, Kerne p wachsen:</text>
  <rect x="638" y="131" width="291" height="26" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="783" y="149" font-size="12.5" font-weight="bold" fill="#004B96" text-anchor="middle">S_Amdahl(p) = 1 / (s + (1 - s) / p)</text>
  <text x="638" y="175" font-size="12.5" font-weight="bold" fill="#1E3A8A">Asymptote für p → ∞:   S_max = 1 / s</text>
  <text x="638" y="193" font-size="12.5" fill="#475569">• f_par ∈ [0, 1] : Parallelisierbarer Anteil</text>
  <text x="638" y="209" font-size="12.5" fill="#475569">• s = 1 - f_par : Serieller Flaschenhals</text>

  <!-- Box 2: Gustafson -->
  <rect x="628" y="224" width="311" height="96" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="638" y="242" font-size="12.5" font-weight="bold" fill="#166534">Gustafsonsches Gesetz (Weak Scaling):</text>
  <text x="638" y="260" font-size="12.5" fill="#14532D">Problemgröße wächst proportional zu p:</text>
  <rect x="638" y="267" width="291" height="26" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="783" y="285" font-size="12.5" font-weight="bold" fill="#15803D" text-anchor="middle">S_Gustafson(p) = p - s · (p - 1)</text>
  <text x="638" y="310" font-size="12.5" fill="#166534">• Nahezu lineare Skalierung bei größerem Netz</text>

  <!-- Box 3: Parallele Effizienz -->
  <rect x="628" y="328" width="311" height="98" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="638" y="346" font-size="12.5" font-weight="bold" fill="#334155">Parallele Effizienz E(p):</text>
  <text x="638" y="365" font-size="12.5" fill="#334155">E(p) = S(p) / p ≤ 1.0 (100 %)</text>
  <text x="638" y="384" font-size="12.5" fill="#64748B">• Thread-Erzeugung &amp; Scheduling-Overhead</text>
  <text x="638" y="401" font-size="12.5" fill="#64748B">• Synchronisationsblockaden (lock, Interlocked)</text>
  <text x="638" y="418" font-size="12.5" fill="#64748B">• Speicherbandbreite &amp; False Sharing</text>
</svg>
