<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="grad-sem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grad-sem-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-warning-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-danger { fill: url(#grad-sem-danger); stroke: #dc2626; }
      .sem-danger-bg { fill: url(#grad-sem-danger); stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      .sem-card { fill: url(#grad-sem-card); stroke: #cbd5e1; }
      .sem-card-bg { fill: url(#grad-sem-card); stroke: none; }
      .sem-card-stroke { stroke: #cbd5e1; }
      .sem-card-fill { fill: #cbd5e1; }
      .sem-card-text { fill: #1e293b; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      .sem-neutral { fill: url(#grad-sem-neutral); stroke: #334155; }
      .sem-neutral-bg { fill: url(#grad-sem-neutral); stroke: none; }
      .sem-neutral-stroke { stroke: #334155; }
      .sem-neutral-fill { fill: #334155; }
      .sem-neutral-text { fill: #0f172a; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>


  <!-- Top: Isolierte Prozesse -->
  <rect class="sem-card sem-muted-stroke" x="-25" y="10" width="530" height="156" rx="10" stroke-width="2"/>
  <text class="sem-neutral-text" x="240" y="34" font-size="15.5" font-weight="bold" text-anchor="middle">Prozesse: Isolierter Speicher (IPC nötig)</text>

  <rect class="sem-primary" x="-5" y="48" width="180" height="102" rx="8" stroke-width="1.5"/>
  <text class="sem-primary-text" x="85" y="70" font-size="14" font-weight="bold" text-anchor="middle">Prozess A (.exe)</text>
  <rect class="sem-primary-stroke" x="10" y="82" width="150" height="28" rx="4" fill="#FFFFFF"/>
  <text class="sem-primary-text" x="85" y="101" font-size="13" text-anchor="middle">Eigener RAM / Heap</text>
  <rect class="sem-primary" x="10" y="116" width="150" height="24" rx="4" stroke="none"/>
  <text x="85" y="133" font-size="12.5" class="code sem-primary-text" text-anchor="middle">Thread 1</text>

  <rect class="sem-primary" x="305" y="48" width="180" height="102" rx="8" stroke-width="1.5"/>
  <text class="sem-primary-text" x="395" y="70" font-size="14" font-weight="bold" text-anchor="middle">Prozess B (.exe)</text>
  <rect class="sem-primary-stroke" x="320" y="82" width="150" height="28" rx="4" fill="#FFFFFF"/>
  <text class="sem-primary-text" x="395" y="101" font-size="13" text-anchor="middle">Eigener RAM / Heap</text>
  <rect class="sem-primary" x="320" y="116" width="150" height="24" rx="4" stroke="none"/>
  <text x="395" y="133" font-size="12.5" class="code sem-primary-text" text-anchor="middle">Thread 1</text>

  <line class="sem-warning-stroke" x1="178" y1="98" x2="300" y2="98" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrAmber)"/>
  <text class="sem-warning-text" x="240" y="88" font-size="12.5" font-weight="bold" text-anchor="middle">IPC (ms)</text>

  <!-- Bottom: Threads in einem Prozess -->
  <rect class="sem-success" x="-25" y="182" width="530" height="186" rx="10" stroke-width="2"/>
  <text class="sem-success-text" x="240" y="206" font-size="15.5" font-weight="bold" text-anchor="middle">Threads in 1 Prozess: Geteilter Heap (μs)</text>

  <rect class="sem-success" x="0" y="220" width="220" height="44" rx="6" stroke-width="1.5"/>
  <text class="sem-success-text" x="110" y="247" font-size="13.5" font-weight="bold" text-anchor="middle">Thread 0 (UI) · Stack 0</text>

  <rect class="sem-success" x="260" y="220" width="220" height="44" rx="6" stroke-width="1.5"/>
  <text class="sem-success-text" x="370" y="247" font-size="13.5" font-weight="bold" text-anchor="middle">Thread 1..p · Stack 1..p</text>

  <rect class="sem-success-stroke" x="0" y="282" width="480" height="72" rx="8" fill="#FFFFFF" stroke-width="1.5"/>
  <text class="sem-success-text" x="240" y="308" font-size="14" font-weight="bold" text-anchor="middle">Gemeinsamer Heap (Arrays, Partikel, Zähler)</text>
  <text class="sem-danger-text" x="240" y="334" font-size="13" text-anchor="middle">Schnell (ns–μs), aber Gefahr von Datenkonflikten!</text>
</svg>
