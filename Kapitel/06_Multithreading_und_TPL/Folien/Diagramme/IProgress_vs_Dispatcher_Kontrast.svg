<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1160 390" width="1080" height="390">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <rect x="-40" y="0" width="1160" height="390" fill="none"/>

  <!-- LEFT: Naiv Dispatcher.Invoke -->
  <rect x="10" y="10" width="515" height="366" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <rect x="10" y="10" width="515" height="40" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="267" y="36" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Naiv: Dispatcher.Invoke (Synchron blockierend)</text>

  <rect x="34" y="72" width="190" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="129" y="100" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">Worker-Thread</text>
  <text x="129" y="124" font-size="13" fill="#991B1B" text-anchor="middle">wartet &amp; blockiert!</text>

  <rect x="310" y="72" width="190" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="405" y="100" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">UI-Dispatcher</text>
  <text x="405" y="124" font-size="13" fill="#92400E" text-anchor="middle">zeichnet 1 000×/s</text>

  <line x1="224" y1="94" x2="304" y2="94" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="264" y="84" font-size="12.5" font-weight="bold" fill="#991B1B" text-anchor="middle">Invoke</text>
  <line x1="304" y1="126" x2="224" y2="126" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <text x="264" y="144" font-size="12.5" fill="#991B1B" text-anchor="middle">Ack</text>

  <rect x="34" y="170" width="467" height="188" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="52" y="200" font-size="14.5" font-weight="bold" fill="#991B1B">3 Probleme im Betrieb:</text>
  <text x="52" y="232" font-size="13.5" fill="#7F1D1D">1. Worker stoppt bei jedem Schritt bis UI fertig zeichnet.</text>
  <text x="52" y="262" font-size="13.5" fill="#7F1D1D">2. Deadlock-Gefahr, falls UI gleichzeitig auf Worker wartet.</text>
  <text x="52" y="292" font-size="13.5" fill="#7F1D1D">3. Simulationsklasse ist hart an WPF gekoppelt (keine Tests!).</text>
  <text x="52" y="334" font-size="13.5" font-weight="bold" fill="#B91C1C">Folge: Speedup bricht auf S &lt; 1 ein!</text>

  <!-- RIGHT: Richtig IProgress<T> -->
  <rect x="555" y="10" width="515" height="366" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <rect x="555" y="10" width="515" height="40" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="812" y="36" font-size="16" font-weight="bold" fill="#15803D" text-anchor="middle">Richtig: IProgress&lt;T&gt; (Asynchron &amp; gedrosselt)</text>

  <rect x="579" y="72" width="190" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="674" y="100" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">Worker-Thread</text>
  <text x="674" y="124" font-size="13" fill="#15803D" text-anchor="middle">rechnet sofort weiter!</text>

  <rect x="855" y="72" width="190" height="72" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="950" y="100" font-size="14" font-weight="bold" fill="#15803D" text-anchor="middle">UI-Dispatcher</text>
  <text x="950" y="124" font-size="13" fill="#166534" text-anchor="middle">SynchronizationContext</text>

  <line x1="769" y1="108" x2="849" y2="108" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="809" y="96" font-size="12.5" font-weight="bold" fill="#15803D" text-anchor="middle">Report()</text>
  <text x="809" y="130" font-size="12.5" fill="#166534" text-anchor="middle">alle 50</text>

  <rect x="579" y="170" width="467" height="188" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="597" y="200" font-size="14.5" font-weight="bold" fill="#15803D">3 Vorteile in der Architektur:</text>
  <text x="597" y="232" font-size="13.5" fill="#14532D">1. progress.Report(...) blockiert den Worker nicht.</text>
  <text x="597" y="262" font-size="13.5" fill="#14532D">2. Progress&lt;T&gt; marshallt automatisch in den UI-Thread.</text>
  <text x="597" y="292" font-size="13.5" fill="#14532D">3. Simulation bleibt 100 % WPF-unabhängig (CLI &amp; Tests).</text>
  <text x="597" y="334" font-size="13.5" font-weight="bold" fill="#15803D">Drosselung (z. B. i % 50 == 0) schützt die UI-Queue!</text>
</svg>
