<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1160 390" width="1080" height="390">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-danger-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: #eff6ff; stroke: #2563eb; }
      .sem-primary-bg { fill: #eff6ff; stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: #f0fdf4; stroke: #16a34a; }
      .sem-success-bg { fill: #f0fdf4; stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: #fffbeb; stroke: #d97706; }
      .sem-warning-bg { fill: #fffbeb; stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-danger { fill: #fef2f2; stroke: #dc2626; }
      .sem-danger-bg { fill: #fef2f2; stroke: none; }
      .sem-danger-stroke { stroke: #dc2626; }
      .sem-danger-fill { fill: #dc2626; }
      .sem-danger-text { fill: #991b1b; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>

  <rect x="-40" y="0" width="1160" height="390" fill="none"/>

  <!-- LEFT: Naiv Dispatcher.Invoke -->
  <rect class="sem-danger" x="10" y="10" width="515" height="366" rx="10" stroke-width="2"/>
  <rect class="sem-danger" x="10" y="10" width="515" height="40" rx="10" stroke-width="1.5"/>
  <text class="sem-danger-text" x="267" y="36" font-size="16" font-weight="bold" text-anchor="middle">Naiv: Dispatcher.Invoke (Synchron blockierend)</text>

  <rect class="sem-primary" x="34" y="72" width="190" height="72" rx="8" stroke-width="1.5"/>
  <text class="sem-primary-text" x="129" y="100" font-size="14" font-weight="bold" text-anchor="middle">Worker-Thread</text>
  <text class="sem-danger-text" x="129" y="124" font-size="13" text-anchor="middle">wartet &amp; blockiert!</text>

  <rect class="sem-warning" x="310" y="72" width="190" height="72" rx="8" stroke-width="1.5"/>
  <text class="sem-warning-text" x="405" y="100" font-size="14" font-weight="bold" text-anchor="middle">UI-Dispatcher</text>
  <text class="sem-warning-text" x="405" y="124" font-size="13" text-anchor="middle">zeichnet 1 000×/s</text>

  <line class="sem-danger-stroke" x1="224" y1="94" x2="304" y2="94" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text class="sem-danger-text" x="264" y="84" font-size="12.5" font-weight="bold" text-anchor="middle">Invoke</text>
  <line class="sem-danger-stroke" x1="304" y1="126" x2="224" y2="126" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <text class="sem-danger-text" x="264" y="144" font-size="12.5" text-anchor="middle">Ack</text>

  <rect class="sem-danger-stroke" x="34" y="170" width="467" height="188" rx="8" fill="#FFFFFF" stroke-width="1.2"/>
  <text class="sem-danger-text" x="52" y="200" font-size="14.5" font-weight="bold">3 Probleme im Betrieb:</text>
  <text class="sem-danger-text" x="52" y="232" font-size="13.5">1. Worker stoppt bei jedem Schritt bis UI fertig zeichnet.</text>
  <text class="sem-danger-text" x="52" y="262" font-size="13.5">2. Deadlock-Gefahr, falls UI gleichzeitig auf Worker wartet.</text>
  <text class="sem-danger-text" x="52" y="292" font-size="13.5">3. Simulationsklasse ist hart an WPF gekoppelt (keine Tests!).</text>
  <text class="sem-danger-text" x="52" y="334" font-size="13.5" font-weight="bold">Folge: Speedup bricht auf S &lt; 1 ein!</text>

  <!-- RIGHT: Richtig IProgress<T> -->
  <rect class="sem-success" x="555" y="10" width="515" height="366" rx="10" stroke-width="2"/>
  <rect class="sem-success" x="555" y="10" width="515" height="40" rx="10" stroke-width="1.5"/>
  <text class="sem-success-text" x="812" y="36" font-size="16" font-weight="bold" text-anchor="middle">Richtig: IProgress&lt;T&gt; (Asynchron &amp; gedrosselt)</text>

  <rect class="sem-primary" x="579" y="72" width="190" height="72" rx="8" stroke-width="1.5"/>
  <text class="sem-primary-text" x="674" y="100" font-size="14" font-weight="bold" text-anchor="middle">Worker-Thread</text>
  <text class="sem-success-text" x="674" y="124" font-size="13" text-anchor="middle">rechnet sofort weiter!</text>

  <rect class="sem-success" x="855" y="72" width="190" height="72" rx="8" stroke-width="1.5"/>
  <text class="sem-success-text" x="950" y="100" font-size="14" font-weight="bold" text-anchor="middle">UI-Dispatcher</text>
  <text class="sem-success-text" x="950" y="124" font-size="13" text-anchor="middle">SynchronizationContext</text>

  <line class="sem-success-stroke" x1="769" y1="108" x2="849" y2="108" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text class="sem-success-text" x="809" y="96" font-size="12.5" font-weight="bold" text-anchor="middle">Report()</text>
  <text class="sem-success-text" x="809" y="130" font-size="12.5" text-anchor="middle">alle 50</text>

  <rect class="sem-success-stroke" x="579" y="170" width="467" height="188" rx="8" fill="#FFFFFF" stroke-width="1.2"/>
  <text class="sem-success-text" x="597" y="200" font-size="14.5" font-weight="bold">3 Vorteile in der Architektur:</text>
  <text class="sem-success-text" x="597" y="232" font-size="13.5">1. progress.Report(...) blockiert den Worker nicht.</text>
  <text class="sem-success-text" x="597" y="262" font-size="13.5">2. Progress&lt;T&gt; marshallt automatisch in den UI-Thread.</text>
  <text class="sem-success-text" x="597" y="292" font-size="13.5">3. Simulation bleibt 100 % WPF-unabhängig (CLI &amp; Tests).</text>
  <text class="sem-success-text" x="597" y="334" font-size="13.5" font-weight="bold">Drosselung (z. B. i % 50 == 0) schützt die UI-Queue!</text>
</svg>
