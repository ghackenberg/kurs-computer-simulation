<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1160 390" width="1080" height="390">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrT" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-muted-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #15803d; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #15803d; }
      .sem-success-fill { fill: #15803d; }
      .sem-success-text { fill: #166534; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #b45309; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #b45309; }
      .sem-warning-fill { fill: #b45309; }
      .sem-warning-text { fill: #92400e; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #475569; }
      .sem-muted-text { fill: #334155; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .code { font-family: 'Consolas', monospace; font-weight: bold; }
    </style>
  </defs>


  <!-- LEFT: Nebenläufigkeit (Concurrency) auf 1 Kern -->
  <rect class="sem-primary" x="10" y="10" width="515" height="366" rx="10" stroke-width="2"/>
  <rect class="sem-primary" x="10" y="10" width="515" height="40" rx="10" stroke-width="1.5"/>
  <text class="sem-primary-text" x="267" y="36" font-size="16" font-weight="bold" text-anchor="middle">Nebenläufigkeit (Concurrency): 1 Kern, Zeitscheiben</text>

  <text class="sem-primary-text" x="32" y="84" font-size="14" font-weight="bold">Core 0:</text>
  <rect class="sem-primary-fill" x="105" y="60" width="90" height="38" rx="4"/>
  <text x="150" y="84" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">UI</text>
  <rect class="sem-warning-fill" x="200" y="60" width="90" height="38" rx="4"/>
  <text x="245" y="84" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I/O</text>
  <rect class="sem-primary-fill" x="295" y="60" width="90" height="38" rx="4"/>
  <text x="340" y="84" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">UI</text>
  <rect class="sem-warning-fill" x="390" y="60" width="105" height="38" rx="4"/>
  <text x="442" y="84" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I/O</text>

  <line class="sem-muted-stroke" x1="105" y1="120" x2="495" y2="120" stroke-width="2" marker-end="url(#arrT)"/>
  <text class="sem-muted-text" x="300" y="142" font-size="13" text-anchor="middle">Zeit t → (Schnelles Umschalten)</text>

  <rect class="sem-primary-stroke" x="30" y="168" width="475" height="186" rx="8" fill="#FFFFFF" stroke-width="1.2"/>
  <text class="sem-primary-text" x="48" y="196" font-size="14.5" font-weight="bold">Ziel: Reaktionsfähigkeit statt Rechentempo</text>
  <text class="sem-primary-text" x="48" y="226" font-size="13.5">• Aufgaben schreiten abwechselnd voran (Time-Slicing).</text>
  <text class="sem-primary-text" x="48" y="254" font-size="13.5">• UI-Events und Rendering frieren nicht ein.</text>
  <text class="sem-primary-text" x="48" y="282" font-size="13.5">• Beispiel in WPF: async / await + Task.Run.</text>
  <text class="sem-primary-text" x="48" y="324" font-size="13.5" font-weight="bold">Gesamt-Rechenzeit: nicht schneller als 1 Kern!</text>

  <!-- RIGHT: Echte Parallelität auf 4 Kernen -->
  <rect class="sem-success" x="555" y="10" width="515" height="366" rx="10" stroke-width="2"/>
  <rect class="sem-success" x="555" y="10" width="515" height="40" rx="10" stroke-width="1.5"/>
  <text class="sem-success-text" x="812" y="36" font-size="16" font-weight="bold" text-anchor="middle">Echte Parallelität: 4 Kerne gleichzeitig</text>

  <text class="sem-success-text" x="577" y="84" font-size="13.5" font-weight="bold">Core 0:</text>
  <rect class="sem-success-fill" x="650" y="64" width="380" height="24" rx="4"/>
  <text x="840" y="81" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Partikel 0 .. 24 999</text>

  <text class="sem-success-text" x="577" y="114" font-size="13.5" font-weight="bold">Core 1:</text>
  <rect class="sem-success-fill" x="650" y="94" width="380" height="24" rx="4"/>
  <text x="840" y="111" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Partikel 25 000 .. 49 999</text>

  <text class="sem-success-text" x="577" y="144" font-size="13.5" font-weight="bold">Core 2:</text>
  <rect class="sem-success-fill" x="650" y="124" width="380" height="24" rx="4"/>
  <text x="840" y="141" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Partikel 50 000 .. 74 999</text>

  <text class="sem-success-text" x="577" y="174" font-size="13.5" font-weight="bold">Core 3:</text>
  <rect class="sem-success-fill" x="650" y="154" width="380" height="24" rx="4"/>
  <text x="840" y="171" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Partikel 75 000 .. 99 999</text>

  <rect class="sem-success-stroke" x="575" y="196" width="475" height="158" rx="8" fill="#FFFFFF" stroke-width="1.2"/>
  <text class="sem-success-text" x="593" y="224" font-size="14.5" font-weight="bold">Ziel: Maximaler Durchsatz (Speedup S(p))</text>
  <text class="sem-success-text" x="593" y="252" font-size="13.5">• Alle Kerne rechnen zur exakt selben Zeit.</text>
  <text class="sem-success-text" x="593" y="280" font-size="13.5">• Beispiel in C#: Parallel.For über 100 000 Partikel.</text>
  <text class="sem-success-text" x="593" y="322" font-size="13.5" font-weight="bold">Ideal in der Praxis: Task.Run + Parallel.For kombinieren!</text>
</svg>
