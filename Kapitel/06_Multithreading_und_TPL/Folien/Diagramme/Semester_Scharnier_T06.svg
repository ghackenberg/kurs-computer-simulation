<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 570 380" width="570" height="380">
  <defs>
    <!-- @svg-palette-defs:start -->
    <linearGradient id="grad-sem-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-sem-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-sem-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="grad-sem-muted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- @svg-palette-defs:end -->
    <marker id="arrB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-primary-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="sem-success-fill" d="M 0 1.5 L 8 5 L 0 8.5 z"/>
    </marker>
    <style>
      
/* @svg-palette:start */
      .sem-primary { fill: url(#grad-sem-primary); stroke: #2563eb; }
      .sem-primary-bg { fill: url(#grad-sem-primary); stroke: none; }
      .sem-primary-stroke { stroke: #2563eb; }
      .sem-primary-fill { fill: #2563eb; }
      .sem-primary-text { fill: #1e40af; }
      .sem-success { fill: url(#grad-sem-success); stroke: #16a34a; }
      .sem-success-bg { fill: url(#grad-sem-success); stroke: none; }
      .sem-success-stroke { stroke: #16a34a; }
      .sem-success-fill { fill: #16a34a; }
      .sem-success-text { fill: #15803d; }
      .sem-warning { fill: url(#grad-sem-warning); stroke: #d97706; }
      .sem-warning-bg { fill: url(#grad-sem-warning); stroke: none; }
      .sem-warning-stroke { stroke: #d97706; }
      .sem-warning-fill { fill: #d97706; }
      .sem-warning-text { fill: #b45309; }
      .sem-muted { fill: url(#grad-sem-muted); stroke: #94a3b8; }
      .sem-muted-bg { fill: url(#grad-sem-muted); stroke: none; }
      .sem-muted-stroke { stroke: #94a3b8; }
      .sem-muted-fill { fill: #94a3b8; }
      .sem-muted-text { fill: #475569; }
      /* @svg-palette:end */
text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect x="-45" y="0" width="570" height="380" fill="none"/>

  <!-- Block 1: T02-T05 -->
  <rect class="sem-primary" x="-25" y="16" width="530" height="84" rx="10" stroke-width="2"/>
  <text class="sem-primary-text" x="240" y="42" font-size="18" font-weight="bold" text-anchor="middle">T02–T05: Visualisierung (WPF &amp; OpenGL)</text>
  <text class="sem-primary-text" x="240" y="67" font-size="16" text-anchor="middle">Budget bei 60 FPS: nur 16,6 ms pro Frame</text>
  <text class="sem-muted-text" x="240" y="89" font-size="15.5" text-anchor="middle">Problem: UI-Thread rechnet Physik + zeichnet</text>

  <line class="sem-primary-stroke" x1="240" y1="100" x2="240" y2="132" stroke-width="2.5" marker-end="url(#arrB)"/>

  <!-- Block 2: T06 Scharnier -->
  <rect class="sem-warning" x="-25" y="138" width="530" height="100" rx="10" stroke-width="2.5"/>
  <text class="sem-warning-text" x="240" y="165" font-size="18" font-weight="bold" text-anchor="middle">T06: Architektur-Scharnier (Heute)</text>
  <text class="sem-warning-text" x="240" y="192" font-size="16" font-weight="bold" text-anchor="middle">UI-Dispatcher ◀─ IProgress / Task.Run ─▶ Parallel.For</text>
  <text class="sem-warning-text" x="240" y="220" font-size="15.5" text-anchor="middle">100 % Auslastung aller Kerne ohne UI-Freeze</text>

  <line class="sem-success-stroke" x1="240" y1="238" x2="240" y2="270" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- Block 3: T07-T10 -->
  <rect class="sem-success" x="-25" y="276" width="530" height="88" rx="10" stroke-width="2"/>
  <text class="sem-success-text" x="240" y="303" font-size="18" font-weight="bold" text-anchor="middle">T07–T10: Physikalische Solver</text>
  <text class="sem-success-text" x="240" y="328" font-size="15.5" text-anchor="middle">FEM (T07) · DGL (T08) · DES (T09) · Hybrid (T10)</text>
  <text class="sem-success-text" x="240" y="352" font-size="15.5" text-anchor="middle">Sekundenlange Läufe bleiben flüssig bedienbar</text>
</svg>
